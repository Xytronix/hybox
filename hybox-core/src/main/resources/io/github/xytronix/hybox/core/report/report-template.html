  return `<p class="lead">Threads ranked by execution samples.${top&&T?` The busiest is <code class="mono">${esc(top[2])}</code> at <b>${pct(top[0],T).toFixed(1)}%</b>, with its most-sampled frame in <code class="mono" style="color:var(--violet)">${esc(leafName(top[3]))}</code>.`:""}${anyState?" CPU sampling only sees on-CPU threads, so waiting and blocked threads rarely appear here.":""}</p>
  ${poolSummaryHtml(ht,T)}
  ${threadTimelineHtml()}
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input placeholder="filter threads…" data-filter="th-t"></span>${has(D.threadTotal)?`<span class="chip">${D.threadTotal} live threads</span>`:""}<span class="count" data-count="th-t">${ht.length} rows</span></div>
  <div class="tscroll"><div class="tcap"><table class="sortable" id="th-t"><thead><tr>${thc("#","Rank by sample count",{r:true})}${thc("Thread","JVM thread name",{sort:"text"})}${stHead}${thc("Samples","Execution samples attributed to this thread",{sort:"num",r:true,def:"desc"})}${thc("Self&nbsp;%","Share of all samples",{sort:"num",r:true})}${thc("Top method","Most-sampled method on this thread; expand for the thread's top methods",{sort:"text"})}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function statesHtml(){
  const ts=D.threadStates;
  if(!ts) return "";
  const colors={RUNNABLE:"#5bd68b",WAITING:"#62a8ea",TIMED_WAITING:"#a98be0",BLOCKED:"#f0626b",NEW:"#46cfc0",TERMINATED:"#6b7280"};
  const segs=Object.entries(ts).filter(([,v])=>v>0).map(([k,v])=>({k,v,c:colors[k]||"#9aa1ad"}));
  if(!segs.length) return "";
  const legend=segs.map(s=>`<div class="lg"><span class="sw" style="background:${s.c}"></span><span>${esc(s.k.replace("_"," "))}</span><b>${s.v}</b></div>`).join("");
  const blocked=ts.BLOCKED||0;
  const note = blocked>0
    ? `<div style="color:var(--bad);display:flex;gap:8px;align-items:center;margin-bottom:6px">${I.warn} <b style="color:var(--tx)">${blocked} blocked thread(s)</b></div>Blocked threads can indicate lock contention or a deadlock; inspect their stacks for a circular wait.`
    : `<div style="color:var(--good);display:flex;gap:8px;align-items:center;margin-bottom:6px">${I.check} <b style="color:var(--tx)">No blocked threads</b></div>With zero blocked threads, lock contention and circular waits are unlikely to explain the incident.`;
  const dl=(D.deadlocked&&D.deadlocked.length)?`<div class="alert"><b style="color:var(--bad)">Deadlock detected (${D.deadlocked.length})</b><ul>${D.deadlocked.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:"";
  const total=has(D.threadTotal)?D.threadTotal:segs.reduce((a,s)=>a+s.v,0);
  return `<p class="lead">Live JVM threads by state. <b>${ts.RUNNABLE||0}</b> of <b>${total}</b> were runnable and <b>${blocked}</b> blocked.</p>
  <div class="card"><div class="donutwrap"><div>${donut(segs)}</div><div class="legend">${legend}</div>
  <div style="flex:1;min-width:220px;color:var(--tx3);font-size:12px;line-height:1.7;border-left:1px solid var(--border);padding-left:22px">${note}</div></div>${dl}</div>`;
}

function memHtml(){
  const ser=D.series||{};
  if(!D.heap&&!D.gc&&!D.ram&&!D.alloc&&!(D.retained&&D.retained.length)
    &&!(D.gcByCollector&&D.gcByCollector.length)&&!(D.gcCauses&&D.gcCauses.length)
    &&!(D.heapHistogram&&D.heapHistogram.length)&&!(D.slowIo&&D.slowIo.length)) return "";
  const shortCls=n=>{const p=String(n).split(".");return p.length>=3?p.slice(-2).join("."):String(n);};
  const parts=[];
  const cards=[];
  if(DV.heapG){
    const mx=D.heap&&has(D.heap.max)&&D.heap.max>0?gib(D.heap.max):null;
    const hcG=ser.heapCommitted?ser.heapCommitted.map(gib):null;
    const chart=hcG
      ? lineChart(null,{h:195,max:mx?mx:null,unit:" GiB",decimals:1,times:DV.span,marker:DV.incMarker,
          multi:[{name:"used",series:DV.heapG,color:"#e6b34a",dec:1},{name:"committed",series:hcG,color:"#6e6650",dec:1}]})
      : lineChart(DV.heapG,{h:195,color:"#e6b34a",max:mx?mx:null,unit:" GiB",decimals:1,times:DV.span,marker:DV.incMarker});
    const hcid="ch"+CHART_ID;
    const hlegend=hcG?`<div class="pmlegend"><span class="pmlg" data-pml="${hcid}:0" data-tip="toggle the heap used line"><span class="edot" style="background:#e6b34a"></span>used</span> <span class="pmlg" data-pml="${hcid}:1" data-tip="toggle the heap committed line"><span class="edot" style="background:#6e6650"></span>committed</span></div>`:"";
    cards.push(`<div class="chartcard"><div class="cth"><span class="ctt">Heap used over capture window</span><span class="ctm">${DV.span?esc(DV.span.from)+" → "+esc(DV.span.to)+" · ":""}${mx?mx.toFixed(1)+" GiB max":""}${DV.gcName?" · "+esc(DV.gcName):""}</span></div>${hlegend}${chart}</div>`);
  }
  const gcrows=[];
  if(D.sys&&D.sys.gcYoung&&D.sys.gcOld) gcrows.push(["Collector",D.sys.gcYoung+" + "+D.sys.gcOld]);
  if(D.gc){
    gcrows.push(["Collections",String(D.gc.collections)]);
    gcrows.push(["Longest pause",D.gc.maxPauseMs+" ms"]);
    gcrows.push(["Total pause time",D.gc.totalPauseMs+" ms"]);
  } else if(D.gcByCollector&&D.gcByCollector.length){
    D.gcByCollector.forEach(g=>gcrows.push([g[0],g[1]+" collections · "+g[2]+" ms total"]));
  }
  if(D.gc&&D.gcByCollector&&D.gcByCollector.length){
    const tot=D.gcByCollector.filter(g=>g[1]>0).map(g=>g[0]+" ×"+fmt(g[1])).join(" · ");
    if(tot) gcrows.push(["Collections since JVM start",tot]);
  }
  if(D.sys&&has(D.sys.gcParallel)) gcrows.push(["GC worker threads",D.sys.gcParallel+" parallel, "+(D.sys.gcConc??"?")+" concurrent"]);
  if(D.heap&&has(D.heap.max)&&D.heap.max>0) gcrows.push(["Max heap (-Xmx)",gib(D.heap.max).toFixed(1)+" GiB"]);
  if(D.heap){ gcrows.push(["Peak heap used",gib(D.heap.peak).toFixed(1)+" GiB"+(has(D.heap.max)&&D.heap.max>0?" ("+Math.round(100*D.heap.peak/D.heap.max)+"%)":"")]);
    if(has(D.heap.floor)) gcrows.push(["Post-GC floor","~"+gib(D.heap.floor).toFixed(1)+" GiB"]);
    if(has(D.heap.committed)) gcrows.push(["Heap committed",fmtBytes(D.heap.committed)]); }
  if(D.sys&&D.sys.nonHeap&&has(D.sys.nonHeap.used)) gcrows.push(["Non-heap",fmtBytes(D.sys.nonHeap.used)+" used / "+fmtBytes(D.sys.nonHeap.committed)+" committed"]);
  if(D.ram){ gcrows.push(["Process RSS (peak)",gb(D.ram.rssPeak).toFixed(1)+" GB"]);
    gcrows.push(["Native memory (NMT)",D.ram.nmtOn?fmtBytes(D.ram.nativeCommitted)+" committed":"n/a, start with -XX:NativeMemoryTracking=summary"]); }
  if(D.gc&&has(D.gc.explicitDisabled)){
    const exDesc=D.gc.explicitDisabled?"disabled (-XX:+DisableExplicitGC)":(D.gc.explicitConcurrent?"concurrent (invokes concurrent)":"stop-the-world");
    gcrows.push(["Explicit GC",exDesc]);
    const ex=D.gc.explicitCalls||[];
    const exTotal=ex.reduce((a,c)=>a+c[1],0);
    gcrows.push(["Explicit GC calls",exTotal===0?"none in window":exTotal+" · "+ex.map(c=>c[0]+" ×"+c[1]).join(", ")]);
  }
  if(gcrows.length) cards.push(`<div class="kvcard"><div class="kvh"><span class="ic">${I.gc}</span><b>Garbage collection &amp; memory</b><small>${DV.gcHealthy==null?"":(DV.gcHealthy?"healthy":"review")}</small></div><div class="kv">${gcrows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`);
  if(cards.length) parts.push(cards.length===2?`<div class="charts2">${cards.join("")}</div>`:cards.join(""));
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pools=[...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0)));
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"·";
    const prows=pools.map(p=>`<tr><td class="nm">${esc(String(p[0]))}</td><td class="r" data-num="${p[1]}">${pv(p[1])}</td><td class="r" data-num="${p[2]}">${pv(p[2])}</td><td class="r" data-num="${p[3]}">${pv(p[3])}</td><td class="r" data-num="${p[4]}">${pv(p[4])}</td></tr>`).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Memory pools</span><span class="ctm">JVM memory pools at capture</span></div>
      <div class="subnote">Heap pools first. "At last GC" is the pool's usage right after the most recent collection; "·" means the JVM does not report that value for this pool.</div>
      <div class="tscroll"><table class="sortable" id="mp-t"><thead><tr>${thc("Pool","JVM memory pool name",{sort:"text"})}${thc("Used","Bytes in use at capture",{sort:"num",r:true})}${thc("Committed","Bytes reserved from the OS for this pool",{sort:"num",r:true})}${thc("Max","Configured ceiling for this pool",{sort:"num",r:true})}${thc("At last GC","Usage right after the most recent collection",{sort:"num",r:true})}</tr></thead><tbody>${prows}</tbody></table></div></div>`);
  }
  if(D.gcCauses&&D.gcCauses.length){
    const crows=D.gcCauses.map((c,i)=>`<tr><td class="rank">${i+1}</td><td class="nm">${esc(String(c[0]))}</td><td class="r" data-num="${c[1]}">${fmt(c[1])}</td><td class="r" data-num="${c[2]}">${Number(c[2]).toFixed(1)}</td></tr>`).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">GC causes</span><span class="ctm">why each collection fired</span></div>
      <div class="tscroll"><table class="sortable" id="gcc-t"><thead><tr>${thc("#","Rank",{r:true})}${thc("Cause","GC cause reported by the JVM",{sort:"text"})}${thc("Collections","Collections with this cause",{sort:"num",r:true,def:"desc"})}${thc("Total pause ms","Summed pause time for this cause",{sort:"num",r:true})}</tr></thead><tbody>${crows}</tbody></table></div></div>`);
  }
  if(DV.rssG&&D.ram){
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Process RSS over capture window</span><span class="ctm">peak ${gb(D.ram.rssPeak).toFixed(1)} GB${D.sys&&has(DV.memLimitBytes)?" · "+gb(DV.memLimitBytes).toFixed(1)+" GB "+DV.memBasis:""}</span></div>${lineChart(DV.rssG,{h:150,color:"#d98b6a",unit:" GB",decimals:1,times:DV.span,marker:DV.incMarker})}</div>`);
  }
  if(D.alloc&&(((D.alloc.bySubsystem||[]).length)||((D.alloc.byThread||[]).length)||((D.alloc.byClass||[]).length)||((D.alloc.byMod||[]).length))){
    const tot=(has(D.alloc.total)&&D.alloc.total>0?D.alloc.total:(D.alloc.bySubsystem||[]).reduce((a,s)=>a+s[1],0))||1;
    const allocBars=(items,nowrap)=>{
      const mx=Math.max(...items.map(i=>i[1]));
      return items.map(i=>{
        const lbl=String(i[0]);
        return `<div class="wbar"><div class="wn"><span${nowrap?' class="tnc"':""} data-tipov="${esc(lbl)}">${esc(lbl)}</span></div><div class="wt"><div class="wf al" style="width:${(100*i[1]/Math.max(1,mx)).toFixed(1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${pct(i[1],tot).toFixed(1)}%</div></div>`;
      }).join("");
    };
    const arate=has(D.incident.windowSec)&&D.incident.windowSec>0?` ≈ ${fmtBytes(tot/D.incident.windowSec)}/s`:"";
    const note=`<div class="subnote">JFR allocation samples over the window: allocation pressure (GC churn), not retained RAM. ${fmtBytes(tot)} of sampled allocations attributed${arate}.</div>`;
    const aworlds=(D.alloc.byWorld||[]).filter(w=>w.bytes>0);
    if(aworlds.length>1){
      parts.push(`<div class="tbar wsel"><span class="wsl">scope</span><span class="chip tog on" data-allocworld="*">all worlds</span>`
        +aworlds.map(w=>`<span class="chip tog" data-allocworld="${esc(w.world)}">${esc(worldLabel(w.world))} · ${pct(w.bytes,tot).toFixed(0)}%</span>`).join("")+`</div>`);
    }
    if((D.alloc.bySubsystem||[]).length) parts.push(`<div class="chartcard" style="margin-top:12px"><div class="cth"><span class="ctt">Where allocation pressure goes, by engine subsystem</span><span class="ctm">${fmtBytes(tot)} sampled</span></div>${note}<div class="wbars" id="allocSub"></div></div>`);
    if((D.alloc.byMod||[]).length) parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Where allocation pressure goes, by mod</span><span class="ctm">${fmtBytes(tot)} sampled</span></div><div class="wbars" id="allocMod"></div></div>`);
    if((D.alloc.byThread||[]).length) parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocating threads</span><span class="ctm">allocation samples</span></div><div class="wbars">${allocBars(D.alloc.byThread,true)}</div></div>`);
    if((D.alloc.byClass||[]).length){
      const mx=Math.max(...D.alloc.byClass.map(i=>i[1]));
      const clsBars=D.alloc.byClass.map(i=>{
        const full=String(i[0]);
        return `<div class="wbar"><div class="wn"><span class="tnc" data-tipov="${esc(full)}">${esc(shortCls(full))}</span></div><div class="wt"><div class="wf al" style="width:${(100*i[1]/Math.max(1,mx)).toFixed(1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${pct(i[1],tot).toFixed(1)}%</div></div>`;
      }).join("");
      parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocated classes</span><span class="ctm">allocation samples</span></div><div class="wbars">${clsBars}</div></div>`);
    }
  }
  if(D.retained&&D.retained.length){
    const rrows=D.retained.map((r,i)=>{
      const cls=String(r[0]), site=r[2]?String(r[2]):null;
      return `<tr><td class="rank">${i+1}</td><td class="nm"><span class="tnc2" data-tipov="${esc(cls)}">${esc(shortCls(cls))}</span></td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td><td class="mono">${site?`<span class="tnc2" style="max-width:420px" data-tipov="${esc(site)}">${esc(shortCls(site))}</span>`:"·"}</td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Long-lived allocations</span><span class="ctm">JFR old-object samples</span></div>
      <div class="subnote">Old-object samples: objects still alive late in the recording, the leak candidates. Ranked by sample count; approximate, not exact retained bytes.</div>
      <div class="tscroll"><table class="sortable" id="ret-t"><thead><tr>${thc("#","Rank by sample count",{r:true})}${thc("Class","Sampled object class",{sort:"text"})}${thc("Samples","Old-object samples of this class still reachable",{sort:"num",r:true,def:"desc"})}${thc("Dominant allocation site","Most common allocation site among the samples")}</tr></thead><tbody>${rrows}</tbody></table></div></div>`);
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    const totB=D.heapHistogram.reduce((a,r)=>a+r[2],0)||1;
    const hrows=D.heapHistogram.map((r,i)=>{
      const p=100*r[2]/totB;
      return `<tr><td class="rank">${i+1}</td><td class="nm"><span class="tnc2" data-tipov="${esc(String(r[0]))}">${esc(shortCls(r[0]))}</span></td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td><td class="r" data-num="${p.toFixed(2)}"><span class="pct">${p.toFixed(1)}%</span></td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Heap histogram</span><span class="ctm">exact live bytes per class at capture</span></div>
      <div class="subnote">Point-in-time heap walk at capture (opt-in, Capture.HeapHistogram): exact instances and shallow bytes per class, complementing the sampled leak candidates above.</div>
      <div class="tscroll"><table class="sortable" id="hh-t"><thead><tr>${thc("#","Rank",{r:true})}${thc("Class","Object class",{sort:"text"})}${thc("Instances","Live instances at capture",{sort:"num",r:true})}${thc("Bytes","Shallow bytes at capture",{sort:"num",r:true,def:"desc"})}${thc("% of listed","Share of the bytes listed in this table",{sort:"num",r:true})}</tr></thead><tbody>${hrows}</tbody></table></div></div>`);
  }
  if(D.slowIo&&D.slowIo.length){
    const srows=D.slowIo.map((r,i)=>{
      const full=String(r[0]);
      const shortP=full.split("/").filter(Boolean).slice(-2).join("/")||full;
      const kind=String(r[3]||"");
      return `<tr><td class="rank">${i+1}</td><td data-sval="${esc(full)}"><span class="tnc2" data-tipov="${esc(full)}">${esc(shortP)}</span></td><td data-sval="${esc(kind)}"><span class="lvl ${kind==="write"?"WARN":"INFO"}">${esc(kind)}</span></td><td class="r" data-num="${r[1]}">${Number(r[1]).toFixed(0)}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Slow file operations</span><span class="ctm">individual ops at or over 20 ms</span></div>
      <div class="subnote">File operations that took 20 ms or longer (the JFR reporting threshold). A world save or log flush blocking here is tick time lost.</div>
      <div class="tscroll"><table class="sortable" id="sio-t"><thead><tr>${thc("#","Rank",{r:true})}${thc("Path","File path; hover for the full path",{sort:"text"})}${thc("Kind","Read or write",{sort:"text"})}${thc("Duration ms","Wall time of the single operation",{sort:"num",r:true,def:"desc"})}${thc("Bytes","Bytes transferred by the operation",{sort:"num",r:true})}</tr></thead><tbody>${srows}</tbody></table></div></div>`);
  }
  if(!parts.length) return "";
  let lead="";
  if(D.heap&&D.gc){
    const ex=D.gc.explicitCalls||[], exTotal=ex.reduce((a,c)=>a+c[1],0);
    const exLead=has(D.gc.explicitDisabled)?(exTotal===0?` No explicit <code class="mono">System.gc()</code> calls fired in the window.`:` ${exTotal} explicit <code class="mono">System.gc()</code> call(s) fired; attributed to ${ex.map(c=>esc(c[0])).join(", ")}.`):"";
    lead=`<p class="lead">Heap usage and GC pauses over the capture window. Heap moved between roughly ${gib(D.heap.floor).toFixed(1)} and ${gib(D.heap.peak).toFixed(1)} GiB${has(D.heap.max)&&D.heap.max>0?` against a ${gib(D.heap.max).toFixed(1)} GiB maximum`:""}; ${esc(DV.gcName||"the collector")} ran ${D.gc.collections} collections with a longest pause of <b>${D.gc.maxPauseMs}ms</b>.${exLead}</p>`;
  }
  return lead+((DV.heapG||DV.rssG)?legendHtml():"")+parts.join("");
}

function networkHtml(){
  const ser=D.series||{};
  if(!D.net) return "";
  const mb=v=>has(v)?v.toFixed(1):"n/a";
  const inKnown=has(D.net.inAvg);
  const others=Array.isArray(D.net.others)?D.net.others.filter(o=>o&&o.length>=5):[];
  const cards=[];
  if(ser.netOut) cards.push(`<div class="chartcard"><div class="cth"><span class="ctt">Outbound network over capture window</span><span class="ctm">${esc(D.net.iface)} · avg ${mb(D.net.outAvg)} · peak ${mb(D.net.outPeak)} Mb/s</span></div>${lineChart(ser.netOut,{h:195,color:"#a98be0",max:Math.max(1,Math.ceil(D.net.outPeak*1.12)),unit:" Mb/s",decimals:1,times:DV.span,marker:DV.incMarker})}</div>`);
  const rows=[
    ["Interface",D.net.iface],
    ["Outbound avg / peak",mb(D.net.outAvg)+" / "+mb(D.net.outPeak)+" Mb/s"],
    ["Inbound avg / peak",inKnown?(mb(D.net.inAvg)+" / "+mb(D.net.inPeak)+" Mb/s"):"n/a"]
  ];
  if(has(D.incident.windowSec)&&D.incident.windowSec>0){
    const tot=mbps=>{const mb=mbps*D.incident.windowSec/8;return mb>=1000?(mb/1000).toFixed(1)+" GB":Math.round(mb)+" MB";};
    if(inKnown) rows.push(["Transferred in (window)","≈ "+tot(D.net.inAvg)]);
    rows.push(["Transferred out (window)","≈ "+tot(D.net.outAvg)]);
  }
  others.forEach(o=>rows.push([String(o[0]),`in ${Number(o[1]).toFixed(1)}/${Number(o[2]).toFixed(1)} · out ${Number(o[3]).toFixed(1)}/${Number(o[4]).toFixed(1)} Mb/s`]));
  rows.push(["Throughput source","jdk.NetworkUtilization (per-interface, host-wide)"]);
  cards.push(`<div class="kvcard"><div class="kvh"><span class="ic">${I.net}</span><b>Network</b><small>${esc(D.net.iface)}</small></div><div class="kv">${rows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`);
  let out=cards.length===2?`<div class="charts2">${cards.join("")}</div>`:cards.join("");
  if(ser.netIn) out+=`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Inbound network over capture window</span><span class="ctm">avg ${mb(D.net.inAvg)} · peak ${mb(D.net.inPeak)} Mb/s</span></div>${lineChart(ser.netIn,{h:150,color:"#62a8ea",max:Math.max(1,Math.ceil(D.net.inPeak*1.25)),unit:" Mb/s",decimals:1,times:DV.span,marker:DV.incMarker})}</div>`;
  const lead=`<p class="lead">Network throughput on <code class="mono">${esc(D.net.iface)}</code> over the window. Outbound averaged <b>${mb(D.net.outAvg)} Mb/s</b> (peak ${mb(D.net.outPeak)})${inKnown?`; inbound <b>${mb(D.net.inAvg)} Mb/s</b> (peak ${mb(D.net.inPeak)})`:`; inbound n/a`}. Rates are host-wide for the interface.${others.length?` <b>${others.length}</b> other active interface${others.length===1?"":"s"} listed in the Network card.`:""}</p>`;
  return lead+((ser.netOut||ser.netIn)?legendHtml():"")+out;
}

function worldsHtml(){
  const ws=DV.worlds;
  if(!ws.length) return "";
  const T=DV.samples;
  const hasSamples=T&&ws.some(w=>has(w.samples));
  const hasTick=ws.some(w=>has(w.tps));
  const entMap=new Map((D.entities||[]).map(e=>[e[0],e[1]]));
  const hasEnt=entMap.size>0||ws.some(w=>has(w.entities));
  const hasChunks=ws.some(w=>has(w.chunks));
  const hasChunksGen=ws.some(w=>has(w.chunksGenerated));
  const hasChunksLoad=ws.some(w=>has(w.chunksLoaded));
  const hasPct=ws.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
  const pcountOf=w=>{const a=w.playerNames||[];const n=has(w.players)?w.players:a.length;return `<span class="pcount${n?'':' z'}"${a.length?` data-tip="In world: ${esc(a.join(", "))}"`:''}><span class="plk">${I.players}</span><b>${n}</b></span>`;};
  const rows=ws.map(w=>{
    const isInst=String(w.name).indexOf("instance-")===0;
    const kind=isInst?"instance":"persistent";
    const badges=w.stalled?' <span class="st TIMED_WAITING" style="margin-left:6px">STALLED</span>':'';
    let cells=`<td class="nm" data-sval="${esc(worldLabel(w.name))}"><span${w.stalled?' class="stallname"':''} data-tipov="${esc(w.name)}">${esc(worldLabel(w.name))}</span>${badges} ${pcountOf(w)}</td><td class="pkg">${kind}</td>`;
    if(hasEnt){
      const ents=entMap.get(w.name);
      const tot=has(w.entities)?w.entities:(ents&&ents.length?ents.reduce((a,t)=>a+t[1],0):null);
      if(ents&&ents.length){
        const tip=ents.map(t=>`${String(t[0])} ×${fmt(t[1])}`).join(", ");
        cells+=`<td data-num="${tot}"><span class="pcount" data-tip="Top types: ${esc(tip)}"><b>${fmt(tot)}</b></span></td>`;
      } else if(tot!=null) cells+=`<td data-num="${tot}"><span class="pcount"><b>${fmt(tot)}</b></span></td>`;
      else cells+=`<td data-num="-1"><span class="pkg">·</span></td>`;
    }
    if(hasChunks) cells+=`<td class="r" data-num="${has(w.chunks)?w.chunks:-1}">${has(w.chunks)?fmt(w.chunks):"·"}</td>`;
    if(hasChunksGen) cells+=`<td class="r" data-num="${has(w.chunksGenerated)?w.chunksGenerated:-1}">${has(w.chunksGenerated)?fmt(w.chunksGenerated):"·"}</td>`;
    if(hasChunksLoad) cells+=`<td class="r" data-num="${has(w.chunksLoaded)?w.chunksLoaded:-1}">${has(w.chunksLoaded)?fmt(w.chunksLoaded):"·"}</td>`;
    if(hasTick){
      cells+=`<td class="r" data-num="${has(w.tps)?w.tps:-1}">${has(w.tps)&&w.tps>=0?w.tps.toFixed(1):"·"}</td>`;
      if(hasPct){
        const med=has(w.msptP50)?w.msptP50:w.mspt;
        const pc=v=>has(v)&&v>=0?v.toFixed(1):"·";
        cells+=`<td class="r" data-num="${has(med)?med:-1}">${pc(med)}</td><td class="r" data-num="${has(w.msptP95)?w.msptP95:-1}">${pc(w.msptP95)}</td><td class="r" data-num="${has(w.msptMax)?w.msptMax:-1}">${pc(w.msptMax)}</td>`;
      } else {
        cells+=`<td class="r" data-num="${has(w.mspt)?w.mspt:-1}">${has(w.mspt)&&w.mspt>=0?w.mspt.toFixed(1):"·"}</td>`;
      }
    }
    if(hasSamples){
      const s=has(w.samples)?w.samples:0, p=pct(s,T), heavy=p>=20, idle=s===0;
      cells+=`<td class="r" data-num="${s}">${fmt(s)}</td><td class="r"><span class="${heavy?'v-warn':(idle?'pkg':'pct')}">${p.toFixed(1)}%</span></td>`;
    }
    return `<tr class="${w.stalled?'hl':''}">${cells}</tr>`;
  }).join("");
  let head=thc("World","World or ephemeral instance name",{sort:"text"})+thc("Kind","Persistent world or ephemeral instance",{sort:"text"});
  if(hasEnt) head+=thc("Entities","Live entities in this world at capture; hover a count for the typed breakdown",{sort:"num"});
  if(hasChunks) head+=thc("Chunks","Loaded chunks in this world at capture",{sort:"num",r:true});
  if(hasChunksGen) head+=thc("Chunks gen","Chunks generated in this world during the captured window",{sort:"num",r:true});
  if(hasChunksLoad) head+=thc("Chunks loaded","Chunks loaded (disk + generated) in this world during the captured window",{sort:"num",r:true});
  if(hasTick){
    head+=thc("TPS","Measured tick rate at capture",{sort:"num",r:true});
    if(hasPct) head+=thc("MSPT med","Median milliseconds per tick over the window",{sort:"num",r:true})+thc("p95","95th percentile milliseconds per tick",{sort:"num",r:true})+thc("max","Worst single tick in the window (ms)",{sort:"num",r:true});
    else head+=thc("MSPT","Average milliseconds per tick at capture",{sort:"num",r:true});
  }
  if(hasSamples) head+=thc("Samples","CPU samples on this world's tick thread",{sort:"num",r:true,def:"desc"})+thc("CPU&nbsp;%","Share of all execution samples",{sort:"num",r:true});
  const lead=DV.topWorld&&T
    ? `<p class="lead">Per-world CPU from execution samples. <b>${esc(worldLabel(DV.topWorld.name))}</b> leads at <b>${pct(DV.topWorld.samples,T).toFixed(1)}%</b>${DV.stalled?`; the stalled world <code class="mono">${esc(worldLabel(DV.stalled.name))}</code> ranks #${DV.stalledRank} of ${ws.length}`:''}. Hover a world's player count to see who was connected, or an entity count for the typed breakdown.</p>`
    : `<p class="lead">Worlds at the moment of capture. Hover a world's player count to see who was connected, or an entity count for the typed breakdown.</p>`;
  return lead+`<div class="tbar"><span class="srch"><span class="si">${I.search}</span><input placeholder="filter worlds…" data-filter="w-t"></span><span class="count" data-count="w-t">${ws.length} rows</span></div>
  <div class="tscroll"><table class="sortable" id="w-t"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function systemHtml(){
  const s=D.sys; if(!s) return "";
  const row=(k,v)=>v==null?"":`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`;
  function swapRow(){
    const sw=s.swap;
    if(!sw||!has(sw.total)||sw.total<=0) return "";
    const used=Math.max(0,sw.total-(sw.free||0));
    return `<div class="row"><span class="k">Swap (host)</span><span class="v${used>0?" v-warn":""}">${fmtBytes(used)} used of ${fmtBytes(sw.total)}</span></div>`;
  }
  function card(ic,title,sub,rows){const body=rows.join("");if(!body)return "";return `<div class="kvcard"><div class="kvh"><span class="ic">${ic}</span><b>${esc(title)}</b><small>${esc(sub||"")}</small></div><div class="kv">${body}</div></div>`;}
  const cards=[
    card(I.cpu,"Processor",has(s.cpuCores)?s.cpuCores+" cores":"",[
      row("Brand",s.cpuBrand),row("Cores",s.cpuCores),row("Hardware threads",s.hwThreads),row("Sockets",s.sockets),
      row("Container CPU",has(s.cpuUsageCores)&&s.cpuUsageCores>=0?s.cpuUsageCores.toFixed(2)+" cores"+(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0&&has(s.cpuCores)&&s.container.cpuLimit<s.cpuCores?" ("+(100*s.cpuUsageCores/s.container.cpuLimit).toFixed(0)+"% of limit)":(has(s.cpuCores)&&s.cpuCores>0?" ("+(100*s.cpuUsageCores/s.cpuCores).toFixed(0)+"% of "+s.cpuCores+" cores)":"")):null),
      row("CPU affinity (cpuset)",s.cpuset||null),
      row("Pressure (PSI some avg10)",[has(s.psiCpu)&&s.psiCpu>=0?"cpu "+s.psiCpu.toFixed(1)+"%":null,has(s.psiIo)&&s.psiIo>=0?"io "+s.psiIo.toFixed(1)+"%":null,has(s.psiMem)&&s.psiMem>=0?"mem "+s.psiMem.toFixed(1)+"%":null].filter(Boolean).join(" · ")||null),
      row("Machine RAM (host)",has(s.ramTotal)&&s.ramTotal>0?gb(s.ramTotal).toFixed(1)+" GB":null),
      row("Load average (1m, host)",has(s.loadAvg)&&s.loadAvg>=0?s.loadAvg.toFixed(2):null),
      row("CPU throttling",has(s.throttledPeriods)&&s.throttledPeriods>0?s.throttledPeriods+" periods"+(has(s.throttledMs)&&s.throttledMs>0?" · "+fmtDur(s.throttledMs):"")+" in window":null),
      row("CPU steal (host)",has(s.cpuStealPct)&&s.cpuStealPct>=0?s.cpuStealPct.toFixed(1)+"% of window":null),
      row("CPU iowait (host)",has(s.cpuIowaitPct)&&s.cpuIowaitPct>=0?s.cpuIowaitPct.toFixed(1)+"% of window":null),
      row("Safepoints",has(s.safepointCount)&&s.safepointCount>0?fmt(s.safepointCount)+(has(s.safepointMs)&&s.safepointMs>0?" · "+s.safepointMs.toFixed(0)+" ms to-safepoint":"")+" in window":null)
    ]),
    card(osIcon(s.os||""),"Operating system",osFamily(s.os||""),[
      row("OS",s.os),row("Architecture",s.arch),row("Host",s.server),
      row("Server software",s.hytale?"Hytale Dedicated "+s.hytale:null),row("Uptime",has(s.uptimeMs)&&s.uptimeMs>0?fmtDur(s.uptimeMs):null),
      row("Disk",s.disk&&has(s.disk.total)&&s.disk.total>0?gb(s.disk.free).toFixed(1)+" GB free of "+gb(s.disk.total).toFixed(1)+" GB":null),
      row("Block I/O limit",(has(s.ioReadLimit)&&s.ioReadLimit>=0)||(has(s.ioWriteLimit)&&s.ioWriteLimit>=0)?[has(s.ioReadLimit)&&s.ioReadLimit>=0?"read "+fmtBytes(s.ioReadLimit)+"/s":null,has(s.ioWriteLimit)&&s.ioWriteLimit>=0?"write "+fmtBytes(s.ioWriteLimit)+"/s":null].filter(Boolean).join(" · "):null),
      row("Host memory",has(s.hostMemUsed)&&s.hostMemUsed>=0?(has(s.ramTotal)&&s.ramTotal>0?gb(s.hostMemUsed).toFixed(1)+" GB of "+gb(s.ramTotal).toFixed(1)+" GB used":gb(s.hostMemUsed).toFixed(1)+" GB used"):null),
      swapRow(),
      row("Runtime",s.container&&s.container.runtime?s.container.runtime:null),
      row("Container",s.container&&s.container.type?s.container.type:null),
      row("CPU limit",(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0)?(has(s.cpuCores)&&s.cpuCores>0&&s.container.cpuLimit>=s.cpuCores?"unlimited (quota "+s.container.cpuLimit.toFixed(0)+")":s.container.cpuLimit.toFixed(1)+" cores"):null),
      row("Memory limit",s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.container.memLimit):null),
      row("Open files",has(s.openFds)&&s.openFds>=0?(has(s.maxFds)&&s.maxFds>0?fmt(s.openFds)+" of "+fmt(s.maxFds):fmt(s.openFds)):null),
      row("Container memory",has(s.containerMemUsed)&&s.containerMemUsed>=0?(s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.containerMemUsed)+" of "+fmtBytes(s.container.memLimit)+" ("+(100*s.containerMemUsed/s.container.memLimit).toFixed(0)+"%)":fmtBytes(s.containerMemUsed)):null),
      row("Container swap",has(s.containerSwapUsed)&&s.containerSwapUsed>=0?(s.containerSwapMax===0?"disabled":fmtBytes(s.containerSwapUsed)+(has(s.containerSwapMax)&&s.containerSwapMax>0?" of "+fmtBytes(s.containerSwapMax):" used")):null),
      row("OOM kills",has(s.oomKills)&&s.oomKills>0?fmt(s.oomKills)+" (cumulative)":null)
    ]),
    card(I.java,"Java / JVM",s.javaVendor?jvmDistro(s.javaVendor):"",[
      row("Runtime",s.jvm),row("Vendor",s.javaVendor),row("Version",s.javaVersion),row("java.home",s.javaHome),
      ...(s.loaders||[]).map(l=>row(l[0]+" loader",l[1])),
      row("Max heap",has(s.xmxBytes)&&s.xmxBytes>0?gib(s.xmxBytes).toFixed(1)+" GiB (-Xmx)":null)
    ]),
    card(I.gc,"Garbage collector",DV.gcName||"",[
      row("Young",s.gcYoung),row("Old",s.gcOld),row("Parallel GC threads",s.gcParallel),row("Concurrent GC threads",s.gcConc),
      row("GC time ratio",s.gcTimeRatio),
      row("Explicit GC",D.gc&&has(D.gc.explicitDisabled)?(D.gc.explicitDisabled?"disabled":(D.gc.explicitConcurrent?"concurrent":"stop-the-world")):null)
    ])
  ].filter(Boolean);
  let cw="";
  const cRisk=containerRisk();
  if(cRisk) cw=`<div class="cwarn" id="cwarn">${I.warn}<span>Heap <b>-Xmx (${gib(cRisk.xmx).toFixed(1)} GiB)</b> is at or above the ${s.container&&s.container.runtime?esc(s.container.runtime)+" ":""}container memory limit (<b>${gib(cRisk.lim).toFixed(1)} GiB</b>): the JVM can be OOM-killed before GC reacts.</span></div>`;
  let dw="";
  const dRisk=diskRisk();
  if(dRisk) dw=`<div class="cwarn" id="dwarn">${I.warn}<span>Low disk space (<b>${gb(dRisk.free).toFixed(1)} GB</b> free of ${gb(dRisk.total).toFixed(1)} GB): the JFR recording and incident bundles can fail to write.</span></div>`;
  let cmd="";
  if(s.startCommand){
    const long=s.startCommand.length>200;
    cmd=`<div class="codewrap${long?" closed":""}" style="margin-top:16px"><div class="codehd"${long?' data-code':''}><span class="ic">${I.term}</span><span class="fn">Start command</span>${long?`<span class="chev2">${I.chev}</span>`:""}</div><pre class="cmdpre">${esc(s.startCommand)}</pre></div>`;
  }
  if(!cards.length&&!cw&&!dw&&!cmd) return "";
  return (cards.length?`<div class="syscols">${cards.join("")}</div>`:"")+cw+dw+cmd;
}

  if(!pl||!pl.length) return "";

  const rows=pl.map(p=>{
    const [author,name,ver,isCore]=p, range=p[4]||null, compat=p[5]||null;
    const link=isCore?'<span class="corebadge">core module</span>':`<a class="cf" href="https://www.curseforge.com/hytale/search?search=${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">${I.ext} CurseForge</a>`;
    const ci=MIXCONF.modInfo.get(name);

  <div class="tscroll"><div class="tcap"><table class="sortable" id="pl-t"><thead><tr>${thc("Plugin","Plugin or module name",{sort:"text"})}${thc("Author","Author or namespace",{sort:"text"})}${thc("Version","Installed version",{sort:"text"})}${thc("Compiled for","Server range from the mod's manifest, checked against the running server.",{sort:"text"})}${thc("Type","Hytale core engine module vs community plugin",{sort:"text"})}${thc("Link","Search for this plugin on CurseForge (external link)")}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function logHtml(){
  const log=D.log;
  if(!log||!log.length) return "";
  const grouped=[];
  for(const l of log){
    const prev=grouped[grouped.length-1];
    if(prev && prev[0]===l[0] && prev[1]===l[1] && prev[2]===l[2]) prev[3]++;
    else grouped.push([l[0],l[1],l[2],1]);
  }
  const collapsed=log.length-grouped.length;
  const errs=log.filter(l=>l[0]==="ERROR").length, warns=log.filter(l=>l[0]==="WARN").length;
  const lines=grouped.map(l=>{
    const [lv,src,msg,n]=l;
    const lvCls=(lv==="ERROR"||lv==="WARN"||lv==="INFO")?lv:"OTHER";
    const nl=msg.indexOf("\n");
    const multiline=nl>=0;
    const first=multiline?msg.slice(0,nl):msg;
    const cnt=n>1?`<span class="repeat" data-tip="repeated ${n} times">×${n}</span>`:"";
    const body=multiline
      ? `<details class="logdet"><summary><span class="logfirst">${esc(first)}</span> <span class="logmore">+${msg.split("\n").length-1} more lines</span>${cnt}</summary><pre class="logpre">${esc(msg)}</pre></details>`
      : `${esc(msg)}${cnt}`;
    return `<div class="lline l${lvCls}" data-type="${lvCls}"><span class="lvl ${lvCls}">${esc(lv||"·")}</span><span class="lsrc" data-tipov="${esc(src||"·")}">${esc(src||"·")}</span><div class="lmsg">${body}</div></div>`;
  }).join("");
  return `<p class="lead">Chronological tail of the server log (oldest first, ending at the incident). <b>${errs}</b> ERROR and <b>${warns}</b> WARN lines${collapsed>0?`; <b>${collapsed}</b> repeated line(s) collapsed into counts`:''}.</p>
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input placeholder="filter log…" data-filter="log-list"></span><span class="chip tog" data-type-filter="log-list" data-val="ERROR">${errs} errors</span><span class="chip tog" data-type-filter="log-list" data-val="WARN">${warns} warnings</span><span class="count" data-count="log-list">${grouped.length} lines</span></div>
  <div class="logscroll" id="log-list">${lines}</div>`;
}

function configHtml(){
  const blocks=(D.configs||[]).map(c=>
    `<div class="codewrap closed"><div class="codehd" data-code><span class="ic">${I.doc}</span><span class="fn">${esc(c.title)}</span><span class="chev2">${I.chev}</span></div><pre>${colorJson(c.content)}</pre></div>`);
  let mix="";
  if(D.mixins){
    const cfgs=D.mixins.configs||[];
    const total=cfgs.reduce((a,c)=>a+c[1].length,0);
    const conflicts=MIXCONF.list;
    const rows=cfgs.map(c=>{
      const chips=c[1].map(m=>`<span class="mxchip">${esc(m)}</span>`).join(" ");
      return `<tr><td class="nm" data-sval="${esc(c[0])}">${esc(c[0])}</td><td class="r" data-num="${c[1].length}">${c[1].length}</td><td style="white-space:normal">${chips}</td></tr>`;
    }).join("");
    let conf="";
    if(conflicts&&conflicts.length){
      const crows=conflicts.map(c=>{
        const target=c[0], pairs=c[1];
        const mods=[...new Set(pairs.map(p=>modOfConfig(p[0])))];
        const head=mods.map(esc).join(' <span class="vs">↔</span> ')+` <span class="dash">·</span> ${esc(String(target).split(".").pop())}`;
        const chips=pairs.map(p=>`<span class="mxchip warnchip">${esc(p[0])}${p[1]?" → "+esc(p[1]):""}</span>`).join(" ");
        return `<div class="mxcrow"><div class="mxchead">${head}</div><code>${esc(target)}</code><div class="mxchips">${chips}</div></div>`;
      }).join("");
      conf=`<div class="mxconf"><div class="mxchd">${I.warn} ${conflicts.length} class${conflicts.length===1?"":"es"} patched by more than one config</div>
        <div class="mxcsub">Overlapping mixins can interact in load-order-dependent ways; flag these mods first when debugging odd behaviour.</div>
        ${crows}</div>`;
    } else if(conflicts&&cfgs.length>=2){
      conf=`<div class="mxok">${I.check} No classes patched by more than one config.</div>`;
    }
    mix=`<div class="kvcard" style="margin-top:16px"><div class="kvh"><span class="ic">${I.layers}</span><b>Mixins</b><small>${total} applied</small></div>
      <div class="kv">
        ${D.mixins.bootstrapper?`<div class="row"><span class="k">Bootstrapper</span><span class="v">${esc(D.mixins.bootstrapper)}</span></div>`:""}
        <div class="row"><span class="k">Total</span><span class="v">${total} mixins across ${cfgs.length} config${cfgs.length===1?"":"s"}</span></div>
      </div>
      ${conf}
      ${cfgs.length?`<div class="tscroll" style="margin:10px;border-radius:6px"><table class="sortable" id="mx-t"><thead><tr>${thc("Config","The mixin config file that registered these mixins; its name identifies the owning mod",{sort:"text"})}${thc("Count","Mixins registered by this config",{sort:"num",r:true,def:"desc"})}${thc("Mixin classes","All mixin classes this config applies")}</tr></thead><tbody>${rows}</tbody></table></div>`:""}</div>`;
  }
  if(!blocks.length&&!mix) return "";
  return blocks.join("\n")+mix;
}

document.querySelectorAll("table.sortable").forEach(tbl=>{
  const ths=[...tbl.querySelectorAll("thead th")];

    const type=th.dataset.sort, tb=tbl.querySelector("tbody");
    const rows=[...tb.querySelectorAll("tr")];
    ths.forEach(x=>x.classList.remove("asc","desc"));
    th.classList.add(asc?"asc":"desc");
    const val=(tr)=>{
      const cell=tr.children[ci];
      if(type==="num"){

      return (sv!=null?sv:cell.textContent).trim().toLowerCase();
    };
    rows.sort((a,b)=>{
      const av=val(a), bv=val(b);
      if(type==="num")return asc?av-bv:bv-av;
      return asc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    });
    rows.forEach(r=>tb.appendChild(r));
    pruneBarTips();
  };
  ths.forEach((th,ci)=>{
    if(!th.classList.contains("sortable"))return;
    th.addEventListener("click",()=>sortBy(th,ci,!th.classList.contains("asc")));
  });

  if(di>=0) sortBy(ths[di],di,ths[di].classList.contains("asc"));
});

function buildMarkdown(){
  const T=DV.samples, ser=D.series||{}, L=[];
  L.push(`# Incident ${D.incident.id}`,"");
  L.push(`**${D.incident.severity}** · ${D.incident.trigger}${has(D.incident.stallMs)?` · heartbeat stalled ${D.incident.stallMs}ms`:""}${D.incident.worldShort?` on world ${D.incident.worldShort}`:""}`);
  L.push(`Captured ${D.incident.created}${DV.win?` · window ${DV.win}`:""}${T?` · ${fmt(T)} samples`:""}${has(D.incident.players)?` · ${D.incident.players} players`:""}`,"");
  if(has(D.incident.note)) L.push(`> ${D.incident.note}`,"");
  const diag=[];
  if(DV.topWorld&&T) diag.push(`- Busiest world thread: ${worldLabel(DV.topWorld.name)} (${pct(DV.topWorld.samples,T).toFixed(1)}% of samples)`);
  if(DV.topMethod&&T) diag.push(`- Top sampled frame: ${leafName(DV.topMethod[1])} (${pct(DV.topMethod[0],T).toFixed(2)}%)`);
  if(DV.stalled&&has(DV.stalled.samples)&&T) diag.push(`- Stalled world ${worldLabel(DV.stalled.name)} ranks #${DV.stalledRank} of ${DV.worlds.length} by CPU`);
  if(D.gc) diag.push(`- GC: ${DV.gcName||"GC"}, ${D.gc.collections} collections, max pause ${D.gc.maxPauseMs}ms`);
  if(D.threadStates) diag.push(`- Threads: ${D.threadTotal??"?"} live, ${D.threadStates.BLOCKED||0} blocked`);
  if(D.ram&&D.sys&&has(D.sys.ramTotal)) diag.push(`- Memory: RSS ${gb(D.ram.rssLast).toFixed(1)} GB of ${gb(D.sys.ramTotal).toFixed(1)} GB${D.heap?`; heap peak ${gib(D.heap.peak).toFixed(1)} GiB`:""}`);
  if(diag.length){ L.push(`## Diagnosis`); L.push(...diag); L.push(""); }
  if(D.deadlocked&&D.deadlocked.length){
    L.push(`## Deadlock detected (${D.deadlocked.length})`);
    D.deadlocked.forEach(d=>L.push(`- ${d}`));
    L.push("");
  }
  if(D.sys){
    L.push(`## Environment`);
    if(D.sys.os) L.push(`- OS: ${D.sys.os}${D.sys.arch?` (${D.sys.arch})`:""}`);
    if(D.sys.cpuBrand||has(D.sys.cpuCores)) L.push(`- CPU: ${D.sys.cpuBrand||""}${has(D.sys.cpuCores)?` (${D.sys.cpuCores} cores)`:""}${D.cpu?`, peak ${D.cpu.machMax.toFixed(1)}%`:""}`);
    if(D.sys.jvm) L.push(`- JVM: ${D.sys.jvm}${DV.gcName?`, ${DV.gcName} GC`:""}`);
    if(D.sys.server||D.sys.hytale) L.push(`- Server: ${[D.sys.server,D.sys.hytale?"Hytale "+D.sys.hytale:null,D.hyboxVersion?"Hybox v"+D.hyboxVersion:null].filter(Boolean).join(" · ")}`);
    if(D.sys.disk&&has(D.sys.disk.total)&&D.sys.disk.total>0){
      let dl=`- Disk: ${gb(D.sys.disk.free).toFixed(1)} GB free of ${gb(D.sys.disk.total).toFixed(1)} GB`;
      if(DV.diskG){const st=sstat(DV.diskG);dl+=` (window min ${st.min.toFixed(1)} / avg ${st.avg.toFixed(1)} / max ${st.max.toFixed(1)} GB free)`;}
      L.push(dl);
      const dRisk=diskRisk();
      if(dRisk) L.push(`- WARNING: low disk space (${gb(dRisk.free).toFixed(1)} GB free of ${gb(dRisk.total).toFixed(1)} GB); the JFR recording and incident bundles can fail to write`);
    }
    {
      const dio=D.series||{};
      const dstat=s=>{const st=sstat(s);return `min ${st.min.toFixed(1)} / avg ${st.avg.toFixed(1)} / max ${st.max.toFixed(1)} MB/s`;};
      const ps=[];
      if(dio.diskWrite) ps.push(`write ${dstat(dio.diskWrite)}`);
      if(dio.diskRead) ps.push(`read ${dstat(dio.diskRead)}`);
      if(ps.length) L.push(`- Disk I/O: ${ps.join("; ")}`);
    }
    if(has(D.sys.hostMemUsed)&&D.sys.hostMemUsed>=0&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)
      L.push(`- Host memory: ${gb(D.sys.hostMemUsed).toFixed(1)} GB of ${gb(D.sys.ramTotal).toFixed(1)} GB used`);
    if(D.sys.swap&&has(D.sys.swap.total)&&D.sys.swap.total>0){
      const swUsed=Math.max(0,D.sys.swap.total-(D.sys.swap.free||0));
      if(swUsed>0) L.push(`- Swap: ${fmtBytes(swUsed)} used of ${fmtBytes(D.sys.swap.total)}`);
    }
    if(D.sys.nonHeap&&has(D.sys.nonHeap.used))
      L.push(`- Non-heap: ${fmtBytes(D.sys.nonHeap.used)} used / ${fmtBytes(D.sys.nonHeap.committed)} committed`);
    if(D.net&&Array.isArray(D.net.others)&&D.net.others.length)
      D.net.others.forEach(o=>L.push(`- Net ${o[0]}: in ${Number(o[1]).toFixed(1)}/${Number(o[2]).toFixed(1)} · out ${Number(o[3]).toFixed(1)}/${Number(o[4]).toFixed(1)} Mb/s (avg/peak)`));
    if(D.sys.container){
      const c=D.sys.container;
      const parts=[c.runtime,c.type,has(c.cpuLimit)&&c.cpuLimit>0?c.cpuLimit.toFixed(1)+" cores":null,
        has(c.memLimit)&&c.memLimit>0?fmtBytes(c.memLimit)+" memory limit":null].filter(Boolean);
      if(parts.length) L.push(`- Container: ${parts.join(" · ")}`);
      const cRisk=containerRisk();
      if(cRisk) L.push(`- WARNING: heap -Xmx (${gib(cRisk.xmx).toFixed(1)} GiB) is at or above the container memory limit (${gib(cRisk.lim).toFixed(1)} GiB)`);
    }
    L.push("");
  }
  const cmpRows=[...document.querySelectorAll("[data-cmp]")];
  if(cmpRows.length){
    L.push(`## Baseline vs incident window`,"| Metric | Baseline avg | Incident avg | Delta |","|---|---|---|---|");
    cmpRows.forEach(tr=>{
      const cells=[...tr.children].map(td=>td.textContent.trim());
      L.push(`| ${cells[0]} | ${cells[1]} | ${cells[2]} | ${cells[3]} |`);
    });
    L.push("");
  }
  if(D.hotMethods&&D.hotMethods.length&&T){
    L.push(`## Hot methods`,"| # | Method | Samples | Self% |","|---|---|---|---|");
    D.hotMethods.slice(0,10).forEach((m,i)=>L.push(`| ${i+1} | ${m[1]} | ${fmt(m[0])} | ${pct(m[0],T).toFixed(2)}% |`));
    L.push("");
  }
  if(D.hotThreads&&D.hotThreads.length&&T){
    L.push(`## Hot threads`,"| Thread | State | Samples | CPU% | Top method |","|---|---|---|---|---|");
    D.hotThreads.slice(0,10).forEach(ht=>L.push(`| ${ht[2]} | ${ht[1]} | ${fmt(ht[0])} | ${pct(ht[0],T).toFixed(1)}% | ${ht[3]?leafName(ht[3]):"-"} |`));
    L.push("");
  }
  if(D.subsystems&&D.subsystems.length&&T){
    L.push(`## CPU by engine subsystem`,"| Subsystem | Samples | Share |","|---|---|---|");
    D.subsystems.slice(0,10).forEach(s=>L.push(`| ${s[0]} | ${fmt(s[1])} | ${pct(s[1],T).toFixed(1)}% |`));
    L.push("");
  }
  if(D.modCpu&&D.modCpu.length&&T){
    L.push(`## CPU by mod`,"| Mod | Samples | Share | Dominant method | Top threads |","|---|---|---|---|---|");
    D.modCpu.slice(0,10).forEach(m=>L.push(`| ${m[0]} | ${fmt(m[1])} | ${pct(m[1],T).toFixed(1)}% | ${m[2]||"-"} | ${(m[3]&&m[3].length)?m[3].map(t=>`${t[0]} ${(100*t[1]/Math.max(1,m[1])).toFixed(0)}%`).join("; "):"-"} |`));
    L.push("");
  }
  if(D.gcCauses&&D.gcCauses.length){
    L.push(`## GC causes`,"| Cause | Collections | Total pause ms |","|---|---|---|");
    D.gcCauses.forEach(c=>L.push(`| ${c[0]} | ${fmt(c[1])} | ${Number(c[2]).toFixed(1)} |`));
    L.push("");
  }
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"-";
    L.push(`## Memory pools`,"| Pool | Used | Committed | Max | At last GC |","|---|---|---|---|---|");
    [...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0))).slice(0,8).forEach(p=>
      L.push(`| ${p[0]} | ${pv(p[1])} | ${pv(p[2])} | ${pv(p[3])} | ${pv(p[4])} |`));
    L.push("");
  }
  if(D.alloc){
    const top=(m,n)=>(m||[]).slice(0,n).map(e=>`- ${e[0]}: ${fmtBytes(e[1])}${D.alloc.total?` (${pct(e[1],D.alloc.total).toFixed(1)}%)`:""}`);
    const sub=top(D.alloc.bySubsystem,5), mod=top(D.alloc.byMod,5);
    if(sub.length||mod.length){
      L.push(`## Allocation pressure (sampled)`);
      if(sub.length){ L.push(`By subsystem:`); L.push(...sub); }
      if(mod.length){ L.push(`By mod:`); L.push(...mod); }
      L.push("");
    }
  }
  if(D.retained&&D.retained.length){
    L.push(`## Long-lived allocations (leak candidates)`,"| Class | Samples | Allocation site |","|---|---|---|");
    D.retained.slice(0,10).forEach(r=>L.push(`| ${r[0]} | ${fmt(r[1])} | ${r[2]||"-"} |`));
    L.push("");
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    L.push(`## Heap histogram (point in time)`,"| Class | Instances | Bytes |","|---|---|---|");
    D.heapHistogram.slice(0,10).forEach(h=>L.push(`| ${h[0]} | ${fmt(h[1])} | ${fmtBytes(h[2])} |`));
    L.push("");
  }
  if(D.slowIo&&D.slowIo.length){
    L.push(`## Slow file operations`,"| Path | Kind | Duration ms | Bytes |","|---|---|---|---|");
    [...D.slowIo].sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${r[3]} | ${Number(r[1]).toFixed(0)} | ${fmtBytes(r[2])} |`));
    L.push("");
  }
  if(D.tickSystems&&D.tickSystems.length){
    const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
    L.push(`## Engine systems (tick cost)`,"| System | World | avg 1m ms | max 1m ms | % of budget |","|---|---|---|---|---|");
    [...D.tickSystems].sort((a,b)=>b[2]-a[2]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${worldLabel(r[1])} | ${Number(r[2]).toFixed(2)} | ${Number(r[3]).toFixed(2)} | ${(100*r[2]/BUDGET).toFixed(1)}% |`));
    L.push("");
  }
  if(D.pluginMetrics&&D.pluginMetrics.length){
    L.push(`## Plugin metrics`,"| Metric | Kind | Min | Avg | Max |","|---|---|---|---|---|");
    D.pluginMetrics.forEach(m=>{
      const st=sstat(m.series);
      L.push(`| ${m.name} | ${m.kind} | ${st.min.toFixed(1)} | ${st.avg.toFixed(1)} | ${st.max.toFixed(1)} |`);
    });
    L.push("");
  }
  if(Array.isArray(D.worldTps)&&D.worldTps.length){
    L.push(`## Tick rate by world`);
    D.worldTps.forEach(w=>{const st=sstat(w.series);L.push(`- ${worldLabel(w.name)}: avg ${st.avg.toFixed(1)} / min ${st.min.toFixed(1)} / max ${st.max.toFixed(1)} tps`);});
    L.push("");
  }
  if(DV.worlds.length&&T){
    const hasPct=DV.worlds.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
    const pc=v=>has(v)&&v>=0?v.toFixed(1):"-";
    L.push(`## Worlds`,
      hasPct?"| World | Kind | MSPT med | p95 | max | Samples | CPU% |":"| World | Kind | Samples | CPU% |",
      hasPct?"|---|---|---|---|---|---|---|":"|---|---|---|---|");
    DV.worlds.forEach(w=>{
      const base=`| ${worldLabel(w.name)}${w.stalled?" (STALLED)":""} | ${String(w.name).indexOf("instance-")===0?"instance":"persistent"} |`;
      const tail=` ${has(w.samples)?fmt(w.samples):"-"} | ${has(w.samples)?pct(w.samples,T).toFixed(1)+"%":"-"} |`;
      L.push(hasPct?base+` ${pc(has(w.msptP50)?w.msptP50:w.mspt)} | ${pc(w.msptP95)} | ${pc(w.msptMax)} |`+tail:base+tail);
    });
    L.push("");
  }
  if((D.entities&&D.entities.length)||ser.entities){
    L.push(`## Entities`);
    if(ser.entities){const st=sstat(ser.entities);L.push(`Total over window: min ${fmt(st.min)} / avg ${fmt(Math.round(st.avg))} / max ${fmt(st.max)}`);}
    (D.entities||[]).forEach(e=>L.push(`- ${worldLabel(e[0])}: ${(e[1]||[]).map(t=>`${t[0]} x${t[1]}`).join(", ")}`));
    L.push("");
  }
  if(D.plugins&&D.plugins.length){
    const incompat=D.plugins.filter(p=>p[5]==="INCOMPATIBLE");
    L.push(`## Plugins`,`${D.plugins.length} loaded (${D.plugins.filter(p=>p[3]).length} core, ${D.plugins.filter(p=>!p[3]).length} community)`);
    incompat.forEach(p=>L.push(`- INCOMPATIBLE: ${p[1]} ${p[2]} declares server range ${p[4]||"?"}`));
    L.push("");
  }
  if(D.assetPacks&&D.assetPacks.length){
    L.push(`## Asset packs`,`${D.assetPacks.length} loaded`);
    D.assetPacks.forEach(p=>L.push(`- ${p[1]} ${p[2]}${p[5]==="INCOMPATIBLE"?` · INCOMPATIBLE (declares server range ${p[4]||"?"})`:""}`));
    L.push("");
  }
  if(MIXCONF.list&&MIXCONF.list.length){
    L.push(`## Mixin conflicts`);
    MIXCONF.list.forEach(c=>L.push(`- ${c[0]}: ${c[1].map(p=>p[1]?`${p[0]} (${p[1]})`:p[0]).join(" vs ")}`));
    L.push("");
  }
  if(Array.isArray(D.events)&&D.events.length){
    const byType={};
    D.events.forEach(e=>{
      const m=/×(\d+)$/.exec(e[2]||"");
      byType[e[1]]=(byType[e[1]]||0)+(m?parseInt(m[1],10):1);
    });
    L.push(`## Events in window`,Object.entries(byType).map(([k,v])=>`${v} ${k.toUpperCase()}`).join(" · "),"");
  }
  return L.join("\n").trimEnd();
}

let RSZ;
window.addEventListener("resize",()=>{clearTimeout(RSZ);RSZ=setTimeout(()=>{renderCharts();pruneBarTips();},150);});
window.BBZOOM={get:()=>ZOOM,set:setZoom};
window.BBCHARTS=CHARTS;

const TIP=document.createElement("div"); TIP.id="tipbox"; document.body.appendChild(TIP);
let TIP_ANCHOR=null;
function hideTip(){TIP_ANCHOR=null;TIP.style.display="none";}
document.addEventListener("mouseover",e=>{
  const a=e.target.closest?e.target.closest("[data-tip]"):null;
  if(a===TIP_ANCHOR) return;
  if(!a){ if(e.target.closest&&e.target.closest(".bbtipcv")) return; hideTip();return;}
  TIP_ANCHOR=a;
  TIP.textContent=a.getAttribute("data-tip");
  TIP.style.display="block";
  const r=a.getBoundingClientRect(), tw=TIP.offsetWidth, th=TIP.offsetHeight, m=8;
  let x=r.left+r.width/2-tw/2; x=Math.max(m,Math.min(innerWidth-tw-m,x));
  let y=r.bottom+9;
  if(y+th>innerHeight-m) y=r.top-th-9;
  y=Math.max(m,Math.min(y,innerHeight-th-m));
  TIP.style.left=x+"px"; TIP.style.top=y+"px";
});
document.addEventListener("mouseout",e=>{ if(!e.relatedTarget) hideTip(); });
document.addEventListener("scroll",hideTip,true);

initFlame();
initThreadTimeline();

const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.id||"top";
    document.querySelectorAll(".navlist a").forEach(a=>a.classList.toggle("on",a.dataset.nav===id)); }});
},{rootMargin:"-12% 0px -78% 0px"});
const hdr=document.querySelector("header"); hdr.id="top"; spy.observe(hdr);
document.querySelectorAll("section").forEach(s=>spy.observe(s));
</script>
</body>
</html>
