    return `<tr><td class="rank">${i+1}</td><td class="mcell" data-sval="${esc(m[1])}">${m[2]&&m[2].length?`<button type="button" class="mname" aria-expanded="false"><span class="exp" aria-hidden="true">▸</span>${splitMethod(m[1])}</button>${mixinTag(m[3])}${pathHtml(m[2],m[4])}`:splitMethod(m[1])+mixinTag(m[3])}</td><td class="r" data-num="${m[0]}">${fmt(m[0])}</td><td class="r"><span class="pct">${p!=null?p.toFixed(2)+"%":"·"}</span></td></tr>`;
  }).join("");
  return `<p class="lead">The method that was running in each of <b>${T?fmt(T):"all"}</b> CPU samples, all threads.${hm.some(m=>m[3]||(m[4]||[]).some(Boolean))?" Tags mark frames that Mixins added or changed. Their time still counts as the code they run in.":""}</p>
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input type="search" aria-label="Filter methods" placeholder="filter methods…" data-filter="meth-t"></span><span class="chip">top ${hm.length}</span><span class="count" data-count="meth-t">${hm.length} rows</span></div>
  <div class="tscroll"><div class="tcap"><table class="sortable" id="meth-t"><thead><tr>${thc("#","",{r:true})}${thc("Method","The method that was running when the sample was taken",{sort:"text"})}${thc("Samples","CPU samples in which this method was running",{sort:"num",r:true,def:"desc"})}${thc("Self&nbsp;%","Share of all CPU samples",{sort:"num",r:true})}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function markThreadGroup(name){
  document.querySelectorAll("#th-t tbody tr, #pool-t tbody tr").forEach(tr=>{
    const link=tr.querySelector("[data-flamegroup]");
    tr.classList.toggle("thsel", !!name&&!!link&&link.getAttribute("data-flamegroup")===name);
    if(link) link.setAttribute("aria-pressed",String(!!name&&link.dataset.flamegroup===name));
  });
  document.querySelectorAll(".ttlabels [data-flamegroup]").forEach(el=>{
    el.classList.toggle("thsel", !!name&&el.getAttribute("data-flamegroup")===name);
    el.setAttribute("aria-pressed",String(!!name&&el.dataset.flamegroup===name));
  });
}
function thName(t){return String(t[0])+(t.length>2&&t[2]!=null?` (${t[2]} thread${t[2]===1?"":"s"})`:"");}
function threadGroup(name){
  if(name==null) return "(unknown thread)";
  const id=/^(.*-)(?=[0-9a-fA-F]*[0-9])[0-9a-fA-F]{12,}$/.exec(name);
  if(id) return id[1]+"*";
  let i=name.length-1;
  while(i>=0&&name[i]>="0"&&name[i]<="9") i--;
  if(i<name.length-1&&i>=0&&(name[i]==="-"||name[i]==="#")) return name.slice(0,i);
  return name;
}
function flameFocusGroup(g){
  const F=window.BBFLAME; if(!F||!F.tree) return;
  const sec=document.getElementById("flame"); if(sec) setSectionExpanded(sec,true);
  const node=(F.tree.children||[]).find(c=>c.name===g);
  if(node) F.zoomTo(node); else F.reset();
  if(sec) sec.scrollIntoView({behavior:"smooth",block:"start"});
  requestAnimationFrame(()=>{ if(flameRender) flameRender(); $("#flamechild")?.focus({preventScroll:true}); });
}
function threadMethodsHtml(methods,thSamples){
  if(!methods||!methods.length) return "";
  const items=methods.map(m=>{
    const mp=thSamples?pct(m[1],thSamples):null;
    return `<div class="pf"><span class="arr">•</span>${shortMethod(m[0])}${mixinTag(m[2])}<span class="thmn">${fmt(m[1])}${mp!=null?` · ${mp.toFixed(0)}%`:""}</span></div>`;
  }).join("");
  return `<div class="mpath" hidden><span class="plab">Top methods on this thread</span>${items}</div>`;
}
function threadMods(mods,s){
  return Array.isArray(mods)&&s?mods.filter(m=>pct(m[1],s)>=0.5||pct(m[2],s)>=0.5).slice(0,3):[];
}
function threadModsHtml(mods,s){
  const shown=threadMods(mods,s);
  return shown.length?`<div class="thmods">Mods on this thread: ${shown.map(m=>`${esc(m[0])} (self ${pct(m[1],s).toFixed(1)}%, total ${pct(m[2],s).toFixed(1)}%)`).join(", ")}</div>`:"";
}
function poolSummaryHtml(ht,T,hasFlame){
  const groups={};
  ht.forEach(t=>{const g=threadGroup(t[2]); const e=groups[g]||(groups[g]={s:0,n:0}); e.s+=t[0]; e.n++;});
  const all=Object.entries(groups).filter(([,v])=>v.n>=2).sort((a,b)=>b[1].s-a[1].s);
  const minShare=T?T*0.003:0;
  let pools=all.filter(([,v])=>v.s>=minShare).slice(0,12);
  if(!pools.length&&all.length) pools=all.slice(0,1);
  if(!pools.length) return "";
  const more=all.length-pools.length;
  const max=pools[0][1].s||1;
  const rows=pools.map(([g,v])=>{
    const p=T?pct(v.s,T):null;
    const name=hasFlame?`<button type="button" class="thlink" data-flamegroup="${esc(g)}" aria-pressed="false" data-tip="Focus this pool in the flame graph">${esc(g)}</button>`:esc(g);
    return `<tr><td class="nm">${name}</td><td class="r" data-num="${v.n}">${v.n}</td><td class="r" data-num="${v.s}">${fmt(v.s)}</td><td class="r"><span class="bbar"><i style="width:${(100*v.s/max).toFixed(0)}%;background:var(--s1)"></i></span><span class="pct">${p!=null?p.toFixed(1)+"%":"·"}</span></td></tr>`;
  }).join("");
  const note=more>0?`<div class="subnote" style="margin-top:4px">${more} pool${more===1?" is":"s are"} under 0.3% and not shown.</div>`:"";
  return `<div class="card" style="margin-bottom:14px"><h3><span class="ic">${I.threads}</span> Thread pools (aggregated)</h3>
  <div class="subnote">Threads with the same base name count as one pool.</div>
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input type="search" aria-label="Filter thread pools" placeholder="filter pools…" data-filter="pool-t"></span><span class="count" data-count="pool-t">${pools.length} rows</span></div>
  <div class="tscroll"><table class="sortable" id="pool-t"><thead><tr>${thc("Pool / group","",{sort:"text"})}${thc("Threads","Number of threads in the pool",{sort:"num",r:true})}${thc("Samples","CPU samples summed across the pool",{sort:"num",r:true,def:"desc"})}${thc("Self&nbsp;%","Share of all CPU samples",{sort:"num",r:true})}</tr></thead><tbody>${rows}</tbody></table></div>${note}</div>`;
}
function threadsHtml(){
  const ht=D.hotThreads||[];
  if(!ht.length) return adv("thread states over time",threadTimelineHtml());
  const T=DV.samples;
  const hasFlame=!!(D.flame&&Array.isArray(D.flame)&&Array.isArray(D.flame[2])&&D.flame[2].length);
  const rows=ht.map((t,i)=>{
    const [s,,name,meth,meths,methLabel,mods]=t;
    const p=T?pct(s,T):null;
    const stall=DV.stalled && name.indexOf(DV.stalled.name)>=0;
    const nameCell=hasFlame
      ? `<button type="button" class="thlink" data-flamegroup="${esc(threadGroup(name))}" aria-pressed="false" data-tip="Focus this thread in the flame graph">${esc(name)}</button>`
      : esc(name);
    const modLine=threadModsHtml(mods,s);
    const methCell=(meths&&meths.length)
      ? `<td class="mcell"><button type="button" class="mname" aria-expanded="false"><span class="exp" aria-hidden="true">▸</span>${splitMethod(meth)}</button>${mixinTag(methLabel)}${modLine}${threadMethodsHtml(meths,s)}</td>`
      : `<td>${splitMethod(meth)}${mixinTag(methLabel)}${modLine}</td>`;
    return `<tr><td class="rank">${i+1}</td><td class="nm${stall?' stallname':''}"${stall?' data-tip="Tick thread of the stalled world."':''}>${nameCell}${stall?'<span class="vword v-warn">stalled</span>':''}</td><td class="r" data-num="${s}">${fmt(s)}</td><td class="r"><span class="pct">${p!=null?p.toFixed(2)+"%":"·"}</span></td>${methCell}</tr>`;
  }).join("");
  return `${recordingScopeBadge()}<p class="lead">Threads by CPU samples. Waiting and blocked threads use no CPU. Thread states has them.</p>
  ${poolSummaryHtml(ht,T,hasFlame)}
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input type="search" aria-label="Filter threads" placeholder="filter threads…" data-filter="th-t"></span><span class="count" data-count="th-t">${ht.length} rows</span></div>
  <div class="tscroll"><div class="tcap"><table class="sortable" id="th-t"><thead><tr>${thc("#","",{r:true})}${thc("Thread","",{sort:"text"})}${thc("Samples","CPU samples on this thread",{sort:"num",r:true,def:"desc"})}${thc("Self&nbsp;%","Share of all CPU samples",{sort:"num",r:true})}${thc("Top method","Most sampled method on this thread. Expand the row for its top methods.",{sort:"text"})}</tr></thead><tbody>${rows}</tbody></table></div></div>
  ${adv("thread states over time",threadTimelineHtml())}`;
}

function statesHtml(){
  const ts=D.threadStates, ser=D.series||{};
  const dl=DV.deadlock?`<div class="alert"><b style="color:var(--bad)">Deadlock detected · ${D.deadlocked.length} deadlocked thread${D.deadlocked.length===1?"":"s"}</b><ul>${D.deadlocked.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:"";
  const segs=Object.entries(ts||{}).filter(([,v])=>v>0).map(([k,v])=>({k,v,c:STCOL[k]||PAL.neutral}));
  const blocked=ts&&ts.BLOCKED||0;
  const facts=[];
  if(ts) facts.push(blocked?`<b class="v-warn">${blocked}</b> thread${blocked===1?" was":"s were"} waiting for a lock at capture.`:"No thread was waiting for a lock at capture.");
  if(ts&&!DV.deadlock) facts.push("No deadlock found.");
  let internals="";
  if(segs.length){
    const legend=segs.map(s=>`<div class="lg"><span class="sw" style="background:${s.c}"></span><span>${esc(s.k.replace("_"," "))}</span><b>${s.v}</b></div>`).join("");
    const total=has(D.threadTotal)?D.threadTotal:segs.reduce((a,s)=>a+s.v,0);
    internals+=`<div class="card"><div class="donutwrap"><div>${donut(segs)}</div><div class="legend">${legend}</div><div class="state-note"><b>${ts.RUNNABLE||0}</b> of <b>${total}</b> live threads were runnable at capture.</div></div></div>`;
  }
  if(ser.threads) internals+=`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Live threads over the capture window</span><span class="ctm">${has(D.threadTotal)?D.threadTotal+" at capture":""}</span></div>${lineChart(ser.threads,{h:150,color:SERIES[0],unit:"",decimals:0,times:DV.span,marker:DV.incMarker})}</div>`;
  if(!facts.length&&!dl&&!internals) return "";
  return (facts.length?`<p class="lead">${facts.join(" ")}</p>`:"")+dl+adv("live threads by state",internals);
}

function memHtml(){
  const ser=D.series||{};
  if(!D.heap&&!D.gc&&!D.ram&&!D.alloc&&!(D.retained&&D.retained.length)
    &&!(D.gcByCollector&&D.gcByCollector.length)&&!(D.gcCauses&&D.gcCauses.length)
    &&!(D.heapHistogram&&D.heapHistogram.length)&&!(D.slowIo&&D.slowIo.length)) return "";
  const shortCls=n=>{const p=String(n).split(".");return p.length>=3?p.slice(-2).join("."):String(n);};
  const parts=[];
  const cards=[];
  if(DV.heapG){
    const mx=D.heap&&has(D.heap.max)&&D.heap.max>0?gib(D.heap.max):null;
    const hcG=ser.heapCommitted?ser.heapCommitted.map(gib):null;
    const chart=hcG
      ? lineChart(null,{h:195,max:mx?mx:null,unit:" GiB",decimals:1,times:DV.span,marker:DV.incMarker,
          multi:[{name:"used",series:DV.heapG,color:SERIES[0],dec:1},{name:"committed",series:hcG,color:PAL.neutral,dec:1}]})
      : lineChart(DV.heapG,{h:195,color:SERIES[0],max:mx?mx:null,unit:" GiB",decimals:1,times:DV.span,marker:DV.incMarker});
    const hcid="ch"+CHART_ID;
    const hlegend=hcG?`<div class="pmlegend"><button type="button" class="pmlg" data-pml="${hcid}:0" aria-pressed="true" data-tip="toggle the heap used line"><span class="edot" style="background:${SERIES[0]}"></span>used</button> <button type="button" class="pmlg" data-pml="${hcid}:1" aria-pressed="true" data-tip="toggle the heap committed line"><span class="edot" style="background:${PAL.neutral}"></span>committed</button></div>`:"";
    cards.push(`<div class="chartcard"><div class="cth"><span class="ctt">Heap used over capture window</span><span class="ctm">${DV.span?esc(DV.span.from)+" → "+esc(DV.span.to)+" · ":""}${mx?mx.toFixed(1)+" GiB max":""}${DV.gcName?" · "+esc(DV.gcName):""}</span></div>${hlegend}${chart}</div>`);
  }
  const gcrows=[], advrows=[];
  if(D.sys&&D.sys.gcYoung&&D.sys.gcOld) gcrows.push(["Collector",D.sys.gcYoung+" + "+D.sys.gcOld]);
  if(D.gc){
    gcrows.push(["Collections",String(D.gc.collections)]);
    gcrows.push(["Longest pause",D.gc.maxPauseMs+" ms"]);
    gcrows.push(["Total pause time",D.gc.totalPauseMs+" ms"]);
  } else if(D.gcByCollector&&D.gcByCollector.length){
    D.gcByCollector.forEach(g=>gcrows.push([g[0],g[1]+" collections · "+g[2]+" ms total"]));
  }
  if(D.heap&&has(D.heap.max)&&D.heap.max>0) gcrows.push(["Max heap (-Xmx)",gib(D.heap.max).toFixed(1)+" GiB"]);
  if(D.heap){ gcrows.push(["Peak heap used",gib(D.heap.peak).toFixed(1)+" GiB"+(has(D.heap.max)&&D.heap.max>0?" ("+Math.round(100*D.heap.peak/D.heap.max)+"%)":"")]);
    if(has(D.heap.floor)) gcrows.push(["Post-GC floor","~"+gib(D.heap.floor).toFixed(1)+" GiB"]);
    if(has(D.heap.committed)) advrows.push(["Heap committed",fmtBytes(D.heap.committed)]); }
  if(D.gc&&D.gcByCollector&&D.gcByCollector.length){
    const tot=D.gcByCollector.filter(g=>g[1]>0).map(g=>g[0]+" ×"+fmt(g[1])).join(" · ");
    if(tot) advrows.push(["Collections since JVM start",tot]);
  }
  if(D.sys&&has(D.sys.gcParallel)) advrows.push(["GC worker threads",D.sys.gcParallel+" parallel, "+(D.sys.gcConc??"?")+" concurrent"]);
  if(D.sys&&D.sys.nonHeap&&has(D.sys.nonHeap.used)) advrows.push(["Non-heap",fmtBytes(D.sys.nonHeap.used)+" used / "+fmtBytes(D.sys.nonHeap.committed)+" committed"]);
  if(D.ram){ advrows.push(["Process RSS (peak)",gib(D.ram.rssPeak).toFixed(1)+" GiB"]);
    advrows.push(["Native memory (NMT)",D.ram.nmtOn?fmtBytes(D.ram.nativeCommitted)+" committed":"n/a, start with -XX:NativeMemoryTracking=summary"]); }
  if(D.gc&&has(D.gc.explicitDisabled)){
    const exDesc=D.gc.explicitDisabled?"disabled (-XX:+DisableExplicitGC)":(D.gc.explicitConcurrent?"runs alongside the server":"stop-the-world");
    advrows.push(["Explicit GC",exDesc]);
    const ex=D.gc.explicitCalls||[];
    const exTotal=ex.reduce((a,c)=>a+c[1],0);
    advrows.push(["Explicit GC calls",exTotal===0?"none in window":exTotal+" · "+ex.map(c=>c[0]+" ×"+c[1]).join(", ")]);
  }
  const kv=(title,rows)=>`<div class="kvcard"><div class="kvh"><span class="ic">${I.gc}</span><b>${title}</b></div><div class="kv">${rows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`;
  if(gcrows.length) cards.push(kv("Garbage collection &amp; memory",gcrows));
  if(cards.length) parts.push(cards.length===2?`<div class="charts2">${cards.join("")}</div>`:cards.join(""));
  const advanced=[];
  if(advrows.length) advanced.push(kv("JVM memory details",advrows));
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pools=[...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0)));
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"n/a";
    const prows=pools.map(p=>`<tr><td class="nm">${esc(String(p[0]))}</td><td class="r" data-num="${p[1]}">${pv(p[1])}</td><td class="r" data-num="${p[2]}">${pv(p[2])}</td><td class="r" data-num="${p[3]}">${pv(p[3])}</td><td class="r" data-num="${p[4]}">${pv(p[4])}</td></tr>`).join("");
    advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Memory pools</span><span class="ctm">JVM memory pools at capture</span></div>
      <div class="tscroll"><table class="sortable" id="mp-t"><thead><tr>${thc("Pool","",{sort:"text"})}${thc("Used","Bytes in use at capture",{sort:"num",r:true})}${thc("Committed","Bytes reserved from the OS for this pool",{sort:"num",r:true})}${thc("Max","Configured ceiling for this pool",{sort:"num",r:true})}${thc("At last GC","Usage right after the most recent collection",{sort:"num",r:true})}</tr></thead><tbody>${prows}</tbody></table></div></div>`);
  }
  if(D.gcCauses&&D.gcCauses.length){
    const crows=D.gcCauses.map((c,i)=>`<tr><td class="rank">${i+1}</td><td class="nm">${esc(String(c[0]))}</td><td class="r" data-num="${c[1]}">${fmt(c[1])}</td><td class="r" data-num="${c[2]}">${Number(c[2]).toFixed(1)}</td></tr>`).join("");
    advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">GC causes</span><span class="ctm">why each collection fired</span></div>
      <div class="tscroll"><table class="sortable" id="gcc-t"><thead><tr>${thc("#","",{r:true})}${thc("Cause","GC cause reported by the JVM",{sort:"text"})}${thc("Collections","Collections with this cause",{sort:"num",r:true,def:"desc"})}${thc("Total pause ms","Summed pause time for this cause",{sort:"num",r:true})}</tr></thead><tbody>${crows}</tbody></table></div></div>`);
  }
  if(D.alloc&&(((D.alloc.bySubsystem||[]).length)||((D.alloc.byThread||[]).length)||((D.alloc.byClass||[]).length)||((D.alloc.byMod||[]).length))){
    const tot=(has(D.alloc.total)&&D.alloc.total>0?D.alloc.total:(D.alloc.bySubsystem||[]).reduce((a,s)=>a+s[1],0))||1;
    const allocBars=(items,nowrap)=>{
      const mx=Math.max(...items.map(i=>i[1]));
      return items.map(i=>{
        const lbl=thName(i);
        return `<div class="wbar"><div class="wn"><span${nowrap?' class="tnc"':""} data-tipov="${esc(lbl)}">${esc(lbl)}</span></div><div class="wt"><div class="wf al" style="width:${(100*i[1]/Math.max(1,mx)).toFixed(1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${pct(i[1],tot).toFixed(1)}%</div></div>`;
      }).join("");
    };
    const arate=has(D.incident.windowSec)&&D.incident.windowSec>0?`, ${fmtBytes(tot/D.incident.windowSec)}/s`:"";
    const note=`<div class="subnote">Memory allocated during the recording: ${fmtBytes(tot)}${arate}. GC frees most of it. This is not memory in use.</div>`;
    const aworlds=(D.alloc.byWorld||[]).filter(w=>w.bytes>0);
    if(aworlds.length>1){
      parts.push(`${recordingScopeBadge()}<div class="tbar wsel"><span class="wsl">World scope</span><button type="button" class="chip tog on" data-allocworld="*" aria-pressed="true">all worlds</button>`
        +aworlds.map(w=>`<button type="button" class="chip tog" data-allocworld="${esc(w.world)}" aria-pressed="false">${esc(worldLabel(w.world))} · ${pct(w.bytes,tot).toFixed(0)}%</button>`).join("")+`</div>`);
    }
    if((D.alloc.bySubsystem||[]).length) parts.push(`<div class="chartcard" style="margin-top:12px"><div class="cth"><span class="ctt">Allocated memory by engine subsystem</span><span class="ctm">${fmtBytes(tot)} sampled</span></div>${recordingScopeBadge()}${note}<div class="wbars" id="allocSub"></div></div>`);
    if((D.alloc.byMod||[]).length) parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Allocated memory by mod</span><span class="ctm">${fmtBytes(tot)} sampled</span></div>${recordingScopeBadge()}<div class="subnote">${D.alloc.byMod.some(m=>m.length>2)?"Self is memory allocated by the mod's own code. Total includes Hytale code the mod calls into.":MOD_OLDER}</div><div class="wbars" id="allocMod"></div></div>`);
    if((D.alloc.byThread||[]).length) advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocating threads</span><span class="ctm">allocation samples</span></div>${recordingScopeBadge()}<div class="wbars">${allocBars(D.alloc.byThread,true)}</div></div>`);
    if((D.alloc.byClass||[]).length){
      const mx=Math.max(...D.alloc.byClass.map(i=>i[1]));
      const clsBars=D.alloc.byClass.map(i=>{
        const full=String(i[0]);
        return `<div class="wbar"><div class="wn"><span class="tnc" data-tipov="${esc(full)}">${esc(shortCls(full))}</span></div><div class="wt"><div class="wf al" style="width:${(100*i[1]/Math.max(1,mx)).toFixed(1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${pct(i[1],tot).toFixed(1)}%</div></div>`;
      }).join("");
      advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocated classes</span><span class="ctm">allocation samples</span></div>${recordingScopeBadge()}<div class="wbars">${clsBars}</div></div>`);
    }
  }
  if(D.retained&&D.retained.length){
    const rrows=D.retained.map((r,i)=>{
      const cls=String(r[0]), site=r[2]?String(r[2]):null;
      return `<tr><td class="rank">${i+1}</td><td class="nm"><span class="tnc2" data-tipov="${esc(cls)}">${esc(shortCls(cls))}</span></td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td><td class="mono">${site?`<span class="tnc2" style="max-width:420px" data-tipov="${esc(site)}">${esc(shortCls(site))}</span>`:"·"}</td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Long-lived allocations</span><span class="ctm">JFR old-object samples</span></div>${recordingScopeBadge()}
      <div class="subnote">Objects that stayed alive for a long time. A class that keeps growing here can be a leak. Counts are sampled, not exact.</div>
      <div class="tscroll"><table class="sortable" id="ret-t"><thead><tr>${thc("#","",{r:true})}${thc("Class","Sampled object class",{sort:"text"})}${thc("Samples","Old-object samples of this class still reachable",{sort:"num",r:true,def:"desc"})}${thc("Dominant allocation site","Most common allocation site among the samples")}</tr></thead><tbody>${rrows}</tbody></table></div></div>`);
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    const totB=D.heapHistogram.reduce((a,r)=>a+r[2],0)||1;
    const hrows=D.heapHistogram.map((r,i)=>{
      const p=100*r[2]/totB;
      return `<tr><td class="rank">${i+1}</td><td class="nm"><span class="tnc2" data-tipov="${esc(String(r[0]))}">${esc(shortCls(r[0]))}</span></td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td><td class="r" data-num="${p.toFixed(2)}"><span class="pct">${p.toFixed(1)}%</span></td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Heap histogram</span><span class="ctm">exact live bytes per class at capture</span></div>
      <div class="subnote">Every object on the heap at capture, by class. Shown when <code>Capture.HeapHistogram</code> is on.</div>
      <div class="tscroll"><table class="sortable" id="hh-t"><thead><tr>${thc("#","",{r:true})}${thc("Class","",{sort:"text"})}${thc("Instances","Live instances at capture",{sort:"num",r:true})}${thc("Bytes","Shallow bytes at capture",{sort:"num",r:true,def:"desc"})}${thc("% of listed","Share of the bytes listed in this table",{sort:"num",r:true})}</tr></thead><tbody>${hrows}</tbody></table></div></div>`);
  }
  if(D.slowIo&&D.slowIo.length){
    const srows=D.slowIo.map((r,i)=>{
      const full=String(r[0]);
      const shortP=full.split("/").filter(Boolean).slice(-2).join("/")||full;
      const kind=String(r[3]||"");
      return `<tr><td class="rank">${i+1}</td><td data-sval="${esc(full)}"><span class="tnc2" data-tipov="${esc(full)}">${esc(shortP)}</span></td><td data-sval="${esc(kind)}"><span class="lvl ${kind==="write"?"WARN":"INFO"}">${esc(kind)}</span></td><td class="r" data-num="${r[1]}">${Number(r[1]).toFixed(0)}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td></tr>`;
    }).join("");
    const sioT=D.slowIoThresholdMs;
    const sioMeta=sioT!=null?`slowest single reads and writes, recorded from ${sioT} ms`:"slowest single reads and writes";
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Slow file operations</span><span class="ctm">${sioMeta}</span></div>
      <div class="subnote">A slow read or write on a world thread delays the tick.</div>
      <div class="tscroll"><table class="sortable" id="sio-t"><thead><tr>${thc("#","",{r:true})}${thc("Path","Hover for the full path",{sort:"text"})}${thc("Kind","",{sort:"text"})}${thc("Duration ms","Wall time of the single operation",{sort:"num",r:true,def:"desc"})}${thc("Bytes","Bytes transferred by the operation",{sort:"num",r:true})}</tr></thead><tbody>${srows}</tbody></table></div></div>`);
  }
  if(!parts.length&&!advanced.length) return "";
  const ex=(D.gc&&D.gc.explicitCalls)||[], exTotal=ex.reduce((a,c)=>a+c[1],0);
  const exLead=exTotal>0?` Code asked for ${exTotal} full collection${exTotal===1?"":"s"} with <code class="mono">System.gc()</code>, from ${ex.map(c=>esc(c[0])).join(", ")}.`:"";
  const lead=D.heap?`<p class="lead">Heap used ${gib(D.heap.floor).toFixed(1)} to ${gib(D.heap.peak).toFixed(1)} GiB${has(D.heap.max)&&D.heap.max>0?` of ${gib(D.heap.max).toFixed(1)} GiB`:""}.${exLead}</p>`:"";
  return lead+parts.join("")+adv("JVM details for support",advanced.join(""));
}

function networkHtml(){
  const ser=D.series||{};
  if(!D.net) return "";
  const mb=v=>has(v)?v.toFixed(1):"n/a", MBIT="Mbit/s";
  const inKnown=has(D.net.inAvg);
  const others=Array.isArray(D.net.others)?D.net.others.filter(o=>o&&o.length>=5&&[1,2,3,4].some(i=>Number(o[i])>0)):[];
  const cards=[];
  if(ser.netOut) cards.push(`<div class="chartcard"><div class="cth"><span class="ctt">Outbound network over capture window</span><span class="ctm">${esc(D.net.iface)} · avg ${mb(D.net.outAvg)} · peak ${mb(D.net.outPeak)} ${MBIT}</span></div>${lineChart(ser.netOut,{h:195,color:SERIES[0],max:Math.max(1,Math.ceil(D.net.outPeak*1.12)),unit:" "+MBIT,decimals:1,times:DV.span,marker:DV.incMarker})}</div>`);
  const rows=[
    ["Interface",D.net.iface],
    ["Outbound avg / peak",mb(D.net.outAvg)+" / "+mb(D.net.outPeak)+" "+MBIT],
    ["Inbound avg / peak",inKnown?(mb(D.net.inAvg)+" / "+mb(D.net.inPeak)+" "+MBIT):"n/a"]
  ];
  if(has(D.incident.windowSec)&&D.incident.windowSec>0){
    const tot=mbps=>fmtBytes(Math.round(mbps*1e6/8*D.incident.windowSec));
    if(inKnown) rows.push(["Transferred in (window)","≈ "+tot(D.net.inAvg)]);
    rows.push(["Transferred out (window)","≈ "+tot(D.net.outAvg)]);
  }
  others.forEach(o=>rows.push([String(o[0]),`in ${Number(o[1]).toFixed(1)}/${Number(o[2]).toFixed(1)} · out ${Number(o[3]).toFixed(1)}/${Number(o[4]).toFixed(1)} ${MBIT}`]));
  cards.push(`<div class="kvcard"><div class="kvh"><span class="ic">${I.net}</span><b>Network</b><small>${esc(D.net.iface)}</small></div><div class="kv">${rows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`);
  let out=cards.length===2?`<div class="charts2">${cards.join("")}</div>`:cards.join("");
  if(ser.netIn) out+=`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Inbound network over capture window</span><span class="ctm">avg ${mb(D.net.inAvg)} · peak ${mb(D.net.inPeak)} ${MBIT}</span></div>${lineChart(ser.netIn,{h:150,color:SERIES[0],max:Math.max(1,Math.ceil(D.net.inPeak*1.25)),unit:" "+MBIT,decimals:1,times:DV.span,marker:DV.incMarker})}</div>`;
  const lead=`<p class="lead">Traffic of the whole machine on <code class="mono">${esc(D.net.iface)}</code>, not only the server.</p>`;
  return lead+out;
}

function worldsHtml(){
  const ws=DV.worlds;
  if(!ws.length) return "";
  const T=DV.samples;
  const hasSamples=T&&ws.some(w=>has(w.samples));
  const hasTick=ws.some(w=>has(w.tps));
  const tpsElsewhere=!!(D.series&&D.series.tps)&&Array.isArray(D.worldTps)&&D.worldTps.length>0;
  const entMap=new Map((D.entities||[]).map(e=>[e[0],e[1]]));
  const hasEnt=entMap.size>0||ws.some(w=>has(w.entities));
  const hasChunks=ws.some(w=>has(w.chunks));
  const hasChunksGen=ws.some(w=>has(w.chunksGenerated));
  const hasChunksLoad=ws.some(w=>has(w.chunksLoaded));
  const hasPct=ws.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
  const pcountOf=w=>{const a=w.playerNames||[];const n=has(w.players)?w.players:a.length;return `<span class="pcount${n?'':' z'}"${a.length?` data-tip="In world: ${esc(a.join(", "))}"`:''}><span class="plk">${I.players}</span><b>${n}</b></span>`;};
  const rows=ws.map(w=>{
    const isInst=String(w.name).indexOf("instance-")===0;
    const kind=isInst?"instance":"persistent";
    const badges=w.stalled?' <span class="st STALL" style="margin-left:6px">Stalled</span>':'';
    let cells=`<td class="nm" data-sval="${esc(worldLabel(w.name))}"><span${w.stalled?' class="stallname"':''} data-tipov="${esc(w.name)}">${esc(worldLabel(w.name))}</span>${badges} ${pcountOf(w)}</td><td class="pkg">${kind}</td>`;
    if(hasEnt){
      const ents=entMap.get(w.name);
      const tot=has(w.entities)?w.entities:(ents&&ents.length?ents.reduce((a,t)=>a+t[1],0):null);
      if(ents&&ents.length){
        const tip=ents.map(t=>`${String(t[0])} ×${fmt(t[1])}`).join(", ");
        cells+=`<td data-num="${tot}"><span class="pcount" data-tip="Top types: ${esc(tip)}"><b>${fmt(tot)}</b></span></td>`;
      } else if(tot!=null) cells+=`<td data-num="${tot}"><span class="pcount"><b>${fmt(tot)}</b></span></td>`;
      else cells+=`<td data-num="-1"><span class="pkg">·</span></td>`;
    }
    if(hasChunks) cells+=`<td class="r" data-num="${has(w.chunks)?w.chunks:-1}">${has(w.chunks)?fmt(w.chunks):"·"}</td>`;
    if(hasChunksGen) cells+=`<td class="r" data-num="${has(w.chunksGenerated)?w.chunksGenerated:-1}">${has(w.chunksGenerated)?fmt(w.chunksGenerated):"·"}</td>`;
    if(hasChunksLoad) cells+=`<td class="r" data-num="${has(w.chunksLoaded)?w.chunksLoaded:-1}">${has(w.chunksLoaded)?fmt(w.chunksLoaded):"·"}</td>`;
    if(hasTick){
      if(!tpsElsewhere) cells+=`<td class="r" data-num="${has(w.tps)?w.tps:-1}">${has(w.tps)&&w.tps>=0?w.tps.toFixed(1):"·"}</td>`;
      if(hasPct){
        const med=has(w.msptP50)?w.msptP50:w.mspt;
        const pc=v=>has(v)&&v>=0?v.toFixed(1):"·";
        cells+=`<td class="r" data-num="${has(med)?med:-1}">${pc(med)}</td><td class="r" data-num="${has(w.msptP95)?w.msptP95:-1}">${pc(w.msptP95)}</td><td class="r" data-num="${has(w.msptMax)?w.msptMax:-1}">${pc(w.msptMax)}</td>`;
      } else {
        cells+=`<td class="r" data-num="${has(w.mspt)?w.mspt:-1}">${has(w.mspt)&&w.mspt>=0?w.mspt.toFixed(1):"·"}</td>`;
      }
    }
    if(hasSamples){
      const s=has(w.samples)?w.samples:0, p=pct(s,T), heavy=p>=20, idle=s===0;
      cells+=`<td class="r" data-num="${s}">${fmt(s)}</td><td class="r"><span class="${heavy?'v-warn':(idle?'pkg':'pct')}">${p.toFixed(1)}%${heavy?'<span class="vword">high</span>':''}</span></td>`;
    }
    return `<tr class="${w.stalled?'hl':''}">${cells}</tr>`;
  }).join("");
  let head=thc("World","World or ephemeral instance name",{sort:"text"})+thc("Kind","Persistent world or ephemeral instance",{sort:"text"});
  if(hasEnt) head+=thc("Entities","Live entities in this world at capture. Hover a count for the types.",{sort:"num"});
  if(hasChunks) head+=thc("Chunks","Loaded chunks in this world at capture",{sort:"num",r:true});
  if(hasChunksGen) head+=thc("Chunks gen","Chunks generated in this world during the captured window",{sort:"num",r:true});
  if(hasChunksLoad) head+=thc("Chunks loaded","Chunks loaded (disk + generated) in this world during the captured window",{sort:"num",r:true});
  if(hasTick){
    if(!tpsElsewhere) head+=thc("TPS","TPS at capture",{sort:"num",r:true});
    if(hasPct) head+=thc("Tick time med","Median tick time over the window (ms)",{sort:"num",r:true})+thc("p95","95th percentile tick time (ms)",{sort:"num",r:true})+thc("max","Slowest single tick in the window (ms)",{sort:"num",r:true});
    else head+=thc("Tick time","Average tick time at capture (ms)",{sort:"num",r:true});
  }
  if(hasSamples) head+=thc("Samples","CPU samples on this world's tick thread",{sort:"num",r:true,def:"desc"})+thc("CPU&nbsp;%","Share of all CPU samples",{sort:"num",r:true});
  const tpsNote=hasTick&&tpsElsewhere?` TPS per world is in <a href="#metrics">Key metrics</a>.`:"";
  const lead=`<p class="lead">Hover a player count for names, or an entity count for types.${tpsNote}</p>`;
  return lead+`<div class="tbar"><span class="srch"><span class="si">${I.search}</span><input type="search" aria-label="Filter worlds" placeholder="filter worlds…" data-filter="w-t"></span><span class="count" data-count="w-t">${ws.length} rows</span></div>
  <div class="tscroll"><table class="sortable" id="w-t"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function systemHtml(){
  const s=D.sys; if(!s) return "";
  const row=(k,v)=>v==null?"":`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`;
  function swapRow(){
    const sw=s.swap;
    if(!sw||!has(sw.total)||sw.total<=0) return "";
    const used=Math.max(0,sw.total-(sw.free||0));
    return `<div class="row"><span class="k">Swap (machine)</span><span class="v${used>0?" v-warn":""}">${fmtBytes(used)} used of ${fmtBytes(sw.total)}</span></div>`;
  }
  function card(ic,title,sub,rows){const body=rows.join("");if(!body)return "";return `<div class="kvcard"><div class="kvh"><span class="ic">${ic}</span><b>${esc(title)}</b><small>${esc(sub||"")}</small></div><div class="kv">${body}</div></div>`;}
  const cards=[
    card(I.cpu,"Processor",has(s.cpuCores)?s.cpuCores+" cores":"",[
      row("Brand",s.cpuBrand),row("Cores",s.cpuCores),row("Hardware threads",s.hwThreads),row("Sockets",s.sockets),
      row("Container CPU",has(s.cpuUsageCores)&&s.cpuUsageCores>=0?s.cpuUsageCores.toFixed(2)+" cores"+(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0&&has(s.cpuCores)&&s.container.cpuLimit<s.cpuCores?" ("+(100*s.cpuUsageCores/s.container.cpuLimit).toFixed(0)+"% of limit)":(has(s.cpuCores)&&s.cpuCores>0?" ("+(100*s.cpuUsageCores/s.cpuCores).toFixed(0)+"% of "+s.cpuCores+" cores)":"")):null),
      row("CPU affinity (cpuset)",s.cpuset||null),
      row("Pressure (PSI some avg10)",[has(s.psiCpu)&&s.psiCpu>=0?"cpu "+s.psiCpu.toFixed(1)+"%":null,has(s.psiIo)&&s.psiIo>=0?"io "+s.psiIo.toFixed(1)+"%":null,has(s.psiMem)&&s.psiMem>=0?"mem "+s.psiMem.toFixed(1)+"%":null].filter(Boolean).join(" · ")||null),
      row("Machine RAM",has(s.ramTotal)&&s.ramTotal>0?gib(s.ramTotal).toFixed(1)+" GiB":null),
      row("CPU throttling",has(s.throttledPeriods)&&s.throttledPeriods>0?s.throttledPeriods+" periods"+(has(s.throttledMs)&&s.throttledMs>0?" · "+fmtDur(s.throttledMs):"")+" in window":null),
      row("CPU steal (machine)",has(s.cpuStealPct)&&s.cpuStealPct>=0?s.cpuStealPct.toFixed(1)+"% of window":null),
      row("CPU iowait (machine)",has(s.cpuIowaitPct)&&s.cpuIowaitPct>=0?s.cpuIowaitPct.toFixed(1)+"% of window":null)
    ]),
    card(osIcon(s.os||""),"Operating system",osFamily(s.os||""),[
      row("OS",s.os),row("Architecture",s.arch),row("Server name",s.server),
      row("Server software",s.hytale?"Hytale Dedicated "+s.hytale:null),row("Uptime",has(s.uptimeMs)&&s.uptimeMs>0?fmtDur(s.uptimeMs):null),
      row("Disk",s.disk&&has(s.disk.total)&&s.disk.total>0?gib(s.disk.free).toFixed(1)+" GiB free of "+gib(s.disk.total).toFixed(1)+" GiB":null),
      row("Block I/O limit",(has(s.ioReadLimit)&&s.ioReadLimit>=0)||(has(s.ioWriteLimit)&&s.ioWriteLimit>=0)?[has(s.ioReadLimit)&&s.ioReadLimit>=0?"read "+fmtBytes(s.ioReadLimit)+"/s":null,has(s.ioWriteLimit)&&s.ioWriteLimit>=0?"write "+fmtBytes(s.ioWriteLimit)+"/s":null].filter(Boolean).join(" · "):null),
      row("Machine memory",has(s.hostMemUsed)&&s.hostMemUsed>=0?(has(s.ramTotal)&&s.ramTotal>0?gib(s.hostMemUsed).toFixed(1)+" GiB of "+gib(s.ramTotal).toFixed(1)+" GiB used":gib(s.hostMemUsed).toFixed(1)+" GiB used"):null),
      swapRow(),
      row("Runtime",s.container&&s.container.runtime?s.container.runtime:null),
      row("Container",s.container&&s.container.type?s.container.type:null),
      row("CPU limit",(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0)?(has(s.cpuCores)&&s.cpuCores>0&&s.container.cpuLimit>=s.cpuCores?"unlimited (quota "+s.container.cpuLimit.toFixed(0)+")":s.container.cpuLimit.toFixed(1)+" cores"):null),
      row("Memory limit",s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.container.memLimit):null),
      row("Open files",has(s.openFds)&&has(s.maxFds)&&s.maxFds>0&&s.openFds>=0.8*s.maxFds?fmt(s.openFds)+" of "+fmt(s.maxFds):null),
      row("Container memory",has(s.containerMemUsed)&&s.containerMemUsed>=0?(s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.containerMemUsed)+" of "+fmtBytes(s.container.memLimit)+" ("+(100*s.containerMemUsed/s.container.memLimit).toFixed(0)+"%)":fmtBytes(s.containerMemUsed)):null),
      row("Container swap",has(s.containerSwapUsed)&&s.containerSwapUsed>=0?(s.containerSwapMax===0?"disabled":fmtBytes(s.containerSwapUsed)+(has(s.containerSwapMax)&&s.containerSwapMax>0?" of "+fmtBytes(s.containerSwapMax):" used")):null),
      row("OOM kills",has(s.oomKills)&&s.oomKills>0?fmt(s.oomKills)+" (cumulative)":null)
    ]),
    card(I.java,"Java / JVM",s.javaVendor?jvmDistro(s.javaVendor):"",[
      row("Runtime",s.jvm),row("Vendor",s.javaVendor),row("Version",s.javaVersion),row("java.home",s.javaHome),
      ...(s.loaders||[]).map(l=>row(l[0]+" loader",l[1]))
    ])
  ].filter(Boolean);
  const advCards=[
    card(I.cpu,"Load and JVM pauses","",[
      row("Load average (1m, machine)",has(s.loadAvg)&&s.loadAvg>=0?s.loadAvg.toFixed(2):null),
      row("Safepoints",has(s.safepointCount)&&s.safepointCount>0?fmt(s.safepointCount)+(has(s.safepointMs)&&s.safepointMs>0?" · "+s.safepointMs.toFixed(0)+" ms to-safepoint":"")+" in window":null)
    ]),
    card(I.gc,"Garbage collector",DV.gcName||"",[
      row("Young",s.gcYoung),row("Old",s.gcOld),row("Parallel GC threads",s.gcParallel),row("Concurrent GC threads",s.gcConc),
      row("GC time ratio",s.gcTimeRatio),
      row("Explicit GC",D.gc&&has(D.gc.explicitDisabled)?(D.gc.explicitDisabled?"disabled":(D.gc.explicitConcurrent?"concurrent":"stop-the-world")):null)
    ])
  ].filter(Boolean);
  let cw="";
  const cRisk=containerRisk();
  if(cRisk) cw=`<div class="cwarn" id="cwarn">${I.warn}<span>The heap limit (-Xmx <b>${gib(cRisk.xmx).toFixed(1)} GiB</b>) is <b>${Math.round(100*cRisk.xmx/cRisk.lim)}%</b> of the ${s.container&&s.container.runtime?esc(s.container.runtime)+" ":""}container's <b>${gib(cRisk.lim).toFixed(1)} GiB</b>. The container can kill the server. Set -Xmx to about 75% of the container limit.</span></div>`;
  let dw="";
  const dRisk=diskRisk();
  if(dRisk) dw=`<div class="cwarn" id="dwarn">${I.warn}<span>Low disk space (<b>${gib(dRisk.free).toFixed(1)} GiB</b> free of ${gib(dRisk.total).toFixed(1)} GiB). The recording and incident bundles can fail to write.</span></div>`;
  let cmd="";
  if(s.startCommand){
    const long=s.startCommand.length>200;
    cmd=`<div class="codewrap${long?" closed":""}" style="margin-top:16px"><button type="button" class="codehd" data-code aria-expanded="${!long}"><span class="ic">${I.term}</span><span class="fn">Start command</span><span class="chev2" aria-hidden="true">${I.chev}</span></button><pre class="cmdpre">${esc(s.startCommand)}</pre></div>`;
  }
  const advanced=adv("JVM details for support",advCards.length?`<div class="syscols">${advCards.join("")}</div>`:"");
  if(!cards.length&&!cw&&!dw&&!cmd&&!advanced) return "";
  return (cards.length?`<div class="syscols">${cards.join("")}</div>`:"")+cw+dw+cmd+advanced;
}

function modSite(site){
  const w=site==null?"":String(site).trim();
  return /^https?:\/\/[^\s/?#]+\S*$/i.test(w)?w:null;
}
function modNameLink(name,site,search){
  const own=modSite(site);
  const href=own||`https://www.curseforge.com/hytale/search?search=${encodeURIComponent(search||name)}`;
  return `<a class="evlink" style="margin-left:0;font-size:inherit" href="${esc(href)}" target="_blank" rel="noopener noreferrer" data-tip="${own?"Open the mod website":"Search CurseForge for this mod"}">${esc(name)}</a>`;
}

function pluginsHtml(){
  const pl=D.plugins;
  if(!pl||!pl.length) return "";
  const core=pl.filter(p=>p[3]).length, comm=pl.length-core;
  const incompat=pl.filter(p=>p[5]==="INCOMPATIBLE").length;
  const rows=pl.map(p=>{
    const [author,name,ver,isCore]=p, range=p[4]||null, compat=p[5]||null;
    const link=isCore?'<span class="corebadge">core module</span>':`<a class="cf" href="https://www.curseforge.com/hytale/search?search=${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">${I.ext} CurseForge</a>`;
    const ci=MIXCONF.modInfo.get(name);
    const ovl=ci?` <span class="ovltag" data-tip="${esc(ci.join(", "))}">mixin overlap</span>`:"";
    let bad="", cfCell;
    if(compat==="INCOMPATIBLE"){
      bad=` <span class="ovltag badtag" data-tip="Declared server range ${esc(range||"?")} excludes the running server version.">incompatible</span>`;
      cfCell=`<span class="vtag v-bad">${esc(range||"?")}</span>`;
    } else if(compat==="MISSING"||compat==="PARSE_FAILED"){
      cfCell=`<span class="pkg" data-tip="No parseable server range in the manifest.">?</span>`;
    } else {
      cfCell=range?`<span class="vtag">${esc(range)}</span>`:`<span class="pkg">·</span>`;

function logHtml(){
  const log=D.log;
  if(!log||!log.length) return "";
  const grouped=[];
  for(const l of log){
    const prev=grouped[grouped.length-1];
    if(prev && prev[0]===l[0] && prev[1]===l[1] && prev[2]===l[2]) prev[3]++;
    else grouped.push([l[0],l[1],l[2],1]);
  }
  const collapsed=log.length-grouped.length;
  const errs=log.filter(l=>l[0]==="ERROR").length, warns=log.filter(l=>l[0]==="WARN").length;
  const lines=grouped.map(l=>{
    const [lv,src,msg,n]=l;
    const lvCls=(lv==="ERROR"||lv==="WARN"||lv==="INFO")?lv:"OTHER";
    const nl=msg.indexOf("\n");
    const multiline=nl>=0;
    const first=multiline?msg.slice(0,nl):msg;
    const cnt=n>1?`<span class="repeat" data-tip="repeated ${n} times">×${n}</span>`:"";
    const body=multiline
      ? `<details class="logdet"><summary><span class="logfirst">${esc(first)}</span> <span class="logmore">+${msg.split("\n").length-1} more lines</span>${cnt}</summary><pre class="logpre">${esc(msg)}</pre></details>`
      : `${esc(msg)}${cnt}`;
    return `<div class="lline l${lvCls}" data-type="${lvCls}"><span class="lvl ${lvCls}">${esc(lv||"·")}</span><span class="lsrc" data-tipov="${esc(src||"·")}">${esc(src||"·")}</span><div class="lmsg">${body}</div></div>`;
  }).join("");
  return `<p class="lead">The last server log lines before the incident, oldest first. <b>${errs}</b> error${errs===1?"":"s"}, <b>${warns}</b> warning${warns===1?"":"s"}${collapsed>0?`, <b>${collapsed}</b> repeat${collapsed===1?"":"s"} merged`:''}.</p>
  <div class="tbar"><span class="srch"><span class="si">${I.search}</span><input type="search" aria-label="Filter log" placeholder="filter log…" data-filter="log-list"></span><button type="button" class="chip tog" data-type-filter="log-list" data-val="ERROR" aria-pressed="false">${errs} errors</button><button type="button" class="chip tog" data-type-filter="log-list" data-val="WARN" aria-pressed="false">${warns} warnings</button><span class="count" data-count="log-list">${grouped.length} lines</span></div>
  <div class="logscroll" id="log-list">${lines}</div>`;
}

function mixinsHtml(){
  const M=D.mixins;
  if(!M) return "";
  const H=M.hyinit;
  if(!H) return legacyMixinsHtml(M);
  const sources=M.sources||[], cfgs=M.configs||[], probs=M.problems||[], ovl=M.overlaps||[];
  const errors=probs.filter(p=>p[0]==="error").length, warns=probs.length-errors;
  const totalMixins=cfgs.reduce((a,c)=>a+(c[1]||[]).length,0);
  const lead=`<p class="lead">Hyinit${H.version?` <b>${esc(H.version)}</b>`:""} loaded <b>${sources.length}</b> early plugin JAR${sources.length===1?"":"s"} with <b>${fmt(totalMixins)}</b> Mixin${totalMixins===1?"":"s"} in <b>${cfgs.length}</b> config${cfgs.length===1?"":"s"}.${has(H.patchedClasses)?` Mixins changed <b>${fmt(H.patchedClasses)}</b> class${H.patchedClasses===1?"":"es"} by capture time.`:""} The full list of changed methods is in <code>extras/mixins.txt</code>.</p>${M.note?`<div class="subnote">${esc(M.note)}</div>`:""}`;

    }).join("");
    const head=[errors?`${errors} error${errors===1?"":"s"}`:"",warns?`${warns} warning${warns===1?"":"s"}`:""].filter(Boolean).join(" and ");
    prob=`<div class="mxconf${errors?" bad":""}" style="margin:0 0 14px"><div class="mxchd">${I.warn} ${head} since startup</div><div class="mxcsub">The server log has the full stack traces.</div>${rows}${has(H.problemsOmitted)&&H.problemsOmitted>0?`<div class="mxcsub">${fmt(H.problemsOmitted)} more were not kept.</div>`:""}</div>`;
  } else {
    prob=`<div class="mxok" style="margin:0 0 14px">${I.check} No Mixin problems since startup.</div>`;
  }
  const started=H.launchMode==="earlyPlugin"?"from the early plugins folder":H.launchMode==="launcher"?"with java -jar":H.launchMode;
  const kv=[
    ["Hyinit",H.version],
    ["Started",started],
    ["Mixin",[H.mixin,H.fabricMixin?"Fabric Mixin "+H.fabricMixin:null,H.mixinExtras?"MixinExtras "+H.mixinExtras:null].filter(Boolean).join(" · ")],
    ["Classes transformed",has(H.classesTransformed)?fmt(H.classesTransformed)+(has(H.transformMs)?` in ${fmt(H.transformMs)} ms`:""):null],
    ["Hyinit startup",has(H.bootstrapMs)?`${fmt(H.bootstrapMs)} ms before Hytale started`:null]
  ].filter(r=>r[1]).map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(String(r[1]))}</span></div>`).join("");
  const card=`<div class="kvcard" style="margin-bottom:14px"><div class="kvh"><span class="ic">${I.layers}</span><b>Versions</b></div><div class="kv">${kv}</div></div>`;
  const srows=sources.map(s=>{
    const [file,plugin,ver,sha,configs,main,skipped,compat,methods]=s;
    const tags=(skipped?` <span class="ovltag badtag" data-tip="The plugin was disabled at startup, so its Mixins were not applied.">Mixins skipped</span>`:"")
      +(compat?` <span class="ovltag" data-tip="Declared Mixin compatibility">compat ${esc(compat)}</span>`:"");
    const name=plugin?String(plugin).split(":").pop():String(file||"").replace(/\.jar$/i,"");
    const hp=plugin?(D.plugins||[]).find(p=>((p[0]?p[0]+":":"")+p[1]).toLowerCase()===String(plugin).toLowerCase()):null;
    const nameLink=modNameLink(name,hp?hp[6]:null,plugin?name:name.replace(/-\d[\w.+-]*$/,"")||name);
    return `<tr><td class="nm" data-sval="${esc(name)}">${nameLink}${tags}</td><td class="pkg">${esc(file||"·")}</td><td class="vtag">${esc(ver||"·")}</td><td data-sval="${esc(sha||"")}">${sha?`<span class="sha" data-tip="SHA-256 ${esc(sha)}">${esc(String(sha).slice(0,8))}</span>`:`<span class="pkg">·</span>`}</td><td class="r" data-num="${methods||0}">${has(methods)?fmt(methods):"·"}</td><td style="white-space:normal">${(configs||[]).map(c=>`<span class="mxchip">${esc(c)}</span>`).join(" ")}</td></tr>`;
  }).join("");

    <div class="tscroll"><table class="sortable" id="mxs-t"><thead><tr>${thc("Mod","Plugin name from the JAR's manifest. Opens the mod website, or a CurseForge search when it has none.",{sort:"text"})}${thc("JAR","File name in the early plugins folder",{sort:"text"})}${thc("Version","Version from the JAR's manifest",{sort:"text"})}${thc("SHA-256","First 8 characters. Hover for the full checksum.",{sort:"text"})}${thc("Methods","Methods that this JAR's Mixins added or changed so far",{sort:"num",r:true,def:"desc"})}${thc("Mixin configs","Configs Hyinit registered from this JAR")}</tr></thead><tbody>${srows}</tbody></table></div></div>`:"";
  const crows=cfgs.map(c=>{
    const [name,mixins,source,pkg,targets,compat,priority,required]=c;
    const n=(mixins||[]).length;
    return `<tr><td class="nm" data-sval="${esc(name)}">${esc(name)}${pkg?`<div class="pkg">${esc(pkg)}</div>`:""}</td><td data-sval="${esc(mixinMod(source))}">${esc(mixinMod(source))}</td><td class="r" data-num="${n}">${n}</td><td class="r" data-num="${targets||0}">${has(targets)?fmt(targets):"·"}</td><td style="white-space:normal">${n?`<details><summary>${n} class${n===1?"":"es"}</summary>${mixinChips(mixins)}</details>`:"·"}</td></tr>`;
  }).join("");
  const ctable=cfgs.length?`<div class="card" style="margin-bottom:14px"><h3><span class="ic">${I.doc}</span> Mixin configs</h3>
    <div class="tscroll"><table class="sortable" id="mx-t"><thead><tr>${thc("Config","Mixin config file and its Mixin package",{sort:"text"})}${thc("Mod","The JAR that registered this config",{sort:"text"})}${thc("Mixins","Mixin classes in this config",{sort:"num",r:true,def:"desc"})}${thc("Targets","Classes this config changes",{sort:"num",r:true})}${thc("Mixin classes","Expand to list the Mixin classes")}</tr></thead><tbody>${crows}</tbody></table></div></div>`:"";
  let over="";
  if(ovl.length){
    const shown=ovl.slice(0,50).map(o=>{
      const mods=[...new Set((o[1]||[]).map(p=>p[0]))];
      const chips=(o[1]||[]).map(p=>`<span class="mxchip warnchip">${esc(p[0])}${p[1]?" → "+esc(String(p[1]).split(".").pop()):""}</span>`).join(" ");
      return `<div class="mxcrow"><div class="mxchead">${mods.map(esc).join(' <span class="vs">↔</span> ')} <span class="dash">·</span> ${esc(leafName(o[0]))}</div><code>${esc(o[0])}</code><div class="mxchips">${chips}</div></div>`;
    }).join("");
    over=`<div class="mxconf" style="margin:0 0 14px"><div class="mxchd">${I.warn} ${ovl.length} method${ovl.length===1?"":"s"} changed by more than one mod</div>
      <div class="mxcsub">Two mods change the same code here. If the server misbehaves, test with one of them removed.</div>
      ${shown}${ovl.length>50?`<div class="mxcsub">${ovl.length-50} more are in extras/mixins.txt.</div>`:""}</div>`;
  } else if(sources.length>=2){
    over=`<div class="mxok" style="margin:0 0 14px">${I.check} No method is changed by more than one mod.</div>`;
  }
  return lead+prob+card+stable+over+ctable;
}

const menuToggle=$("#menu-toggle"),reportNav=$("#report-nav"),narrow=matchMedia("(max-width:800px)");

function applyFilter(id){
  const inp=document.querySelector(`input[data-filter="${id}"]`);
  const q=(inp?inp.value:"").toLowerCase();

  const type=chip?chip.dataset.val:"";
  const root=document.getElementById(id); if(!root) return;
  const items=root.tagName==="TABLE"||root.querySelector("tbody")?root.querySelectorAll("tbody tr"):root.querySelectorAll(":scope > *");
  let n=0;
  items.forEach(el=>{
    const okText=el.textContent.toLowerCase().includes(q);
    const okType=!type||el.dataset.type===type;
    const show=okText&&okType; el.style.display=show?"":"none"; if(show)n++;
  });
  const c=document.querySelector(`[data-count="${id}"]`); if(c)c.textContent=n+(root.tagName==="DIV"?" lines":" rows");
  const empty=document.querySelector(`[data-filter-empty="${id}"]`); if(empty) empty.hidden=n!==0;
  pruneBarTips();
}

document.querySelectorAll("table.sortable").forEach(tbl=>{
  const ths=[...tbl.querySelectorAll("thead th")];
  const sortBy=(th,ci,asc)=>{
    const type=th.dataset.sort, tb=tbl.querySelector("tbody");
    const rows=[...tb.querySelectorAll("tr")];
    ths.forEach(x=>{x.classList.remove("asc","desc");if(x.dataset.sort)x.setAttribute("aria-sort","none");});
    th.classList.add(asc?"asc":"desc");th.setAttribute("aria-sort",asc?"ascending":"descending");
    const val=(tr)=>{
      const cell=tr.children[ci];
      if(type==="num"){
        const dn=cell.getAttribute("data-num");
        return dn!=null?parseFloat(dn):(parseFloat(cell.textContent.replace(/[^0-9.\-]/g,""))||0);
      }
      const sv=cell.getAttribute("data-sval");
      return (sv!=null?sv:cell.textContent).trim().toLowerCase();
    };
    rows.sort((a,b)=>{
      const av=val(a), bv=val(b);
      if(type==="num")return asc?av-bv:bv-av;
      return asc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    });
    rows.forEach(r=>tb.appendChild(r));
    pruneBarTips();
  };
  ths.forEach((th,ci)=>{
    if(!th.classList.contains("sortable"))return;
    th.querySelector(".sortbtn").addEventListener("click",()=>sortBy(th,ci,!th.classList.contains("asc")));
  });
  const di=ths.findIndex(x=>x.classList.contains("asc")||x.classList.contains("desc"));
  if(di>=0) sortBy(ths[di],di,ths[di].classList.contains("asc"));
});

function buildMarkdown(){
  const T=DV.samples, ser=D.series||{}, L=[];
  L.push(`# Incident ${D.incident.id}`,"");
  L.push(`**${D.incident.severity.charAt(0)+D.incident.severity.slice(1).toLowerCase()}** · ${D.incident.triggerLabel}${has(D.incident.stallMs)?` · stalled ${fmtDur(D.incident.stallMs)}`:""}${D.incident.worldShort?` on world ${D.incident.worldShort}`:""}`);
  L.push(`Captured ${D.incident.created}${DV.win?` · window ${DV.win}`:""}${T?` · ${fmt(T)} CPU samples`:""}${has(D.incident.players)?` · ${D.incident.players} player${D.incident.players===1?"":"s"}`:""}`,"");
  if(has(D.incident.note)) L.push(`> ${D.incident.note}`,"");
  if(ZOOM&&(ZOOM.a>0||ZOOM.b<1)) L.push("> Diagnosis, CPU, hot methods, mods and the flame graph cover the entire recording, not the chosen time range.","");
  if(D.jfrUnavailableReason) L.push(`This bundle has no usable recording: ${D.jfrUnavailableReason}`,"");
  const ftext=items=>(items||[]).map(s=>s[1]==="code"?"`"+s[0]+"`":s[1]==="b"?"**"+s[0]+"**":s[0]).join("");
  const fnd=D.findings||{};
  const diag=(fnd.evidence||[]).map(e=>`- ${ftext(e.spans)}`);
  if(DV.stalled&&has(DV.stalled.samples)&&T&&DV.worlds.length>1) diag.push(`- Stalled world ${worldLabel(DV.stalled.name)} ranks #${DV.stalledRank} of ${DV.worlds.length} by CPU`);
  if(D.gc) diag.push(`- GC: ${DV.gcName||"GC"}, ${D.gc.collections} collections, longest pause ${D.gc.maxPauseMs} ms`);
  if(D.threadStates) diag.push(`- Threads: ${D.threadTotal??"?"} live, ${D.threadStates.BLOCKED||0} blocked`);
  if(D.ram&&D.sys&&has(D.sys.ramTotal)) diag.push(`- Memory: RSS ${gib(D.ram.rssLast).toFixed(1)} GiB of ${gib(D.sys.ramTotal).toFixed(1)} GiB${D.heap?`, heap peak ${gib(D.heap.peak).toFixed(1)} GiB`:""}`);
  const steps=(fnd.steps||[]).map((e,i)=>`${i+1}. ${ftext(e.spans)}`);
  if(diag.length||steps.length){ L.push(`## Diagnosis`); L.push(...diag); if(steps.length) L.push("","Next steps:",...steps); L.push(""); }
  const capturedCards=[...document.querySelectorAll("#stalled .kvcard")];
  if(capturedCards.length){
    L.push(`## Captured diagnostics`,"");
    capturedCards.forEach(card=>{
      const head=card.querySelector(".kvh");
      L.push(`### ${head?head.textContent.trim():"Section"}`);
      card.querySelectorAll(".kv .row").forEach(r=>{
        const k=r.querySelector(".k"), v=r.querySelector(".v");
        L.push(`- **${k?k.textContent.trim():""}**: ${v?v.textContent.trim().replace(/\s*\n\s*/g," · "):""}`);
      });
      const pre=card.querySelector("pre");
      if(pre) L.push("```",pre.textContent.replace(/\s+$/,""),"```");
      L.push("");
    });
  }
  if(D.deadlocked&&D.deadlocked.length){
    L.push(`## Deadlock detected (${D.deadlocked.length} deadlocked threads)`);
    D.deadlocked.forEach(d=>L.push(`- ${d}`));
    L.push("");
  }
  if(D.sys){
    L.push(`## Environment`);
    if(D.sys.os) L.push(`- OS: ${D.sys.os}${D.sys.arch?` (${D.sys.arch})`:""}`);
    if(D.sys.cpuBrand||has(D.sys.cpuCores)) L.push(`- CPU: ${D.sys.cpuBrand||""}${has(D.sys.cpuCores)?` (${D.sys.cpuCores} cores)`:""}${D.cpu?`, peak ${D.cpu.machMax.toFixed(1)}%`:""}`);
    if(D.sys.jvm) L.push(`- JVM: ${D.sys.jvm}${DV.gcName?`, ${DV.gcName} GC`:""}`);
    if(D.sys.server||D.sys.hytale) L.push(`- Server: ${[D.sys.server,D.sys.hytale?"Hytale "+D.sys.hytale:null,D.hyboxVersion?"Hybox v"+D.hyboxVersion:null].filter(Boolean).join(" · ")}`);
    if(D.sys.disk&&has(D.sys.disk.total)&&D.sys.disk.total>0){
      let dl=`- Disk: ${gib(D.sys.disk.free).toFixed(1)} GiB free of ${gib(D.sys.disk.total).toFixed(1)} GiB`;
      if(DV.diskG){const st=sstat(DV.diskG);dl+=` (window min ${st.min.toFixed(1)} / avg ${st.avg.toFixed(1)} / max ${st.max.toFixed(1)} GiB free)`;}
      L.push(dl);
      const dRisk=diskRisk();
      if(dRisk) L.push(`- WARNING: low disk space (${gib(dRisk.free).toFixed(1)} GiB free of ${gib(dRisk.total).toFixed(1)} GiB). The recording and incident bundles can fail to write.`);
    }
    {
      const dio=D.series||{};
      const dstat=s=>{const st=sstat(s.map(v=>v*1e6/MIB));return `min ${st.min.toFixed(1)} / avg ${st.avg.toFixed(1)} / max ${st.max.toFixed(1)} MiB/s`;};
      const ps=[];
      if(dio.diskWrite) ps.push(`write ${dstat(dio.diskWrite)}`);
      if(dio.diskRead) ps.push(`read ${dstat(dio.diskRead)}`);
      if(ps.length) L.push(`- Disk I/O: ${ps.join(", ")}`);
    }
    if(has(D.sys.hostMemUsed)&&D.sys.hostMemUsed>=0&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)
      L.push(`- Machine memory: ${gib(D.sys.hostMemUsed).toFixed(1)} GiB of ${gib(D.sys.ramTotal).toFixed(1)} GiB used`);
    if(D.sys.swap&&has(D.sys.swap.total)&&D.sys.swap.total>0){
      const swUsed=Math.max(0,D.sys.swap.total-(D.sys.swap.free||0));
      if(swUsed>0) L.push(`- Swap: ${fmtBytes(swUsed)} used of ${fmtBytes(D.sys.swap.total)}`);
    }
    if(D.sys.nonHeap&&has(D.sys.nonHeap.used))
      L.push(`- Non-heap: ${fmtBytes(D.sys.nonHeap.used)} used / ${fmtBytes(D.sys.nonHeap.committed)} committed`);
    if(D.net&&Array.isArray(D.net.others)&&D.net.others.length)
      D.net.others.forEach(o=>L.push(`- Net ${o[0]}: in ${Number(o[1]).toFixed(1)}/${Number(o[2]).toFixed(1)} · out ${Number(o[3]).toFixed(1)}/${Number(o[4]).toFixed(1)} Mbit/s (avg/peak)`));
    if(D.sys.container){
      const c=D.sys.container;
      const parts=[c.runtime,c.type,has(c.cpuLimit)&&c.cpuLimit>0?c.cpuLimit.toFixed(1)+" cores":null,
        has(c.memLimit)&&c.memLimit>0?fmtBytes(c.memLimit)+" memory limit":null].filter(Boolean);
      if(parts.length) L.push(`- Container: ${parts.join(" · ")}`);
      const cRisk=containerRisk();
      if(cRisk) L.push(`- WARNING: the heap limit (-Xmx ${gib(cRisk.xmx).toFixed(1)} GiB) is ${Math.round(100*cRisk.xmx/cRisk.lim)}% of the container's ${gib(cRisk.lim).toFixed(1)} GiB. The container can kill the server. Set -Xmx to about 75% of the container limit.`);
    }
    L.push("");
  }
  const cmpRows=[...document.querySelectorAll("[data-cmp]")];
  if(cmpRows.length){
    L.push(`## Baseline vs incident window`,"| Metric | Baseline avg | Incident avg | Delta |","|---|---|---|---|");
    cmpRows.forEach(tr=>{
      const cells=[...tr.children].map(td=>td.textContent.trim());
      L.push(`| ${cells[0]} | ${cells[1]} | ${cells[2]} | ${cells[3]} |`);
    });
    L.push("");
  }
  if(D.hotMethods&&D.hotMethods.length&&T){
    L.push(`## Hot methods`,"| # | Method | Samples | Self% |","|---|---|---|---|");
    D.hotMethods.slice(0,10).forEach((m,i)=>L.push(`| ${i+1} | ${m[1]} | ${fmt(m[0])} | ${pct(m[0],T).toFixed(2)}% |`));
    L.push("");
  }
  if(D.hotThreads&&D.hotThreads.length&&T){
    const thm=D.hotThreads.some(ht=>ht.length>6);
    L.push(`## Hot threads`,`| Thread | Samples | CPU% | Top method |${thm?" Mods (self / total) |":""}`,`|---|---|---|---|${thm?"---|":""}`);
    D.hotThreads.slice(0,10).forEach(ht=>L.push(`| ${ht[2]} | ${fmt(ht[0])} | ${pct(ht[0],T).toFixed(1)}% | ${ht[3]?leafName(ht[3]):"-"} |${thm?` ${threadMods(ht[6],ht[0]).map(m=>`${m[0]} ${pct(m[1],ht[0]).toFixed(1)}% / ${pct(m[2],ht[0]).toFixed(1)}%`).join(", ")||"-"} |`:""}`));
    L.push("");
  }
  if(D.subsystems&&D.subsystems.length&&T){
    L.push(`## CPU by engine subsystem`,"| Subsystem | Samples | Share |","|---|---|---|");
    D.subsystems.slice(0,10).forEach(s=>L.push(`| ${s[0]} | ${fmt(s[1])} | ${pct(s[1],T).toFixed(1)}% |`));
    L.push("");
  }
  const modRows=D.modCpu&&D.modCpu.some(m=>m.length>4)?modSplit(D.modCpu,4):null;
  if(modRows&&modRows.length&&T){
    L.push(`## CPU by mod`,"Self is time in the mod's own code. Total includes Hytale code the mod calls into.","","| Mod | Self | Self % | Total | Total % | Self ran in | Entered through |","|---|---|---|---|---|---|---|");
    const named=(m,l)=>m?m+(l?` (${l})`:""):"-";
    modRows.slice(0,10).forEach(m=>L.push(`| ${m.id} | ${fmt(m.self)} | ${pct(m.self,T).toFixed(1)}% | ${fmt(m.total)} | ${pct(m.total,T).toFixed(1)}% | ${named(m.sm,m.sl)} | ${named(m.tm,m.tl)} |`));
    L.push("");
  } else if(!modRows&&D.modCpu&&D.modCpu.length&&T){
    L.push(`## CPU by mod`,MOD_OLDER,"","| Mod | Samples | Share | Dominant method | Top threads |","|---|---|---|---|---|");
    D.modCpu.slice(0,10).forEach(m=>L.push(`| ${m[0]} | ${fmt(m[1])} | ${pct(m[1],T).toFixed(1)}% | ${m[2]||"-"} | ${(m[3]&&m[3].length)?m[3].map(t=>`${thName(t)} ${(100*t[1]/Math.max(1,m[1])).toFixed(0)}%`).join(", "):"-"} |`));
    L.push("");
  }
  if(D.gcCauses&&D.gcCauses.length){
    L.push(`## GC causes`,"| Cause | Collections | Total pause ms |","|---|---|---|");
    D.gcCauses.forEach(c=>L.push(`| ${c[0]} | ${fmt(c[1])} | ${Number(c[2]).toFixed(1)} |`));
    L.push("");
  }
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"-";
    L.push(`## Memory pools`,"| Pool | Used | Committed | Max | At last GC |","|---|---|---|---|---|");
    [...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0))).slice(0,8).forEach(p=>
      L.push(`| ${p[0]} | ${pv(p[1])} | ${pv(p[2])} | ${pv(p[3])} | ${pv(p[4])} |`));
    L.push("");
  }
  if(D.alloc){
    const share=b=>D.alloc.total?` (${pct(b,D.alloc.total).toFixed(1)}%)`:"";
    const top=(m,n)=>(m||[]).slice(0,n).map(e=>`- ${e[0]}: ${fmtBytes(e[1])}${share(e[1])}`);
    const modFresh=(D.alloc.byMod||[]).some(m=>m.length>2);
    const sub=top(D.alloc.bySubsystem,5);
    const mod=modFresh?modSplit(D.alloc.byMod,2).slice(0,5).map(m=>`- ${m.id}: self ${fmtBytes(m.self)}${share(m.self)}, total ${fmtBytes(m.total)}${share(m.total)}`):top(D.alloc.byMod,5);
    if(sub.length||mod.length){
      L.push(`## Allocated memory (sampled)`);
      if(sub.length){ L.push(`By subsystem:`); L.push(...sub); }
      if(mod.length){ L.push(`By mod:`,modFresh?"Self is memory allocated by the mod's own code. Total includes Hytale code the mod calls into.":MOD_OLDER); L.push(...mod); }
      L.push("");
    }
  }
  if(D.retained&&D.retained.length){
    L.push(`## Long-lived allocations (leak candidates)`,"| Class | Samples | Allocation site |","|---|---|---|");
    D.retained.slice(0,10).forEach(r=>L.push(`| ${r[0]} | ${fmt(r[1])} | ${r[2]||"-"} |`));
    L.push("");
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    L.push(`## Heap histogram (point in time)`,"| Class | Instances | Bytes |","|---|---|---|");
    D.heapHistogram.slice(0,10).forEach(h=>L.push(`| ${h[0]} | ${fmt(h[1])} | ${fmtBytes(h[2])} |`));
    L.push("");
  }
  if(D.slowIo&&D.slowIo.length){
    L.push(`## Slow file operations`,"| Path | Kind | Duration ms | Bytes |","|---|---|---|---|");
    [...D.slowIo].sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${r[3]} | ${Number(r[1]).toFixed(0)} | ${fmtBytes(r[2])} |`));
    L.push("");
  }
  if(D.tickSystems&&D.tickSystems.length){
    const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
    L.push(`## Engine systems (tick cost)`,"| System | World | avg 1m ms | max 1m ms | % of budget |","|---|---|---|---|---|");
    [...D.tickSystems].sort((a,b)=>b[2]-a[2]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${worldLabel(r[1])} | ${Number(r[2]).toFixed(2)} | ${Number(r[3]).toFixed(2)} | ${(100*r[2]/BUDGET).toFixed(1)}% |`));
    L.push("");
  }
  if(D.pluginMetrics&&D.pluginMetrics.length){
    const cell=s=>String(s).replace(/\|/g,"\\|");
    L.push(`## Plugin metrics`,"Counters are rates per second (/s) between their first and last delta in the window. Window total is the sum of every delta in the window. Since start is the plugin's running total at its last update. A counter reported once has no rate (\"once\").","",
      "| Metric | Kind | Min | Avg | Max | Window total | Since start |","|---|---|---|---|---|---|---|");
    D.pluginMetrics.forEach(m=>{
      const rate=m.kind==="count"&&has(m.bucketSec), u=rate?"/s":"";
      const drawn=(m.series||[]).filter(v=>v!=null), ok=drawn.length>0;
      const st=ok?sstat(drawn):null, d=ok?autoDec(st.min,st.max,1):0;
      const f=v=>ok?Number(v).toFixed(d)+u:(m.uncharted==="zero"?"0"+u:m.uncharted==="single"?"once":"-");
      const tot=m.kind==="count"&&has(m.total)?fmt(Math.round(m.total)):"-";
      const cum=has(m.cumulative)?fmt(Math.round(m.cumulative)):"-";
      L.push(`| ${cell(m.name)} | ${m.kind==="count"?"counter":m.kind} | ${f(st?st.min:0)} | ${f(st?st.avg:0)} | ${f(st?st.max:0)} | ${tot} | ${cum} |`);
    });
    L.push("");
  }
  if(Array.isArray(D.worldTps)&&D.worldTps.length){
    L.push(`## TPS by world`);
    D.worldTps.forEach(w=>{const st=sstat(w.series);L.push(`- ${worldLabel(w.name)}: avg ${st.avg.toFixed(1)} / min ${st.min.toFixed(1)} / max ${st.max.toFixed(1)} TPS`);});
    L.push("");
  }
  if(DV.worlds.length&&T){
    const hasPct=DV.worlds.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
    const pc=v=>has(v)&&v>=0?v.toFixed(1):"-";
    L.push(`## Worlds`,
      hasPct?"| World | Kind | Tick time med | p95 | max | Samples | CPU% |":"| World | Kind | Samples | CPU% |",
      hasPct?"|---|---|---|---|---|---|---|":"|---|---|---|---|");
    DV.worlds.forEach(w=>{
      const base=`| ${worldLabel(w.name)}${w.stalled?" (stalled)":""} | ${String(w.name).indexOf("instance-")===0?"instance":"persistent"} |`;
      const tail=` ${has(w.samples)?fmt(w.samples):"-"} | ${has(w.samples)?pct(w.samples,T).toFixed(1)+"%":"-"} |`;
      L.push(hasPct?base+` ${pc(has(w.msptP50)?w.msptP50:w.mspt)} | ${pc(w.msptP95)} | ${pc(w.msptMax)} |`+tail:base+tail);
    });
    L.push("");
  }
  if((D.entities&&D.entities.length)||ser.entities){
    L.push(`## Entities`);
    if(ser.entities){const st=sstat(ser.entities);L.push(`Total over window: min ${fmt(st.min)} / avg ${fmt(Math.round(st.avg))} / max ${fmt(st.max)}`);}
    (D.entities||[]).forEach(e=>L.push(`- ${worldLabel(e[0])}: ${(e[1]||[]).map(t=>`${t[0]} x${t[1]}`).join(", ")}`));
    L.push("");
  }
  if(D.plugins&&D.plugins.length){
    const incompat=D.plugins.filter(p=>p[5]==="INCOMPATIBLE");
    L.push(`## Plugins`,`${D.plugins.length} loaded (${D.plugins.filter(p=>p[3]).length} core, ${D.plugins.filter(p=>!p[3]).length} community)`);
    incompat.forEach(p=>L.push(`- INCOMPATIBLE: ${p[1]} ${p[2]} declares server range ${p[4]||"?"}`));
    L.push("");
  }
  if(D.assetPacks&&D.assetPacks.length){
    L.push(`## Asset packs`,`${D.assetPacks.length} loaded`);
    D.assetPacks.forEach(p=>L.push(`- ${p[1]} ${p[2]}${p[5]==="INCOMPATIBLE"?` · INCOMPATIBLE (declares server range ${p[4]||"?"})`:""}`));
    L.push("");
  }
  if(MIXCONF.list&&MIXCONF.list.length){
    L.push(`## Mixin conflicts`);
    MIXCONF.list.forEach(c=>L.push(`- ${c[0]}: ${c[1].map(p=>p[1]?`${p[0]} (${p[1]})`:p[0]).join(" vs ")}`));
    L.push("");
  }
  if(D.mixins&&D.mixins.hyinit){
    const H=D.mixins.hyinit, probs=D.mixins.problems||[], ovl=D.mixins.overlaps||[];
    L.push(`## Mixins`,`Hyinit ${H.version||"?"} · Mixin ${H.mixin||"?"} · ${(D.mixins.sources||[]).length} early plugin JARs`);
    (D.mixins.sources||[]).forEach(s=>L.push(`- ${s[1]?String(s[1]).split(":").pop():s[0]} ${s[2]||""} (${s[0]}${s[3]?`, sha256 ${String(s[3]).slice(0,8)}`:""})`));
    probs.forEach(p=>L.push(`- ${String(p[0]).toUpperCase()}: ${p[1]}${p[2]?` (${p[2]})`:""}`));
    ovl.slice(0,10).forEach(o=>L.push(`- Changed by more than one mod: ${o[0]} (${[...new Set((o[1]||[]).map(p=>p[0]))].join(", ")})`));
    L.push("");
  }
  if(Array.isArray(D.events)&&D.events.length){
    const byType={};
    D.events.forEach(e=>{
      const m=/×(\d+)$/.exec(e[2]||"");
      byType[e[1]]=(byType[e[1]]||0)+(m?parseInt(m[1],10):1);
    });
    L.push(`## Events in window`,Object.entries(byType).map(([k,v])=>`${v} ${k.startsWith("mod:")?k.slice(4):k.toUpperCase()}`).join(" · "),"");
  }
  return L.join("\n").trimEnd();
}
(function(){
  const btn=$("#copyMd"); if(!btn) return;
  btn.addEventListener("click",async()=>{
    const md=buildMarkdown();
    let ok=true;
    try{ await navigator.clipboard.writeText(md); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=md; document.body.appendChild(ta); ta.select(); try{ok=document.execCommand("copy");}catch(_){ok=false;} ta.remove();btn.focus({preventScroll:true}); }
    btn.classList.add(ok?"ok":"fail"); btn.innerHTML=ok?`${I.check} Copied`:`${I.warn} Copy failed`;
    setTimeout(()=>{btn.classList.remove("ok","fail"); btn.innerHTML=`${I.copy} Copy as Markdown`;},ok?1600:3200);
  });
})();

const TIP=document.createElement("div");TIP.id="tipbox";TIP.setAttribute("role","tooltip");document.body.appendChild(TIP);
let TIP_ANCHOR=null;
function hideTip(){
  if(TIP_ANCHOR){
    const ids=(TIP_ANCHOR.getAttribute("aria-describedby")||"").split(/\s+/).filter(id=>id&&id!=="tipbox");
    if(ids.length)TIP_ANCHOR.setAttribute("aria-describedby",ids.join(" "));else TIP_ANCHOR.removeAttribute("aria-describedby");
  }
  TIP_ANCHOR=null;TIP.style.display="none";
}
function showTip(a){
  if(!a||!a.getAttribute("data-tip")){hideTip();return;}
  if(a===TIP_ANCHOR)return;
  hideTip();TIP_ANCHOR=a;TIP.textContent=a.getAttribute("data-tip");TIP.style.display="block";
  a.setAttribute("aria-describedby",((a.getAttribute("aria-describedby")||"")+" tipbox").trim());
  const r=a.getBoundingClientRect(),tw=TIP.offsetWidth,th=TIP.offsetHeight,m=8;
  const x=Math.max(m,Math.min(innerWidth-tw-m,r.left+r.width/2-tw/2));
  let y=r.bottom+9;if(y+th>innerHeight-m)y=r.top-th-9;
  TIP.style.left=x+"px";TIP.style.top=Math.max(m,Math.min(y,innerHeight-th-m))+"px";
}
document.addEventListener("mouseover",e=>{
  if(e.target.closest?.(".bbtipcv"))return;
  showTip(e.target.closest?.("[data-tip]")||document.activeElement.closest?.("[data-tip]"));
});
document.addEventListener("mouseout",e=>{
  if(TIP_ANCHOR&&!TIP_ANCHOR.contains(e.relatedTarget)&&!TIP_ANCHOR.contains(document.activeElement))hideTip();
});
document.addEventListener("focusin",e=>showTip(e.target.closest?.("[data-tip]")));
document.addEventListener("focusout",hideTip);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    hideTip();
    clearChartHover();
  }
});
document.addEventListener("scroll",()=>{
  const anchor=TIP_ANCHOR;hideTip();
  if(anchor&&anchor.contains(document.activeElement))showTip(anchor);
  if(!document.activeElement?.matches?.(".chartholder:focus-visible")) clearChartHover();
},true);
window.addEventListener("blur",clearChartHover);
document.documentElement.addEventListener("mouseleave",clearChartHover);

initFlame();

const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ const id=e.target.id||"top";
    document.querySelectorAll(".navlist a").forEach(a=>{const on=a.dataset.nav===id;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current");}); }});
},{rootMargin:"-12% 0px -78% 0px"});
const hdr=document.querySelector("header"); hdr.id="top"; spy.observe(hdr);
document.querySelectorAll("section").forEach(s=>spy.observe(s));
