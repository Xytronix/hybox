<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b0b0b'/%3E%3Cg fill='%23FFD21F' stroke='%230b0b0b' stroke-width='12' stroke-linejoin='round'%3E%3Cpath d='M136 230 L256 170 L186 136 L66 196 Z'/%3E%3Cpath d='M136 230 L256 170 L256 290 Z' fill='%239A7600'/%3E%3Cpath d='M256 170 L376 230 L256 290 Z' fill='%23C79A00'/%3E%3Cpath d='M256 170 L376 230 L446 196 L326 136 Z'/%3E%3Cpath d='M270 40 L216 142 L254 142 L232 222 L306 108 L266 108 L302 40 Z'/%3E%3Cpath d='M136 230 L256 290 L256 432 L136 372 Z'/%3E%3Cpath d='M256 290 L376 230 L376 372 L256 432 Z'/%3E%3Cpath d='M136 230 L256 290 L200 334 L80 274 Z'/%3E%3Cpath d='M256 290 L376 230 L432 274 L312 334 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f0f0f; --bg2:#141414; --panel:#191919; --panel2:#1f1f1f; --panelh:#262626; --code:#0b0b0b;
    --border:#2b2b2b; --border2:#383838; --border3:#474747;
    --tx:#ece9e2; --tx2:#bdb8ad; --tx3:#a29d93; --tx4:#948f86;
    --accent:#ffd21f; --accent-h:#ffe066; --on-accent:#0b0b0b;
    --good:#4cc38a; --warn:#ff8a3d; --bad:#f0626b; --neutral:#8f8a81; --shadow:rgba(0,0,0,.5);
    --ev-gc:#ece9e2; --ev-plugin:#d9c48c; --ev-conn:#a29d93; --mark-profile:#ece9e2;
    --ev-mod1:#b39a6b; --ev-mod2:#c9a740; --ev-mod3:#fff0b3; --ev-mod4:#7d776d;
    --st-wait:#a29d93; --st-timed:#6b665e; --st-new:#ece9e2; --st-term:#7d776d;
    --fl-other:#bdb8ad; --fl-engine:#d9c48c; --fl-mod:var(--accent); --fl-jdk:#8f8a81;
    --s1:var(--accent); --s2:#ece9e2; --s3:#c9a740; --s4:#a29d93; --s5:#7d776d; --s6:#d9c48c; --s7:#fff0b3;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    --r:9px;
  }
  *{box-sizing:border-box;scrollbar-color:var(--border2) var(--bg2);scrollbar-width:thin}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border3)}
  ::-webkit-scrollbar-corner{background:var(--bg2)}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--tx)}
  svg{display:block}
  button,input,select{font:inherit}
  input::placeholder{color:var(--tx4);opacity:1}
  button{color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
  button:disabled{cursor:default;color:var(--tx3)}
  :focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}
  .tscroll :focus-visible,.codewrap :focus-visible,.kvcard :focus-visible,.ttwrap :focus-visible,.logscroll :focus-visible{outline-offset:-2px}
  .chartholder[data-mouse]:focus-visible{outline:none!important}
  [hidden]{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  .mono{font-family:var(--mono)}

  .wrap{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1560px;margin:0 auto;min-height:100vh}
  .nav{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--border);padding:0;overflow-y:auto;background:var(--bg2)}
  .main{min-width:0;padding:0 40px 140px}
  .menu-toggle{display:none}
  .main,.sbody,.card,.chartcard,.kvcard,.mgrid>*,.syscols>*,.charts2>*{min-width:0}
  .main{overflow-wrap:anywhere}

  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
  .brand .logo{width:34px;height:34px;flex:none}
  .brand b{font-size:13px;letter-spacing:.07em;color:var(--tx);display:block}
  .brand small{display:block;color:var(--tx4);font-size:12px;margin-top:1px}
  .navlist{list-style:none;margin:0;padding:10px 12px}
  .navlist a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:7px;color:var(--tx2);font-size:12.5px;transition:.12s;position:relative}
  .navlist a .nic{color:var(--tx4);display:grid;place-items:center;width:16px;height:16px;flex:none}
  .navlist a:hover{background:var(--panel);color:var(--tx)}
  .navlist a:hover .nic{color:var(--tx2)}
  .navlist a.on{background:var(--panel2);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
  .navlist a.on .nic{color:var(--accent)}
  .navlist a .nct{margin-left:auto;color:var(--tx4);font-size:12px;font-family:var(--mono)}
  .navfoot{padding:16px 20px;color:var(--tx4);font-size:12px;line-height:1.8;border-top:1px solid var(--border);margin-top:6px}
  .navfoot b{color:var(--tx3)}
  .navfoot .nw{white-space:nowrap}
  .navfoot p{margin:8px 0 0;line-height:1.55}
  .navfoot a{color:var(--accent)}
  .navfoot a:hover{color:var(--accent-h);text-decoration:underline}

  header{padding:30px 0 24px;border-bottom:1px solid var(--border)}
  .hl-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .hl-pills{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .hl-end{display:flex;align-items:center;gap:14px;flex:none;margin-left:auto;min-height:30px}
  #copySlot{display:inline-flex;gap:8px;flex-wrap:wrap}
  @media(max-width:820px){.hl-top{flex-wrap:wrap}.hl-end{margin-left:0;flex:1 1 100%;flex-wrap:wrap;row-gap:8px}}
  .badge{font-weight:700;font-size:12px;padding:6px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
  .badge.warn{background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
  .badge.crit{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
  .badge.info{background:transparent;color:var(--tx3);border:1px solid var(--border3)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill{font-size:11.5px;color:var(--tx2);background:var(--panel);border:1px solid var(--border);padding:5px 11px;border-radius:20px;display:inline-flex;gap:7px;align-items:center}
  .pill b{color:var(--tx)}
  .incid{color:var(--tx3);font-size:12px;font-family:var(--mono);white-space:nowrap}
  .incid b{color:var(--tx2)}
  h1{font-size:29px;font-weight:680;letter-spacing:-.015em;margin:6px 0 2px;color:var(--tx);line-height:1.2;overflow-wrap:anywhere}
  h1 .ms{color:var(--warn)}
  .subhead{color:var(--tx2);font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
  .subhead code{font-family:var(--mono);color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);padding:1px 6px;border-radius:5px;font-size:12px}

  .envstrip{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
  .echip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 13px;position:relative;min-width:0;max-width:100%}
  .echip .eic{width:22px;height:22px;display:grid;place-items:center;color:var(--tx2);flex:none}
  .echip .el{font-size:12px;color:var(--tx4)}
  .echip .ev{font-size:12.5px;color:var(--tx);font-weight:600;margin-top:1px}
  .vitals{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .vital{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 14px;min-width:0;max-width:100%}
  .vital .vv{font-size:12.5px;color:var(--tx2);line-height:1.4}
  .vital .vn{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
  .vital .vn small{font-size:12px;font-weight:500;margin-left:2px}
  .vital .vn.v-bad{color:var(--bad)}
  .vital .vn.v-warn{color:var(--warn)}
  .vital .vl{font-size:12px;color:var(--tx3);margin-top:3px}

  section{padding:30px 0;border-bottom:1px solid var(--border);scroll-margin-top:8px}
  .section-heading{margin:0 0 20px}
  .sh{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;user-select:none;font-size:16px;font-weight:650;color:var(--tx);letter-spacing:.005em}
  .sh .sic{width:26px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;color:var(--tx2);flex:none}
  .sh .num{font-size:12px;color:var(--tx4);font-family:var(--mono)}
  .sh .sub{color:var(--tx4);font-size:12px;font-weight:400;margin-left:2px}
  .sh .chev{margin-left:auto;color:var(--tx4);transition:.2s}
  .sh:hover .sic{border-color:var(--border3);color:var(--tx)}
  .sh:hover .chev{color:var(--tx)}
  section.collapsed .chev{transform:rotate(-90deg)}
  section.collapsed .sbody{display:none}

  .lead{color:var(--tx2);font-size:13.5px;line-height:1.65;margin:-6px 0 20px;max-width:880px}
  .lead b{color:var(--tx)}
  .lead .hot{color:var(--tx);font-weight:600}

  .recording-scope{display:none;color:var(--tx3);border:1px solid var(--border3);border-radius:5px;padding:3px 7px;font-size:12px;font-weight:500;line-height:1.5;margin:0 0 12px}
  .has-time-filter .recording-scope{display:inline-flex}
  .cth .recording-scope{margin:0}
  .filter-empty{padding:18px;color:var(--tx2);border:1px solid var(--border);border-radius:8px}
  .filter-empty[hidden]{display:none}
  .dcause{display:flex;flex-direction:column;gap:5px;padding-left:12px;border-left:3px solid var(--border3)}
  .dcause.clear,.dcause.likely{border-left-color:var(--warn)}
  .dconf{font-size:12px;color:var(--tx3)}
  .dcause p{margin:0;font-size:15px;line-height:1.5;color:var(--tx)}
  .dcause p b{color:var(--tx)}
  .dblock{margin-top:16px}
  .diagcard>:first-child{margin-top:0}
  .dblock h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--tx2)}
  .dblock ol.nextsteps{margin-top:0}
  .findings li::before{content:"";flex:none;width:5px;height:5px;margin-top:8px;border-radius:50%;background:var(--tx4)}
  .findings code,.dcause code{font-family:var(--mono);font-size:11px;color:var(--tx);overflow-wrap:anywhere}
  .term{border-bottom:1px dotted var(--tx3);cursor:help;position:relative}
  .term:hover,.term:focus-within{border-bottom-color:var(--accent)}
  .termtip{position:fixed;display:none;width:max-content;max-width:min(300px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:7px;padding:8px 11px;
    font-size:12px;font-weight:400;line-height:1.5;color:var(--tx2);text-align:left;z-index:99;box-shadow:0 8px 24px var(--shadow);cursor:auto;font-family:var(--sans)}
  .termtip::before,.termtip::after{content:"";position:absolute;left:0;right:0;height:10px}
  .termtip::before{top:-10px}
  .termtip::after{bottom:-10px}
  .termtip b{color:var(--tx);font-weight:600}
  .termtip a{color:var(--accent);margin-left:4px}
  .termtip a:hover{color:var(--accent-h);text-decoration:underline}
  .term:hover>.termtip,.term:focus-within>.termtip{display:block}
  .dinfo{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:5px;padding:0;border:1px solid var(--border3);border-radius:50%;
    background:none;color:var(--tx3);font:600 10px/1 var(--sans);vertical-align:1px;cursor:help}
  .dinfo:hover,.dinfo:focus-visible{color:var(--tx);border-color:var(--tx3)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:8px}
  .card h3 .ic{color:var(--tx3)}
  .findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .findings li{display:flex;gap:11px;font-size:12.5px;color:var(--tx2);line-height:1.5;align-items:flex-start}
  .findings li b{color:var(--tx)}
  .dok{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--tx2)}
  .dok svg{color:var(--good);flex:none}
  .dok+.card{margin-top:14px}
  details.adv{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2)}
  details.adv>summary{cursor:pointer;list-style:none;padding:12px 15px;font-size:12.5px;color:var(--tx3);display:flex;gap:8px;align-items:baseline;border-radius:var(--r)}
  details.adv>summary:hover,details.adv[open]>summary{color:var(--tx)}
  details.adv>summary:hover::before{color:var(--tx)}
  details.adv>summary::-webkit-details-marker{display:none}
  details.adv>summary::before{content:"\25B8";color:var(--tx4);font-size:10px;transition:.15s}
  details.adv[open]>summary::before{transform:rotate(90deg)}
  details.adv>summary small{font-size:12px;color:var(--tx4)}
  details.adv>.advbody{padding:0 15px 15px}
  details.adv>.advbody>:first-child{margin-top:0}

  .factstrip{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 16px}
  .factstrip .pill svg{color:var(--tx4)}
  .mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media(max-width:1080px){.mgrid{grid-template-columns:1fr}}
  .mcard .cic{display:inline-grid;place-items:center;width:16px;height:16px;color:var(--tx4);margin-right:8px;flex:none}
  .mcard .ctt{display:inline-flex;align-items:center}
  .mstats{font-family:var(--mono);font-size:12px;color:var(--tx4);display:inline-flex;flex-wrap:wrap;align-items:baseline}
  .mstats b{color:var(--tx2);font-weight:600}
  .mstats .mnow b{color:var(--tx);font-size:12.5px}
  .mstats .mnow .mu2{color:var(--tx4);font-size:12px}
  .mstats .msep{padding:0 5px;color:var(--tx4)}
  .mstats .munit{color:var(--tx4);margin-left:4px}
  .mstats .munit.pc{margin-left:0}
  .mstats b.v-warn{color:var(--warn)}
  .v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}
  .vword{font-family:var(--sans);font-size:11.5px;margin-left:4px}

  [data-tip]{cursor:help}
  #tipbox{position:fixed;display:none;max-width:min(300px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:7px;padding:8px 11px;
    font-size:12px;font-weight:400;line-height:1.5;color:var(--tx2);text-transform:none;letter-spacing:0;text-align:left;z-index:99;
    box-shadow:0 14px 34px var(--shadow);white-space:normal;pointer-events:none;overflow-wrap:anywhere;font-family:var(--sans)}
  thead th .thl{cursor:help}

  .charts2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
  @media(max-width:1080px){.charts2{grid-template-columns:1fr}}
  .chartcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
  .chartcard .cth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px;flex-wrap:wrap}
  .chartcard .ctt{font-size:12.5px;color:var(--tx);font-weight:600}
  .chartcard .ctm{font-size:12px;color:var(--tx4);font-family:var(--mono)}
  .chartholder{position:relative;flex:1 1 auto;min-width:0;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
  .chartholder svg{width:100%;height:100%;display:block;overflow:hidden;cursor:crosshair}
  .axlab{fill:var(--tx4);font-size:12px;font-family:var(--mono)}
  .gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
  .gridline.minor{stroke-opacity:.5}
  .scalerow{display:flex;justify-content:flex-end;margin:-2px 0 4px}
  .scalesw{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;font-family:var(--mono)}
  .scl{appearance:none;font:inherit;font-size:11.5px;line-height:1.5;color:var(--tx2);background:var(--panel);border:0;padding:2px 10px;cursor:pointer}
  .scl+.scl{border-left:1px solid var(--border)}
  .scl:hover{background:var(--panelh);color:var(--tx)}
  .scl[aria-pressed="true"],.scl[aria-pressed="true"]:hover{background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:underline 2px;text-underline-offset:3px}
  .scl:disabled,.scl:disabled:hover{color:var(--tx4);background:var(--panel);cursor:default}
  .scalesw :focus-visible{outline-offset:-2px}
  .scl[aria-pressed="true"]:focus-visible{outline:2px solid var(--on-accent)!important;outline-offset:-4px}
  .refline{stroke:var(--tx3);stroke-width:1;stroke-dasharray:6 4}
  .reflab{fill:var(--tx3);font-size:12px;font-family:var(--mono);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
  .ch-guide,.ch-dot{transition:opacity .08s;pointer-events:none}
  .chtip{position:fixed;left:0;top:0;width:max-content;max-width:min(360px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:6px;padding:5px 9px;font-size:12px;font-family:var(--mono);color:var(--tx2);pointer-events:none;z-index:95;box-shadow:0 8px 22px var(--shadow);text-align:left;overflow-wrap:anywhere}
  .chtip b{color:var(--tx)}
  .chtip[hidden]{display:none}
  .chtip .ctl{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12px;line-height:1.35}
  .chtip .ctl .cdot{width:6px;height:6px;border-radius:50%;flex:none}
  .chtip .ctl .ctxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:290px}
  .chtip .ctl.cinc .ctxt{color:var(--bad)}
  .chtip .ctl.cmore .ctxt{color:var(--tx4)}
  .chtip.pin{position:absolute;max-width:min(420px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;pointer-events:auto;user-select:text;-webkit-user-select:text;cursor:auto;padding:6px 32px 8px 10px}
  .chtip.pin .ctl{align-items:flex-start}
  .chtip.pin .ctl .cdot{margin-top:5px}
  .chtip.pin .ctl .ctxt{white-space:normal;overflow:visible;max-width:none}
  .chtip .ctclose{position:absolute;top:4px;right:5px;width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--tx3);font:16px/1 var(--sans)}
  .chtip .ctclose:hover{background:var(--panelh);color:var(--tx)}
  .chtip .ctsec{margin-top:8px;padding-top:6px;border-top:1px solid var(--border2);font-family:var(--sans);font-weight:600;color:var(--tx)}
  .chtip .ctkv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;margin-top:3px;line-height:1.4}
  .chtip .ctkv>span:nth-child(odd){color:var(--tx3);font-family:var(--sans)}
  .chtip .ctkv>span:nth-child(even){text-align:right}
  .chtip .ctkv .ctln{display:block}
  .chtip .ctkv.ctcode>span:nth-child(odd){color:var(--tx2);font-family:var(--mono)}
  .chtip .ctkv .vword{font-size:11px}
  .chtip .ctkv.ctthr{grid-template-columns:auto minmax(0,1fr)}
  .chtip .ctkv.ctthr>span:nth-child(even){overflow-wrap:anywhere}
  .chtip b.v-warn{color:var(--warn)}
  .chtip .ctmut,.chtip .ctsub{color:var(--tx3)}
  .chtip .ctsub{margin-top:3px;font-family:var(--sans)}
  .chtip .ctown{display:block;color:var(--tx3);font-family:var(--sans);font-size:11.5px}
  .chtip .ctzoom{display:inline-block;margin-top:9px;font-size:12px;color:var(--tx);background:var(--panel);border:1px solid var(--border3);padding:3px 11px;border-radius:20px;font-family:var(--mono)}
  .chtip .ctzoom:hover{border-color:var(--accent);color:var(--accent)}

  .wbars{display:flex;flex-direction:column;gap:10px}
  .wbar{display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr) minmax(0,130px);align-items:center;gap:12px;font-size:12px}

const DV=(()=>{
  const worlds=D.worlds||[];
  const sampled=worlds.filter(w=>has(w.samples)&&w.samples>0);
  const ranked=[...sampled].sort((a,b)=>b.samples-a.samples);
  const stalled=worlds.find(w=>w.stalled)||null;
  const rankedAll=[...worlds].sort((a,b)=>(b.samples||0)-(a.samples||0));
  const ser=D.series||{};
  const heapG=ser.heap?ser.heap.map(gib):null;
  const rssG=ser.rss?ser.rss.map(gib):null;
  const diskG=ser.disk?ser.disk.map(gib):null;
  const hostMemG=ser.hostMem?ser.hostMem.map(gib):null;
  const seriesLen=Math.max(0,...Object.values(ser).filter(a=>Array.isArray(a)&&a.length>1).map(a=>a.length));
  const bucketSec=(has(D.incident.windowSec)&&D.incident.windowSec>0&&seriesLen>1)?D.incident.windowSec/seriesLen:null;
  return {
    worlds, ranked, topWorld:ranked[0]||null, stalled,
    stalledRank: stalled?rankedAll.indexOf(stalled)+1:0,
    deadlock:Array.isArray(D.deadlocked)&&D.deadlocked.length>0,
    lowLoad:(D.incident.samples||0)<300,
    heapG, rssG, diskG, hostMemG, perMin:bucketSec?60/bucketSec:null, per:bucketSec?" per "+fmtDur(bucketSec*1000):" per sample",
    win:has(D.incident.windowSec)?fmtDur(D.incident.windowSec*1000):null,
    span:(D.incident.recStart&&has(D.incident.windowSec))?{from:D.incident.recStart,to:secToHms(hmsToSec(D.incident.recStart)+D.incident.windowSec)}:null,
    incMarker:has(D.incident.markerFrac)?(D.incident.trigger==="UNCLEAN_SHUTDOWN"
      ?{label:"server stopped",frac:D.incident.markerFrac,recoverySec:null,kind:'stopped'}
      :{label:has(D.incident.stallMs)?("stall "+fmtDur(D.incident.stallMs)):D.incident.triggerLabel,
        frac:D.incident.markerFrac,recoverySec:has(D.incident.recoverySec)?D.incident.recoverySec:null,kind:'incident'})
      :has(D.incident.profileFrac)?{label:MARKWORD.profile,frac:D.incident.profileFrac,recoverySec:null,kind:'profile'}
      :has(D.incident.captureFrac)?{label:'captured',frac:D.incident.captureFrac,recoverySec:null,kind:'captured'}:null,
    gcName:D.sys?gcDisplayName(D.sys.gcYoung,D.sys.gcOld):null,
    samples:D.incident.samples||null
  };
})();

function modOfConfig(cfg){
  const base=String(cfg).toLowerCase().replace(/\.mixins\.json$/,"").replace(/^_+/,"");
  let best=null;
  if(base.length>=3){
    (D.plugins||[]).forEach(p=>{
      const nm=String(p[1]||""), nml=nm.toLowerCase(), aul=String(p[0]||"").toLowerCase();
      if(nml.includes(base)||(nml.length>=3&&base.includes(nml))||(aul.length>=3&&aul.includes(base))){
        if(!best||nm.length<best.length) best=nm;
      }
    });
  }
  if(best) return best;
  if(D.mixins&&D.mixins.bootstrapper){
    const bs=String(D.mixins.bootstrapper).split(" ")[0], bsl=bs.toLowerCase();
    if(bsl.includes(base)||base.includes(bsl)) return bs;
  }
  return String(cfg);
}
const MIXCONF=(()=>{
  const raw=(D.mixins&&Array.isArray(D.mixins.conflicts))?D.mixins.conflicts:null;
  const byConfig=new Set(), modInfo=new Map();
  let list=null;
  if(raw){
    list=raw.map(c=>[c[0],(c[1]||[]).map(p=>Array.isArray(p)?[p[0],p[1]??null]:[p,null])]);
    list.forEach(c=>{
      const shortT=String(c[0]).split(".").pop();
      c[1].forEach((p,pi)=>{
        byConfig.add(p[0]);
        const mod=modOfConfig(p[0]);
        const others=c[1].filter((_,j)=>j!==pi).map(q=>modOfConfig(q[0])).join(" + ");
        const line=`${p[1]||p[0]} ↔ ${others} on ${shortT}`;
        if(!modInfo.has(mod)) modInfo.set(mod,[]);
        modInfo.get(mod).push(line);
      });
    });
  }
  return {list,byConfig,modInfo};
})();

function containerRisk(){
  const c=D.sys&&D.sys.container;
  if(!c||!has(c.memLimit)||c.memLimit<=0) return null;
  if(!has(D.sys.xmxBytes)||D.sys.xmxBytes<=0) return null;
  return D.sys.xmxBytes>0.9*c.memLimit?{xmx:D.sys.xmxBytes,lim:c.memLimit}:null;
}
function diskRisk(){
  const d=D.sys&&D.sys.disk;
  if(!d||!has(d.free)||!has(d.total)||d.total<=0) return null;
  return (d.free<0.05*d.total||d.free<2*1024*1024*1024)?{free:d.free,total:d.total}:null;
}
function sliceAvg(arr,a,b){
  const N=arr.length;
  let i0=Math.max(0,Math.floor(a*(N-1))), i1=Math.min(N-1,Math.ceil(b*(N-1)));
  if(i1<i0) i1=i0;
  let s=0,n=0;
  for(let i=i0;i<=i1;i++){s+=arr[i];n++;}
  return n?s/n:null;
}
function usualNote(H){
  if(!H||H.enough) return "";
  const off=H.off?" Metrics history is off. Turn it on in /hybox settings.":"";
  if(H.off&&!H.hours) return "Metrics history is off, so there are no usual values to compare with. Turn it on in /hybox settings.";
  return `Not enough history yet (${H.hours} hour${H.hours===1?"":"s"}). Usual values need this time of day on ${H.minDays} of the last 7 days, and the history has it on ${H.days}.${off}`;
}
function comparisonHtml(){

  const perMin=s=>s&&DV.perMin?s.map(v=>v*DV.perMin):null;

  const CMP=Array.isArray(D.compare)?D.compare:[], cdef=k=>CMP.find(c=>c.key===k)||{key:k,label:k,unit:"",dec:1,bad:null};
  const scaled={heap:DV.heapG,rss:DV.rssG,hostMem:DV.hostMemG,disk:DV.diskG,diskWrite:mibs(ser.diskWrite),diskRead:mibs(ser.diskRead)};

    .map(c=>({l:c.label,k:c.key,s:c.key in scaled?scaled[c.key]:c.perMin?perMin(ser[c.key]):ser[c.key],u:c.unit,dec:c.dec,bad:c.bad}));

  const usualSub=hasU?` Usual for this server is the median of the samples within 30 minutes of ${H.clock} UTC on the last 7 days, from ${H.days} days of data. The small value is what 95% of those samples stayed under, or above for TPS. Marked unusual when the ${win} is 25% or more past it.`:"";

    return {html:`<td class="r" data-md="${md}">${withU(m.median,dec,u)}${m.flag?`<span class="vword v-warn">unusual</span>`:""}<span class="usub">${sub}</span></td>`,flag:!!m.flag};
  }
  if(has(mf)&&mf>=0.2&&metrics.length>=3){

      const more=rest.length?`<tbody id="cmp-more" hidden>${rest.map(r=>r.html).join("")}</tbody>`:"";
      const btn=rest.length?`<button type="button" class="copybtn cmpmore" data-cmpmore data-label="All metrics (${all.length})" aria-expanded="false" aria-controls="cmp-more">All metrics (${all.length})</button>`:"";
      return `<div class="card cmpwrap" id="cmpcard"><h3><span class="ic">${I.clock}</span> Baseline vs ${term} window</h3>
    <div class="subnote">Baseline is the first ${Math.round(b1*100)}% of the recording. ${Term} is from just before the marker ${recov?"through recovery":"to the end"}.${usualSub}</div>${noteHtml}
    <div class="tscroll"><table><thead><tr>${thc("Metric","")}${thc("Baseline avg","",{r:true})}${thc(Term+" avg","",{r:true})}${thc("Delta","Marked worse when the change is 5% or more in the direction that hurts. Players, chunks generated, chunks loaded and network traffic are never marked. A drop in tick time or work during a stall is not an improvement, so nothing is marked better. Changes above 999% show as a multiple.",{r:true})}${usualHead}</tr></thead><tbody>${none}${flagged.map(r=>r.html).join("")}</tbody>${more}</table></div>${btn}</div>`;
    }
  }
  if(hasU){
    const label=win==="recording"?"Recording avg":Term+" avg";
    const rows=H.metrics.filter(m=>has(m.incident)).map(m=>{
      const d=defs.find(x=>x.k===m.key)||{l:m.label,u:m.unit,dec:1};
      const dec=autoDec(Math.min(m.incident,m.median),Math.max(m.incident,m.median),d.dec);
      return `<tr data-cmp="${esc(d.l)}"><td class="nm">${esc(d.l)}</td><td class="r">${withU(m.incident,dec,d.u)}</td>${usualCell(m.key,d.dec,d.u).html}</tr>`;
    }).join("");
    if(rows) return `<div class="card cmpwrap" id="cmpcard"><h3><span class="ic">${I.clock}</span> ${win==="recording"?"Recording":Term} vs usual for this server</h3>
    <div class="subnote">${win==="recording"?"The recording is averaged from start to end.":`${Term} is from just before the marker ${recov?"through recovery":"to the end"}.`}${usualSub}</div>
    <div class="tscroll"><table><thead><tr>${thc("Metric","")}${thc(label,"",{r:true})}${usualHead}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return note?`<div class="card cmpwrap" id="usualcard"><h3><span class="ic">${I.clock}</span> Usual for this server</h3>${noteHtml}</div>`:"";
}
function similarHtml(){
  const S=D.history&&D.history.similar;
  if(!S) return "";
  const line=(S.line||[]).map(s=>{const v=esc(s[0]);return s[1]==="b"?`<b>${v}</b>`:s[1]==="code"?`<code>${v}</code>`:v;}).join("");
  const leaf=m=>{const i=m.lastIndexOf("."), j=i<0?-1:m.lastIndexOf(".",i-1), k=m.indexOf("$",i+1);return m.slice(j+1,k<0?m.length:k);};
  const same=`<span class="vword">same</span>`;
  const rows=(S.rows||[]).map(r=>`<tr><td>${esc(r.created)}</td><td class="nm">${esc(r.triggerLabel||r.trigger)}</td><td>${r.world?`<span data-tip="${esc(r.world)}">${esc(worldLabel(r.world))}</span>`:`<span class="pct">·</span>`}</td><td data-md="${r.mod?esc(r.mod)+(r.sameMod?" (same)":""):r.read?"none":"·"}">${r.mod?esc(r.mod)+(r.sameMod?same:""):`<span class="pct">${r.read?"none":"·"}</span>`}</td><td data-md="${r.method?esc(leaf(r.method))+(r.sameMethod?" (same)":""):"·"}">${r.method?`<code data-tip="${esc(r.method)}">${esc(leaf(r.method))}</code>${r.sameMethod?same:""}`:`<span class="pct">·</span>`}</td></tr>`).join("");
  const shown=(S.rows||[]).length;
  const table=shown?`<div class="tscroll"><table><thead><tr>${thc("When","")}${thc("Trigger","")}${thc("World","")}${thc("Top mod then","A mod whose own code used 10% or more of the CPU samples.")}${thc("Top method then","The most sampled method in that recording.")}</tr></thead><tbody>${rows}</tbody></table></div>`:"";
  const more=S.month>shown?` The table shows the ${shown} newest.`:"";
  return `<div class="card cmpwrap" id="similarcard"><h3><span class="ic">${I.layers}</span> Similar incidents</h3><p class="simline">${line}</p>${table}<div class="subnote">Earlier incidents on this server with the same trigger or world, from the ${S.checked} older bundle${S.checked===1?"":"s"} still on disk. Manual captures are not counted.${more}</div></div>`;
}
const NO_FINDINGS="Nothing crossed a threshold in this recording.";
const DOCS_URL="https://wiki.hytalemodding.dev/mod/hybox/";
const CONFIDENCE={clear:"Cause",likely:"Likely cause",unclear:""};
const causeLabel=c=>c.confidence in CONFIDENCE?CONFIDENCE[c.confidence]:"Cause";
const findingText=items=>(items||[]).map(s=>s[1]==="code"?"`"+s[0]+"`":s[1]==="b"?"**"+s[0]+"**":s[0]).join("");
function diagnosisData(){
  const g=D.diagnosis||{}, list=x=>Array.isArray(x)?x:[];
  return {kind:g.kind,cause:g.cause||null,why:list(g.why),steps:list(g.steps),other:list(g.other),terms:list(g.terms)};
}
function diagnosisText(withOther){
  const g=diagnosisData(), L=[];
  if(g.cause) L.push(causeLabel(g.cause)?`**${causeLabel(g.cause)}:** ${findingText(g.cause.spans)}`:`**${findingText(g.cause.spans)}**`);
  else if(g.why.length) L.push("**Notable**");
  L.push(...g.why.map(e=>`- ${findingText(e.spans)}`));
  if(!g.cause&&!g.why.length&&!g.other.length&&!D.jfrUnavailableReason) L.push(`- ${NO_FINDINGS}`);
  if(g.steps.length) L.push("","**Next steps**",...g.steps.map((e,i)=>`${i+1}. ${findingText(e.spans)}`));
  if(withOther&&g.other.length) L.push("","**Other findings**",...g.other.map(e=>`- ${findingText(e.spans)}`));
  return L;
}
function diagnosisHtml(){
  const g=diagnosisData(), cmp=similarHtml()+comparisonHtml();
  if(!D.diagnosis||!g.cause&&!g.why.length&&!g.other.length&&D.jfrUnavailableReason) return cmp;
  const terms=new Map(g.terms.map(t=>[t.term,t]));
  const hasFlame=!!(D.flame&&Array.isArray(D.flame)&&Array.isArray(D.flame[2])&&D.flame[2].length);
  const links={cpu:"#cpu",methods:"#methods",worlds:"#worlds",memory:"#memory",states:"#states",metrics:"#metrics",system:"#system",plugins:"#plugins",mixins:"#mixins",config:"#config",log:"#log",engine:"#engine"};
  if(hasFlame) links.flame="#flame";
  const href=e=>e.label==="Slow file operations"?"#sio":e.label==="Lock waits"&&D.locks&&D.locks.rows&&D.locks.rows.length?"#locks":links[e.section];
  const attrs=e=>{
    if(e.section!=="flame") return "";
    const c=(e.spans||[]).find(s=>s[1]==="code"&&/^WorldThread - /.test(s[0]));
    return c?` data-flamegroup="${esc(threadGroup(c[0]))}"`:"";
  };
  const seen=new Set();
  let tid=0;
  const span=s=>{
    const value=esc(s[0]), styled=s[1]==="b"?`<b>${value}</b>`:s[1]==="code"?`<code>${value}</code>`:value, t=s[2]&&terms.get(s[2]);
    if(!t) return styled;
    const id="dterm"+(++tid);
    return `<span class="term" tabindex="0" aria-describedby="${id}">${styled}<span class="termtip" role="tooltip" id="${id}"><b>${esc(t.term)}</b> ${esc(t.meaning)}<a href="${esc(DOCS_URL+t.doc)}" target="_blank" rel="noopener noreferrer">More</a></span></span>`;
  };
  const body=e=>{
    const h=href(e), k=h&&h+attrs(e), link=h&&!seen.has(k);

      +(e.hover?`<button type="button" class="dinfo" data-tip="${esc(e.hover)}" aria-label="How this was measured: ${esc(e.hover)}">i</button>`:"")
      +(link?` <a class="evlink" href="${h}"${attrs(e)}>${esc(e.label)}</a>`:"");
  };
  const items=list=>list.map(e=>`<li><span>${body(e)}</span></li>`).join("");
  let head;
  if(g.cause) head=`<div class="dcause ${esc(g.cause.confidence||"")}">${causeLabel(g.cause)?`<span class="dconf">${causeLabel(g.cause)}</span>`:""}<p>${body(g.cause)}</p></div>`
    +(g.why.length?`<div class="dblock"><h4>Why</h4><ul class="findings">${items(g.why)}</ul></div>`:"");
  else head=g.why.length?`<div class="dblock dnotable"><h4>Notable</h4><ul class="findings">${items(g.why)}</ul></div>`
    :g.other.length?"":`<div class="dok">${I.check}<span>${NO_FINDINGS}</span></div>`;
  const steps=g.steps.length?`<div class="dblock"><h4>Next steps</h4><ol class="nextsteps">${g.steps.map(e=>`<li>${body(e)}</li>`).join("")}</ol></div>`:"";
  const other=g.other.length?`<details class="adv dother"${head?"":" open"}><summary>Other findings <small>${g.other.length}</small></summary><div class="advbody"><ul class="findings">${items(g.other)}</ul></div></details>`:"";
  return `<div class="card diagcard">${head}${steps}${other}</div>`+cmp;
}
function placeTerm(t){
  const tip=t&&t.querySelector(".termtip");
  if(!tip||getComputedStyle(tip).display==="none") return;
  const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight, m=8;
  let y=r.bottom+6; if(y+h>innerHeight-m) y=r.top-h-6;
  tip.style.left=Math.max(m,Math.min(innerWidth-w-m,r.left))+"px";
  tip.style.top=Math.max(m,y)+"px";
}
document.addEventListener("mouseover",e=>{const t=e.target.closest?.(".term");if(t&&!e.target.closest(".termtip"))placeTerm(t);});

function statsInner(o){
  const d=autoDec(o.min,o.max,o.dec), f=v=>fixed(Number(v),d);
  const flag=(cls,word)=>cls?`<span class="vword ${cls}">${word}</span>`:"";
  const parts=[];
  const total=o.nowLabel==="total";
  const now=has(o.now)?`<span class="mnow" data-stat="now">${o.nowLabel||"last"} <b${o.nowCls?` class="${o.nowCls}"`:""}>${total?fmt(Math.round(o.now)):has(o.nowDec)?fixed(Number(o.now),o.nowDec):f(o.now)}</b>${o.nowSuffix||""}</span>`:null;
  if(now&&total) parts.push(now);
  parts.push(`<span data-stat="min">min <b${o.minCls?` class="${o.minCls}"`:""}>${f(o.min)}</b>${flag(o.minCls,"low")}</span>`);
  parts.push(`<span data-stat="avg">avg <b>${f(o.avg)}</b></span>`);
  parts.push(`<span data-stat="max">max <b${o.maxCls?` class="${o.maxCls}"`:""}>${f(o.max)}</b>${flag(o.maxCls,"high")}</span>`);
  if(now&&!total) parts.push(now);
  let out=parts.join('<span class="msep">·</span>');
  if(o.unitLabel) out+=o.unitLabel==="%"?`<span class="munit pc">%</span>`:` <span class="munit">${esc(o.unitLabel)}</span>`;
  if(o.extra) out+=`<span class="msep">·</span>${o.extra}`;
  return out;
}

    const tw=D.tps?(D.worlds||[]).find(w=>w.name===D.tps.world):null;
    const target=(D.vitals&&D.vitals.tpsTarget>0)?D.vitals.tpsTarget:((D.tps&&D.tps.target>0)?D.tps.target:30);
    const budget=(D.vitals&&D.vitals.tickBudgetMs>0)?D.vitals.tickBudgetMs:1000/target;
    const gcHl=Array.isArray(D.gcOverlap)&&D.gcOverlap.length;
    const worst=Array.isArray(ser.msptWorst)&&ser.msptWorst.some(v=>v!=null)?ser.msptWorst:null;
    const sparse=!!worst&&worst.some(v=>v==null);
    const incW=pick==="slowest"&&Array.isArray(ser.msptIncident)&&D.incident.world?D.incident.world:null;
    const incWorst=incW&&Array.isArray(ser.msptWorstIncident)&&ser.msptWorstIncident.some(v=>v!=null)?ser.msptWorstIncident:null;
    const incSparse=!!incWorst&&incWorst.some(v=>v==null);
    const pre=w=>incW?worldLabel(w)+" ":"";
    const worstLine=(w,s,sp,color)=>({name:pre(w)+(sp?"stall":"worst tick"),tip:sp?"The stall at the marker. This older bundle did not record the worst tick of each interval.":"The slowest single tick in each interval",series:s,color,dec:1,op:0.45,sparse:sp});
    const lines=[{name:pre(D.tps&&D.tps.world)+"avg",tip:"Average tick time in each interval",series:ser.mspt,color:SERIES[0],dec:1}];
    if(worst) lines.push(worstLine(D.tps&&D.tps.world,worst,sparse,SERIES[0]));
    if(incW){
      lines.push({name:pre(incW)+"avg",tip:`Average tick time in ${worldLabel(incW)}, the incident world`,series:ser.msptIncident,color:SERIES[1],dec:1});
      if(incWorst) lines.push(worstLine(incW,incWorst,incSparse,SERIES[1]));
    }
    const multi=lines.length>1?lines:null;
    const realWorst=(worst&&!sparse)||(incWorst&&!incSparse), oldWorst=(worst&&sparse)||(incWorst&&incSparse);
    const why=incW?` The numbers are for ${worldLabel(D.tps.world)}, the world with the lowest TPS in this window. The incident happened in ${worldLabel(incW)}.`:tickWhy;
    card(I.bolt,incW?"Tick time by world":`Tick time${D.tps?` · ${esc(worldLabel(D.tps.world))}`:""}`,
      `Time per tick.${realWorst?" The light line is the slowest tick in each interval, so one slow tick shows at its real length.":""}${oldWorst?" This older bundle did not record the worst tick of each interval, so the point at the marker is the stall.":has(D.incident.stallMs)?" The spike at the marker is the stall.":""}${gcHl?" Highlighted parts overlap a GC pause.":""} The dashed line is the ${fixed(budget,1)} ms tick budget at ${target} TPS. A tick far above the rest is cut off at the top and marked with its real length. Zoom in to see it to scale.${why}${swPct}`,
      ser.mspt,{color:SERIES[0],unit:" ms",decimals:1,gcIdx:true,multi,ref:{v:budget,label:`${fixed(budget,1)} ms budget`},sev:v=>v>budget?"high":null,core:true,family:"tick"},
      (s,z,i0)=>{const st=sstat(s);const stall=has(D.incident.stallMs)&&markerInZoom();
        let top=null;
        if(worst&&!sparse) (z?worst.slice(i0||0,(i0||0)+s.length):worst).forEach(v=>{if(v!=null&&(top==null||v>top))top=v;});
        if(!z&&tw&&has(tw.msptMax)&&(top==null||tw.msptMax>top)) top=tw.msptMax;
        const ex=[];
        if(top!=null&&top>st.max) ex.push(`<span data-stat="worst" data-tip="The slowest single tick. Each point on the average line is an average, so one slow tick looks smaller there.">worst tick <b${top>=budget?' class="v-warn"':""}>${fixed(top,1)} ms</b></span>`);
        if(stall) ex.push(`<span data-stat="stall">stall <b class="v-warn">${fmtDur(D.incident.stallMs)}</b></span>`);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:1,unitLabel:"ms",
          maxCls:stall?"v-warn":null,
          extra:ex.length?ex.join('<span class="msep">·</span>'):null});});
  }
  if(ser.tps){
    const target=(D.vitals&&D.vitals.tpsTarget>0)?D.vitals.tpsTarget:((D.tps&&has(D.tps.target))?D.tps.target:null);
    const worlds=(Array.isArray(D.worldTps)?D.worldTps:[]).filter(w=>w&&w.name&&w.series&&w.series.length>=2);
    const main=D.tps?worlds.find(w=>w.name===D.tps.world):null;
    const others=worlds.filter(w=>w!==main).slice(0,7);
    const multi=main&&others.length?[main,...others].map((w,k)=>({name:worldLabel(w.name),tip:w.name,series:w.series,color:SERIES[k%SERIES.length],dec:1})):null;
    const more=multi&&worlds.length>multi.length?` Showing the ${multi.length} busiest of ${worlds.length} worlds.`:"";
    card(I.pulse,multi?"TPS by world":`TPS${D.tps?` · ${esc(worldLabel(D.tps.world))}`:""}`,
      `Ticks per second.${target?` The dashed line is the ${target} TPS target.`:""}${multi?` The numbers are for ${worldLabel(D.tps.world)}. Click a world to hide its line.${more}`:tickWhy}`,
      ser.tps,{color:SERIES[0],unit:" TPS",decimals:1,multi,ref:target?{v:target,label:`${target} TPS target`,ceiling:true}:null,sev:target?v=>v<0.9*target?"low":null:null,core:true},
      (s,z)=>{const st=sstat(s);
        const min=(!z&&D.tps&&has(D.tps.min))?D.tps.min:st.min;
        const avg=(!z&&D.tps&&has(D.tps.avg))?D.tps.avg:st.avg;
        return statsInner({now:s[s.length-1],nowLabel:multi?esc(worldLabel(D.tps.world))+" last":null,nowSuffix:target?`<span class="mu2">/${target}</span>`:"",
          min,avg,max:st.max,dec:1,unitLabel:"TPS",minCls:(target&&min<0.9*target)?"v-warn":null});});
  }
  if(ser.players) simple(I.players,"Players online","Players online. Worlds has the count per world.",ser.players,"",0,null,
    (s,z)=>{const st=sstat(s);
      return statsInner({now:(!z&&has(D.incident.players))?D.incident.players:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:0});});
  {
    const cl=[["connects",ser.connects],["joins",ser.joins],["leaves",ser.leaves]]
      .filter(l=>Array.isArray(l[1])&&l[1].length);
    if(cl.length){
      const NOUN={connects:["connect","connects"],joins:["join","joins"],leaves:["leave","leaves"]};
      grouped("Connections",cl.map((l,k)=>({name:l[0],kind:"count",series:l[1],color:SERIES[k],dec:0,noun:NOUN[l[0]]})),per,I.players);
    }
  }
  if(ser.entities) simple(I.layers,"Entities","Entities in all worlds. Worlds has the count per world and by type.",ser.entities,"",0);
  if(ser.chunks) simple(I.layers,"Chunks","Loaded chunks in all worlds. Worlds has the count per world.",ser.chunks,"",0,{family:"loaded"});
  const churnLines=[];
  if(ser.chunksGenerated) churnLines.push({name:"generated",kind:"count",series:ser.chunksGenerated,dec:0});
  if(ser.chunksLoaded) churnLines.push({name:"loaded",kind:"count",series:ser.chunksLoaded,dec:0});
  churnLines.forEach((l,k)=>{l.color=SERIES[k];});
  if(churnLines.length) grouped("Chunk churn",churnLines,per,I.layers);
  if(ser.ping) simple(I.clock,"Player ping","Average player ping. If ping rises while TPS stays flat, the network is slow, not the server.",ser.ping," ms",0,
    {sev:(a=>v=>a>0&&v>2*a?"high":null)(sstat(ser.ping).avg)},
    (s,z)=>{const st=sstat(s);
      return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:0,unitLabel:"ms",
        maxCls:(st.avg>0&&st.max>2*st.avg)?"v-warn":null});});
  if(ser.cpu&&ser.cpuJvm){
    groupedCard("CPU",[
      {name:"server",kind:"gauge",series:ser.cpuJvm,color:SERIES[0],dec:1},
      {name:"machine",kind:"gauge",series:ser.cpu,color:SERIES[1],dec:1}
    ],"","%",cards,{core:true},I.cpu);
  } else if(ser.cpu){
    card(I.cpu,"Machine CPU",`CPU use of the whole machine, all programs.${D.cpu?` Server peak ${fixed(D.cpu.jvmMax,1)}%, server average ${fixed(D.cpu.jvmAvg,1)}%.`:""}`,
      ser.cpu,{color:SERIES[0],unit:"%",decimals:1,core:true},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,
          avg:(!z&&D.cpu)?D.cpu.machAvg:st.avg,max:(!z&&D.cpu)?D.cpu.machMax:st.max,dec:1,unitLabel:"%"});});
  }
  if(DV.heapG){
    const mx=(D.heap&&has(D.heap.max)&&D.heap.max>0)?gib(D.heap.max):null;
    const hcG=Array.isArray(ser.heapCommitted)&&ser.heapCommitted.length===DV.heapG.length?ser.heapCommitted.map(gib):null;
    card(I.heap,"Heap used",`Java heap in use.${mx?` Maximum ${fixed(mx,1)} GiB.`:""}${hcG?" The committed line is heap the JVM has reserved from the system.":""} The saw shape is normal: memory fills, then GC frees it.`,
      DV.heapG,{color:SERIES[0],unit:" GiB",decimals:1,core:true,family:"heap",multi:hcG?[{name:"used",tip:"Heap in use",series:DV.heapG,color:SERIES[0],dec:1},{name:"committed",tip:"Heap the JVM has reserved from the system",series:hcG,color:PAL.neutral,dec:1}]:null},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:(!z&&D.heap)?gib(D.heap.floor):st.min,
          avg:st.avg,max:(!z&&D.heap)?gib(D.heap.peak):st.max,dec:1,unitLabel:"GiB"});});
  }
  if(DV.rssG){
    const ramG=(D.sys&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)?gib(D.sys.ramTotal):null;
    const heapAbove=DV.heapG&&Math.max(...DV.heapG)>Math.max(...DV.rssG);
    card(I.ram,"Process RSS",`Memory the server process holds (RSS).${ramG?` The machine has ${fixed(ramG,1)} GiB.`:""}${heapAbove?" RSS can be lower than the heap when the system compresses or swaps memory.":""}`,
      DV.rssG,{color:SERIES[0],unit:" GiB",decimals:1,family:"heap"},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,
          max:(!z&&D.ram)?gib(D.ram.rssPeak):st.max,dec:1,unitLabel:"GiB"});});
  }
  if(DV.hostMemG){
    const memTot=(D.sys&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)?gib(D.sys.ramTotal):null;
    const memLast=DV.hostMemG[DV.hostMemG.length-1];
    card(I.ram,"Machine memory",`Memory in use on the whole machine, all programs.${memTot?` At capture ${fixed(memLast,1)} of ${fixed(memTot,1)} GiB (${fixed((100*memLast/memTot),0)}%).`:""}`,
      DV.hostMemG,{color:SERIES[0],unit:" GiB",decimals:1},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:1,unitLabel:"GiB"});});
  }
  if(DV.diskG){
    const dtot=(D.sys&&D.sys.disk&&has(D.sys.disk.total)&&D.sys.disk.total>0)?gib(D.sys.disk.total):null;
    simple(I.disk,"Disk free",`Free space on the server disk${dtot?`, ${fixed(dtot,1)} GiB in total`:""}. A full disk stops the recording and bundle writes.`,
      DV.diskG," GiB",1,{sev:dtot?v=>v<0.05*dtot?"low":null:null},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:1,unitLabel:"GiB",
          minCls:(dtot&&st.min<0.05*dtot)?"v-warn":null});});
  }
  if(ser.diskWrite||ser.diskRead){
    const lines=[], mibs=s=>s.map(v=>v*1e6/MIB);
    if(ser.diskWrite) lines.push({name:"write",kind:"gauge",series:mibs(ser.diskWrite),dec:1});
    if(ser.diskRead) lines.push({name:"read",kind:"gauge",series:mibs(ser.diskRead),dec:1});
    lines.forEach((l,k)=>{l.color=SERIES[k];});
    grouped("Disk I/O",lines," MiB/s",I.disk);
  }
  if(ser.gcPause) simple(I.gc,"GC pause",`Longest GC pause in each interval.${D.gc?` ${D.gc.collections} collection${D.gc.collections===1?"":"s"}, ${D.gc.totalPauseMs} ms in total.`:""}`,
    ser.gcPause," ms",2,{sev:v=>v>=50?"high":null,family:"gcPause"},
    (s,z)=>{const st=sstat(s);
      return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,
        max:(!z&&D.gc)?D.gc.maxPauseMs:st.max,dec:2,unitLabel:"ms",maxCls:st.max>=50?"v-warn":null});});
  if(ser.exceptions) simple(I.warn,"Exceptions thrown",`Exceptions thrown${per}. For a spike, read Server log at that time.`,
    ser.exceptions,per,0,{sev:(a=>v=>a>0&&v>5*a?"high":null)(sstat(ser.exceptions).avg)},
    (s,z)=>{const st=sstat(s);const tot=s.reduce((a,v)=>a+v,0);
      return statsInner({now:tot,nowLabel:"total",nowDec:0,min:st.min,avg:st.avg,max:st.max,dec:0,unitLabel:per.trim(),
        maxCls:(st.avg>0&&st.max>5*st.avg)?"v-warn":null});});

  const facts=[];
  if(DV.win) facts.push(`<span class="pill">${I.clock} window <b>${DV.win}</b></span>`);
  if(has(D.incident.players)&&!ser.players) facts.push(`<span class="pill">${I.players} <b>${D.incident.players}</b> player${D.incident.players===1?"":"s"} at capture</span>`);
  if(D.gc&&!ser.gcPause) facts.push(`<span class="pill">${I.gc} max GC pause <b>${D.gc.maxPauseMs} ms</b></span>`);
  if(D.gc&&has(D.gc.totalPauseMs)&&has(D.incident.windowSec)&&D.incident.windowSec>0) facts.push(`<span class="pill">${I.gc} GC time <b>${fixed((100*D.gc.totalPauseMs/(D.incident.windowSec*1000)),1)}%</b></span>`);
  if(D.sys&&has(D.sys.cpuStealPct)&&D.sys.cpuStealPct>=5) facts.push(`<span class="pill">${I.cpu} CPU steal <b>${fixed(D.sys.cpuStealPct,1)}%</b></span>`);
  if(D.sys&&has(D.sys.cpuIowaitPct)&&D.sys.cpuIowaitPct>=5) facts.push(`<span class="pill">${I.cpu} CPU iowait <b>${fixed(D.sys.cpuIowaitPct,1)}%</b></span>`);
  if(D.sys&&has(D.sys.oomKills)&&D.sys.oomKills>0) facts.push(`<span class="pill">${I.warn} OOM kills <b>${D.sys.oomKills}</b></span>`);
  if(D.sys&&has(D.sys.cpuUsageCores)&&D.sys.container&&has(D.sys.container.cpuLimit)&&D.sys.container.cpuLimit>0&&has(D.sys.cpuCores)&&D.sys.container.cpuLimit<D.sys.cpuCores&&(100*D.sys.cpuUsageCores/D.sys.container.cpuLimit)>=80) facts.push(`<span class="pill">${I.cpu} Container CPU <b>${fixed((100*D.sys.cpuUsageCores/D.sys.container.cpuLimit),0)}% of limit</b></span>`);
  if(D.sys&&((has(D.sys.psiCpu)&&D.sys.psiCpu>=10)||(has(D.sys.psiIo)&&D.sys.psiIo>=10)||(has(D.sys.psiMem)&&D.sys.psiMem>=10))) facts.push(`<span class="pill">${I.warn} Stalled on CPU, memory or disk, last 10 s <b>cpu ${fixed((D.sys.psiCpu||0),0)}% · io ${fixed((D.sys.psiIo||0),0)}% · mem ${fixed((D.sys.psiMem||0),0)}%</b></span>`);

  const worlds=worldsHtml();
  const fold=hidden.length?`<details class="adv" id="flatcharts"><summary>${hidden.length} chart${hidden.length===1?"":"s"} without change <small>${esc(still.join(" "))}</small></summary><div class="advbody"><div class="mgrid">${hidden.join("")}</div></div></details>`:"";
  if(!cards.length&&!facts.length&&!fold&&!worlds) return "";
  return (worlds?`<div id="worlds" class="worldsblock">${worlds}</div>`:"")
    +(facts.length?`<div class="factstrip">${facts.join("")}</div>`:"")
    +(cards.length?`<div class="mgrid">${cards.join("")}</div>`:"")
    +fold;
}

function lineStatText(slice,kind,dec,unit){
  const st=sstat(slice), fm=v=>fixed(Number(v),autoDec(st.min,st.max,dec));
  const tot=kind==="count"?slice.reduce((a,v)=>a+v,0):null;
  return `${tot!=null?`total ${fmt(Math.round(tot))} · `:""}min ${fm(st.min)} · avg ${fm(st.avg)} · max ${fm(st.max)}${unit&&unit.trim()?(unit.trim()==="%"?"%":" "+unit.trim()):""}`;
}
function groupedCard(title,lines,kindChip,unit,cards,extra,icon){
  const single=lines.length===1;
  const chart=single
    ? lineChart(lines[0].series,Object.assign({h:170,color:lines[0].color,unit,decimals:lines[0].dec,times:DV.span,marker:DV.incMarker},extra||{}))
    : lineChart(null,Object.assign({h:170,unit,decimals:1,times:DV.span,marker:DV.incMarker,multi:lines},extra||{}));
  const cid="ch"+CHART_ID;
  const off=()=>CHARTS[cid].lineOff||new Set();
  const sliceL=(a,b)=>lines.map(l=>{const Nn=l.series.length;
    let j0=Math.max(0,Math.floor(a*(Nn-1))), j1=Math.min(Nn-1,Math.ceil(b*(Nn-1)));
    if(j1<=j0) j1=Math.min(Nn-1,j0+1);
    return l.series.slice(j0,j1+1);});
  const countStrip=slices=>{
    const shown=lines.map((l,k)=>({l,k,tot:Math.round(slices[k].reduce((a,v)=>a+(v||0),0)),mx:Math.round(Math.max(0,...slices[k].filter(v=>v!=null)))})).filter(x=>!off().has(x.k));
    const word=(x,n)=>`<b>${fmt(n)}</b> ${n===1?x.l.noun[0]:x.l.noun[1]}`;
    const totals=`<span class="pml">${shown.map(x=>word(x,x.tot)).join(", ")}</span>`;
    return shown.every(x=>x.tot<10)?totals:`${totals}<span class="msep">·</span><span class="pml">max ${shown.map(x=>word(x,x.mx)).join(" and ")} ${esc(unit.trim())}</span>`;
  };
  const nouns=lines.every(l=>l.noun);
  const stripHtml=slices=>{
    if(nouns) return countStrip(slices);
    if(lines.length>2) return "";
    return lines.map((l,k)=>off().has(k)?"":`<span class="pml"><b style="color:${l.color}">${esc(l.name)}</b> ${lineStatText(slices[k],l.kind,l.dec,unit)}</span>`)
      .filter(Boolean).join('<span class="msep">·</span>');
  };
  const tipFor=(slices,k)=>`${lines[k].name}: ${lineStatText(slices[k],lines[k].kind,lines[k].dec,unit)}`;
  const slices0=lines.map(l=>l.series);
  let strip0;
  if(single&&nouns){
    strip0=countStrip(slices0);
    CHARTS[cid].mkStats=s0=>countStrip([s0]); CHARTS[cid].statHtml0=strip0;
  } else if(single){
    const l=lines[0];
    const sb=(s0,zoomed,i0)=>{const s=s0.filter(v=>v!=null);
      const am=l.amounts&&zoomed?l.amounts.slice(i0||0,(i0||0)+s0.length):null;
      const tot=l.kind!=="rate"?0:am?am.reduce((a,v)=>a+v,0):has(l.total)?l.total:0;
      const totHtml=`<span data-stat="total">total <b>${fmt(Math.round(tot))}</b></span>`;
      if(l.kind==="rate"&&!s.length) return `<span data-stat="none">no rate in this range</span><span class="msep">·</span>${totHtml}`;
      const st=sstat(s);
      const oo={min:st.min,avg:st.avg,max:st.max,dec:l.dec,unitLabel:unit.trim()||null};
      if(l.kind==="rate"){
        oo.extra=totHtml
          +(has(l.cumulative)?`<span class="msep">·</span><span data-stat="cumulative">since start <b>${fmt(Math.round(l.cumulative))}</b></span>`:"");
      } else if(l.kind==="count"){oo.now=s.reduce((a,v)=>a+v,0);oo.nowLabel="total";oo.nowDec=0;} else oo.now=s[s.length-1];
      return statsInner(oo);};
    strip0=sb(l.series);
    CHARTS[cid].mkStats=sb; CHARTS[cid].statHtml0=strip0;
  } else {
    strip0=stripHtml(slices0);
    CHARTS[cid].pmUpdate=()=>{
      const slices=ZOOM?sliceL(ZOOM.a,ZOOM.b):slices0;
      const stripEl=document.querySelector(`.mstats[data-stats="${cid}"]`);
      if(stripEl) stripEl.innerHTML=stripHtml(slices);
      lines.forEach((l,k)=>{const chip=document.querySelector(`[data-pml="${cid}:${k}"]`);
        if(chip) chip.setAttribute("data-tip",tipFor(slices,k));});
    };
  }
  const legend=single?"":`<div class="pmlegend">${lines.map((l,k)=>`<button type="button" class="pmlg" data-pml="${cid}:${k}" aria-pressed="true" data-tip="${esc(tipFor(slices0,k))}">${swatch(l.color)}${esc(l.name)}</button>`).join(" ")}</div>`;
  const ttip=extra&&extra.tip;
  cards.push(`<div class="chartcard mcard"><div class="cth"><span class="ctt"${ttip?` data-tip="${esc(ttip)}"`:""}><span class="cic">${icon||I.pulse}</span>${esc(title)}${kindChip?` <span class="st NEUTRAL" style="margin-left:7px">${kindChip}</span>`:""}</span><span class="mstats" data-stats="${cid}">${strip0}</span></div>${legend}${chart}</div>`);
}

function pluginMetricsHtml(){
  const all=(D.pluginMetrics||[]).filter(m=>m&&m.name);
  if(!all.length) return "";
  const charted=all.filter(m=>m.series&&m.series.length>=2);
  const zero=all.filter(m=>!charted.includes(m)&&m.uncharted==="zero");
  const single=all.filter(m=>!charted.includes(m)&&m.uncharted==="single");
  const skipped=all.filter(m=>!charted.includes(m)&&m.uncharted!=="zero"&&m.uncharted!=="single");
  const decOf=s=>s.some(v=>Math.abs(v-Math.round(v))>1e-9)?1:0;
  const owners=[];
  const colorOf=m=>{const o=String(m.name).split("/")[0];if(!owners.includes(o))owners.push(o);return SERIES[owners.indexOf(o)%SERIES.length];};
  const cards=[];
  charted.forEach(m=>{
    const rate=m.kind==="count"&&has(m.bucketSec);
    const label=String(m.label||m.name);
    const line={name:label,kind:rate?"rate":(m.kind==="count"?"count":"gauge"),series:m.series,color:colorOf(m),
      dec:decOf(m.series),bucketSec:m.bucketSec,amounts:m.amounts,total:m.total,cumulative:m.cumulative};
    groupedCard(label,[line],rate?"counter":(m.kind==="count"?"count":"gauge"),rate?"/s":(m.kind==="count"?DV.per:""),cards,{tip:String(m.name)});
  });
  const mname=m=>`<code data-tip="${esc(String(m.name))}">${esc(String(m.label||m.name))}</code>`;
  const names=ms=>ms.map(mname).join(", ");
  const withTotals=ms=>ms.map(m=>`${mname(m)}${m.kind==="count"?` (total ${fmt(Math.round(m.total||0))})`:""}`).join(", ");
  let notes="";
  if(single.length) notes+=`<div class="subnote" style="margin-top:14px">Reported once, so no chart: ${withTotals(single)}.</div>`;
  if(zero.length) notes+=`<div class="subnote" style="margin-top:8px">Zero for the whole window (charts hidden): ${names(zero)}.</div>`;
  if(skipped.length) notes+=`<div class="subnote" style="margin-top:8px">Not charted, over the chart limit: ${withTotals(skipped)}.</div>`;
  return `<p class="lead">Numbers that plugins report through the Hybox API or as JFR events. Counters show as a rate per second. <b>total</b> is the sum in this window. <b>since start</b> is the plugin's own running total.</p>`
    +(cards.length?`<div class="mgrid">${cards.join("")}</div>`:"")+notes;
}

function engineHtml(){
  const ts=(D.tickSystems||[]).filter(r=>r&&r.length>=6);
  const series=(D.tickSeries||[]).filter(s=>s&&s.name&&s.series&&s.series.length>=2);
  if(!ts.length&&!series.length){
    return "";
  }
  const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
  const parts=[];
  if(series.length){
    const byWorld=new Map(), order=[];
    series.forEach(s=>{
      const at=String(s.name).lastIndexOf(" @ ");
      const world=at>=0?String(s.name).slice(at+3):"(unknown world)";
      const sys=at>=0?String(s.name).slice(0,at):String(s.name);
      if(!byWorld.has(world)){byWorld.set(world,[]);order.push(world);}
      byWorld.get(world).push({sys,series:s.series});
    });
    const cards=[];
    order.forEach(world=>{
      let ms=byWorld.get(world);
      if(ms.length>6){
        ms=[...ms].sort((a,b)=>sstat(b.series).avg-sstat(a.series).avg).slice(0,6);
      }
      const lines=ms.map((m,k)=>({name:m.sys,kind:"gauge",series:m.series,color:SERIES[k%SERIES.length],dec:1}));
      groupedCard(worldLabel(world),lines,"tick time"," ms",cards,{gcIdx:true,family:"tick"});
    });
    parts.push(`<div class="mgrid">${cards.join("")}</div>`);
  }
  if(ts.length){
    const sorted=[...ts].sort((a,b)=>b[2]-a[2]);
    const rows=sorted.map(r=>{
      const [sys,world,avg1,max1,avg5,max5]=r;
      const pctB=100*avg1/BUDGET;
      const cls=pctB>100?"v-bad":(pctB>50?"v-warn":"pct"), word=pctB>100?"over budget":(pctB>50?"high":"");
      const barCol=pctB>100?"var(--bad)":(pctB>50?"var(--warn)":"var(--good)");
      return `<tr><td class="nm"><span class="tnc2" style="max-width:280px" data-tipov="${esc(sys)}">${esc(sys)}</span></td><td class="pkg" data-sval="${esc(world)}"><span class="tnc2" style="max-width:170px" data-tipov="${esc(world)}">${esc(worldLabel(world))}</span></td><td class="r" data-num="${avg1}">${fixed(Number(avg1),2)}</td><td class="r" data-num="${max1}">${fixed(Number(max1),2)}</td><td class="r" data-num="${avg5}">${fixed(Number(avg5),2)}</td><td class="r" data-num="${max5}">${fixed(Number(max5),2)}</td><td class="r" data-num="${fixed(pctB,2)}"><span class="bbar"><i style="width:${fixed(Math.min(100,pctB),0)}%;background:${barCol}"></i></span><span class="${cls}">${fixed(pctB,1)}%${word?`<span class="vword">${word}</span>`:""}</span></td></tr>`;
    }).join("");
    parts.push(`<div class="tscroll" style="margin-top:${series.length?"16px":"0"}"><div class="tcap"><table class="sortable" id="es-t"><thead><tr>${thc("System","Engine ECS system",{sort:"text"})}${thc("World","World whose Store ticks this system",{sort:"text"})}${thc("avg 1m","Average tick time, last minute (ms)",{sort:"num",r:true,def:"desc"})}${thc("max 1m","Slowest tick, last minute (ms)",{sort:"num",r:true})}${thc("avg 5m","Average tick time, last 5 minutes (ms)",{sort:"num",r:true})}${thc("max 5m","Slowest tick, last 5 minutes (ms)",{sort:"num",r:true})}${thc("% of budget","Share of the "+fixed(BUDGET,1)+" ms tick budget (avg 1m)",{sort:"num",r:true})}</tr></thead><tbody>${rows}</tbody></table></div></div>`);
  }
  if(D.tickSystemsNote) parts.push(`<div class="subnote" id="tsnote" style="margin-top:10px">${esc(D.tickSystemsNote)}</div>`);
  const lead=`<p class="lead">Time each engine system took per tick, measured by Hytale. It includes time spent waiting on locks and disk.</p>`;
  return lead+parts.join("");
}

  <div class="flame-controls"><label>Child frame <select id="flamechild" aria-describedby="flamevalue"></select></label><button type="button" class="copybtn" id="flamezoom">Zoom to frame</button><button type="button" class="copybtn" id="flameup">Parent frame</button></div>

  <canvas id="flamecv" class="bbtipcv" height="520" role="img" aria-label="Flame graph. Use the child frame selector, the parent and zoom buttons, or the search matches to move through it without the canvas." aria-describedby="flamevalue"></canvas>`;
}
function initFlame(){
  const cv=$("#flamecv"); if(!cv||!D.flame) return;
  const ROW=22, AROW=10, MAXH=520;
  const nodes=[];
  function parse(n,parent=null){
    const node={name:String(n[0]),samples:n[1],children:[],owner:n[3]|0,label:n[4]||null,parent,id:nodes.length};
    nodes.push(node);node.children=(n[2]||[]).map(c=>parse(c,node));return node;
  }
  const root=parse(D.flame);
  let path=[root];
  let filter="";
  let cells=[];
  const ownOff={};
  const childSelect=$("#flamechild"),matchSelect=$("#flamematch"),value=$("#flamevalue");
  let choices=[],searchMatches=[],fTimer=null,choiceRoot=null,choiceOwners="";
  function describe(node){
    const names=[];for(let n=node;n;n=n.parent) names.push(n.name);
    return `${names.reverse().join(" → ")}${node.label?` (${node.label})`:""} · ${nSamples(node.samples)} · ${fixed(pct(node.samples,root.samples||1),2)}% of total · ${fixed(pct(node.samples,path[path.length-1].samples||1),1)}% of view`;
  }
  function showFrameValue(){
    const cur=path[path.length-1],selected=nodes[Number(childSelect.value)];
    const gap=Math.max(0,cur.samples-cur.children.reduce((n,c)=>n+c.samples,0));
    value.textContent=`View: ${describe(cur)}${gap&&cur.children.length?` · ${nSamples(gap)} in frames too small to show`:""}`+(selected?`. Selected: ${describe(selected)}`:"");
  }
  function syncFrameControls(){
    const cur=path[path.length-1],owners=[1,2,3].map(o=>ownOff[o]?1:0).join("");
    if(choiceRoot!==cur||choiceOwners!==owners){
      const selected=nodes[Number(childSelect.value)];choices=[];
      const add=n=>{if(ownOff[n.owner])n.children.forEach(add);else choices.push(n);};
      cur.children.forEach(add);
      childSelect.innerHTML=choices.length?choices.map(n=>`<option value="${n.id}">${esc(n.name)} · ${nSamples(n.samples)}</option>`).join(""):'<option value="-1">No child frames in this view</option>';
      if(choices.includes(selected))childSelect.value=String(selected.id);
      choiceRoot=cur;choiceOwners=owners;
    }
    $("#flamezoom").setAttribute("aria-disabled",String(!choices.length));
    $("#flameup").setAttribute("aria-disabled",String(path.length<2));
    showFrameValue();
  }
  function updateMatches(){
    searchMatches=filter?nodes.filter(n=>n.name.toLowerCase().includes(filter)).sort((a,b)=>b.samples-a.samples):[];
    const search=$("#flamesearch");
    if(!filter&&search.contains(document.activeElement))childSelect.focus();
    search.hidden=!filter;
    matchSelect.innerHTML=searchMatches.length?searchMatches.map(n=>`<option value="${n.id}">${esc(n.name)} · ${nSamples(n.samples)}</option>`).join(""):'<option value="-1">No matching frames</option>';
    $("#flamejump").setAttribute("aria-disabled",String(!searchMatches.length));
  }
  childSelect.addEventListener("change",showFrameValue);
  $("#flamezoom").addEventListener("click",()=>{const n=nodes[Number(childSelect.value)];if(n){clearTimeout(fTimer);zoomTo(n);}});
  $("#flameup").addEventListener("click",()=>{clearTimeout(fTimer);if(path.length>1)zoomTo(path[path.length-2]);});
  matchSelect.addEventListener("change",()=>{clearTimeout(fTimer);const n=nodes[Number(matchSelect.value)];if(n)value.textContent="Search match: "+describe(n);});
  $("#flamejump").addEventListener("click",()=>{clearTimeout(fTimer);const n=nodes[Number(matchSelect.value)];if(n)zoomTo(n);});
  const hue=name=>{
    const cls=String(name).split(".")[0]||String(name);
    let h=0; for(let i=0;i<cls.length;i++) h=(h*31+cls.charCodeAt(i))>>>0;
    return h%360;
  };
  const hslOf=hex=>{
    const v=parseInt(String(hex).slice(1),16), r=(v>>16&255)/255, g=(v>>8&255)/255, b=(v&255)/255;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
    const h=!d?0:mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
    return [h*60,d?100*d/(1-Math.abs(2*l-1)):0,100*l];
  };
  const OWNER_HSL={0:hslOf(FLAME_COL[0]),1:hslOf(FLAME_COL[1]),2:hslOf(FLAME_COL[2]),3:hslOf(FLAME_COL[3])};
  const OWNER_JIT={0:0,1:8,2:2,3:0}, OWNER_LJ={0:5,1:7,2:9,3:7};
  const colorOf=(node,anc)=>{
    const o=OWNER_HSL[node.owner|0]?node.owner|0:0, [bh,bs,bl]=OWNER_HSL[o], hh=hue(node.name), jit=OWNER_JIT[o], j=jit?hh%(2*jit+1)-jit:0;
    const s=anc?Math.max(4,bs-30):bs;
    const l=anc?40:bl-OWNER_LJ[o]/2+hh%OWNER_LJ[o];
    return `hsl(${fixed((bh+j),1)},${fixed(s,1)}%,${fixed(l,1)}%)`;
  };
  function render(){
    const cssW=cv.clientWidth||(cv.parentElement?cv.parentElement.clientWidth:0); if(!cssW) return;
    const dpr=devicePixelRatio||1;
    const cur=path[path.length-1];
    let depth=0;
    (function dd(n,d){const hid=d>0&&!!ownOff[n.owner];if(!hid&&d>depth)depth=d;const cd=hid?d:d+1;if(cd<64)n.children.forEach(c=>dd(c,cd));})(cur,0);
    const ancRows=path.length-1;
    const availRows=Math.max(3,Math.floor((MAXH-ancRows*AROW)/ROW));
    const shownDepth=Math.min(depth+1,availRows);
    const cut=depth+1-shownDepth;
    const cssH=ancRows*AROW+shownDepth*ROW;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.font="12px ui-monospace,Menlo,monospace"; ctx.textBaseline="middle";
    cells=[];
    for(let a=0;a<ancRows;a++){
      const nd=path[a], y=a*AROW;
      ctx.globalAlpha=.55; ctx.fillStyle=colorOf(nd,true);
      ctx.fillRect(0,y,cssW,AROW-1); ctx.globalAlpha=1;
      cells.push({x:0,y,w:cssW,h:AROW-1,node:nd,kind:"anc",pathIdx:a});
    }
    const y0=ancRows*AROW;
    const matches=n=>filter&&String(n.name).toLowerCase().includes(filter);
    const draw=(n,x,w,d)=>{
      if(d>=shownDepth||w<1) return;
      const y=y0+d*ROW;
      const hidden=d>0&&!!ownOff[n.owner];
      if(!hidden){
        const dim=filter&&!matches(n);
        ctx.globalAlpha=dim?.22:1;
        ctx.fillStyle=colorOf(n,false);
        ctx.fillRect(x,y,Math.max(w-0.6,0.4),ROW-1);
        if(w>40){
          ctx.globalAlpha=1;ctx.fillStyle=dim?PAL.tx:PAL.ink;
          ctx.save();ctx.beginPath();ctx.rect(x+3,y,w-6,ROW);ctx.clip();
          ctx.fillText(String(n.name),x+4,y+ROW/2);
          ctx.restore();
        }
        ctx.globalAlpha=1;
        cells.push({x,y,w,h:ROW-1,node:n,kind:"cell"});
      }
      const cd=hidden?d:d+1;
      let cx=x, childSum=0;
      n.children.forEach(c=>{childSum+=c.samples;});
      n.children.forEach(c=>{
        const cw=w*c.samples/(n.samples||1);
        draw(c,cx,cw,cd);
        cx+=cw;
      });
      const gapN=n.samples-childSum;
      if(n.children.length&&gapN>0&&!hidden&&cd<shownDepth){
        const gw=w*gapN/(n.samples||1);
        if(gw>=1){
          const gy=y0+cd*ROW;
          ctx.globalAlpha=.06; ctx.fillStyle=PAL.tx;
          ctx.fillRect(cx,gy,Math.max(gw-0.6,0.4),ROW-1); ctx.globalAlpha=1;
          cells.push({x:cx,y:gy,w:gw,h:ROW-1,node:null,kind:"gap",gapN});
        }
      }
    };
    draw(cur,0,cssW,0);
    const note=$("#flamenote");
    if(note) note.textContent=cut>0?`+${cut} deeper level${cut===1?"":"s"}`:"";
    syncFrameControls();
    if(typeof markThreadGroup==="function") markThreadGroup(path.length>=2?path[1].name:null);
  }
  function cellAt(mx,my){
    for(let i=cells.length-1;i>=0;i--){
      const c=cells[i];
      if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) return c;
    }
    return null;
  }
  cv.addEventListener("mousemove",e=>{
    const r=cv.getBoundingClientRect();
    const c=cellAt(e.clientX-r.left,e.clientY-r.top);
    if(!c){hideTip();cv.style.cursor="default";return;}
    cv.style.cursor="pointer";
    let txt;
    if(c.kind==="gap") txt=`${nSamples(c.gapN)} in frames too small to show`;
    else txt=`${c.node.name}${c.node.label?` · ${c.node.label}`:""} · ${nSamples(c.node.samples)} · ${fixed(pct(c.node.samples,root.samples||1),2)}% of total · ${fixed(pct(c.node.samples,path[path.length-1].samples||1),1)}% of view`;
    TIP.textContent=txt; TIP.style.display="block";
    placeTip(TIP,e.clientX,e.clientY);
  });
  cv.addEventListener("mouseleave",()=>hideTip());
  function zoomTo(node){
    if(!node||nodes[node.id]!==node)return;
    path=[];for(let n=node;n;n=n.parent)path.push(n);path.reverse();
    render();cv.scrollIntoView({block:"nearest"});
  }
  function jumpToBest(){
    if(searchMatches.length) zoomTo(searchMatches[0]);
  }
  cv.addEventListener("click",e=>{
    const r=cv.getBoundingClientRect();
    const c=cellAt(e.clientX-r.left,e.clientY-r.top);
    if(!c||!c.node) return;
    if(c.kind==="anc"){path=path.slice(0,c.pathIdx+1);render();return;}
    if(c.node!==path[path.length-1]) zoomTo(c.node);
  });
  const fin=$("#flamefilter");
  function resetFlame(){clearTimeout(fTimer);path=[root];filter="";if(fin)fin.value="";updateMatches();render();}
  cv.addEventListener("dblclick",resetFlame);
  const crumbEl=$("#flamecrumb");
  if(crumbEl) crumbEl.addEventListener("click",resetFlame);
  if(fin){
    fin.addEventListener("input",()=>{
      clearTimeout(fTimer);filter=fin.value.trim().toLowerCase();updateMatches();render();
      if(filter) fTimer=setTimeout(jumpToBest,220);
    });
    fin.addEventListener("keydown",e=>{if(e.key==="Enter"&&filter){clearTimeout(fTimer);jumpToBest();}});
  }
  document.querySelectorAll(".flamelg .flgtog").forEach(el=>el.addEventListener("click",()=>{
    const o=+el.dataset.own;ownOff[o]=!ownOff[o];setPressed(el,!ownOff[o],"off");render();
  }));
  flameRender=render;
  window.BBFLAME={cells:()=>cells,zoomTo,reset:resetFlame,rootNode:()=>path[path.length-1],tree:root,
    setFilter:v=>{clearTimeout(fTimer);filter=String(v).trim().toLowerCase();if(fin)fin.value=v;updateMatches();render();}};
  render();
}

function threadTimelineHtml(){
  const tt=D.threadTimeline;
  if(!tt||!tt.length) return "";
  const lg=[["RUNNABLE",STCOL.RUNNABLE],["WAITING",STCOL.WAITING],["TIMED_WAITING",STCOL.TIMED_WAITING],["BLOCKED",STCOL.BLOCKED]].map(([k,c])=>[STLABEL[k],c])
    .map(([k,c])=>`<span><span class="edot" style="background:${c}"></span>${k}</span>`).join(" ");
  const hasFlame=!!(D.flame&&Array.isArray(D.flame)&&Array.isArray(D.flame[2])&&D.flame[2].length);
  const labels=tt.map(t=>hasFlame?`<button type="button" class="ttlabel" data-flamegroup="${esc(threadGroup(t.name))}" aria-pressed="false" data-tip="${esc(t.name)} · focus in flame graph">${esc(t.name)}</button>`:`<div class="ttlabel" data-tipov="${esc(t.name)}">${esc(t.name)}</div>`).join("");
  const ttCnt=(has(D.threadTotal)&&D.threadTotal>tt.length)?`top ${tt.length} of ${D.threadTotal} threads · `:"";
  return `<div class="ttlegend">${lg}<span style="margin-left:auto" class="pkg">${ttCnt}most common state in each interval. Gaps have no samples.</span></div>
  <div class="ttwrap"><div class="ttlabels">${labels}</div><div class="ttcv"><canvas id="ttcanvas" class="bbtipcv" role="img" aria-label="Thread states over time. Use the thread and interval controls below for values."></canvas></div></div>
  <div class="timeline-controls"><label>Thread <select id="ttthread">${tt.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join("")}</select></label><label>Interval <input id="ttinterval" type="range" min="0" max="${Math.max(0,tt[0].states.length-1)}" value="0" aria-describedby="ttvalue"></label></div><output id="ttvalue" aria-live="polite"></output>`;
}
function initThreadTimeline(){
  const cv=$("#ttcanvas"); if(!cv||!D.threadTimeline||!D.threadTimeline.length) return;
  const tt=D.threadTimeline, ROWH=22;
  const SCOL={1:STCOL.RUNNABLE,2:STCOL.WAITING,3:STCOL.TIMED_WAITING,4:STCOL.BLOCKED};
  const SNAME={0:"no samples",1:STLABEL.RUNNABLE,2:STLABEL.WAITING,3:STLABEL.TIMED_WAITING,4:STLABEL.BLOCKED};
  let geo=null;
  const threadSelect=$("#ttthread"),interval=$("#ttinterval"),value=$("#ttvalue");
  function showValue(){
    const t=tt[Number(threadSelect.value)],i=Number(interval.value),state=SNAME[t.states[i]||0],clock=globalClock(i/((t.states.length-1)||1));
    value.textContent=`${t.name} · ${state} · interval ${i+1} of ${t.states.length}${clock?" · "+clock:""}`;
    interval.setAttribute("aria-valuetext",`${i+1}: ${clock?clock+" · ":""}${state}`);
  }
  threadSelect.addEventListener("change",showValue);interval.addEventListener("input",showValue);
  function render(){
    const holder=cv.parentElement;
    const cssW=holder?holder.clientWidth-16:0; if(cssW<=0) return;
    const cssH=tt.length*ROWH;
    const dpr=devicePixelRatio||1;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const N=tt[0].states.length;
    const za=ZOOM?ZOOM.a:0, zb=ZOOM?ZOOM.b:1;
    let i0=Math.max(0,Math.floor(za*(N-1))), i1=Math.min(N-1,Math.ceil(zb*(N-1)));
    if(i1<=i0) i1=Math.min(N-1,i0+1);
    const n=i1-i0+1, cw=cssW/n;
    tt.forEach((t,r)=>{
      const y=r*ROWH;
      for(let i=0;i<n;i++){
        const s=t.states[i0+i];
        if(!s) continue;
        ctx.fillStyle=SCOL[s]||PAL.neutral;
        ctx.fillRect(i*cw,y+1,Math.max(cw-0.4,0.5),ROWH-3);
      }
    });
    const mark=DV.incMarker;
    if(INCHL&&mark&&mark.frac!=null){
      const gf=clamp01(mark.frac);
      if(gf>=za-1e-9&&gf<=zb+1e-9){
        const x=Math.round(((gf-za)/((zb-za)||1))*cssW)+0.5;
        ctx.setLineDash([3,3]); ctx.strokeStyle=markColor(mark.kind); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cssH); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    let marks=[];
    const evList=shownEvents();
    if(evList&&evList.length){
      marks=eventMarks(evList,f=>(f<za-1e-9||f>zb+1e-9)?null:Math.max(0,Math.min(n-1,Math.round(f*(N-1))-i0)),i=>(i+0.5)*cw);
      ctx.setLineDash([4,4]); ctx.lineWidth=1;
      marks.forEach(m=>{
        ctx.globalAlpha=.45; ctx.strokeStyle=m.color; ctx.beginPath(); ctx.moveTo(m.x,0); ctx.lineTo(m.x,cssH); ctx.stroke();
        ctx.globalAlpha=1; ctx.fillStyle=m.color; ctx.beginPath(); ctx.arc(m.x,3,2.6,0,2*Math.PI); ctx.fill();
      });
