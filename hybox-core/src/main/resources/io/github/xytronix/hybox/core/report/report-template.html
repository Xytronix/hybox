<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#121317; --bg2:#16181d; --panel:#1b1e24; --panel2:#21242c; --panelh:#262a33;
    --border:#2a2e37; --border2:#363c47; --border3:#454c5a;
    --tx:#d6dae2; --tx2:#9aa1ad; --tx3:#6b7280; --tx4:#525866;
    --good:#5bd68b; --warn:#e6b34a; --bad:#f0626b; --crit:#ff5d6c; --info:#62a8ea;
    --blue:#62a8ea; --violet:#a98be0; --teal:#46cfc0; --amber:#e6b34a; --pink:#ef7aa5;
    --accent:#62a8ea;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    --r:9px;
  }
  *{box-sizing:border-box;scrollbar-color:var(--border2) var(--bg2);scrollbar-width:thin}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border3)}
  ::-webkit-scrollbar-corner{background:var(--bg2)}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(98,168,234,.28)}
  svg{display:block}
  .mono{font-family:var(--mono)}

  .wrap{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1560px;margin:0 auto;min-height:100vh}
  .nav{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--border);padding:0;overflow-y:auto;background:linear-gradient(180deg,var(--bg2),var(--bg))}
  .main{min-width:0;padding:0 40px 140px}

  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
  .brand .glyph{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2b303a,#15171c);border:1px solid var(--border2);display:grid;place-items:center;color:var(--crit);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .brand b{font-size:13px;letter-spacing:.07em;color:var(--tx);display:block}
  .brand small{display:block;color:var(--tx4);font-size:10px;letter-spacing:.16em;margin-top:1px}
  .navlist{list-style:none;margin:0;padding:10px 12px}
  .navlist a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:7px;color:var(--tx2);font-size:12.5px;transition:.12s;position:relative}
  .navlist a .nic{color:var(--tx4);display:grid;place-items:center;width:16px;height:16px;flex:none}
  .navlist a:hover{background:var(--panel);color:var(--tx)}
  .navlist a:hover .nic{color:var(--tx2)}
  .navlist a.on{background:var(--panel2);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
  .navlist a.on .nic{color:var(--accent)}
  .navlist a .nct{margin-left:auto;color:var(--tx4);font-size:10px;font-family:var(--mono)}
  .navfoot{padding:16px 20px;color:var(--tx4);font-size:10.5px;line-height:1.8;border-top:1px solid var(--border);margin-top:6px}
  .navfoot b{color:var(--tx3)}

  header{padding:30px 0 24px;border-bottom:1px solid var(--border)}
  .hl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .badge{font-weight:700;font-size:11px;letter-spacing:.12em;padding:6px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
  .badge.warn{background:rgba(230,179,74,.12);color:var(--warn);border:1px solid rgba(230,179,74,.34)}
  .badge.bad{background:rgba(240,98,107,.12);color:var(--bad);border:1px solid rgba(240,98,107,.34)}
  .badge.good{background:rgba(98,168,234,.12);color:var(--blue);border:1px solid rgba(98,168,234,.34)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill{font-size:11.5px;color:var(--tx2);background:var(--panel);border:1px solid var(--border);padding:5px 11px;border-radius:20px;display:inline-flex;gap:7px;align-items:center}
  .pill b{color:var(--tx)}
  .incid{color:var(--tx3);font-size:12px;margin-left:auto;font-family:var(--mono)}
  .incid b{color:var(--tx2)}
  h1{font-size:29px;font-weight:680;letter-spacing:-.015em;margin:6px 0 2px;color:#eef1f6;line-height:1.2;overflow-wrap:anywhere}
  h1 .ms{color:var(--warn)}
  .subhead{color:var(--tx2);font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
  .subhead code{font-family:var(--mono);color:var(--tx);background:rgba(255,255,255,.05);padding:1px 6px;border-radius:5px;font-size:12px}

  .envstrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .echip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 13px;position:relative}
  .echip .eic{width:22px;height:22px;display:grid;place-items:center;color:var(--tx2);flex:none}
  .echip .el{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx4)}
  .echip .ev{font-size:12.5px;color:var(--tx);font-weight:600;margin-top:1px}

  section{padding:30px 0;border-bottom:1px solid var(--border);scroll-margin-top:8px}
  .sh{display:flex;align-items:center;gap:13px;margin-bottom:20px;cursor:pointer;user-select:none}
  .sh .sic{width:26px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;color:var(--accent);flex:none}
  .sh .num{font-size:10.5px;color:var(--tx4);font-family:var(--mono)}
  .sh h2{font-size:16px;font-weight:650;margin:0;color:#eaecf1;letter-spacing:.005em}
  .sh .sub{color:var(--tx4);font-size:11.5px;font-weight:400;margin-left:2px}
  .sh .chev{margin-left:auto;color:var(--tx4);transition:.2s}
  section.collapsed .chev{transform:rotate(-90deg)}
  section.collapsed .sbody{display:none}

  .lead{color:var(--tx2);font-size:13.5px;line-height:1.65;margin:-6px 0 20px;max-width:880px}
  .lead b{color:var(--tx)}
  .lead .hot{color:var(--warn);font-weight:600}

  .diag{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
  @media(max-width:1080px){.diag{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
  .card.glow{box-shadow:0 0 0 1px rgba(230,179,74,.12),0 14px 40px rgba(0,0,0,.32);border-color:rgba(230,179,74,.28)}
  .card h3{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px}
  .card h3 .ic{color:var(--warn)}
  .diagtext{font-size:13.5px;color:var(--tx);line-height:1.7}
  .diagtext b{color:#fff}
  .diagtext code{font-family:var(--mono);font-size:12px;color:var(--teal);background:rgba(70,207,192,.08);padding:1px 6px;border-radius:5px}
  .findings{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .findings li{display:flex;gap:11px;font-size:12.5px;color:var(--tx2);line-height:1.5;align-items:flex-start}
  .findings li .fi{flex:none;margin-top:1px}
  .findings li b{color:var(--tx)}
  .verdict{display:flex;flex-direction:column;gap:13px}
  .vrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .vrow:last-child{border-bottom:0;padding-bottom:0}
  .vrow .vk{color:var(--tx3);font-size:11.5px}
  .vrow .vv{color:var(--tx);font-size:12.5px;text-align:right;font-weight:500}
  .vv.bad{color:var(--bad)} .vv.warn{color:var(--warn)} .vv.good{color:var(--good)}
  .tagrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:10.5px;font-family:var(--mono);color:var(--tx2);background:var(--panel2);border:1px solid var(--border2);padding:3px 8px;border-radius:5px}
  .tag.ok{color:var(--good);border-color:rgba(91,214,139,.28)} .tag.no{color:var(--tx4)}

  .factstrip{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 16px}
  .factstrip .pill svg{color:var(--tx4)}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:1080px){.mgrid{grid-template-columns:1fr}}
  .mcard .cic{display:inline-grid;place-items:center;width:16px;height:16px;color:var(--tx4);margin-right:8px;flex:none}
  .mcard .ctt{display:inline-flex;align-items:center}
  .mstats{font-family:var(--mono);font-size:11px;color:var(--tx4);display:inline-flex;flex-wrap:wrap;align-items:baseline}
  .mstats b{color:var(--tx2);font-weight:600}
  .mstats .mnow b{color:var(--tx);font-size:12.5px}
  .mstats .mnow .mu2{color:var(--tx4);font-size:11px}
  .mstats .msep{padding:0 5px;color:var(--border3)}
  .mstats .munit{color:var(--tx4);margin-left:4px}
  .mstats b.v-warn{color:var(--warn)}
  .v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)} .v-info{color:var(--blue)}

  [data-tip]{cursor:help}
  #tipbox{position:fixed;display:none;max-width:300px;background:#0b0c0f;border:1px solid var(--border3);border-radius:7px;padding:8px 11px;
    font-size:11px;font-weight:400;line-height:1.5;color:var(--tx2);text-transform:none;letter-spacing:0;text-align:left;z-index:99;
    box-shadow:0 14px 34px rgba(0,0,0,.55);white-space:normal;pointer-events:none;overflow-wrap:anywhere;font-family:var(--sans)}
  thead th .thl{cursor:help}

  .charts2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
  @media(max-width:1080px){.charts2{grid-template-columns:1fr}}
  .chartcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
  .chartcard .cth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px;flex-wrap:wrap}
  .chartcard .ctt{font-size:12.5px;color:var(--tx);font-weight:600}
  .chartcard .ctm{font-size:11px;color:var(--tx4);font-family:var(--mono)}
  .chartholder{position:relative;flex:1 1 auto}
  .chartholder svg{width:100%;height:100%;display:block;overflow:visible;cursor:crosshair}
  .axlab{fill:var(--tx4);font-size:9px;font-family:var(--mono)}
  .gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
  .ch-guide,.ch-dot{transition:opacity .08s;pointer-events:none}
  .chtip{position:absolute;transform:translate(-50%,calc(-100% - 9px));background:#0b0c0f;border:1px solid var(--border3);border-radius:6px;padding:5px 9px;font-size:11px;font-family:var(--mono);color:var(--tx2);white-space:nowrap;pointer-events:none;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.55);text-align:left;max-width:320px}
  .chtip b{color:#fff}
  .chtip[hidden]{display:none}
  .chtip .ctl{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:10.5px;line-height:1.35}
  .chtip .ctl .cdot{width:6px;height:6px;border-radius:50%;flex:none}
  .chtip .ctl .ctxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:290px}
  .chtip .ctl.cinc .ctxt{color:#f0626b}
  .chtip .ctl.cmore .ctxt{color:var(--tx4)}

  .wbars{display:flex;flex-direction:column;gap:10px}
  .wbar{display:grid;grid-template-columns:minmax(150px,32%) minmax(0,1fr) 110px;align-items:center;gap:12px;font-size:12px}
  .wbar .wn{color:var(--tx2);display:flex;align-items:flex-start;gap:7px;min-width:0;line-height:1.35}
  .wbar .wn svg{flex:none;margin-top:1px}
  .wbar .wn span{overflow-wrap:anywhere}
  .wbar.stall .wn{color:var(--warn)}
  .wbar .wt{height:13px;background:var(--bg2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
  .wbar .wf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),#3f7fc0)}
  .wbar.stall .wf{background:linear-gradient(90deg,var(--warn),#b8862f)}
  .wbar .wv{text-align:right;color:var(--tx3);font-family:var(--mono);font-size:11px}

  .donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:9px}
  .legend .lg{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2)}
  .legend .lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .lg b{color:var(--tx);font-family:var(--mono);margin-left:auto;padding-left:18px}

  .tbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .tbar input{background:var(--bg2);border:1px solid var(--border2);color:var(--tx);font-family:var(--mono);font-size:12px;padding:7px 11px 7px 32px;border-radius:7px;width:250px;outline:none}
  .tbar .srch{position:relative}
  .tbar .srch .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx4)}
  .tbar input:focus{border-color:var(--blue)}
  .tbar .chip{font-size:11px;color:var(--tx2);background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:20px}
  .tbar .count{color:var(--tx4);font-size:11px;margin-left:auto;font-family:var(--mono)}
  .tbar .chip.tog{cursor:pointer;transition:.12s}
  .tbar .chip.tog:hover{border-color:var(--border3);color:var(--tx)}
  .tbar .chip.tog.on{background:var(--panel2);border-color:var(--blue);color:#cfe2f8}

  .tscroll{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .tcap{max-height:540px;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{position:sticky;top:0;background:var(--bg2);color:var(--tx3);font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.r{text-align:right}
  thead th.sortable:hover{color:var(--tx)}
  thead th .ar{opacity:0;font-size:9px;margin-left:4px;color:var(--blue)}
  thead th.asc .ar,thead th.desc .ar{opacity:1}
  thead th.asc .ar::after{content:"▲"} thead th.desc .ar::after{content:"▼"}
  tbody td{padding:8px 13px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:var(--mono);font-size:11.5px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:rgba(255,255,255,.022)}
  td.r{text-align:right}
  .rank{color:var(--tx4);width:30px}
  .nm{color:var(--tx);font-family:var(--sans);font-weight:500}
  .cls{color:var(--violet)} .leaf{color:var(--tx)}
  .pkg{color:var(--tx4)}
  .st{font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid}
  .st.RUNNABLE{color:var(--good);border-color:rgba(91,214,139,.3);background:rgba(91,214,139,.07)}
  .st.WAITING{color:var(--blue);border-color:rgba(98,168,234,.3);background:rgba(98,168,234,.07)}
  .st.TIMED_WAITING{color:var(--violet);border-color:rgba(169,139,224,.3);background:rgba(169,139,224,.07)}
  .st.BLOCKED{color:var(--bad);border-color:rgba(240,98,107,.3);background:rgba(240,98,107,.07)}
  .st.NEUTRAL{color:var(--tx3);border-color:var(--border2)}
  .pcount{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx3);background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:0 7px;line-height:18px;vertical-align:middle}
  .pcount .plk{display:inline-flex;color:var(--tx4)}
  .pcount .plk svg{width:12px;height:12px}
  .pcount b{color:var(--tx2);font-weight:600}
  .pcount[data-tip]{cursor:help}
  .pcount.z{opacity:.5}
  .pct{color:var(--tx3)}
  tr.hl td{background:rgba(230,179,74,.06)!important}
  .nm.stallname{color:var(--warn);cursor:help}
  .vtag{font-family:var(--mono);color:var(--tx2)}
  .corebadge{font-size:10px;color:var(--tx4);font-family:var(--sans)}

  .mname{display:flex;align-items:center;gap:7px;cursor:pointer}
  .mname .exp{color:var(--tx4);font-size:9px;transition:.15s;flex:none;width:9px}
  .mname:hover .exp{color:var(--blue)}
  tr.open .mname .exp{transform:rotate(90deg);color:var(--blue)}
  .mpath{margin:8px 0 2px 16px;border-left:1px solid var(--border2);padding:2px 0 2px 0}
  .mpath[hidden]{display:none}
  .mpath .plab{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx4);margin:0 0 5px 12px}
  .mpath .pf{font-size:11px;color:var(--tx2);padding:2px 0 2px 12px;position:relative;white-space:nowrap}
  .mpath .pf .arr{color:var(--tx4);margin-right:6px}
  .mpath .pf .cls{color:var(--violet)}

  .syscols{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:1080px){.syscols{grid-template-columns:1fr}}
  .kvcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  .kvcard .kvh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
  .kvcard .kvh .ic{color:var(--accent)} .kvcard .kvh b{font-size:12.5px;color:var(--tx)}
  .kvcard .kvh small{color:var(--tx4);font-size:11px;margin-left:auto;font-family:var(--mono)}
  .kv .row{display:flex;justify-content:space-between;gap:16px;padding:9px 16px;font-size:12px;border-bottom:1px solid var(--border)}
  .kv .row:last-child{border-bottom:0}
  .kv .row .k{color:var(--tx3);flex:none}
  .kv .row .v{color:var(--tx);text-align:right;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}

  .codewrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .codehd{display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--bg2);cursor:pointer;user-select:none}
  .codehd .ic{color:var(--accent)}
  .codehd .fn{color:var(--tx);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
  .codehd .chev2{margin-left:auto;color:var(--tx4);transition:.2s}
  .codewrap.closed .chev2{transform:rotate(-90deg)}
  .codewrap.closed pre{display:none}
  pre{margin:0;padding:15px 17px;font-size:11.8px;line-height:1.7;color:var(--tx2);overflow-x:auto;background:#0e0f13;max-height:460px;overflow-y:auto;font-family:var(--mono)}
  .jk{color:var(--blue)} .js{color:var(--good)} .jn{color:var(--amber)} .jb{color:var(--violet)} .jp{color:var(--tx4)}

  .lvl{font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:4px;border:1px solid;flex:none}
  .lvl.WARN{color:var(--warn);border-color:rgba(230,179,74,.3);background:rgba(230,179,74,.07)}
  .lvl.ERROR{color:var(--bad);border-color:rgba(240,98,107,.3);background:rgba(240,98,107,.07)}
  .lvl.INFO{color:var(--blue);border-color:rgba(98,168,234,.3);background:rgba(98,168,234,.07)}
  .lvl.OTHER{color:var(--tx3);border-color:var(--border2);background:var(--bg2)}
  .logscroll{max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r);background:#0e0f13;padding:6px 0}
  .lline{display:flex;gap:10px;align-items:flex-start;padding:3px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.6}
  .lline:hover{background:rgba(255,255,255,.025)}
  .lline.lERROR{box-shadow:inset 2px 0 0 var(--bad)}
  .lline.lWARN{box-shadow:inset 2px 0 0 var(--warn)}
  .lline .lsrc{color:var(--teal);flex:none;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lline .lmsg{color:var(--tx2);min-width:0;flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
  .logdet summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
  .logdet summary::-webkit-details-marker{display:none}
  .logdet summary::before{content:"\25B8";color:var(--tx4);font-size:10px;transition:.15s}
  .logdet[open] summary::before{transform:rotate(90deg)}
  .logdet .logfirst{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}

  const sl=Math.max(1,...Object.values(D.series||{}).filter(a=>Array.isArray(a)&&a.length>1).map(a=>a.length));

    off+=len; });

  const ranked=[...sampled].sort((a,b)=>b.samples-a.samples);
  const stalled=worlds.find(w=>w.stalled)||null;
  const rankedAll=[...worlds].sort((a,b)=>(b.samples||0)-(a.samples||0));
  const ts=D.threadStates||null;
  const blocked=ts?(ts.BLOCKED||0):null;
  const ser=D.series||{};
  const heapG=ser.heap?ser.heap.map(gib):null;
  const rssG=ser.rss?ser.rss.map(gb):null;
  const diskG=ser.disk?ser.disk.map(gb):null;
  const hostMemG=ser.hostMem?ser.hostMem.map(gb):null;
  return {
    worlds, ranked, topWorld:ranked[0]||null, stalled,
    stalledRank: stalled?rankedAll.indexOf(stalled)+1:0,
    topThread:(D.hotThreads&&D.hotThreads[0])||null,

function modOfConfig(cfg){
  const base=String(cfg).toLowerCase().replace(/\.mixins\.json$/,"").replace(/^_+/,"");
  let best=null;
  if(base.length>=3){
    (D.plugins||[]).forEach(p=>{
      const nm=String(p[1]||""), nml=nm.toLowerCase(), aul=String(p[0]||"").toLowerCase();
      if(nml.includes(base)||(nml.length>=3&&base.includes(nml))||(aul.length>=3&&aul.includes(base))){
        if(!best||nm.length<best.length) best=nm;
      }
    });
  }
  if(best) return best;
  if(D.mixins&&D.mixins.bootstrapper){
    const bs=String(D.mixins.bootstrapper).split(" ")[0], bsl=bs.toLowerCase();
    if(bsl.includes(base)||base.includes(bsl)) return bs;
  }
  return String(cfg);
}
const MIXCONF=(()=>{
  const raw=(D.mixins&&Array.isArray(D.mixins.conflicts))?D.mixins.conflicts:null;
  const byConfig=new Set(), modInfo=new Map();
  let list=null;
  if(raw){
    list=raw.map(c=>[c[0],(c[1]||[]).map(p=>Array.isArray(p)?[p[0],p[1]??null]:[p,null])]);
    list.forEach(c=>{
      const shortT=String(c[0]).split(".").pop();
      c[1].forEach((p,pi)=>{
        byConfig.add(p[0]);
        const mod=modOfConfig(p[0]);
        const others=c[1].filter((_,j)=>j!==pi).map(q=>modOfConfig(q[0])).join(" + ");
        const line=`${p[1]||p[0]} ↔ ${others} on ${shortT}`;
        if(!modInfo.has(mod)) modInfo.set(mod,[]);
        modInfo.get(mod).push(line);
      });
    });
  }
  return {list,byConfig,modInfo};
})();

function containerRisk(){
  const c=D.sys&&D.sys.container;
  if(!c||!has(c.memLimit)||c.memLimit<=0) return null;
  if(!has(D.sys.xmxBytes)||D.sys.xmxBytes<=0) return null;
  return D.sys.xmxBytes>0.9*c.memLimit?{xmx:D.sys.xmxBytes,lim:c.memLimit}:null;
}
function diskRisk(){
  const d=D.sys&&D.sys.disk;
  if(!d||!has(d.free)||!has(d.total)||d.total<=0) return null;
  return (d.free<0.05*d.total||d.free<2*1024*1024*1024)?{free:d.free,total:d.total}:null;
}
function sliceAvg(arr,a,b){
  const N=arr.length;
  let i0=Math.max(0,Math.floor(a*(N-1))), i1=Math.min(N-1,Math.ceil(b*(N-1)));
  if(i1<i0) i1=i0;
  let s=0,n=0;
  for(let i=i0;i<=i1;i++){s+=arr[i];n++;}
  return n?s/n:null;
}
function comparisonHtml(){
  if(!has(D.incident.markerFrac)||D.incident.markerFrac<0.2) return "";
  const ser=D.series||{}, mf=D.incident.markerFrac;
  const recov=has(D.incident.recoverySec);
  const term=D.incident.trigger==="MANUAL"?"profile":"incident";
  const b1=Math.max(0.1,mf-0.1), ia=Math.max(0,mf-0.02);
  const metrics=[
    {l:"Tick rate",s:ser.tps,u:"tps",dec:1,bad:"down"},
    {l:"Tick interval",s:ser.mspt,u:"ms",dec:1,bad:"up"},
    {l:"Players",s:ser.players,u:"players",dec:0,bad:null},
    {l:"Entities",s:ser.entities,u:"entities",dec:0,bad:"up25warn"},

    {l:"Chunks loaded",s:ser.chunksLoaded,u:"/interval",dec:0,bad:null},
    {l:"Machine CPU",s:ser.cpu,u:"%",dec:1,bad:"up"},
    {l:"Heap",s:DV.heapG,u:"GiB",dec:1,bad:null},
    {l:"RSS",s:DV.rssG,u:"GB",dec:1,bad:null},
    {l:"Host memory",s:DV.hostMemG,u:"GB",dec:1,bad:"up"},
    {l:"Disk free",s:DV.diskG,u:"GB",dec:1,bad:"down"},
    {l:"Disk write",s:ser.diskWrite,u:"MB/s",dec:1,bad:"up"},
    {l:"Disk read",s:ser.diskRead,u:"MB/s",dec:1,bad:"up"},
    {l:"Net out",s:ser.netOut,u:"Mb/s",dec:1,bad:null},
    {l:"Net in",s:ser.netIn,u:"Mb/s",dec:1,bad:null},
    {l:"Threads",s:ser.threads,u:"threads",dec:0,bad:null},
    {l:"GC pause",s:ser.gcPause,u:"ms",dec:2,bad:"up"},

    {l:"Ping",s:ser.ping,u:"ms",dec:0,bad:"up"}
  ].filter(m=>m.s&&m.s.length>=10);
  if(metrics.length<3) return "";
  function cmpRow(l,base,inc,u,dec,bad){
    if(base==null||inc==null) return "";
    dec=autoDec(Math.min(base,inc),Math.max(base,inc),dec);
    let delta;
    if(Math.abs(base)<1e-9){
      delta='<span class="pct">·</span>';
    } else {
      const d=100*(inc-base)/Math.abs(base);
      let cls="pct";
      if(bad==="up25warn"){
        if(d>25) cls="v-warn";
      } else if(Math.abs(d)>=5&&bad){
        const isBad=(bad==="up"&&d>0)||(bad==="down"&&d<0);

      }
      delta=`<span class="${cls}">${d>0?"+":""}${Math.abs(d)>=100?d.toFixed(0):d.toFixed(1)}%</span>`;
    }
    return `<tr data-cmp="${esc(l)}" data-base="${base.toFixed(4)}" data-inc="${inc.toFixed(4)}"><td class="nm">${esc(l)}</td><td class="r">${base.toFixed(dec)} ${esc(u)}</td><td class="r">${inc.toFixed(dec)} ${esc(u)}</td><td class="r">${delta}</td></tr>`;
  }
  let rows=metrics.map(m=>cmpRow(m.l,sliceAvg(m.s,0,b1),sliceAvg(m.s,ia,1),m.u,m.dec,m.bad)).join("");
  if(Array.isArray(D.events)&&has(D.incident.windowSec)&&D.incident.windowSec>0){
    const wMin=D.incident.windowSec/60;
    const cnt=(a,b)=>D.events.reduce((s,e)=>{
      if(e[1]!=="error"||e[0]<a||e[0]>=b) return s;
      const m=/ ×(\d+)$/.exec(String(e[2]));
      return s+(m?+m[1]:1);
    },0);
    const bm=b1*wMin, im=(1-ia)*wMin;
    if(bm>0&&im>0) rows+=cmpRow("Log errors",cnt(0,b1)/bm,cnt(ia,1.0001)/im,"/min",1,"up");
  }
  if(Array.isArray(D.tickSeries)&&D.tickSeries.length){
    [...D.tickSeries]
      .map(ts=>({ts,avg:ts.series.reduce((a,v)=>a+v,0)/(ts.series.length||1)}))
      .sort((a,b)=>b.avg-a.avg).slice(0,3)
      .forEach(x=>{rows+=cmpRow(x.ts.name,sliceAvg(x.ts.series,0,b1),sliceAvg(x.ts.series,ia,1),"ms",1,"up");});
  }
  if(!rows) return "";
  return `<div class="card cmpwrap" id="cmpcard"><h3><span class="ic" style="color:var(--blue)">${I.clock}</span> Baseline vs ${term} window</h3>
    <div class="subnote">Average over the calm window vs the ${term} window. Calm: the first ${Math.round(b1*100)}% of the recording; ${term}: from just before the marker${recov?" through recovery":" to the end of the capture"}.</div>
    <div class="tscroll"><table><thead><tr>${thc("Metric","Series averaged over each window")}${thc("Baseline avg","Average over the calm window",{r:true})}${thc((term==="profile"?"Profile":"Incident")+" avg","Average from just before the "+term+(recov?" through recovery":" to the end of the capture"),{r:true})}${thc("Delta","Red when the change direction is bad for this metric; grey under ±5%.",{r:true})}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function diagnosisHtml(){
  const T=DV.samples, ser=D.series||{};
  const ev=[];
  const row=(html,link,label)=>ev.push(`<li><span class="fi" style="color:var(--warn)">${I.fire}</span><span>${html}${link?` <a class="evlink" href="${link}">${label} ↗</a>`:""}</span></li>`);
  if(DV.topWorld&&T) row(`<code>WorldThread - ${esc(DV.topWorld.name)}</code> produced <b>${pct(DV.topWorld.samples,T).toFixed(1)}%</b> of ${fmt(T)} CPU samples, the largest single consumer.`,"#cpu","CPU &amp; load");
  if(DV.topMethod&&T) row(`Top frame <code>${esc(leafName(DV.topMethod[1]))}</code> holds <b>${pct(DV.topMethod[0],T).toFixed(2)}%</b> of samples (${fmt(DV.topMethod[0])} hits).`,"#methods","hot methods");
  if(DV.stalled&&has(DV.stalled.samples)&&T) row(`The stalled world <code>${esc(worldLabel(DV.stalled.name))}</code> drew <b>${pct(DV.stalled.samples,T).toFixed(1)}%</b> of samples, #${DV.stalledRank} of ${DV.worlds.length} by CPU.`,"#worlds","worlds");
  if(D.gc) row(`${esc(DV.gcName||"GC")} ran <b>${D.gc.collections}</b> collections, longest pause <b>${D.gc.maxPauseMs} ms</b> (${D.gc.totalPauseMs} ms total).`,"#memory","memory &amp; GC");
  if(DV.deadlock!=null) row(DV.deadlock
    ? `<b>${DV.blocked}</b> thread(s) were BLOCKED at capture; inspect their stacks for a circular wait.`
    : `<b>0</b> threads BLOCKED at capture, so lock contention is unlikely.`,"#states","thread states");
  if(D.ram&&has(DV.memPct)) row(`Process RSS <b>${gb(D.ram.rssLast).toFixed(1)} GB</b> of ${gb(DV.memLimitBytes).toFixed(1)} GB ${DV.memBasis} (${DV.memPct.toFixed(0)}%)${D.heap&&has(D.heap.max)&&D.heap.max>0?`; heap peaked at <b>${gib(D.heap.peak).toFixed(1)}</b> of ${gib(D.heap.max).toFixed(1)} GiB`:""}.`,"#memory","memory &amp; GC");
  let exSpike=null;
  if(ser.exceptions&&ser.exceptions.length>=10){
    const arr=ser.exceptions, st=sstat(arr);
    let maxI=0; arr.forEach((v,i)=>{if(v>arr[maxI])maxI=i;});
    if(st.avg>0&&arr[maxI]>5*st.avg&&maxI>=Math.floor(arr.length*0.9)) exSpike={v:arr[maxI],avg:st.avg};
  }
  if(exSpike) row(`<b>${fmt(exSpike.v)}</b> exceptions/interval right before the incident, <b>${(exSpike.v/exSpike.avg).toFixed(0)}×</b> the window average of ${exSpike.avg.toFixed(1)}.`,"#metrics","key metrics");
  const allocLead=(D.alloc&&D.alloc.bySubsystem&&D.alloc.bySubsystem.length&&!String(D.alloc.bySubsystem[0][0]).startsWith("Other"))?D.alloc.bySubsystem[0]:null;
  if(allocLead) row(`<b>${esc(allocLead[0])}</b> leads allocation pressure at <b>${fmtBytes(allocLead[1])}</b> sampled.`,"#memory","allocation");
  const cRisk=containerRisk();
  if(cRisk) row(`Heap -Xmx <b>${gib(cRisk.xmx).toFixed(1)} GiB</b> is at or above the container memory limit of <b>${gib(cRisk.lim).toFixed(1)} GiB</b>; the JVM can be OOM-killed before GC reacts.`,"#system","system");
  const incompatN=(D.plugins||[]).filter(p=>p&&p[5]==="INCOMPATIBLE").length;
  if(incompatN) row(`<b>${incompatN}</b> installed mod${incompatN===1?" declares":"s declare"} a server version range that excludes the running server.`,"#plugins","plugins");
  const cmp=comparisonHtml();
  if(ev.length<2) return cmp;

  let cause="Inconclusive · review recording.jfr in JDK Mission Control";
  if(DV.topWorld&&DV.machBound===true&&!DV.lowLoad) cause=`Single-thread tick saturation (${worldLabel(DV.topWorld.name)})`;
  else if(DV.machBound===false) cause="Host-wide CPU saturation";

  const sig=[];
  if(DV.topWorld&&T) sig.push({ok:!DV.lowLoad&&pct(DV.topWorld.samples,T)>=25,label:"world-thread dominance"});
  if(DV.topMethod&&T) sig.push({ok:pct(DV.topMethod[0],T)>=2,label:"hot-method share"});
  if(DV.gcHealthy!=null) sig.push({ok:DV.gcHealthy===true,label:"GC ruled out"});
  if(ser.exceptions) sig.push({ok:!!exSpike,label:"exception spike near the incident"});
  if(DV.machBound!=null) sig.push({ok:DV.machBound===true,label:"machine CPU headroom"});
  const okN=sig.filter(s=>s.ok).length;
  const conf=okN>=4?"high":okN>=2?"medium":"low";
  const confTip=sig.map(s=>(s.ok?"✓ ":"✗ ")+s.label).join("; ");

  const steps=[];
  if(DV.deadlock) steps.push(`Resolve the deadlock: ${DV.blocked} blocked threads (<a href="#states">thread states</a>)`);
  if(DV.topWorld) steps.push(`Profile <code>WorldThread - ${esc(DV.topWorld.name)}</code> in JDK Mission Control (recording.jfr in this bundle)`);
  const topSub=(D.subsystems||[]).find(x=>!String(x[0]).startsWith("Other"));
  if(topSub&&T) steps.push(`Review the ${esc(topSub[0])} hot path: ${fmt(topSub[1])} samples, ${pct(topSub[1],T).toFixed(1)}% of CPU (<a href="#methods">hot methods</a>)`);
  if(MIXCONF.list&&MIXCONF.list.length) steps.push(`Inspect the ${MIXCONF.list.length} class${MIXCONF.list.length===1?"":"es"} patched by multiple mixin configs (<a href="#config">mixins</a>)`);
  if(exSpike) steps.push(`Trace the exception burst in the <a href="#log">server log</a> tail`);
  const stepHtml=steps.slice(0,3).map(s=>`<li>${s}</li>`).join("");

  const intro=has(D.incident.stallMs)&&D.incident.worldShort
    ? `<code>${esc(D.incident.trigger)}</code> fired after <b>${esc(D.incident.worldShort)}</b> missed its heartbeat by <b>${fmt(D.incident.stallMs)} ms</b>. Every line below is computed from this bundle's recording.`
    : `<code>${esc(D.incident.trigger)}</code> fired at ${esc(D.incident.created)}. Every line below is computed from this bundle's recording.`;
  const left=`<div class="card glow"><h3><span class="ic">${I.warn}</span> Evidence</h3>
    <div class="diagtext">${intro}</div>
    <ul class="findings">${ev.join("")}</ul></div>`;

  const vrows=[];
  vrows.push(`<div class="vrow"><span class="vk">Severity</span><span class="vv ${sevClass}">${esc(D.incident.severity)}</span></div>`);
  vrows.push(`<div class="vrow"><span class="vk">Likely cause</span><span class="vv">${esc(cause)}</span></div>`);
  vrows.push(`<div class="vrow"><span class="vk">Confidence</span><span class="vv"><span class="tag ${conf==="high"?"ok":(conf==="low"?"no":"")}" data-confidence data-tip="${esc(confTip)}">confidence: ${conf} · ${okN}/${sig.length} signals</span></span></div>`);
  const tags=[];
  if(DV.gcHealthy!=null) tags.push(`<span class="tag ${DV.gcHealthy?'ok':'no'}">GC: ${DV.gcHealthy?'nominal':'elevated'}</span>`);
  if(DV.deadlock!=null) tags.push(`<span class="tag ${DV.deadlock?'no':'ok'}">${DV.deadlock?'blocked threads':'no deadlock'}</span>`);
  const right=`<div class="card"><h3><span class="ic" style="color:var(--blue)">${I.pulse}</span> Verdict</h3>
    <div class="verdict">${vrows.join("")}</div>
    ${stepHtml?`<div style="margin-top:14px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)">Next steps</div><ol class="nextsteps">${stepHtml}</ol>`:""}
    ${tags.length?`<div class="tagrow" style="margin-top:12px">${tags.join("")}</div>`:""}</div>`;
  return `<div class="diag">${left}${right}</div>`+cmp;
}

function statsInner(o){
  const d=autoDec(o.min,o.max,o.dec), f=v=>Number(v).toFixed(d);
  const parts=[];
  if(has(o.now)) parts.push(`<span class="mnow" data-stat="now">${o.nowLabel||"now"} <b${o.nowCls?` class="${o.nowCls}"`:""}>${f(o.now)}</b>${o.nowSuffix||""}</span>`);
  parts.push(`<span data-stat="min">min <b${o.minCls?` class="${o.minCls}"`:""}>${f(o.min)}</b></span>`);
  parts.push(`<span data-stat="avg">avg <b>${f(o.avg)}</b></span>`);
  parts.push(`<span data-stat="max">max <b${o.maxCls?` class="${o.maxCls}"`:""}>${f(o.max)}</b></span>`);
  let out=parts.join('<span class="msep">·</span>');
  if(o.unitLabel) out+=` <span class="munit">${esc(o.unitLabel)}</span>`;
  if(o.extra) out+=`<span class="msep">·</span>${o.extra}`;
  return out;
}

      +`<span class="evcount"></span>${(has(D.eventsHidden)&&D.eventsHidden>0)?`<span class="evmore" data-tip="${D.eventsHidden} earlier event${D.eventsHidden===1?"":"s"} exceeded the on-chart cap and are not shown">+${D.eventsHidden} earlier</span>`:""}</span>`);

function metricsHtml(){
  const ser=D.series||{};
  const cards=[];
  const flatZero=[];
  const allZero=s=>Array.isArray(s)&&s.length>0&&s.every(v=>v===0);
  const tickWhy=D.tps?(D.incident.world&&D.incident.world!==D.tps.world
    ?` Shown for ${worldLabel(D.tps.world)}, the busiest world by CPU samples; the incident world has no tick series.`
    :` Shown for the incident world.`):"";
  const card=(ic,title,tip,series,chartOpts,statBuilder)=>{
    const chart=lineChart(series,Object.assign({h:170,times:DV.span,marker:DV.incMarker},chartOpts));
    const cid="ch"+CHART_ID;
    const html0=statBuilder(series,false);
    CHARTS[cid].mkStats=statBuilder; CHARTS[cid].statHtml0=html0;
    const hint=(chartOpts&&chartOpts.gcIdx&&Array.isArray(D.gcOverlap)&&D.gcOverlap.length)?`<span class="gchint gctog" data-gctog data-tip="toggle the amber GC-overlap highlight">amber = GC overlap</span>`:"";
    cards.push(`<div class="chartcard mcard"><div class="cth"><span class="ctt"${tip?` data-tip="${esc(tip)}"`:""}><span class="cic">${ic}</span>${title}</span><span class="mstats" data-stats="${cid}">${html0}</span>${hint}</div>${chart}</div>`);
  };

  if(ser.mspt){
    const sw=DV.stalled;
    const swPct=(sw&&(has(sw.msptP95)||has(sw.msptMax)))
      ?` Stalled world ${worldLabel(sw.name)}: ${[has(sw.msptP95)?"p95 "+sw.msptP95.toFixed(1)+" ms":null,has(sw.msptMax)?"max "+sw.msptMax.toFixed(1)+" ms":null].filter(Boolean).join(", ")}.`:"";
    const tw=D.tps?(D.worlds||[]).find(w=>w.name===D.tps.world):null;
    card(I.bolt,`Tick interval${D.tps?` · ${esc(worldLabel(D.tps.world))}`:""}`,
      `Milliseconds per tick${has(D.incident.stallMs)?"; the spike at the marker is the triggering stall":""}. Amber pieces overlap a GC pause.${tickWhy}${swPct}`,

        const ex=[];
        if(!z&&tw&&has(tw.msptMax)&&tw.msptMax>st.max) ex.push(`<span data-stat="worst" data-tip="Worst single tick in the window. The chart averages ticks per bucket, so single-tick spikes flatten out.">worst tick <b>${tw.msptMax.toFixed(1)} ms</b></span>`);
        if(stall) ex.push(`<span data-stat="stall">stall <b class="v-warn">${fmt(D.incident.stallMs)} ms</b></span>`);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,max:st.max,dec:1,unitLabel:"ms",

  }

      ser.tps,{color:"#5bd68b",unit:" tps",decimals:1,max:target},
      (s,z)=>{const st=sstat(s);
        const min=(!z&&D.tps&&has(D.tps.min))?D.tps.min:st.min;
        const avg=(!z&&D.tps&&has(D.tps.avg))?D.tps.avg:st.avg;

  if(allZero(ser.players)) flatZero.push("Players online");
  else if(ser.players){

      (s,z)=>{const st=sstat(s);

  }

  else if(ser.entities){

  if(ser.chunksLoaded&&!allZero(ser.chunksLoaded)) churnLines.push({name:"loaded",kind:"count",series:ser.chunksLoaded,color:"#6ba9e0",dec:0});

  else if(ser.chunksGenerated||ser.chunksLoaded) flatZero.push("Chunk churn");

  } else if(ser.cpu){

      ser.cpu,{color:"#62a8ea",unit:"%",decimals:1},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,

  }
  if(DV.heapG){
    const mx=(D.heap&&has(D.heap.max)&&D.heap.max>0)?gib(D.heap.max):null;
    card(I.heap,"Heap used",`Heap usage over the window${mx?` against the ${mx.toFixed(1)} GiB maximum`:""}; the sawtooth is allocate-then-collect.`,
      DV.heapG,{color:"#e6b34a",unit:" GiB",decimals:1,max:mx},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:(!z&&D.heap)?gib(D.heap.floor):st.min,

  }

      DV.rssG,{color:"#d98b6a",unit:" GB",decimals:1},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,
          max:(!z&&D.ram)?gb(D.ram.rssPeak):st.max,dec:1,unitLabel:"GB"});});
  }
  if(DV.hostMemG){
    const memTot=(D.sys&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)?gb(D.sys.ramTotal):null;
    const memLast=DV.hostMemG[DV.hostMemG.length-1];
    card(I.ram,"Host memory",`Physical memory in use on the whole host, all processes${memTot?`. Currently ${memLast.toFixed(1)} of ${memTot.toFixed(1)} GB (${(100*memLast/memTot).toFixed(0)}%)`:""}.`,
      DV.hostMemG,{color:"#cc8bd1",unit:" GB",decimals:1},

      DV.diskG,{color:"#8a93d8",unit:" GB",decimals:1},
      (s,z)=>{const st=sstat(s);

    if(allZero(ser.diskRead)) flatZero.push("Disk read");

    if(lines.length) groupedCard("Disk I/O",lines,""," MB/s",cards,null,I.disk);

  if(allZero(ser.netOut)) flatZero.push("Network out");
  else if(ser.netOut){
    card(I.net,`Network out${D.net?` · ${esc(D.net.iface)}`:""}`,
      `Outbound throughput (jdk.NetworkUtilization, host-wide per interface)${(D.net&&has(D.net.inAvg))?`. Inbound averaged ${D.net.inAvg.toFixed(1)} Mb/s`:""}.`,
      ser.netOut,{color:"#a98be0",unit:" Mb/s",decimals:1},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,
          avg:(!z&&D.net)?D.net.outAvg:st.avg,max:(!z&&D.net)?D.net.outPeak:st.max,dec:1,unitLabel:"Mb/s"});});
  }
  if(ser.threads){
    card(I.threads,"Live threads",
      D.threadStates?`JVM thread count. At capture: ${Object.entries(D.threadStates).map(([k,v])=>v+" "+k.toLowerCase().replace("_"," ")).join(", ")}.`:"JVM thread count over the window.",
      ser.threads,{color:"#62a8ea",unit:"",decimals:0},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:(!z&&has(D.threadTotal))?D.threadTotal:s[s.length-1],
          min:st.min,avg:st.avg,max:st.max,dec:0,unitLabel:"threads"});});
  }
  if(allZero(ser.gcPause)) flatZero.push("GC pause");
  else if(ser.gcPause){
    card(I.gc,"GC pause",`Longest stop-the-world pause per interval${D.gc?` across ${D.gc.collections} collections (${D.gc.totalPauseMs}ms total)`:""}. Anything under ~50ms is healthy.`,
      ser.gcPause,{color:"#5bd68b",unit:" ms",decimals:2},
      (s,z)=>{const st=sstat(s);
        return statsInner({now:s[s.length-1],min:st.min,avg:st.avg,
          max:(!z&&D.gc)?D.gc.maxPauseMs:st.max,dec:2,unitLabel:"ms",maxCls:DV.gcHealthy===false?"v-warn":null});});
  }
  if(allZero(ser.exceptions)) flatZero.push("Exceptions");
  else if(ser.exceptions){
    card(I.warn,"Exceptions thrown","Exceptions per interval. A spike near the incident points at the failing subsystem or mod.",
      ser.exceptions,{color:"#ef7aa5",unit:"/interval",decimals:0},
      (s,z)=>{const st=sstat(s);const tot=s.reduce((a,v)=>a+v,0);
        return statsInner({now:tot,nowLabel:"total",min:st.min,avg:st.avg,max:st.max,dec:0,unitLabel:"/interval",
          maxCls:(st.avg>0&&st.max>5*st.avg)?"v-warn":null});});
  }

  const facts=[];
  if(DV.win) facts.push(`<span class="pill">${I.clock} window <b>${DV.win}</b></span>`);
  if(DV.samples) facts.push(`<span class="pill">${I.fire} <b>${fmt(DV.samples)}</b> execution samples</span>`);
  if(has(D.incident.players)&&!ser.players) facts.push(`<span class="pill">${I.players} <b>${D.incident.players}</b> players at capture</span>`);
  if(has(D.threadTotal)&&!ser.threads) facts.push(`<span class="pill">${I.threads} <b>${D.threadTotal}</b> live threads</span>`);
  if(D.gc&&!ser.gcPause) facts.push(`<span class="pill">${I.gc} max GC pause <b>${D.gc.maxPauseMs} ms</b></span>`);
  if(D.gc&&has(D.gc.totalPauseMs)&&has(D.incident.windowSec)&&D.incident.windowSec>0) facts.push(`<span class="pill">${I.gc} GC overhead <b>${(100*D.gc.totalPauseMs/(D.incident.windowSec*1000)).toFixed(1)}%</b></span>`);
  if(D.sys&&has(D.sys.cpuStealPct)&&D.sys.cpuStealPct>=5) facts.push(`<span class="pill">${I.cpu} CPU steal <b>${D.sys.cpuStealPct.toFixed(1)}%</b></span>`);
  if(D.sys&&has(D.sys.cpuIowaitPct)&&D.sys.cpuIowaitPct>=5) facts.push(`<span class="pill">${I.cpu} CPU iowait <b>${D.sys.cpuIowaitPct.toFixed(1)}%</b></span>`);
  if(D.sys&&has(D.sys.oomKills)&&D.sys.oomKills>0) facts.push(`<span class="pill">${I.warn} OOM kills <b>${D.sys.oomKills}</b></span>`);
  if(D.sys&&has(D.sys.cpuUsageCores)&&D.sys.container&&has(D.sys.container.cpuLimit)&&D.sys.container.cpuLimit>0&&has(D.sys.cpuCores)&&D.sys.container.cpuLimit<D.sys.cpuCores&&(100*D.sys.cpuUsageCores/D.sys.container.cpuLimit)>=80) facts.push(`<span class="pill">${I.cpu} Container CPU <b>${(100*D.sys.cpuUsageCores/D.sys.container.cpuLimit).toFixed(0)}% of limit</b></span>`);
  if(D.sys&&((has(D.sys.psiCpu)&&D.sys.psiCpu>=10)||(has(D.sys.psiIo)&&D.sys.psiIo>=10)||(has(D.sys.psiMem)&&D.sys.psiMem>=10))) facts.push(`<span class="pill">${I.warn} PSI stall <b>cpu ${(D.sys.psiCpu||0).toFixed(0)}% · io ${(D.sys.psiIo||0).toFixed(0)}% · mem ${(D.sys.psiMem||0).toFixed(0)}%</b></span>`);

  if(!cards.length&&!facts.length&&!flatZero.length) return "";
  return (facts.length?`<div class="factstrip">${facts.join("")}</div>`:"")
    +(cards.length?legendHtml()+`<div class="mgrid">${cards.join("")}</div>`:"")
    +(flatZero.length?`<div class="subnote" style="margin-top:14px">Flat at zero for the whole window (charts hidden): ${flatZero.map(esc).join(", ")}.</div>`:"");
}

function lineStatText(slice,kind,dec){
  const st=sstat(slice), f=v=>Number(v).toFixed(autoDec(st.min,st.max,dec));
  const tot=kind==="count"?slice.reduce((a,v)=>a+v,0):null;
  return `${tot!=null?`total ${fmt(Math.round(tot))} · `:""}min ${f(st.min)} · avg ${f(st.avg)} · max ${f(st.max)}`;
}
function groupedCard(title,lines,kindChip,unit,cards,extra,icon){
  const single=lines.length===1;
  const chart=single
    ? lineChart(lines[0].series,Object.assign({h:170,color:lines[0].color,unit,decimals:lines[0].dec,times:DV.span,marker:DV.incMarker},extra||{}))
    : lineChart(null,Object.assign({h:170,unit,decimals:1,times:DV.span,marker:DV.incMarker,multi:lines},extra||{}));
  const cid="ch"+CHART_ID;
  const off=()=>CHARTS[cid].lineOff||new Set();
  const sliceL=(a,b)=>lines.map(l=>{const Nn=l.series.length;
    let j0=Math.max(0,Math.floor(a*(Nn-1))), j1=Math.min(Nn-1,Math.ceil(b*(Nn-1)));
    if(j1<=j0) j1=Math.min(Nn-1,j0+1);
    return l.series.slice(j0,j1+1);});
  const stripHtml=slices=>{
    if(lines.length>2) return "";
    return lines.map((l,k)=>off().has(k)?"":`<span class="pml"><b style="color:${l.color}">${esc(l.name)}</b> ${lineStatText(slices[k],l.kind,l.dec)}</span>`)
      .filter(Boolean).join('<span class="msep">·</span>');
  };
  const tipFor=(slices,k)=>`${lines[k].name}: ${lineStatText(slices[k],lines[k].kind,lines[k].dec)}`;
  const slices0=lines.map(l=>l.series);
  let strip0;
  if(single){
    const l=lines[0];
    const sb=s=>{const st=sstat(s);
      const oo={min:st.min,avg:st.avg,max:st.max,dec:l.dec,unitLabel:unit.trim()||null};
      if(l.kind==="count"){oo.now=s.reduce((a,v)=>a+v,0);oo.nowLabel="total";} else oo.now=s[s.length-1];
      return statsInner(oo);};
    strip0=sb(l.series);
    CHARTS[cid].mkStats=sb; CHARTS[cid].statHtml0=strip0;
  } else {
    strip0=stripHtml(slices0);
    CHARTS[cid].pmUpdate=()=>{
      const slices=ZOOM?sliceL(ZOOM.a,ZOOM.b):slices0;
      const stripEl=document.querySelector(`.mstats[data-stats="${cid}"]`);
      if(stripEl) stripEl.innerHTML=stripHtml(slices);
      lines.forEach((l,k)=>{const chip=document.querySelector(`[data-pml="${cid}:${k}"]`);
        if(chip) chip.setAttribute("data-tip",tipFor(slices,k));});
    };
  }
  const legend=single?"":`<div class="pmlegend">${lines.map((l,k)=>`<span class="pmlg" data-pml="${cid}:${k}" data-tip="${esc(tipFor(slices0,k))}"><span class="edot" style="background:${l.color}"></span>${esc(l.name)}</span>`).join(" ")}</div>`;
  cards.push(`<div class="chartcard mcard"><div class="cth"><span class="ctt"><span class="cic">${icon||I.pulse}</span>${esc(title)}${kindChip?` <span class="st NEUTRAL" style="margin-left:7px">${kindChip}</span>`:""}</span><span class="mstats" data-stats="${cid}">${strip0}</span></div>${legend}${chart}</div>`);
}
const CARD_PAL=["#46cfc0","#62a8ea","#a98be0","#ef7aa5","#5bd68b","#e6b34a","#d98b6a","#8a93d8"];

function pluginMetricsHtml(){
  const pm=(D.pluginMetrics||[]).filter(m=>m&&m.name&&m.series&&m.series.length>=2);
  if(!pm.length) return "";
  const order=[], bySys=new Map();
  pm.forEach(m=>{const sys=String(m.name).split(" ")[0]||String(m.name);
    if(!bySys.has(sys)){bySys.set(sys,[]);order.push(sys);}
    bySys.get(sys).push(m);});
  const scaleOf=m=>{let mx=0;for(const v of m.series){const a=Math.abs(v);if(a>mx)mx=a;}return mx;};
  const compatible=ms=>{const sc=ms.map(scaleOf).filter(s=>s>0);return sc.length<=1||Math.max(...sc)<=20*Math.min(...sc);};
  const decOf=s=>s.some(v=>Math.abs(v-Math.round(v))>1e-9)?1:0;
  const cards=[];
  const mkCard=(title,metrics)=>{
    const sysName=title.split(" (")[0];
    const lines=metrics.map((m,k)=>({
      name:String(m.name).startsWith(sysName+" ")?String(m.name).slice(sysName.length+1):String(m.name),
      kind:m.kind==="count"?"count":"gauge",series:m.series,color:CARD_PAL[k%CARD_PAL.length],dec:decOf(m.series)}));
    const kinds=[...new Set(lines.map(l=>l.kind))];
    const kindChip=kinds.length>1?"count + gauge":(kinds[0]==="count"?"count/interval":"gauge");
    groupedCard(title,lines,kindChip,"",cards);
  };
  order.forEach(sys=>{
    const ms=bySys.get(sys);
    if(ms.length===1){mkCard(String(ms[0].name),ms);return;}
    if(compatible(ms)){mkCard(sys,ms);return;}
    const counts=ms.filter(m=>m.kind==="count"), gauges=ms.filter(m=>m.kind!=="count");
    if(counts.length&&gauges.length){
      mkCard(sys+" (counts)",counts);
      mkCard(sys+" (gauges)",gauges);
    } else mkCard(sys,ms);
  });
  if(!cards.length) return "";
  return `<p class="lead">Numeric series reported by installed plugins through the Hybox API, on the same time axis as every other chart.</p>${legendHtml()}<div class="mgrid">${cards.join("")}</div>`;
}

function engineHtml(){
  const ts=(D.tickSystems||[]).filter(r=>r&&r.length>=6);
  const series=(D.tickSeries||[]).filter(s=>s&&s.name&&s.series&&s.series.length>=2);
  if(!ts.length&&!series.length){
    return "";
  }
  const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
  const parts=[];
  if(series.length){
    const byWorld=new Map(), order=[];
    series.forEach(s=>{
      const at=String(s.name).lastIndexOf(" @ ");
      const world=at>=0?String(s.name).slice(at+3):"(unknown world)";
      const sys=at>=0?String(s.name).slice(0,at):String(s.name);
      if(!byWorld.has(world)){byWorld.set(world,[]);order.push(world);}
      byWorld.get(world).push({sys,series:s.series});
    });
    const cards=[];
    order.forEach(world=>{
      let ms=byWorld.get(world);
      if(ms.length>6){
        ms=[...ms].sort((a,b)=>sstat(b.series).avg-sstat(a.series).avg).slice(0,6);
      }
      const lines=ms.map((m,k)=>({name:m.sys,kind:"gauge",series:m.series,color:CARD_PAL[k%CARD_PAL.length],dec:1}));
      groupedCard(worldLabel(world),lines,"ms per tick"," ms",cards,{gcIdx:true});
    });
    parts.push(`<div class="mgrid">${cards.join("")}</div>`);
  }
  if(ts.length){
    const sorted=[...ts].sort((a,b)=>b[2]-a[2]);
    const rows=sorted.map(r=>{
      const [sys,world,avg1,max1,avg5,max5]=r;
      const pctB=100*avg1/BUDGET;
      const cls=pctB>100?"v-bad":(pctB>50?"v-warn":"pct");
      const barCol=pctB>100?"var(--bad)":(pctB>50?"var(--warn)":"var(--good)");
      return `<tr><td class="nm"><span class="tnc2" style="max-width:280px" data-tipov="${esc(sys)}">${esc(sys)}</span></td><td class="pkg" data-sval="${esc(world)}"><span class="tnc2" style="max-width:170px" data-tipov="${esc(world)}">${esc(worldLabel(world))}</span></td><td class="r" data-num="${avg1}">${Number(avg1).toFixed(2)}</td><td class="r" data-num="${max1}">${Number(max1).toFixed(2)}</td><td class="r" data-num="${avg5}">${Number(avg5).toFixed(2)}</td><td class="r" data-num="${max5}">${Number(max5).toFixed(2)}</td><td class="r" data-num="${pctB.toFixed(2)}"><span class="bbar"><i style="width:${Math.min(100,pctB).toFixed(0)}%;background:${barCol}"></i></span><span class="${cls}">${pctB.toFixed(1)}%</span></td></tr>`;
    }).join("");
    parts.push(`<div class="tscroll" style="margin-top:${series.length?"16px":"0"}"><div class="tcap"><table class="sortable" id="es-t"><thead><tr>${thc("System","Engine ECS system",{sort:"text"})}${thc("World","World whose Store ticks this system",{sort:"text"})}${thc("avg 1m","Average tick cost, last minute (ms)",{sort:"num",r:true,def:"desc"})}${thc("max 1m","Worst tick, last minute (ms)",{sort:"num",r:true})}${thc("avg 5m","Average tick cost, last 5 minutes (ms)",{sort:"num",r:true})}${thc("max 5m","Worst tick, last 5 minutes (ms)",{sort:"num",r:true})}${thc("% of budget","Share of the "+BUDGET.toFixed(1)+" ms tick budget (avg 1m)",{sort:"num",r:true})}</tr></thead><tbody>${rows}</tbody></table></div></div>`);
  }
  if(D.tickSystemsNote) parts.push(`<div class="subnote" id="tsnote" style="margin-top:10px">${esc(D.tickSystemsNote)}</div>`);
  const lead=`<p class="lead">Per-system tick wall time, measured by the engine itself for every system tick. This is exact time, not sampling: a system blocking on locks or IO shows its full cost here even when CPU profiling misses it.</p>`;
  return lead+(series.length?legendHtml(true):"")+parts.join("");
}

function flameHtml(){
  if(!D.flame||!Array.isArray(D.flame)||!Array.isArray(D.flame[2])||!D.flame[2].length) return "";
  const sw=(o,c,l)=>`<span class="flg flgtog" data-own="${o}" data-tip="show or hide ${l} frames"><span class="fsw" style="background:${c}"></span>${l}</span>`;
  return `<p class="lead">Every execution sample's full stack, grouped by thread at the top level. Width is sample share, depth is the call path.</p>
  <div class="flamebar"><span class="srch"><span class="si">${I.search}</span><input id="flamefilter" placeholder="filter frames…"></span><span class="flamelg">${sw(1,"hsl(205,54%,46%)","engine")}${sw(2,"hsl(33,80%,50%)","mod")}${sw(3,"hsl(220,5%,46%)","JDK")}</span><span class="fcrumb" id="flamecrumb" style="display:none"></span><span class="fnote" id="flamenote"></span></div>
  <canvas id="flamecv" class="bbtipcv" height="520"></canvas>`;
}
function initFlame(){
  const cv=$("#flamecv"); if(!cv||!D.flame) return;
  const ROW=18, AROW=10, MAXH=520;
  const parse=n=>({name:String(n[0]),samples:n[1],children:(n[2]||[]).map(parse),owner:n[3]|0});
  const root=parse(D.flame);
  let path=[root];
  let filter="";
  let cells=[];
  const ownOff={};
  const hue=name=>{
    const cls=String(name).split(".")[0]||String(name);
    let h=0; for(let i=0;i<cls.length;i++) h=(h*31+cls.charCodeAt(i))>>>0;
    return h%360;
  };
  const OWNER_HUE={0:265,1:205,2:33,3:220}, OWNER_SAT={0:16,1:54,2:80,3:5};
  const colorOf=(node,anc)=>{
    const o=node.owner|0, j=hue(node.name)%24-12;
    const s=anc?Math.max(8,OWNER_SAT[o]-20):OWNER_SAT[o];
    const l=anc?34:(o===0?30:(o===2?50:46));
    return `hsl(${OWNER_HUE[o]+j},${s}%,${l}%)`;
  };
  function render(){
    const cssW=cv.clientWidth||(cv.parentElement?cv.parentElement.clientWidth:0); if(!cssW) return;
    const dpr=devicePixelRatio||1;
    const cur=path[path.length-1];
    let depth=0;
    (function dd(n,d){const hid=d>0&&!!ownOff[n.owner];if(!hid&&d>depth)depth=d;const cd=hid?d:d+1;if(cd<64)n.children.forEach(c=>dd(c,cd));})(cur,0);
    const ancRows=path.length-1;
    const availRows=Math.max(3,Math.floor((MAXH-ancRows*AROW)/ROW));
    const shownDepth=Math.min(depth+1,availRows);
    const cut=depth+1-shownDepth;
    const cssH=ancRows*AROW+shownDepth*ROW;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.font="10px ui-monospace,Menlo,monospace"; ctx.textBaseline="middle";
    cells=[];
    for(let a=0;a<ancRows;a++){
      const nd=path[a], y=a*AROW;
      ctx.globalAlpha=.55; ctx.fillStyle=colorOf(nd,true);
      ctx.fillRect(0,y,cssW,AROW-1); ctx.globalAlpha=1;
      cells.push({x:0,y,w:cssW,h:AROW-1,node:nd,kind:"anc",pathIdx:a});
    }
    const y0=ancRows*AROW;
    const matches=n=>filter&&String(n.name).toLowerCase().includes(filter);
    const draw=(n,x,w,d)=>{
      if(d>=shownDepth||w<1) return;
      const y=y0+d*ROW;
      const hidden=d>0&&!!ownOff[n.owner];
      if(!hidden){
        const dim=filter&&!matches(n);
        ctx.globalAlpha=dim?.22:1;
        ctx.fillStyle=colorOf(n,false);
        ctx.fillRect(x,y,Math.max(w-0.6,0.4),ROW-1);
        if(w>40){
          ctx.fillStyle=dim?"rgba(214,218,226,.4)":"rgba(10,11,14,.85)";
          ctx.save();ctx.beginPath();ctx.rect(x+3,y,w-6,ROW);ctx.clip();
          ctx.fillText(String(n.name),x+4,y+ROW/2);
          ctx.restore();
        }
        ctx.globalAlpha=1;
        cells.push({x,y,w,h:ROW-1,node:n,kind:"cell"});
      }
      const cd=hidden?d:d+1;
      let cx=x, childSum=0;
      n.children.forEach(c=>{childSum+=c.samples;});
      n.children.forEach(c=>{
        const cw=w*c.samples/(n.samples||1);
        draw(c,cx,cw,cd);
        cx+=cw;
      });
      const gapN=n.samples-childSum;
      if(n.children.length&&gapN>0&&!hidden&&cd<shownDepth){
        const gw=w*gapN/(n.samples||1);
        if(gw>=1){
          const gy=y0+cd*ROW;
          ctx.globalAlpha=.06; ctx.fillStyle="#ffffff";
          ctx.fillRect(cx,gy,Math.max(gw-0.6,0.4),ROW-1); ctx.globalAlpha=1;
          cells.push({x:cx,y:gy,w:gw,h:ROW-1,node:null,kind:"gap",gapN});
        }
      }
    };
    draw(cur,0,cssW,0);
    const note=$("#flamenote");
    if(note) note.textContent=cut>0?`+${cut} deeper level${cut===1?"":"s"}`:"";
    const crumb=$("#flamecrumb");
    if(crumb){
      if(path.length>1){crumb.style.display="";crumb.textContent="⟲ "+cur.name+" · reset";}
      else crumb.style.display="none";
    }
    if(typeof markThreadGroup==="function") markThreadGroup(path.length>=2?path[1].name:null);
  }
  function cellAt(mx,my){
    for(let i=cells.length-1;i>=0;i--){
      const c=cells[i];
      if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) return c;
    }
    return null;
  }
  cv.addEventListener("mousemove",e=>{
    const r=cv.getBoundingClientRect();
    const c=cellAt(e.clientX-r.left,e.clientY-r.top);
    if(!c){hideTip();cv.style.cursor="default";return;}
    cv.style.cursor="pointer";
    let txt;
    if(c.kind==="gap") txt=`pruned frames (${fmt(c.gapN)} samples)`;
    else txt=`${c.node.name} · ${fmt(c.node.samples)} samples · ${pct(c.node.samples,root.samples||1).toFixed(2)}% of total · ${pct(c.node.samples,path[path.length-1].samples||1).toFixed(1)}% of view`;
    TIP.textContent=txt; TIP.style.display="block";
    const tw=TIP.offsetWidth, th=TIP.offsetHeight, m=8;
    let x=e.clientX+12; if(x+tw>innerWidth-m)x=e.clientX-tw-12;
    let y=e.clientY+16; if(y+th>innerHeight-m)y=e.clientY-th-12;
    TIP.style.left=Math.max(m,x)+"px"; TIP.style.top=Math.max(m,y)+"px";
  });
  cv.addEventListener("mouseleave",()=>hideTip());
  function findPath(target,node,acc){
    if(node===target) return acc.concat(node);
    for(const c of node.children){const r=findPath(target,c,acc.concat(node));if(r)return r;}
    return null;
  }
  function zoomTo(node){
    const p=findPath(node,root,[]);
    if(p){path=p;render();cv.scrollIntoView({block:"nearest"});}
  }
  function jumpToBest(){
    let best=null;
    (function walk(n){if(String(n.name).toLowerCase().includes(filter)&&(!best||n.samples>best.samples))best=n;n.children.forEach(walk);})(root);
    if(best) zoomTo(best);
  }
  cv.addEventListener("click",e=>{
    const r=cv.getBoundingClientRect();
    const c=cellAt(e.clientX-r.left,e.clientY-r.top);
    if(!c||!c.node) return;
    if(c.kind==="anc"){path=path.slice(0,c.pathIdx+1);render();return;}
    if(c.node!==path[path.length-1]) zoomTo(c.node);
  });
  const fin=$("#flamefilter");
  function resetFlame(){ path=[root]; filter=""; if(fin) fin.value=""; render(); }
  cv.addEventListener("dblclick",resetFlame);
  const crumbEl=$("#flamecrumb");
  if(crumbEl) crumbEl.addEventListener("click",resetFlame);
  if(fin){
    let fTimer=null;

function initThreadTimeline(){
  const cv=$("#ttcanvas"); if(!cv||!D.threadTimeline||!D.threadTimeline.length) return;
  const tt=D.threadTimeline, ROWH=14;
  const SCOL={1:"#5bd68b",2:"#62a8ea",3:"#a98be0",4:"#f0626b"};
  const SNAME={0:"no samples",1:"RUNNABLE",2:"WAITING",3:"TIMED_WAITING",4:"BLOCKED"};
  let geo=null;
  function render(){
    const holder=cv.parentElement;
    const cssW=holder?holder.clientWidth-16:0; if(cssW<=0) return;
    const cssH=tt.length*ROWH;
    const dpr=devicePixelRatio||1;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const N=tt[0].states.length;
    const za=ZOOM?ZOOM.a:0, zb=ZOOM?ZOOM.b:1;
    let i0=Math.max(0,Math.floor(za*(N-1))), i1=Math.min(N-1,Math.ceil(zb*(N-1)));
    if(i1<=i0) i1=Math.min(N-1,i0+1);
    const n=i1-i0+1, cw=cssW/n;
    tt.forEach((t,r)=>{
      const y=r*ROWH;
      for(let i=0;i<n;i++){
        const s=t.states[i0+i];
        if(!s) continue;
        ctx.fillStyle=SCOL[s]||"#9aa1ad";
        ctx.fillRect(i*cw,y+1,Math.max(cw-0.4,0.5),ROWH-3);
      }
    });
    if(INCHL&&has(D.incident.markerFrac)){
      const gf=clamp01(D.incident.markerFrac);
      if(gf>=za-1e-9&&gf<=zb+1e-9){
        const x=Math.round(((gf-za)/((zb-za)||1))*cssW)+0.5;
        ctx.setLineDash([3,3]); ctx.strokeStyle="#f0626b"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cssH); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    geo={i0,i1,n,cw,cssW,cssH,N};
  }
  cv.addEventListener("mousemove",e=>{
    if(!geo){hideTip();return;}
    const r=cv.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const row=Math.floor(my/ROWH), col=Math.floor(mx/geo.cw);
    if(row<0||row>=tt.length||col<0||col>=geo.n){hideTip();cv.style.cursor="default";return;}
    cv.style.cursor="pointer";
    const idx=geo.i0+col, s=tt[row].states[idx]||0;
    const ck=globalClock(idx/((geo.N-1)||1));
    TIP.textContent=`${tt[row].name} · ${SNAME[s]||s}${ck?" · "+ck:""}`;
    TIP.style.display="block";
    const tw=TIP.offsetWidth, th=TIP.offsetHeight, m=8;
    let x=e.clientX+12; if(x+tw>innerWidth-m)x=e.clientX-tw-12;
    let y=e.clientY+16; if(y+th>innerHeight-m)y=e.clientY-th-12;
    TIP.style.left=Math.max(m,x)+"px"; TIP.style.top=Math.max(m,y)+"px";
  });
  cv.addEventListener("mouseleave",()=>hideTip());
  cv.addEventListener("click",e=>{
    const r=cv.getBoundingClientRect();
    const row=Math.floor((e.clientY-r.top)/ROWH);
    if(row>=0&&row<tt.length&&typeof flameFocusGroup==="function") flameFocusGroup(threadGroup(tt[row].name));
  });
  ttRender=render;
  window.BBTT={render,geo:()=>geo};
  render();
}

function threadGroup(name){

  while(i>=0&&name[i]>="0"&&name[i]<="9") i--;
  if(i<name.length-1&&i>=0&&(name[i]==="-"||name[i]==="#")) return name.slice(0,i);

function poolSummaryHtml(ht,T){
