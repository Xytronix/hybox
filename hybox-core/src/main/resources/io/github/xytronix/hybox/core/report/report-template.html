  <div class="tscroll${clip?" thclip":""}" id="th-wrap"><div class="tcap"><table class="sortable" id="th-t"><thead><tr>${thc("#","",{r:true})}${thc("Thread","",{sort:"text"})}${thc("Samples","CPU samples on this thread",{sort:"num",r:true,def:"desc"})}${thc("Self&nbsp;%","Share of all CPU samples",{sort:"num",r:true})}${thc("Top method","Most sampled method on this thread. Expand the row for its top methods.",{sort:"text"})}</tr></thead><tbody>${rows}</tbody></table></div></div>
  ${clip?`<button type="button" class="copybtn cmpmore" data-thall data-label="Show all ${ht.length}" aria-expanded="false" aria-controls="th-wrap">Show all ${ht.length}</button>`:""}
  ${adv("thread states over time",threadTimelineHtml())}`;
}

function statesHtml(){
  const ts=D.threadStates, ser=D.series||{};
  const dl=DV.deadlock?`<div class="alert"><b style="color:var(--bad)">Deadlock detected · ${D.deadlocked.length} deadlocked thread${D.deadlocked.length===1?"":"s"}</b><ul>${D.deadlocked.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:"";
  const segs=Object.entries(ts||{}).filter(([,v])=>v>0).map(([k,v])=>({k,v,c:STCOL[k]||PAL.neutral}));
  const blocked=ts&&ts.BLOCKED||0;
  const facts=[];
  if(ts) facts.push(blocked?`<b class="v-warn">${blocked}</b> thread${blocked===1?" was":"s were"} waiting for a lock at capture.`:"No thread was waiting for a lock at capture.");
  if(ts&&!DV.deadlock) facts.push("No deadlock found.");
  let internals="";
  if(segs.length){
    const legend=segs.map(s=>`<div class="lg"><span class="sw" style="background:${s.c}"></span><span>${esc(STLABEL[s.k]||s.k)}</span><b>${s.v}</b></div>`).join("");
    const total=has(D.threadTotal)?D.threadTotal:segs.reduce((a,s)=>a+s.v,0);
    internals+=`<div class="card"><div class="donutwrap"><div>${donut(segs)}</div><div class="legend">${legend}</div><div class="state-note"><b>${ts.RUNNABLE||0}</b> of <b>${total}</b> live threads were runnable at capture.</div></div></div>`;
  }
  if(ser.threads) internals+=`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Live threads over the capture window</span><span class="ctm">${has(D.threadTotal)?D.threadTotal+" at capture":""}</span></div>${lineChart(ser.threads,{h:150,color:SERIES[0],unit:"",decimals:0,times:DV.span,marker:DV.incMarker})}</div>`;
  if(!facts.length&&!dl&&!internals) return "";
  return (facts.length?`<p class="lead">${facts.join(" ")}</p>`:"")+dl+adv("live threads by state",internals);
}

function memHtml(){
  const ser=D.series||{};
  if(!D.heap&&!D.gc&&!D.ram&&!D.alloc&&!(D.retained&&D.retained.length)
    &&!(D.gcByCollector&&D.gcByCollector.length)&&!(D.gcCauses&&D.gcCauses.length)
    &&!(D.heapHistogram&&D.heapHistogram.length)&&!(D.slowIo&&D.slowIo.length)) return "";
  const shortCls=n=>{const p=String(n).split(".");return p.length>=3?p.slice(-2).join("."):String(n);};
  const parts=[];
  const cards=[];
  const gcrows=[], advrows=[];
  if(D.sys&&D.sys.gcYoung&&D.sys.gcOld) gcrows.push(["Collector",D.sys.gcYoung+" + "+D.sys.gcOld]);
  if(D.gc){
    gcrows.push(["Collections",String(D.gc.collections)]);
    gcrows.push(["Longest pause",D.gc.maxPauseMs+" ms"]);
    gcrows.push(["Total pause time",D.gc.totalPauseMs+" ms"]);
  } else if(D.gcByCollector&&D.gcByCollector.length){
    D.gcByCollector.forEach(g=>gcrows.push([g[0],g[1]+(g[1]===1?" collection · ":" collections · ")+g[2]+" ms total"]));
  }
  if(D.heap&&has(D.heap.max)&&D.heap.max>0) gcrows.push(["Max heap (-Xmx)",fixed(gib(D.heap.max),1)+" GiB"]);
  if(D.heap){ gcrows.push(["Peak heap used",fixed(gib(D.heap.peak),1)+" GiB"+(has(D.heap.max)&&D.heap.max>0?" ("+Math.round(100*D.heap.peak/D.heap.max)+"%)":"")]);
    if(has(D.heap.floor)) gcrows.push(["Post-GC floor","~"+fixed(gib(D.heap.floor),1)+" GiB"]);
    if(has(D.heap.committed)) advrows.push(["Heap committed",fmtBytes(D.heap.committed)]); }
  if(D.gc&&D.gcByCollector&&D.gcByCollector.length){
    const tot=D.gcByCollector.filter(g=>g[1]>0).map(g=>g[0]+" ×"+fmt(g[1])).join(" · ");
    if(tot) advrows.push(["Collections since JVM start",tot]);
  }
  if(D.sys&&has(D.sys.gcParallel)) advrows.push(["GC worker threads",D.sys.gcParallel+" parallel, "+(D.sys.gcConc??"?")+" concurrent"]);
  if(D.sys&&D.sys.nonHeap&&has(D.sys.nonHeap.used)) advrows.push(["Non-heap",fmtBytes(D.sys.nonHeap.used)+" used / "+fmtBytes(D.sys.nonHeap.committed)+" committed"]);
  if(D.ram){ advrows.push(["Process RSS (peak)",fixed(gib(D.ram.rssPeak),1)+" GiB"]);
    advrows.push(["Native memory (NMT)",D.ram.nmtOn?fmtBytes(D.ram.nativeCommitted)+" committed":"n/a, start with -XX:NativeMemoryTracking=summary"]); }
  if(D.gc&&has(D.gc.explicitDisabled)){
    const exDesc=D.gc.explicitDisabled?"disabled (-XX:+DisableExplicitGC)":(D.gc.explicitConcurrent?"runs alongside the server":"stop-the-world");
    advrows.push(["Explicit GC",exDesc]);
    const ex=D.gc.explicitCalls||[];
    const exTotal=ex.reduce((a,c)=>a+c[1],0);
    advrows.push(["Explicit GC calls",exTotal===0?"none in window":exTotal+" · "+ex.map(c=>c[0]+" ×"+c[1]).join(", ")]);
  }
  const kv=(title,rows)=>`<div class="kvcard"><div class="kvh"><span class="ic">${I.gc}</span><b>${title}</b></div><div class="kv">${rows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`;
  if(gcrows.length) cards.push(kv("Garbage collection &amp; memory",gcrows));
  if(cards.length) parts.push(cards.length===2?`<div class="charts2">${cards.join("")}</div>`:cards.join(""));
  const advanced=[];
  if(advrows.length) advanced.push(kv("JVM memory details",advrows));
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pools=[...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0)));
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"n/a";
    const prows=pools.map(p=>`<tr><td class="nm">${esc(String(p[0]))}</td><td class="r" data-num="${p[1]}">${pv(p[1])}</td><td class="r" data-num="${p[2]}">${pv(p[2])}</td><td class="r" data-num="${p[3]}">${pv(p[3])}</td><td class="r" data-num="${p[4]}">${pv(p[4])}</td></tr>`).join("");
    advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Memory pools</span><span class="ctm">JVM memory pools at capture</span></div>
      <div class="tscroll"><table class="sortable" id="mp-t"><thead><tr>${thc("Pool","",{sort:"text"})}${thc("Used","Bytes in use at capture",{sort:"num",r:true})}${thc("Committed","Bytes reserved from the OS for this pool",{sort:"num",r:true})}${thc("Max","Configured ceiling for this pool",{sort:"num",r:true})}${thc("At last GC","Usage right after the most recent collection",{sort:"num",r:true})}</tr></thead><tbody>${prows}</tbody></table></div></div>`);
  }
  if(D.gcCauses&&D.gcCauses.length){
    const crows=D.gcCauses.map((c,i)=>`<tr><td class="rank">${i+1}</td><td class="nm">${esc(String(c[0]))}</td><td class="r" data-num="${c[1]}">${fmt(c[1])}</td><td class="r" data-num="${c[2]}">${fixed(Number(c[2]),1)}</td></tr>`).join("");
    advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">GC causes</span><span class="ctm">why each collection fired</span></div>
      <div class="tscroll"><table class="sortable" id="gcc-t"><thead><tr>${thc("#","",{r:true})}${thc("Cause","GC cause reported by the JVM",{sort:"text"})}${thc("Collections","Collections with this cause",{sort:"num",r:true,def:"desc"})}${thc("Total pause ms","Summed pause time for this cause",{sort:"num",r:true})}</tr></thead><tbody>${crows}</tbody></table></div></div>`);
  }
  if(D.alloc&&(((D.alloc.bySubsystem||[]).length)||((D.alloc.byThread||[]).length)||((D.alloc.byClass||[]).length)||((D.alloc.byMod||[]).length))){
    const tot=(has(D.alloc.total)&&D.alloc.total>0?D.alloc.total:(D.alloc.bySubsystem||[]).reduce((a,s)=>a+s[1],0))||1;
    const allocBars=(items,nowrap)=>{
      const mx=Math.max(...items.map(i=>i[1]));
      return items.map(i=>{
        const lbl=thName(i);
        return `<div class="wbar"><div class="wn"><span${nowrap?' class="tnc"':""} data-tipov="${esc(lbl)}">${esc(lbl)}</span></div><div class="wt"><div class="wf al" style="width:${fixed((100*i[1]/Math.max(1,mx)),1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${fixed(pct(i[1],tot),1)}%</div></div>`;
      }).join("");
    };
    const arate=has(D.incident.windowSec)&&D.incident.windowSec>0?`, ${fmtBytes(tot/D.incident.windowSec)}/s`:"";
    const note=`<div class="subnote">Memory allocated during the recording: ${fmtBytes(tot)}${arate}. GC frees most of it. This is not memory in use.</div>`;
    const aworlds=(D.alloc.byWorld||[]).filter(w=>w.bytes>0&&pct(w.bytes,tot)>=0.5);
    if(aworlds.length>1){
      parts.push(`${recordingScopeBadge()}<div class="tbar wsel"><span class="wsl">World scope</span><button type="button" class="chip tog on" data-allocworld="*" aria-pressed="true">all worlds</button>`
        +aworlds.map(w=>`<button type="button" class="chip tog" data-allocworld="${esc(w.world)}" aria-pressed="false">${esc(worldLabel(w.world))} · ${fixed(pct(w.bytes,tot),0)}%</button>`).join("")+`</div>`);
    }
    if((D.alloc.bySubsystem||[]).length) parts.push(`<div class="chartcard" style="margin-top:12px"><div class="cth"><span class="ctt">Allocated memory by engine subsystem</span><span class="ctm">${fmtBytes(tot)} sampled</span></div>${recordingScopeBadge()}${note}<div class="wbars" id="allocSub"></div></div>`);
    if((D.alloc.byMod||[]).length) parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Allocated memory by mod</span><span class="ctm">${fmtBytes(tot)} sampled</span></div>${recordingScopeBadge()}<div class="subnote">${D.alloc.byMod.some(m=>m.length>2)?MOD_ALLOC_NOTE:MOD_OLDER}</div><div class="wbars" id="allocMod"></div></div>`);
    if((D.alloc.byThread||[]).length) advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocating threads</span><span class="ctm">allocation samples</span></div>${recordingScopeBadge()}<div class="wbars">${allocBars(D.alloc.byThread,true)}</div></div>`);
    if((D.alloc.byClass||[]).length){
      const mx=Math.max(...D.alloc.byClass.map(i=>i[1]));
      const clsBars=D.alloc.byClass.map(i=>{
        const full=String(i[0]);
        return `<div class="wbar"><div class="wn"><span class="tnc" data-tipov="${esc(full)}">${esc(shortCls(full))}</span></div><div class="wt"><div class="wf al" style="width:${fixed((100*i[1]/Math.max(1,mx)),1)}%"></div></div><div class="wv">${fmtBytes(i[1])} · ${fixed(pct(i[1],tot),1)}%</div></div>`;
      }).join("");
      advanced.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Top allocated classes</span><span class="ctm">allocation samples</span></div>${recordingScopeBadge()}<div class="wbars">${clsBars}</div></div>`);
    }
  }
  const retained=(D.retained||[]).filter(r=>r[1]>=3);
  if(D.retained&&D.retained.length&&!retained.length) parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Long-lived allocations</span><span class="ctm">JFR old-object samples</span></div><div class="subnote" style="margin:4px 0 0">Too few long-lived object samples to show a pattern.</div></div>`);
  if(retained.length){
    const sited=retained.some(r=>r[2]), pathed=retained.some(r=>r[4]);
    const pathHow=h=>h.ref==="array"?"[ ]":h.field?"."+h.field:"";
    const pathName=h=>shortCls(h.type)+pathHow(h);
    const pathHtml=(r,cls)=>{
      const c=r[4]; if(!c||(!c.holders.length&&!c.root)) return "";
      const hs=c.holders.slice().reverse();
      const steps=hs.map(h=>`<li><code data-tipov="${esc(h.type+pathHow(h))}">${esc(pathName(h))}</code>${h.ref==="static"?` <span class="pkg">static field</span>`:h.ref==="array"?` <span class="pkg">array element</span>`:""}${h.mod?`<span class="mxchip">${esc(h.mod)}</span>`:""}</li>`
        +(h.skip>0?`<li class="pkg">${fmt(h.skip)} more step${h.skip===1?"":"s"} not recorded</li>`:""));
      const mid=steps.length>7?steps.slice(3,-3):[];
      const list=mid.length?steps.slice(0,3).join("")+`<li><details class="mxstk"><summary>${mid.length} more steps</summary><ol class="rpath" role="list">${mid.join("")}</ol></details></li>`+steps.slice(-3).join(""):steps.join("");
      const root=c.root?`<li><span class="pkg">GC root</span> ${esc(c.root.type||"unknown")}${c.root.system?` (${esc(c.root.system)})`:""}${c.root.description?` <span class="pkg">${esc(c.root.description)}</span>`:""}</li>`:`<li class="pkg">GC root not found in time</li>`;
      const from=hs.length?pathName(hs[0]):(c.root.type||"GC root");
      return `<details class="mxstk"><summary>Path to GC root <small>from ${esc(from)}, ${fmt(c.samples)} of ${fmt(r[1])} samples</small>${c.mod?`<span class="mxchip">${esc(c.mod)}</span>`:""}</summary><ol class="rpath" role="list" aria-label="Path from the GC root to ${esc(shortCls(cls))}">${root}${list}<li><code>${esc(shortCls(cls))}</code> <span class="pkg">sampled object</span></li></ol></details>`;
    };
    const rrows=retained.map((r,i)=>{
      const cls=String(r[0]), site=r[2]?String(r[2]):null, path=pathHtml(r,cls);
      const where=!sited?"":`<td class="mono">${site?`<span class="tnc2" style="max-width:420px" data-tipov="${esc(site)}">${esc(shortCls(site))}</span><div class="modmeth">${esc(r[3]||codeKind(site))}</div>`:`<span class="pkg">no stack</span>`}</td>`;
      return `<tr><td class="rank">${i+1}</td><td class="nm"${path?` data-sval="${esc(shortCls(cls))}"`:""}><span class="tnc2" data-tipov="${esc(cls)}">${esc(shortCls(cls))}</span>${path}</td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td>${where}</tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Long-lived allocations</span><span class="ctm">JFR old-object samples</span></div>${recordingScopeBadge()}
      <div class="subnote">Objects that stayed alive for a long time. A class that keeps growing here can be a leak. Counts are sampled, not exact.${pathed?" A path shows what keeps the object alive, from the GC root down.":""}${sited?"":` ${OLD_SITES}`}</div>
      <div class="tscroll"><table class="sortable" id="ret-t"><thead><tr>${thc("#","",{r:true})}${thc("Class","Sampled object class",{sort:"text"})}${thc("Samples","Old-object samples of this class still reachable",{sort:"num",r:true,def:"desc"})}${sited?thc("Dominant allocation site","Most common allocation site among the samples, with its mod. Same rule as CPU by mod."):""}</tr></thead><tbody>${rrows}</tbody></table></div></div>`);
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    const totB=D.heapHistogram.reduce((a,r)=>a+r[2],0)||1;
    const hrows=D.heapHistogram.map((r,i)=>{
      const p=100*r[2]/totB;
      return `<tr><td class="rank">${i+1}</td><td class="nm"><span class="tnc2" data-tipov="${esc(String(r[0]))}">${esc(shortCls(r[0]))}</span></td><td class="r" data-num="${r[1]}">${fmt(r[1])}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td><td class="r" data-num="${fixed(p,2)}"><span class="pct">${fixed(p,1)}%</span></td></tr>`;
    }).join("");
    parts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Heap histogram</span><span class="ctm">exact live bytes per class at capture</span></div>
      <div class="subnote">Every object on the heap at capture, by class. Shown when <code>Capture.HeapHistogram</code> is on.</div>
      <div class="tscroll"><table class="sortable" id="hh-t"><thead><tr>${thc("#","",{r:true})}${thc("Class","",{sort:"text"})}${thc("Instances","Live instances at capture",{sort:"num",r:true})}${thc("Bytes","Shallow bytes at capture",{sort:"num",r:true,def:"desc"})}${thc("% of listed","Share of the bytes listed in this table",{sort:"num",r:true})}</tr></thead><tbody>${hrows}</tbody></table></div></div>`);
  }
  if(D.slowIo&&D.slowIo.length){
    const srows=D.slowIo.map((r,i)=>{
      const full=String(r[0]);
      const shortP=full.split("/").filter(Boolean).slice(-2).join("/")||full;
      const kind=String(r[3]||"");
      return `<tr><td class="rank">${i+1}</td><td data-sval="${esc(full)}"><span class="tnc2" data-tipov="${esc(full)}">${esc(shortP)}</span></td><td data-sval="${esc(kind)}"><span class="lvl ${kind==="write"?"WARN":"INFO"}">${esc(kind)}</span></td><td class="r" data-num="${r[1]}">${fixed(Number(r[1]),0)}</td><td class="r" data-num="${r[2]}">${fmtBytes(r[2])}</td></tr>`;
    }).join("");
    const sioT=D.slowIoThresholdMs;
    const sioMeta=sioT!=null?`slowest single reads and writes, recorded from ${sioT} ms`:"slowest single reads and writes";
    parts.push(`<div class="chartcard" id="sio" style="margin-top:16px"><div class="cth"><span class="ctt">Slow file operations</span><span class="ctm">${sioMeta}</span></div>
      <div class="subnote">A slow read or write on a world thread delays the tick.</div>
      <div class="tscroll"><table class="sortable" id="sio-t"><thead><tr>${thc("#","",{r:true})}${thc("Path","Hover for the full path",{sort:"text"})}${thc("Kind","",{sort:"text"})}${thc("Duration ms","Wall time of the single operation",{sort:"num",r:true,def:"desc"})}${thc("Bytes","Bytes transferred by the operation",{sort:"num",r:true})}</tr></thead><tbody>${srows}</tbody></table></div></div>`);
  }
  if(!parts.length&&!advanced.length) return "";
  const ex=(D.gc&&D.gc.explicitCalls)||[], exTotal=ex.reduce((a,c)=>a+c[1],0);
  const exLead=exTotal>0?` Code asked for ${exTotal} full collection${exTotal===1?"":"s"} with <code class="mono">System.gc()</code>, from ${ex.map(c=>esc(c[0])).join(", ")}.`:"";
  const lead=D.heap?`<p class="lead">Heap used ${fixed(gib(D.heap.floor),1)} to ${fixed(gib(D.heap.peak),1)} GiB${has(D.heap.max)&&D.heap.max>0?` of ${fixed(gib(D.heap.max),1)} GiB`:""}.${exLead}</p>`:"";
  return lead+parts.join("")+adv("memory pools, GC causes and allocation detail",advanced.join(""));
}

function networkHtml(){
  const ser=D.series||{};
  if(!D.net) return "";
  const mb=v=>has(v)?fixed(v,1):"n/a", MBIT="Mbit/s";
  const inKnown=has(D.net.inAvg);
  const others=Array.isArray(D.net.others)?D.net.others.filter(o=>o&&o.length>=5&&[1,2,3,4].some(i=>Number(o[i])>0)):[];
  const charts=[];
  if(ser.netOut) charts.push(`<div class="chartcard"><div class="cth"><span class="ctt">Outbound network over capture window</span><span class="ctm">${esc(D.net.iface)} · avg ${mb(D.net.outAvg)} · peak ${mb(D.net.outPeak)} ${MBIT}</span></div>${lineChart(ser.netOut,{h:195,color:SERIES[0],unit:" "+MBIT,decimals:1,times:DV.span,marker:DV.incMarker,family:"network"})}</div>`);
  if(ser.netIn) charts.push(`<div class="chartcard" style="margin-top:16px"><div class="cth"><span class="ctt">Inbound network over capture window</span><span class="ctm">avg ${mb(D.net.inAvg)} · peak ${mb(D.net.inPeak)} ${MBIT}</span></div>${lineChart(ser.netIn,{h:150,color:SERIES[0],unit:" "+MBIT,decimals:1,times:DV.span,marker:DV.incMarker,family:"network"})}</div>`);
  const rows=[
    ["Interface",D.net.iface],
    ["Outbound avg / peak",mb(D.net.outAvg)+" / "+mb(D.net.outPeak)+" "+MBIT],
    ["Inbound avg / peak",inKnown?(mb(D.net.inAvg)+" / "+mb(D.net.inPeak)+" "+MBIT):"n/a"]
  ];
  if(has(D.incident.windowSec)&&D.incident.windowSec>0){
    const tot=mbps=>fmtBytes(Math.round(mbps*1e6/8*D.incident.windowSec));
    if(inKnown) rows.push(["Transferred in (window)","≈ "+tot(D.net.inAvg)]);
    rows.push(["Transferred out (window)","≈ "+tot(D.net.outAvg)]);
  }
  others.forEach(o=>rows.push([String(o[0]),`in ${fixed(Number(o[1]),1)}/${fixed(Number(o[2]),1)} · out ${fixed(Number(o[3]),1)}/${fixed(Number(o[4]),1)} ${MBIT}`]));
  const card=`<div class="kvcard"><div class="kvh"><span class="ic">${I.net}</span><b>Network</b><small>${esc(D.net.iface)}</small></div><div class="kv">${rows.map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div></div>`;
  return `<p class="lead">Traffic of the whole machine on <code class="mono">${esc(D.net.iface)}</code>, not only the server. Player ping in Key metrics shows a slow network better.</p>`+card+adv("network over time",charts.join(""));
}

function worldsHtml(){
  const ws=DV.worlds;
  if(!ws.length) return "";
  const T=DV.samples;
  const hasSamples=T&&ws.some(w=>has(w.samples));
  const hasTick=ws.some(w=>has(w.tps));
  const tpsElsewhere=!!(D.series&&D.series.tps)&&Array.isArray(D.worldTps)&&D.worldTps.length>0;
  const entMap=new Map((D.entities||[]).map(e=>[e[0],e[1]]));
  const hasEnt=entMap.size>0||ws.some(w=>has(w.entities));
  const hasChunks=ws.some(w=>has(w.chunks));
  const hasChunksGen=ws.some(w=>has(w.chunksGenerated));
  const hasChunksLoad=ws.some(w=>has(w.chunksLoaded));
  const hasPct=ws.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
  const mixed=!!(D.vitals&&D.vitals.tpsMixed)&&ws.some(w=>has(w.targetTps));
  const hasRadius=ws.some(w=>w.radius);
  const spread=(a,players)=>{
    if(!Array.isArray(a)||a[1]==null) return null;
    const who=` across ${players} player${players===1?"":"s"}`;
    return {v:a[1],tip:(a[0]===a[2]?`${a[1]} chunks`:`Min ${a[0]}, median ${a[1]}, max ${a[2]} chunks`)+who};
  };
  const pcountOf=w=>{const a=w.playerNames||[];const n=has(w.players)?w.players:a.length;return `<span class="pcount${n?'':' z'}"${a.length?` data-tip="In world: ${esc(a.join(", "))}"`:''}><span class="plk">${I.players}</span><b>${n}</b></span>`;};
  const rows=ws.map(w=>{
    const isInst=String(w.name).indexOf("instance-")===0;
    const kind=isInst?"instance":"persistent";
    const badges=w.stalled?' <span class="st STALL" style="margin-left:6px">Stalled</span>':'';
    let cells=`<td class="nm" data-sval="${esc(worldLabel(w.name))}"><span${w.stalled?' class="stallname"':''} data-tipov="${esc(w.name)}">${esc(worldLabel(w.name))}</span>${badges} ${pcountOf(w)}</td><td class="pkg">${kind}</td>`;
    if(hasEnt){
      const ents=entMap.get(w.name);
      const tot=has(w.entities)?w.entities:(ents&&ents.length?ents.reduce((a,t)=>a+t[1],0):null);
      if(ents&&ents.length){
        const tip=ents.map(t=>`${String(t[0])} ×${fmt(t[1])}`).join(", ");
        cells+=`<td data-num="${tot}"><span class="pcount" data-tip="Top types: ${esc(tip)}"><b>${fmt(tot)}</b></span></td>`;
      } else if(tot!=null) cells+=`<td data-num="${tot}"><span class="pcount"><b>${fmt(tot)}</b></span></td>`;
      else cells+=`<td data-num="-1"><span class="pkg">·</span></td>`;
    }
    if(hasChunks) cells+=`<td class="r" data-num="${has(w.chunks)?w.chunks:-1}">${has(w.chunks)?fmt(w.chunks):"·"}</td>`;
    if(hasChunksGen) cells+=`<td class="r" data-num="${has(w.chunksGenerated)?w.chunksGenerated:-1}">${has(w.chunksGenerated)?fmt(w.chunksGenerated):"·"}</td>`;
    if(hasChunksLoad) cells+=`<td class="r" data-num="${has(w.chunksLoaded)?w.chunksLoaded:-1}">${has(w.chunksLoaded)?fmt(w.chunksLoaded):"·"}</td>`;
    if(hasTick){
      if(!tpsElsewhere) cells+=`<td class="r" data-num="${has(w.tps)?w.tps:-1}">${has(w.tps)&&w.tps>=0?fixed(w.tps,1):"·"}</td>`;
      if(hasPct){
        const med=has(w.msptP50)?w.msptP50:w.mspt;
        const pc=v=>has(v)&&v>=0?fixed(v,1):"·";
        cells+=`<td class="r" data-num="${has(med)?med:-1}">${pc(med)}</td><td class="r" data-num="${has(w.msptP95)?w.msptP95:-1}">${pc(w.msptP95)}</td><td class="r" data-num="${has(w.msptMax)?w.msptMax:-1}">${pc(w.msptMax)}</td>`;
      } else {
        cells+=`<td class="r" data-num="${has(w.mspt)?w.mspt:-1}">${has(w.mspt)&&w.mspt>=0?fixed(w.mspt,1):"·"}</td>`;
      }
    }
    if(mixed) cells+=`<td class="r" data-num="${has(w.targetTps)?w.targetTps:-1}">${has(w.targetTps)?w.targetTps:"·"}</td>`;
    if(hasRadius){
      const r=w.radius, vw=r?spread(r.view,r.players):null, ht=r?spread(r.hot,r.players):null;
      const lowered=r&&r.hotLowered?`. A mod lowered it for ${r.hotLowered} of them`:"";
      cells+=`<td class="r" data-num="${vw?vw.v:-1}">${vw?`<span data-tip="${esc(vw.tip)}">${vw.v}</span>`:"·"}</td>`;
      cells+=`<td class="r" data-num="${ht?ht.v:-1}">${ht?`<span data-tip="${esc(ht.tip+lowered)}">${ht.v}</span>`:"·"}</td>`;
      cells+=`<td class="r" data-num="${r&&has(r.sections)?r.sections:-1}">${r&&has(r.sections)?`<span${has(r.sectionsMax)?` data-tip="Most for one player: ${fmt(r.sectionsMax)}"`:""}>${fmt(r.sections)}</span>`:"·"}</td>`;
    }
    if(hasSamples){
      const s=has(w.samples)?w.samples:0, p=pct(s,T), heavy=p>=20, idle=s===0;
      cells+=`<td class="r" data-num="${s}">${fmt(s)}</td><td class="r"><span class="${heavy?'v-warn':(idle?'pkg':'pct')}">${fixed(p,1)}%${heavy?'<span class="vword">high</span>':''}</span></td>`;
    }
    return `<tr class="${w.stalled?'hl':''}">${cells}</tr>`;
  }).join("");
  let head=thc("World","World or ephemeral instance name",{sort:"text"})+thc("Kind","Persistent world or ephemeral instance",{sort:"text"});
  if(hasEnt) head+=thc("Entities","Live entities in this world at capture. Hover a count for the types.",{sort:"num"});
  if(hasChunks) head+=thc("Chunks","Loaded chunks in this world at capture",{sort:"num",r:true});
  if(hasChunksGen) head+=thc("Chunks gen","Chunks generated in this world during the captured window",{sort:"num",r:true});
  if(hasChunksLoad) head+=thc("Chunks loaded","Chunks loaded (disk + generated) in this world during the captured window",{sort:"num",r:true});
  if(hasTick){
    if(!tpsElsewhere) head+=thc("TPS","TPS at capture",{sort:"num",r:true});
    if(hasPct) head+=thc("Tick time med","Median tick time over the window (ms)",{sort:"num",r:true})+thc("p95","95th percentile tick time (ms)",{sort:"num",r:true})+thc("max","Slowest single tick in the window (ms)",{sort:"num",r:true});
    else head+=thc("Tick time","Average tick time at capture (ms)",{sort:"num",r:true});
  }
  if(mixed) head+=thc("Target","TPS target of this world. Worlds here run at different tick rates.",{sort:"num",r:true});
  if(hasRadius) head+=thc("View","Median view radius of the players in this world, in chunks. Hover for min and max.",{sort:"num",r:true})
    +thc("Hot","Median hot radius in chunks. Blocks and fluids tick inside it.",{sort:"num",r:true})
    +thc("Sections","Chunk sections loaded by all players in this world. Hover for the most one player loads.",{sort:"num",r:true});
  if(hasSamples) head+=thc("Samples","CPU samples on this world's tick thread",{sort:"num",r:true,def:"desc"})+thc("CPU&nbsp;%","Share of all CPU samples",{sort:"num",r:true});
  const lead=`<p class="lead">Hover a player count for names, or an entity count for types.${mixed?" Worlds run at different tick rates, so each world is compared with its own TPS target.":""}</p>`;
  const tops=ws.filter(w=>w.radius&&Array.isArray(w.radius.top)&&w.radius.top.length);
  const topRows=tops.map(w=>w.radius.top.map((p,i)=>`<tr><td class="nm">${i===0?esc(worldLabel(w.name)):""}</td><td>${esc(p[0])}</td><td class="r">${p[1]??"·"}</td><td class="r">${p[2]??"·"}</td><td class="r">${p[3]!=null?fmt(p[3]):"·"}</td></tr>`).join("")).join("");
  const topHtml=topRows?`<h3 class="subh" id="w-top-h">Top players by loaded sections</h3><p class="lead">The players whose view loads the most chunk sections, up to five per world. Names are masked.</p><div class="tscroll"><table id="w-top" aria-labelledby="w-top-h"><thead><tr><th>World</th><th>Player</th><th class="r">View</th><th class="r">Hot</th><th class="r">Sections</th></tr></thead><tbody>${topRows}</tbody></table></div>`:"";
  return lead+filterBar("w-t","worlds",ws.length)+`
  <div class="tscroll"><table class="sortable" id="w-t"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`+topHtml;
}

function systemHtml(){
  const s=D.sys; if(!s) return "";
  const row=(k,v,tip)=>v==null?"":`<div class="row"><span class="k">${esc(k)}</span><span class="v"${tip&&tip!==String(v)?` data-tip="${esc(tip)}"`:""}>${esc(String(v))}</span></div>`;
  function swapRow(){
    const sw=s.swap;
    if(!sw||!has(sw.total)||sw.total<=0) return "";
    const used=Math.max(0,sw.total-(sw.free||0));
    return `<div class="row"><span class="k">Swap (machine)</span><span class="v${used>0?" v-warn":""}">${fmtBytes(used)} used of ${fmtBytes(sw.total)}</span></div>`;
  }
  function card(ic,title,sub,rows){const body=rows.join("");if(!body)return "";return `<div class="kvcard"><div class="kvh"><span class="ic">${ic}</span><b>${esc(title)}</b><small>${esc(sub||"")}</small></div><div class="kv">${body}</div></div>`;}
  const cards=[
    card(I.cpu,"Processor",has(s.cpuCores)?s.cpuCores+" cores":"",[
      row("Brand",s.cpuBrand),row("Cores",s.cpuCores),row("Hardware threads",s.hwThreads),row("Sockets",s.sockets),
      row("Container CPU",has(s.cpuUsageCores)&&s.cpuUsageCores>=0?fixed(s.cpuUsageCores,2)+" cores"+(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0&&has(s.cpuCores)&&s.container.cpuLimit<s.cpuCores?" ("+fixed((100*s.cpuUsageCores/s.container.cpuLimit),0)+"% of limit)":(has(s.cpuCores)&&s.cpuCores>0?" ("+fixed((100*s.cpuUsageCores/s.cpuCores),0)+"% of "+s.cpuCores+" cores)":"")):null),
      row("CPU affinity (cpuset)",s.cpuset||null),
      row("Stalled on CPU, memory or disk, last 10 s",[has(s.psiCpu)&&s.psiCpu>=0?"cpu "+fixed(s.psiCpu,1)+"%":null,has(s.psiIo)&&s.psiIo>=0?"io "+fixed(s.psiIo,1)+"%":null,has(s.psiMem)&&s.psiMem>=0?"mem "+fixed(s.psiMem,1)+"%":null].filter(Boolean).join(" · ")||null),
      row("Machine RAM",has(s.ramTotal)&&s.ramTotal>0?fixed(gib(s.ramTotal),1)+" GiB":null),
      row("CPU throttling",has(s.throttledPeriods)&&s.throttledPeriods>0?s.throttledPeriods+" periods"+(has(s.throttledMs)&&s.throttledMs>0?" · "+fmtDur(s.throttledMs):"")+" in window":null),
      row("CPU steal (machine)",has(s.cpuStealPct)&&s.cpuStealPct>=0?fixed(s.cpuStealPct,1)+"% of window":null),
      row("CPU iowait (machine)",has(s.cpuIowaitPct)&&s.cpuIowaitPct>=0?fixed(s.cpuIowaitPct,1)+"% of window":null)
    ]),
    card(osIcon(s.os||""),"Operating system",osFamily(s.os||""),[
      row("OS",s.osShort||s.os,s.os),row("Architecture",s.arch),row("Server name",s.server),
      row("Server software",s.hytale?"Hytale Dedicated "+s.hytale:null),row("Max view radius",has(s.maxViewRadius)?s.maxViewRadius+" chunks":null,"MaxViewRadius in the server config.json. It caps how far each player loads chunks."),row("Uptime",has(s.uptimeMs)&&s.uptimeMs>0?fmtDur(s.uptimeMs):null),
      row("Disk",s.disk&&has(s.disk.total)&&s.disk.total>0?fixed(gib(s.disk.free),1)+" GiB free of "+fixed(gib(s.disk.total),1)+" GiB":null),
      row("Block I/O limit",(has(s.ioReadLimit)&&s.ioReadLimit>=0)||(has(s.ioWriteLimit)&&s.ioWriteLimit>=0)?[has(s.ioReadLimit)&&s.ioReadLimit>=0?"read "+fmtBytes(s.ioReadLimit)+"/s":null,has(s.ioWriteLimit)&&s.ioWriteLimit>=0?"write "+fmtBytes(s.ioWriteLimit)+"/s":null].filter(Boolean).join(" · "):null),
      row("Machine memory",has(s.hostMemUsed)&&s.hostMemUsed>=0?(has(s.ramTotal)&&s.ramTotal>0?fixed(gib(s.hostMemUsed),1)+" GiB of "+fixed(gib(s.ramTotal),1)+" GiB used":fixed(gib(s.hostMemUsed),1)+" GiB used"):null),
      swapRow(),
      row("Runtime",s.container&&s.container.runtime?s.container.runtime:null),
      row("Container",s.container&&s.container.type?s.container.type:null),
      row("CPU limit",(s.container&&has(s.container.cpuLimit)&&s.container.cpuLimit>0)?(has(s.cpuCores)&&s.cpuCores>0&&s.container.cpuLimit>=s.cpuCores?"unlimited (quota "+fixed(s.container.cpuLimit,0)+")":fixed(s.container.cpuLimit,1)+" cores"):null),
      row("Memory limit",s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.container.memLimit):null),
      row("Open files",has(s.openFds)&&has(s.maxFds)&&s.maxFds>0&&s.openFds>=0.8*s.maxFds?fmt(s.openFds)+" of "+fmt(s.maxFds):null),
      row("Container memory",has(s.containerMemUsed)&&s.containerMemUsed>=0?(s.container&&has(s.container.memLimit)&&s.container.memLimit>0?fmtBytes(s.containerMemUsed)+" of "+fmtBytes(s.container.memLimit)+" ("+fixed((100*s.containerMemUsed/s.container.memLimit),0)+"%)":fmtBytes(s.containerMemUsed)):null),
      row("Container swap",has(s.containerSwapUsed)&&s.containerSwapUsed>=0?(s.containerSwapMax===0?"disabled":fmtBytes(s.containerSwapUsed)+(has(s.containerSwapMax)&&s.containerSwapMax>0?" of "+fmtBytes(s.containerSwapMax):" used")):null),
      row("OOM kills",has(s.oomKills)&&s.oomKills>0?fmt(s.oomKills)+" (cumulative)":null)
    ]),
    card(I.java,"Java / JVM","",[
      row("Java",s.javaShort),row("Runtime",s.jvm),row("Vendor",s.javaVendor),row("java.home",s.javaHome),
      ...(s.loaders||[]).map(l=>row(l[0]+" loader",l[1]))
    ])
  ].filter(Boolean);
  const advCards=[
    card(I.cpu,"Load and JVM pauses","",[
      row("Load average (1m, machine)",has(s.loadAvg)&&s.loadAvg>=0?fixed(s.loadAvg,2):null),
      row("Safepoints",has(s.safepointCount)&&s.safepointCount>0?fmt(s.safepointCount)+(has(s.safepointMs)&&s.safepointMs>0?" · "+fixed(s.safepointMs,0)+" ms to-safepoint":"")+" in window":null)
    ]),
    card(I.gc,"Garbage collector",DV.gcName||"",[
      row("Young",s.gcYoung),row("Old",s.gcOld),row("Parallel GC threads",s.gcParallel),row("Concurrent GC threads",s.gcConc),
      row("GC time ratio",s.gcTimeRatio),
      row("Explicit GC",D.gc&&has(D.gc.explicitDisabled)?(D.gc.explicitDisabled?"disabled":(D.gc.explicitConcurrent?"concurrent":"stop-the-world")):null)
    ])
  ].filter(Boolean);
  let cw="";
  const cRisk=containerRisk();
  if(cRisk) cw=`<div class="cwarn" id="cwarn">${I.warn}<span>The heap limit (-Xmx <b>${fixed(gib(cRisk.xmx),1)} GiB</b>) is <b>${Math.round(100*cRisk.xmx/cRisk.lim)}%</b> of the ${s.container&&s.container.runtime?esc(s.container.runtime)+" ":""}container's <b>${fixed(gib(cRisk.lim),1)} GiB</b>. The container can kill the server. Set -Xmx to about 75% of the container limit.</span></div>`;
  let dw="";
  const dRisk=diskRisk();
  if(dRisk) dw=`<div class="cwarn" id="dwarn">${I.warn}<span>Low disk space (<b>${fixed(gib(dRisk.free),1)} GiB</b> free of ${fixed(gib(dRisk.total),1)} GiB). The recording and incident bundles can fail to write.</span></div>`;
  let cmd="";
  if(s.startCommand){
    const long=s.startCommand.length>200;
    cmd=`<div class="codewrap${long?" closed":""}" style="margin-top:16px"><button type="button" class="codehd" data-code aria-expanded="${!long}"><span class="ic">${I.term}</span><span class="fn">Start command</span><span class="chev2" aria-hidden="true">${I.chev}</span></button><pre class="cmdpre">${esc(s.startCommand)}</pre></div>`;
  }
  const advanced=adv("JVM details for support",advCards.length?`<div class="syscols">${advCards.join("")}</div>`:"");
  const net=networkHtml();
  const netBlock=net?`<div class="subblock" id="network"><h3 class="subh"><span class="ic">${I.net}</span>Network</h3>${net}</div>`:"";
  if(!ENVCHIPS&&!cards.length&&!cw&&!dw&&!cmd&&!advanced&&!netBlock) return "";
  return ENVCHIPS+(cards.length?`<div class="syscols">${cards.join("")}</div>`:"")+cw+dw+cmd+netBlock+advanced;
}

function modSite(site){
  const w=site==null?"":String(site).trim();
  return /^https?:\/\/[^\s/?#]+\S*$/i.test(w)?w:null;
}
function modNameLink(name,site,search){
  const own=modSite(site);
  const href=own||`https://www.curseforge.com/hytale/search?search=${encodeURIComponent(search||name)}`;
  return `<a class="evlink" style="margin-left:0;font-size:inherit" href="${esc(href)}" target="_blank" rel="noopener noreferrer" data-tip="${own?"Open the mod website":"Search CurseForge for this mod"}">${esc(name)}</a>`;
}

function pluginsHtml(){
  const pl=D.plugins;
  if(!pl||!pl.length) return "";
  const core=pl.filter(p=>p[3]).length, comm=pl.length-core;
  const incompat=pl.filter(p=>p[5]==="INCOMPATIBLE").length;
  const rows=pl.map(p=>{
    const [author,name,ver,isCore]=p, range=p[4]||null, compat=p[5]||null;
    const link=isCore?'<span class="corebadge">core module</span>':`<a class="cf" href="https://www.curseforge.com/hytale/search?search=${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">${I.ext} CurseForge</a>`;
    const ci=MIXCONF.modInfo.get(name);
    const ovl=ci?` <span class="ovltag" data-tip="${esc(ci.join(", "))}">mixin overlap</span>`:"";
    let bad="", cfCell;
    if(compat==="INCOMPATIBLE"){
      bad=` <span class="ovltag badtag" data-tip="Declared server range ${esc(range||"?")} excludes the running server version.">incompatible</span>`;
      cfCell=`<span class="vtag v-bad">${esc(range||"?")}</span>`;
    } else if(compat==="MISSING"||compat==="PARSE_FAILED"){
      cfCell=`<span class="pkg" data-tip="No parseable server range in the manifest.">?</span>`;
    } else {
      cfCell=range?`<span class="vtag">${esc(range)}</span>`:`<span class="pkg">·</span>`;
    }
    const nameCell=isCore?esc(name):modNameLink(name,p[6]);
    return `<tr data-type="${isCore?'core':'community'}"><td class="nm">${nameCell}${bad}${ovl}</td><td class="pkg">${esc(author)}</td><td class="vtag">${esc(ver)}</td><td data-sval="${esc(range||"")}">${cfCell}</td><td>${isCore?'<span class="st NEUTRAL">Core</span>':'<span class="st RUNNABLE">Community</span>'}</td><td>${link}</td></tr>`;
  }).join("");
  return `<p class="lead"><b>${pl.length}</b> plugins loaded: <b>${core}</b> Hytale core, <b>${comm}</b> community.${incompat?` <b class="v-bad">${incompat}</b> built for another version.`:""}</p>
  ${filterBar("pl-t","plugins",pl.length,`<button type="button" class="chip tog" data-type-filter="pl-t" data-val="core" aria-pressed="false">${core} core</button><button type="button" class="chip tog on" data-type-filter="pl-t" data-val="community" aria-pressed="true">${comm} community</button>`)}
  <div class="tscroll"><div class="tcap"><table class="sortable" id="pl-t"><thead><tr>${thc("Plugin","Opens the website from the mod's manifest, or a CurseForge search when it has none.",{sort:"text"})}${thc("Author","Author or namespace",{sort:"text"})}${thc("Version","",{sort:"text"})}${thc("Compiled for","Server range from the mod's manifest, checked against the running server.",{sort:"text"})}${thc("Type","Hytale core engine module vs community plugin",{sort:"text"})}${thc("Link","Search for this plugin on CurseForge (external link)")}</tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="filter-empty" data-filter-empty="pl-t" role="status" hidden>No matches. <button type="button" class="copybtn" data-clear-filter="pl-t">Clear filters</button></div>`;
}

function settingsHtml(){
  const all=(D.diag||[]).filter(s=>s&&s.settings&&Array.isArray(s.entries)&&s.entries.length);
  const SHOWN=6;
  return all.map(s=>{
    const id=String(s.title).replace(/ settings$/,""), name=id.slice(id.indexOf(":")+1);
    const row=e=>`<div class="row"><span class="k"><span class="tnc2" data-tipov="${esc(e[0])}">${esc(e[0])}</span></span><span class="v">${esc(e[1])}</span></div>`;
    const rest=s.entries.slice(SHOWN);
    const more=rest.length?`<details class="setmore"><summary>Show all ${s.entries.length}</summary><div class="kv">${rest.map(row).join("")}</div></details>`:"";
    return `<div class="kvcard" style="margin-top:16px"><div class="kvh"><span class="ic">${I.doc}</span><b>${esc(name)} settings</b><small>${s.entries.length} reported${rest.length?`, ${rest.length} hidden`:""}</small></div><div class="kv">${s.entries.slice(0,SHOWN).map(row).join("")}</div>${more}</div>`;
  }).join("");
}

function assetPacksHtml(){
  const ap=D.assetPacks;
  if(!ap||!ap.length) return "";
  const incompat=ap.filter(p=>p[5]==="INCOMPATIBLE").length;
  const rows=ap.map(p=>{
    const author=p[0],name=p[1],ver=p[2],range=p[4]||null,compat=p[5]||null;
    const link=`<a class="cf" href="https://www.curseforge.com/hytale/search?search=${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">${I.ext} CurseForge</a>`;
    let bad="",cfCell;
    if(compat==="INCOMPATIBLE"){
      bad=` <span class="ovltag badtag" data-tip="Declared server range ${esc(range||"?")} excludes the running server version.">incompatible</span>`;
      cfCell=`<span class="vtag v-bad">${esc(range||"?")}</span>`;
    } else if(compat==="MISSING"||compat==="PARSE_FAILED"){
      cfCell=`<span class="pkg" data-tip="No parseable server range in the manifest.">?</span>`;
    } else {
      cfCell=range?`<span class="vtag">${esc(range)}</span>`:`<span class="pkg">·</span>`;
    }

  }).join("");
  return `<p class="lead"><b>${ap.length}</b> asset pack${ap.length===1?"":"s"} loaded from <code>mods</code>.${incompat?` <b class="v-bad">${incompat}</b> built for another version.`:""}</p>
  ${filterBar("ap-t","asset packs",ap.length)}
  <div class="tscroll"><div class="tcap"><table class="sortable" id="ap-t"><thead><tr>${thc("Asset pack","",{sort:"text"})}${thc("Author","Author or namespace",{sort:"text"})}${thc("Version","",{sort:"text"})}${thc("Compiled for","Server range from the pack's manifest, checked against the running server.",{sort:"text"})}${thc("Link","Search for this asset pack on CurseForge (external link)")}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function logHtml(){
  const log=D.log;
  if(!log||!log.length) return "";
  const grouped=[];
  for(const l of log){
    const prev=grouped[grouped.length-1];
    if(prev && prev[0]===l[0] && prev[1]===l[1] && prev[2]===l[2]) prev[3]++;

document.querySelectorAll("table.sortable").forEach(tbl=>{

    const type=th.dataset.sort, tb=tbl.querySelector("tbody");

    ths.forEach(x=>{x.classList.remove("asc","desc");if(x.dataset.sort)x.setAttribute("aria-sort","none");});

      return (sv!=null?sv:cell.textContent).trim().toLowerCase();
    };
    rows.sort((a,b)=>{
      const av=val(a), bv=val(b);
      if(type==="num")return asc?av-bv:bv-av;
      return asc?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
    });

  };

function buildMarkdown(){
  const T=DV.samples, ser=D.series||{}, L=[];
  L.push(`# Incident ${D.incident.id}`,"");
  L.push(`**${D.incident.severity.charAt(0)+D.incident.severity.slice(1).toLowerCase()}** · ${D.incident.triggerLabel}${has(D.incident.stallMs)?` · stalled ${fmtDur(D.incident.stallMs)}`:""}${D.incident.worldShort?` on world ${D.incident.worldShort}`:""}`);
  L.push(`Captured ${D.incident.created}${DV.win?` · window ${DV.win}`:""}${T?` · ${fmt(T)} CPU samples`:""}${has(D.incident.players)?` · ${D.incident.players} player${D.incident.players===1?"":"s"}`:""}`,"");
  const nums=vitalsText();
  if(nums.length) L.push(...nums.map(x=>`- ${x}`),"");
  if(has(D.incident.note)) L.push(`> ${D.incident.note}`,"");
  if(ZOOM&&(ZOOM.a>0||ZOOM.b<1)) L.push("> Diagnosis, CPU, hot methods, mods and the flame graph cover the entire recording, not the chosen time range.","");
  if(D.jfrUnavailableReason) L.push(`This bundle has no usable recording: ${D.jfrUnavailableReason}`,"");
  const diag=diagnosisText(true);
  if(diag.length){ L.push(`## Diagnosis`,...diag,""); }
  const capturedCards=[...document.querySelectorAll("#stalled .kvcard")];
  if(capturedCards.length){
    L.push(`## Captured diagnostics`,"");
    capturedCards.forEach(card=>{
      const head=card.querySelector(".kvh");
      L.push(`### ${head?head.textContent.trim():"Section"}`);
      card.querySelectorAll(".kv .row").forEach(r=>{
        const k=r.querySelector(".k"), v=r.querySelector(".v");
        L.push(`- **${k?k.textContent.trim():""}**: ${v?v.textContent.trim().replace(/\s*\n\s*/g," · "):""}`);
      });
      const pre=card.querySelector("pre");
      if(pre) L.push("```",pre.textContent.replace(/\s+$/,""),"```");
      L.push("");
    });
  }
  if(D.deadlocked&&D.deadlocked.length){
    L.push(`## Deadlock detected (${D.deadlocked.length} deadlocked threads)`);
    D.deadlocked.forEach(d=>L.push(`- ${d}`));
    L.push("");
  }
  if(D.sys){
    L.push(`## Environment`);
    if(D.sys.os) L.push(`- OS: ${D.sys.osShort||D.sys.os}`);
    if(D.sys.cpuBrand||has(D.sys.cpuCores)) L.push(`- CPU: ${D.sys.cpuBrand||""}${has(D.sys.cpuCores)?` (${D.sys.cpuCores} cores)`:""}${D.cpu?`, peak ${fixed(D.cpu.machMax,1)}%`:""}`);
    if(D.sys.jvm) L.push(`- JVM: ${D.sys.jvm}${DV.gcName?`, ${DV.gcName} GC`:""}`);
    if(D.sys.server||D.sys.hytale) L.push(`- Server: ${[D.sys.server,D.sys.hytale?"Hytale "+D.sys.hytale:null,D.hyboxVersion?"Hybox v"+D.hyboxVersion:null].filter(Boolean).join(" · ")}`);
    if(D.sys.disk&&has(D.sys.disk.total)&&D.sys.disk.total>0){
      let dl=`- Disk: ${fixed(gib(D.sys.disk.free),1)} GiB free of ${fixed(gib(D.sys.disk.total),1)} GiB`;
      if(DV.diskG){const st=sstat(DV.diskG);dl+=` (window min ${fixed(st.min,1)} / avg ${fixed(st.avg,1)} / max ${fixed(st.max,1)} GiB free)`;}
      L.push(dl);
      const dRisk=diskRisk();
      if(dRisk) L.push(`- WARNING: low disk space (${fixed(gib(dRisk.free),1)} GiB free of ${fixed(gib(dRisk.total),1)} GiB). The recording and incident bundles can fail to write.`);
    }
    {
      const dio=D.series||{};
      const dstat=s=>{const st=sstat(s.map(v=>v*1e6/MIB));return `min ${fixed(st.min,1)} / avg ${fixed(st.avg,1)} / max ${fixed(st.max,1)} MiB/s`;};
      const ps=[];
      if(dio.diskWrite) ps.push(`write ${dstat(dio.diskWrite)}`);
      if(dio.diskRead) ps.push(`read ${dstat(dio.diskRead)}`);
      if(ps.length) L.push(`- Disk I/O: ${ps.join(", ")}`);
    }
    if(has(D.sys.hostMemUsed)&&D.sys.hostMemUsed>=0&&has(D.sys.ramTotal)&&D.sys.ramTotal>0)
      L.push(`- Machine memory: ${fixed(gib(D.sys.hostMemUsed),1)} GiB of ${fixed(gib(D.sys.ramTotal),1)} GiB used`);
    if(D.sys.swap&&has(D.sys.swap.total)&&D.sys.swap.total>0){
      const swUsed=Math.max(0,D.sys.swap.total-(D.sys.swap.free||0));
      if(swUsed>0) L.push(`- Swap: ${fmtBytes(swUsed)} used of ${fmtBytes(D.sys.swap.total)}`);
    }
    if(D.sys.nonHeap&&has(D.sys.nonHeap.used))
      L.push(`- Non-heap: ${fmtBytes(D.sys.nonHeap.used)} used / ${fmtBytes(D.sys.nonHeap.committed)} committed`);
    if(D.net&&Array.isArray(D.net.others)&&D.net.others.length)
      D.net.others.forEach(o=>L.push(`- Net ${o[0]}: in ${fixed(Number(o[1]),1)}/${fixed(Number(o[2]),1)} · out ${fixed(Number(o[3]),1)}/${fixed(Number(o[4]),1)} Mbit/s (avg/peak)`));
    if(D.sys.container){
      const c=D.sys.container;
      const parts=[c.runtime,c.type,has(c.cpuLimit)&&c.cpuLimit>0?fixed(c.cpuLimit,1)+" cores":null,
        has(c.memLimit)&&c.memLimit>0?fmtBytes(c.memLimit)+" memory limit":null].filter(Boolean);
      if(parts.length) L.push(`- Container: ${parts.join(" · ")}`);
      const cRisk=containerRisk();
      if(cRisk) L.push(`- WARNING: the heap limit (-Xmx ${fixed(gib(cRisk.xmx),1)} GiB) is ${Math.round(100*cRisk.xmx/cRisk.lim)}% of the container's ${fixed(gib(cRisk.lim),1)} GiB. The container can kill the server. Set -Xmx to about 75% of the container limit.`);
    }
    L.push("");
  }
  const mdTable=(card,title)=>{
    const heads=[...card.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    L.push(`## ${title}`);
    card.querySelectorAll(".subnote,.simline").forEach(n=>L.push(n.textContent.trim()));
    if(heads.length){
      L.push("",`| ${heads.join(" | ")} |`,`|${heads.map(()=>"---").join("|")}|`);
      card.querySelectorAll("tbody tr:not([data-cmpnone])").forEach(tr=>L.push(`| ${[...tr.children].map(td=>(td.dataset.md||td.textContent).trim()).join(" | ")} |`));
    }
    L.push("");
  };
  const simCard=document.getElementById("similarcard");
  if(simCard) mdTable(simCard,"Similar incidents");
  const cmpCard=document.getElementById("cmpcard")||document.getElementById("usualcard");
  if(cmpCard) mdTable(cmpCard,cmpCard.querySelector("h3").textContent.trim());
  if(D.hotMethods&&D.hotMethods.length&&T){
    L.push(`## Hot methods`,"| # | Method | Samples | Self% |","|---|---|---|---|");
    D.hotMethods.slice(0,10).forEach((m,i)=>L.push(`| ${i+1} | ${m[1]} | ${fmt(m[0])} | ${fixed(pct(m[0],T),2)}% |`));
    L.push("");
  }
  if(D.hotThreads&&D.hotThreads.length&&T){
    const thm=D.hotThreads.some(ht=>ht.length>6);
    L.push(`## Hot threads`,`| Thread | Samples | CPU% | Top method |${thm?" Mods, own CPU |":""}`,`|---|---|---|---|${thm?"---|":""}`);
    D.hotThreads.slice(0,10).forEach(ht=>L.push(`| ${ht[2]} | ${fmt(ht[0])} | ${fixed(pct(ht[0],T),1)}% | ${ht[3]?leafName(ht[3]):"-"} |${thm?` ${threadMods(ht[6],ht[0]).map(m=>`${modShort(m[0])} ${fixed(pct(m[1],ht[0]),1)}%`).join(", ")||"-"} |`:""}`));
    L.push("");
  }
  if(D.subsystems&&D.subsystems.length&&T){
    L.push(`## CPU by engine subsystem`,"| Subsystem | Samples | Share |","|---|---|---|");
    D.subsystems.slice(0,10).forEach(s=>L.push(`| ${s[0]} | ${fmt(s[1])} | ${fixed(pct(s[1],T),1)}% |`));
    L.push("");
  }
  const modRows=D.modCpu&&D.modCpu.some(m=>m.length>4)?modSplit(D.modCpu,4):null;
  if(modRows&&modRows.length&&T){
    L.push(`## CPU by mod`,"The number is the cost: time in the mod's own code.","","| Mod | Own CPU | Samples | Self ran in |","|---|---|---|---|");
    const named=(m,l)=>m?m+(l?` (${l})`:""):"-";
    modRows.filter(m=>m.self>0).slice(0,10).forEach(m=>L.push(`| ${modShort(m.id)} | ${fixed(pct(m.self,T),1)}% | ${fmt(m.self)} | ${named(m.sm,m.sl)} |`));
    const lines=modRows.slice(0,10).map(m=>stackLine(m,T,"samples")).filter(Boolean);
    if(lines.length) L.push("",...lines.map(l=>`- ${l}`));
    L.push("");
  } else if(!modRows&&D.modCpu&&D.modCpu.length&&T){
    L.push(`## CPU by mod`,MOD_OLDER,"","| Mod | Samples | Share | Dominant method | Top threads |","|---|---|---|---|---|");
    D.modCpu.slice(0,10).forEach(m=>L.push(`| ${m[0]} | ${fmt(m[1])} | ${fixed(pct(m[1],T),1)}% | ${m[2]||"-"} | ${(m[3]&&m[3].length)?m[3].map(t=>`${thName(t)} ${fixed((100*t[1]/Math.max(1,m[1])),0)}%`).join(", "):"-"} |`));
    L.push("");
  }
  L.push(...modCostMarkdown());
  if(D.gcCauses&&D.gcCauses.length){
    L.push(`## GC causes`,"| Cause | Collections | Total pause ms |","|---|---|---|");
    D.gcCauses.forEach(c=>L.push(`| ${c[0]} | ${fmt(c[1])} | ${fixed(Number(c[2]),1)} |`));
    L.push("");
  }
  if(Array.isArray(D.memPools)&&D.memPools.length){
    const pv=v=>(has(v)&&v>=0)?fmtBytes(v):"-";
    L.push(`## Memory pools`,"| Pool | Used | Committed | Max | At last GC |","|---|---|---|---|---|");
    [...D.memPools].sort((a,b)=>((b[4]>=0)-(a[4]>=0))).slice(0,8).forEach(p=>
      L.push(`| ${p[0]} | ${pv(p[1])} | ${pv(p[2])} | ${pv(p[3])} | ${pv(p[4])} |`));
    L.push("");
  }
  if(D.alloc){
    const share=b=>D.alloc.total?` (${fixed(pct(b,D.alloc.total),1)}%)`:"";
    const top=(m,n)=>(m||[]).slice(0,n).map(e=>`- ${e[0]}: ${fmtBytes(e[1])}${share(e[1])}`);
    const modFresh=(D.alloc.byMod||[]).some(m=>m.length>2);
    const sub=top(D.alloc.bySubsystem,5);
    const mod=modFresh?modSplit(D.alloc.byMod,2).filter(m=>m.self>0).slice(0,5).map(m=>`- ${modShort(m.id)}: ${fmtBytes(m.self)}${share(m.self)} in its own code`):top(D.alloc.byMod,5);
    if(sub.length||mod.length){
      L.push(`## Allocated memory (sampled)`);
      if(sub.length){ L.push(`By subsystem:`); L.push(...sub); }
      if(mod.length){ L.push(`By mod:`,modFresh?"The number is the cost: memory the mod's own code allocated.":MOD_OLDER); L.push(...mod); }
      L.push("");
    }
  }
  if((D.retained||[]).some(r=>r[1]>=3)){
    const rows=D.retained.filter(r=>r[1]>=3).slice(0,10), sited=rows.some(r=>r[2]);
    L.push(`## Long-lived allocations (leak candidates)`);
    if(!sited) L.push(OLD_SITES_MD);
    L.push(sited?"| Class | Samples | Allocation site |":"| Class | Samples |",sited?"|---|---|---|":"|---|---|");
    rows.forEach(r=>L.push(sited?`| ${r[0]} | ${fmt(r[1])} | ${r[2]?r[2]+" ("+(r[3]||codeKind(r[2]))+")":"-"} |`:`| ${r[0]} | ${fmt(r[1])} |`));
    const pathed=rows.filter(r=>r[4]&&(r[4].holders.length||r[4].root));
    if(pathed.length){
      L.push("","Paths to GC roots, from the root down:");
      pathed.forEach(r=>{
        const c=r[4];
        const steps=c.holders.slice().reverse().map(h=>h.type+(h.ref==="array"?"[ ]":h.field?"."+h.field:"")+(h.ref==="static"?" (static)":"")+(h.mod?" ["+h.mod+"]":"")+(h.skip>0?" > "+h.skip+" more not recorded":""));
        const shown=steps.length>7?[...steps.slice(0,3),(steps.length-6)+" more steps",...steps.slice(-3)]:steps;
        const root=c.root?"GC root "+(c.root.type||"unknown")+(c.root.system?" ("+c.root.system+")":""):"GC root not found";
        L.push(`- ${r[0]}: ${[root,...shown,r[0]].join(" > ")} (${fmt(c.samples)} of ${fmt(r[1])} samples${c.mod?", "+c.mod:""})`);
      });
    }
    L.push("");
  }
  if(D.heapHistogram&&D.heapHistogram.length){
    L.push(`## Heap histogram (point in time)`,"| Class | Instances | Bytes |","|---|---|---|");
    D.heapHistogram.slice(0,10).forEach(h=>L.push(`| ${h[0]} | ${fmt(h[1])} | ${fmtBytes(h[2])} |`));
    L.push("");
  }
  if(D.slowIo&&D.slowIo.length){
    L.push(`## Slow file operations`,"| Path | Kind | Duration ms | Bytes |","|---|---|---|---|");
    [...D.slowIo].sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${r[3]} | ${fixed(Number(r[1]),0)} | ${fmtBytes(r[2])} |`));

  }
  if(D.tickSystems&&D.tickSystems.length){
    const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
    L.push(`## Engine systems (tick cost)`,"| System | World | avg 1m ms | max 1m ms | % of budget |","|---|---|---|---|---|");
    [...D.tickSystems].sort((a,b)=>b[2]-a[2]).slice(0,10).forEach(r=>
      L.push(`| ${r[0]} | ${worldLabel(r[1])} | ${fixed(Number(r[2]),2)} | ${fixed(Number(r[3]),2)} | ${fixed((100*r[2]/BUDGET),1)}% |`));
    L.push("");
  }
  if(D.pluginMetrics&&D.pluginMetrics.length){
    const cell=s=>String(s).replace(/\|/g,"\\|");
    L.push(`## Plugin metrics`,"Counters are rates per second (/s) between their first and last delta in the window. Window total is the sum of every delta in the window. Since start is the plugin's running total at its last update. A counter reported once has no rate (\"once\").","",
      "| Metric | Kind | Min | Avg | Max | Window total | Since start |","|---|---|---|---|---|---|---|");
    D.pluginMetrics.forEach(m=>{
      const rate=m.kind==="count"&&has(m.bucketSec), u=rate?"/s":"";
      const drawn=(m.series||[]).filter(v=>v!=null), ok=drawn.length>0;
      const st=ok?sstat(drawn):null, d=ok?autoDec(st.min,st.max,1):0;
      const f=v=>ok?fixed(Number(v),d)+u:(m.uncharted==="zero"?"0"+u:m.uncharted==="single"?"once":"-");
      const tot=m.kind==="count"&&has(m.total)?fmt(Math.round(m.total)):"-";
      const cum=has(m.cumulative)?fmt(Math.round(m.cumulative)):"-";
      L.push(`| ${cell(m.label||m.name)} | ${m.kind==="count"?"counter":m.kind} | ${f(st?st.min:0)} | ${f(st?st.avg:0)} | ${f(st?st.max:0)} | ${tot} | ${cum} |`);
    });
    L.push("");
  }
  if(Array.isArray(D.worldTps)&&D.worldTps.length){
    L.push(`## TPS by world`);
    D.worldTps.forEach(w=>{const st=sstat(w.series);L.push(`- ${worldLabel(w.name)}: avg ${fixed(st.avg,1)} / min ${fixed(st.min,1)} / max ${fixed(st.max,1)} TPS`);});
    L.push("");
  }
  if(DV.worlds.length&&T){
    const hasPct=DV.worlds.some(w=>has(w.msptP50)||has(w.msptP95)||has(w.msptMax));
    const pc=v=>has(v)&&v>=0?fixed(v,1):"-";
    L.push(`## Worlds`,
      hasPct?"| World | Kind | Tick time med | p95 | max | Samples | CPU% |":"| World | Kind | Samples | CPU% |",
      hasPct?"|---|---|---|---|---|---|---|":"|---|---|---|---|");
    DV.worlds.forEach(w=>{
      const base=`| ${worldLabel(w.name)}${w.stalled?" (stalled)":""} | ${String(w.name).indexOf("instance-")===0?"instance":"persistent"} |`;
      const tail=` ${has(w.samples)?fmt(w.samples):"-"} | ${has(w.samples)?fixed(pct(w.samples,T),1)+"%":"-"} |`;
      L.push(hasPct?base+` ${pc(has(w.msptP50)?w.msptP50:w.mspt)} | ${pc(w.msptP95)} | ${pc(w.msptMax)} |`+tail:base+tail);
    });
    L.push("");
  }
  if((D.entities&&D.entities.length)||ser.entities){
    L.push(`## Entities`);
    if(ser.entities){const st=sstat(ser.entities);L.push(`Total over window: min ${fmt(st.min)} / avg ${fmt(Math.round(st.avg))} / max ${fmt(st.max)}`);}
    (D.entities||[]).forEach(e=>L.push(`- ${worldLabel(e[0])}: ${(e[1]||[]).map(t=>`${t[0]} x${t[1]}`).join(", ")}`));
    L.push("");
  }
  if(D.plugins&&D.plugins.length){
    const incompat=D.plugins.filter(p=>p[5]==="INCOMPATIBLE");
    L.push(`## Plugins`,`${D.plugins.length} loaded: ${D.plugins.filter(p=>p[3]).length} Hytale core, ${D.plugins.filter(p=>!p[3]).length} community.`);
    incompat.forEach(p=>L.push(`- INCOMPATIBLE: ${p[1]} ${p[2]} declares server range ${p[4]||"?"}`));
    L.push("");
  }
  if(D.assetPacks&&D.assetPacks.length){
    L.push(`## Asset packs`,`${D.assetPacks.length} loaded`);
    D.assetPacks.forEach(p=>L.push(`- ${p[1]} ${p[2]}${p[5]==="INCOMPATIBLE"?` · INCOMPATIBLE (declares server range ${p[4]||"?"})`:""}`));
    L.push("");
  }
  if(MIXCONF.list&&MIXCONF.list.length){
    L.push(`## Mixin conflicts`);
    MIXCONF.list.forEach(c=>L.push(`- ${c[0]}: ${c[1].map(p=>p[1]?`${p[0]} (${p[1]})`:p[0]).join(" vs ")}`));
    L.push("");
  }
  if(D.mixins&&D.mixins.hyinit){
    const H=D.mixins.hyinit, probs=D.mixins.problems||[], ovl=D.mixins.overlaps||[];
    L.push(`## Mixins`,`Hyinit ${H.version||"?"} · Mixin ${H.mixin||"?"} · ${(D.mixins.sources||[]).length} early plugin JARs`);
    (D.mixins.sources||[]).forEach(s=>L.push(`- ${s[1]?String(s[1]).split(":").pop():s[0]} ${s[2]||""} (${s[0]}${s[3]?`, sha256 ${String(s[3]).slice(0,8)}`:""})${has(s[9])?`, Mixin apply time ${fmt(s[9])} ms at class load`:""}${has(s[10])?`, ${fmt(s[10])} Mixins off by the mod's settings`:""}`));
    probs.forEach(p=>{
      L.push(`- ${String(p[0]).toUpperCase()}: ${p[1]}${p[2]?` (${p[2]})`:""}`);
      const frame=Array.isArray(p[4])?p[4].find(l=>l[1]==="m"):null;
      if(frame) L.push(`  - First mod frame, ${frame[2]}: \`${String(frame[0]).trim()}\``);
    });
    ovl.slice(0,10).forEach(o=>L.push(`- Changed by more than one mod: ${o[0]} (${[...new Set((o[1]||[]).map(p=>p[0]))].join(", ")})`));
    L.push("");
  }
  if(Array.isArray(D.events)&&D.events.length){
    const byType={};
    D.events.forEach(e=>{
      const m=/×(\d+)$/.exec(e[2]||"");
      byType[e[1]]=(byType[e[1]]||0)+(m?parseInt(m[1],10):1);
    });
    L.push(`## Events in window`,Object.entries(byType).map(([k,v])=>`${v} ${k.startsWith("mod:")?EVLABEL[k]||k.slice(4):k==="othermods"?"from other mods":k.toUpperCase()}`).join(" · "),"");
  }
  return L.join("\n").trimEnd();
}
function vitalsText(){
  const v=D.vitals; if(!v) return [];
  const target=has(v.tpsTarget)&&v.tpsTarget>0?v.tpsTarget:30, budget=has(v.tickBudgetMs)&&v.tickBudgetMs>0?v.tickBudgetMs:1000/target;
  const list=a=>a.filter(Boolean).join(", "), out=[];
  if(has(v.tickAvgMs)||has(v.tickWorstMs)) out.push(`Tick time${vitalsIn()} ${list([has(v.tickAvgMs)?fixed(v.tickAvgMs,1)+" ms avg":null,has(v.tickWorstMs)?fixed(v.tickWorstMs,1)+" ms worst":null])} (budget ${fixed(budget,1)} ms)`);
  if(has(v.tpsAvg)||has(v.tpsMin)) out.push(`TPS${vitalsIn()} ${list([has(v.tpsAvg)?fixed(v.tpsAvg,1)+" avg":null,has(v.tpsMin)?fixed(v.tpsMin,1)+" min":null])} (target ${target})`);
  if(has(v.cpuServerAvg)||has(v.cpuMachineAvg)) out.push(`CPU ${list([has(v.cpuServerAvg)?"server "+fixed(v.cpuServerAvg,0)+"%":null,has(v.cpuMachineAvg)?"machine "+fixed(v.cpuMachineAvg,0)+"%":null])}`);
  if(has(v.heapPeak)) out.push(`Heap ${has(v.heapMax)&&v.heapMax>0?fixed(gib(v.heapPeak),1)+" of "+fixed(gib(v.heapMax),1)+" GiB":fixed(gib(v.heapPeak),1)+" GiB peak"}`);
  return out;
}
function buildSummary(){
  const g=diagnosisData(), T=DV.samples, sev=D.incident.severity.charAt(0)+D.incident.severity.slice(1).toLowerCase();
  const head=[`**${document.querySelector("header h1")?.textContent.trim()||D.incident.triggerLabel}**`,
    `${sev}, ${D.incident.triggerLabel}. Captured ${D.incident.created}${DV.win?`, window ${DV.win}`:""}. Incident ${D.incident.id}.`,
    ...vitalsText()];
  const ev=[...(g.cause?[causeLabel(g.cause)?`${causeLabel(g.cause)}: ${findingText(g.cause.spans)}`:findingText(g.cause.spans)]:[]),...g.why.map(e=>`- ${findingText(e.spans)}`)];
  if(!ev.length&&!g.other.length&&!D.jfrUnavailableReason) ev.push(`- ${NO_FINDINGS}`);
  const sim=D.history&&D.history.similar;
  if(sim&&sim.month>0) ev.push(`- ${findingText(sim.line)}`);
  const steps=g.steps.map((e,i)=>`${i+1}. ${findingText(e.spans)}`);
  const mods=T&&T>=300?modSplit(D.modCpu,4).filter(m=>m.self>0&&m.id!==CAPTURE_MOD&&!/^(com\.hypixel\.|Hytale:)/.test(m.id)).slice(0,3)
    .map(m=>`- ${m.id.slice(m.id.indexOf(":")+1)} ${fixed(pct(m.self,T),1)}% self, ${fixed(pct(m.total,T),1)}% total`):[];
  const costRows=modCostRows().length&&!modCostLow()?modCostRows().filter(r=>r.own>0):[], mixinMods=costRows.slice(0,3)
    .map(r=>`- ${modCostLabel(r,costRows)} ${modCostAmount(r.own)} of world thread samples in its own Mixin code`);
  const blocks=[head,ev.length?[g.cause||!g.why.length?"**Diagnosis**":"**Notable**",...ev]:[],steps.length?["**Next steps**",...steps]:[],mods.length?["**Mods by own CPU**",...mods]:[],mixinMods.length?["**Mixin code by mod**",...mixinMods]:[]];
  const text=()=>blocks.filter(b=>b.length).map(b=>b.join("\n")).join("\n\n");
  let out=text();
  while(out.length>1990){
    const b=[blocks[4],blocks[3],blocks[2],blocks[1]].find(x=>x.length>2);
    if(!b) return out.slice(0,1989)+"…";
    b.pop(); out=text();
  }
  return out;
}
function copyButton(id,label,build){
  const btn=$("#"+id); if(!btn) return;
  btn.addEventListener("click",async()=>{
    const text=build();
    let ok=true;
    try{ await navigator.clipboard.writeText(text); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{ok=document.execCommand("copy");}catch(_){ok=false;} ta.remove();btn.focus({preventScroll:true}); }
    btn.classList.add(ok?"ok":"fail"); btn.innerHTML=ok?`${I.check} Copied`:`${I.warn} Copy failed`;
    setTimeout(()=>{btn.classList.remove("ok","fail"); btn.innerHTML=`${I.copy} ${label}`;},ok?1600:3200);
  });
}

const TIP=document.createElement("div");TIP.id="tipbox";TIP.setAttribute("role","tooltip");document.body.appendChild(TIP);
let TIP_ANCHOR=null;
function hideTip(){
  if(TIP_ANCHOR){
    const ids=(TIP_ANCHOR.getAttribute("aria-describedby")||"").split(/\s+/).filter(id=>id&&id!=="tipbox");
    if(ids.length)TIP_ANCHOR.setAttribute("aria-describedby",ids.join(" "));else TIP_ANCHOR.removeAttribute("aria-describedby");
  }
  TIP_ANCHOR=null;TIP.style.display="none";
}
function showTip(a){
  if(!a||!a.getAttribute("data-tip")){hideTip();return;}
  if(a===TIP_ANCHOR)return;
  hideTip();TIP_ANCHOR=a;TIP.textContent=a.getAttribute("data-tip");TIP.style.display="block";
  a.setAttribute("aria-describedby",((a.getAttribute("aria-describedby")||"")+" tipbox").trim());
  const r=a.getBoundingClientRect(),tw=TIP.offsetWidth,th=TIP.offsetHeight,m=8;
  const x=Math.max(m,Math.min(innerWidth-tw-m,r.left+r.width/2-tw/2));
  let y=r.bottom+9;if(y+th>innerHeight-m)y=r.top-th-9;
  TIP.style.left=x+"px";TIP.style.top=Math.max(m,Math.min(y,innerHeight-th-m))+"px";
}
document.addEventListener("mouseover",e=>{
  if(e.target.closest?.(".bbtipcv"))return;
  showTip(e.target.closest?.("[data-tip]")||document.activeElement.closest?.("[data-tip]"));
});
document.addEventListener("mouseout",e=>{
  if(TIP_ANCHOR&&!TIP_ANCHOR.contains(e.relatedTarget)&&!TIP_ANCHOR.contains(document.activeElement))hideTip();
});
document.addEventListener("focusin",e=>showTip(e.target.closest?.("[data-tip]")));
document.addEventListener("focusout",hideTip);
document.addEventListener("keydown",e=>{

    hideTip();
    clearChartHover();

});
document.addEventListener("scroll",()=>{

  if(anchor&&anchor.contains(document.activeElement))showTip(anchor);
