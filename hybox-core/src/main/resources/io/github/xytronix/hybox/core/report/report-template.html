<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b0b0b'/%3E%3Cg fill='%23FFD21F' stroke='%230b0b0b' stroke-width='12' stroke-linejoin='round'%3E%3Cpath d='M136 230 L256 170 L186 136 L66 196 Z'/%3E%3Cpath d='M136 230 L256 170 L256 290 Z' fill='%239A7600'/%3E%3Cpath d='M256 170 L376 230 L256 290 Z' fill='%23C79A00'/%3E%3Cpath d='M256 170 L376 230 L446 196 L326 136 Z'/%3E%3Cpath d='M270 40 L216 142 L254 142 L232 222 L306 108 L266 108 L302 40 Z'/%3E%3Cpath d='M136 230 L256 290 L256 432 L136 372 Z'/%3E%3Cpath d='M256 290 L376 230 L376 372 L256 432 Z'/%3E%3Cpath d='M136 230 L256 290 L200 334 L80 274 Z'/%3E%3Cpath d='M256 290 L376 230 L432 274 L312 334 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f0f0f; --bg2:#141414; --panel:#191919; --panel2:#1f1f1f; --panelh:#262626; --code:#0b0b0b;
    --border:#2b2b2b; --border2:#383838; --border3:#474747;
    --tx:#ece9e2; --tx2:#bdb8ad; --tx3:#a29d93; --tx4:#948f86;
    --accent:#ffd21f; --accent-h:#ffe066; --on-accent:#0b0b0b;
    --good:#4cc38a; --warn:#ff8a3d; --bad:#f0626b; --crit:#ff4d5e; --neutral:#8f8a81; --shadow:rgba(0,0,0,.5);
    --ev-gc:#ece9e2; --ev-plugin:#d9c48c; --ev-conn:#a29d93; --mark-profile:#ece9e2;
    --ev-mod1:#b39a6b; --ev-mod2:#c9a740; --ev-mod3:#fff0b3; --ev-mod4:#7d776d;
    --st-wait:#a29d93; --st-timed:#6b665e; --st-new:#ece9e2; --st-term:#7d776d;
    --fl-other:#bdb8ad; --fl-engine:#d9c48c; --fl-mod:var(--accent); --fl-jdk:#8f8a81;
    --s1:var(--accent); --s2:#ece9e2; --s3:#c9a740; --s4:#a29d93; --s5:#7d776d; --s6:#d9c48c; --s7:#fff0b3;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    --r:9px;
  }
  *{box-sizing:border-box;scrollbar-color:var(--border2) var(--bg2);scrollbar-width:thin}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border3)}
  ::-webkit-scrollbar-corner{background:var(--bg2)}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--tx)}
  svg{display:block}
  button,input,select{font:inherit}
  input::placeholder{color:var(--tx4);opacity:1}
  button{color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
  button:disabled{cursor:default;color:var(--tx3)}
  :focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}
  .tscroll :focus-visible,.codewrap :focus-visible,.kvcard :focus-visible,.ttwrap :focus-visible,.logscroll :focus-visible{outline-offset:-2px}
  [hidden]{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  .mono{font-family:var(--mono)}

  .wrap{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1560px;margin:0 auto;min-height:100vh}
  .nav{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--border);padding:0;overflow-y:auto;background:var(--bg2)}
  .main{min-width:0;padding:0 40px 140px}
  .menu-toggle{display:none}
  .main,.sbody,.card,.chartcard,.kvcard,.diag>*,.mgrid>*,.syscols>*,.charts2>*{min-width:0}
  .main{overflow-wrap:anywhere}

  .brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
  .brand .logo{width:34px;height:34px;flex:none}
  .brand b{font-size:13px;letter-spacing:.07em;color:var(--tx);display:block}
  .brand small{display:block;color:var(--tx4);font-size:12px;margin-top:1px}
  .navlist{list-style:none;margin:0;padding:10px 12px}
  .navlist a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:7px;color:var(--tx2);font-size:12.5px;transition:.12s;position:relative}
  .navlist a .nic{color:var(--tx4);display:grid;place-items:center;width:16px;height:16px;flex:none}
  .navlist a:hover{background:var(--panel);color:var(--tx)}
  .navlist a:hover .nic{color:var(--tx2)}
  .navlist a.on{background:var(--panel2);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
  .navlist a.on .nic{color:var(--accent)}
  .navlist a .nct{margin-left:auto;color:var(--tx4);font-size:12px;font-family:var(--mono)}
  .navfoot{padding:16px 20px;color:var(--tx4);font-size:12px;line-height:1.8;border-top:1px solid var(--border);margin-top:6px}
  .navfoot b{color:var(--tx3)}
  .navfoot .nw{white-space:nowrap}
  .navfoot p{margin:8px 0 0;line-height:1.55}
  .navfoot a{color:var(--accent)}
  .navfoot a:hover{color:var(--accent-h);text-decoration:underline}

  header{padding:30px 0 24px;border-bottom:1px solid var(--border)}
  .hl-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .hl-pills{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .hl-end{display:flex;align-items:center;gap:14px;flex:none;margin-left:auto;min-height:30px}
  @media(max-width:820px){.hl-top{flex-wrap:wrap}.hl-end{margin-left:0}}
  .badge{font-weight:700;font-size:12px;padding:6px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:8px}
  .badge.warn{background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
  .badge.crit{background:color-mix(in srgb,var(--crit) 8%,transparent);color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 50%,transparent)}
  .badge.info{background:transparent;color:var(--tx3);border:1px solid var(--border3)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill{font-size:11.5px;color:var(--tx2);background:var(--panel);border:1px solid var(--border);padding:5px 11px;border-radius:20px;display:inline-flex;gap:7px;align-items:center}
  .pill b{color:var(--tx)}
  .incid{color:var(--tx3);font-size:12px;font-family:var(--mono);white-space:nowrap}
  .incid b{color:var(--tx2)}
  h1{font-size:29px;font-weight:680;letter-spacing:-.015em;margin:6px 0 2px;color:var(--tx);line-height:1.2;overflow-wrap:anywhere}
  h1 .ms{color:var(--warn)}
  .subhead{color:var(--tx2);font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
  .subhead code{font-family:var(--mono);color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);padding:1px 6px;border-radius:5px;font-size:12px}

  .envstrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .echip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 13px;position:relative;min-width:0;max-width:100%}
  .echip .eic{width:22px;height:22px;display:grid;place-items:center;color:var(--tx2);flex:none}
  .echip .el{font-size:12px;color:var(--tx4)}
  .echip .ev{font-size:12.5px;color:var(--tx);font-weight:600;margin-top:1px}
  .vitals{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .vital{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 14px;min-width:0;max-width:100%}
  .vital .vv{font-size:12.5px;color:var(--tx2);line-height:1.4}
  .vital .vn{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
  .vital .vn small{font-size:12px;font-weight:500;margin-left:2px}
  .vital .vn.v-bad{color:var(--bad)}
  .vital .vn.v-warn{color:var(--warn)}
  .vital .vl{font-size:12px;color:var(--tx3);margin-top:3px}

  section{padding:30px 0;border-bottom:1px solid var(--border);scroll-margin-top:8px}
  .section-heading{margin:0 0 20px}
  .sh{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;user-select:none;font-size:16px;font-weight:650;color:var(--tx);letter-spacing:.005em}
  .sh .sic{width:26px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;color:var(--tx2);flex:none}
  .sh .num{font-size:12px;color:var(--tx4);font-family:var(--mono)}
  .sh .sub{color:var(--tx4);font-size:12px;font-weight:400;margin-left:2px}
  .sh .chev{margin-left:auto;color:var(--tx4);transition:.2s}
  .sh:hover .sic{border-color:var(--border3);color:var(--tx)}
  .sh:hover .chev{color:var(--tx)}
  section.collapsed .chev{transform:rotate(-90deg)}
  section.collapsed .sbody{display:none}

  .lead{color:var(--tx2);font-size:13.5px;line-height:1.65;margin:-6px 0 20px;max-width:880px}
  .lead b{color:var(--tx)}
  .lead .hot{color:var(--tx);font-weight:600}

  .recording-scope{display:none;color:var(--tx3);border:1px solid var(--border3);border-radius:5px;padding:3px 7px;font-size:12px;font-weight:500;line-height:1.5;margin:0 0 12px}
  .has-time-filter .recording-scope{display:inline-flex}
  .cth .recording-scope{margin:0}
  .filter-empty{padding:18px;color:var(--tx2);border:1px solid var(--border);border-radius:8px}
  .filter-empty[hidden]{display:none}
  .diag{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
  @media(max-width:1080px){.diag{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:8px}
  .card h3 .ic{color:var(--tx3)}
  .findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .findings li{display:flex;gap:11px;font-size:12.5px;color:var(--tx2);line-height:1.5;align-items:flex-start}
  .findings li .fi{flex:none;margin-top:1px;color:var(--tx3)}
  .findings li b{color:var(--tx)}
  .diag.one{grid-template-columns:1fr}
  details.adv{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2)}
  details.adv>summary{cursor:pointer;list-style:none;padding:12px 15px;font-size:12.5px;color:var(--tx3);display:flex;gap:8px;align-items:baseline;border-radius:var(--r)}
  details.adv>summary:hover,details.adv[open]>summary{color:var(--tx)}
  details.adv>summary:hover::before{color:var(--tx)}
  details.adv>summary::-webkit-details-marker{display:none}
  details.adv>summary::before{content:"\25B8";color:var(--tx4);font-size:10px;transition:.15s}
  details.adv[open]>summary::before{transform:rotate(90deg)}
  details.adv>summary small{font-size:12px;color:var(--tx4)}
  details.adv>.advbody{padding:0 15px 15px}
  details.adv>.advbody>:first-child{margin-top:0}

  .factstrip{display:flex;gap:10px;flex-wrap:wrap;margin:-2px 0 16px}
  .factstrip .pill svg{color:var(--tx4)}
  .mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media(max-width:1080px){.mgrid{grid-template-columns:1fr}}
  .mcard .cic{display:inline-grid;place-items:center;width:16px;height:16px;color:var(--tx4);margin-right:8px;flex:none}
  .mcard .ctt{display:inline-flex;align-items:center}
  .mstats{font-family:var(--mono);font-size:12px;color:var(--tx4);display:inline-flex;flex-wrap:wrap;align-items:baseline}
  .mstats b{color:var(--tx2);font-weight:600}
  .mstats .mnow b{color:var(--tx);font-size:12.5px}
  .mstats .mnow .mu2{color:var(--tx4);font-size:12px}
  .mstats .msep{padding:0 5px;color:var(--tx4)}
  .mstats .munit{color:var(--tx4);margin-left:4px}
  .mstats .munit.pc{margin-left:0}
  .mstats b.v-warn{color:var(--warn)}
  .v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-bad{color:var(--bad)}
  .vword{font-family:var(--sans);font-size:11.5px;margin-left:4px}

  [data-tip]{cursor:help}
  #tipbox{position:fixed;display:none;max-width:min(300px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:7px;padding:8px 11px;
    font-size:12px;font-weight:400;line-height:1.5;color:var(--tx2);text-transform:none;letter-spacing:0;text-align:left;z-index:99;
    box-shadow:0 14px 34px var(--shadow);white-space:normal;pointer-events:none;overflow-wrap:anywhere;font-family:var(--sans)}
  thead th .thl{cursor:help}

  .charts2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
  @media(max-width:1080px){.charts2{grid-template-columns:1fr}}
  .chartcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column}
  .chartcard .cth{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px;flex-wrap:wrap}
  .chartcard .ctt{font-size:12.5px;color:var(--tx);font-weight:600}
  .chartcard .ctm{font-size:12px;color:var(--tx4);font-family:var(--mono)}
  .chartholder{position:relative;flex:1 1 auto;min-width:0;touch-action:pan-y pinch-zoom}
  .chartholder svg{width:100%;height:100%;display:block;overflow:hidden;cursor:crosshair}
  .axlab{fill:var(--tx4);font-size:12px;font-family:var(--mono)}
  .gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
  .refline{stroke:var(--tx3);stroke-width:1;stroke-dasharray:6 4}
  .reflab{fill:var(--tx3);font-size:12px;font-family:var(--mono);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
  .ch-guide,.ch-dot{transition:opacity .08s;pointer-events:none}
  .chtip{position:fixed;left:0;top:0;width:max-content;max-width:min(360px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:6px;padding:5px 9px;font-size:12px;font-family:var(--mono);color:var(--tx2);pointer-events:none;z-index:95;box-shadow:0 8px 22px var(--shadow);text-align:left;overflow-wrap:anywhere}
  .chtip b{color:var(--tx)}
  .chtip[hidden]{display:none}
  .chtip .ctl{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12px;line-height:1.35}
  .chtip .ctl .cdot{width:6px;height:6px;border-radius:50%;flex:none}
  .chtip .ctl .ctxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:290px}
  .chtip .ctl.cinc .ctxt{color:var(--bad)}
  .chtip .ctl.cmore .ctxt{color:var(--tx4)}

  .wbars{display:flex;flex-direction:column;gap:10px}
  .wbar{display:grid;grid-template-columns:minmax(0,32%) minmax(0,1fr) minmax(0,130px);align-items:center;gap:12px;font-size:12px}
  .wbar .wn{color:var(--tx2);display:flex;align-items:flex-start;gap:7px;min-width:0;line-height:1.35}
  .wbar .wn svg{flex:none;margin-top:1px}
  .wbar .wn span{overflow-wrap:anywhere}
  .wbar.stall .wn{color:var(--warn)}
  .wbar .wt{height:13px;background:var(--bg2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
  .wbar .wf{height:100%;border-radius:4px;background:var(--s1)}
  .wbar.stall .wf{background:var(--warn)}
  .wbar .wv{text-align:right;color:var(--tx3);font-family:var(--mono);font-size:12px}

  .donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .legend{display:flex;flex-direction:column;gap:9px}
  .legend .lg{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2)}
  .legend .lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .lg b{color:var(--tx);font-family:var(--mono);margin-left:auto;padding-left:18px}

  .tbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .tbar input{background:var(--bg2);border:1px solid var(--border2);color:var(--tx);font-family:var(--mono);font-size:12px;padding:7px 11px 7px 32px;border-radius:7px;width:100%;min-width:0}
  .tbar .srch{position:relative;flex:0 1 250px;min-width:0;max-width:100%}
  .tbar .srch .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx4)}
  .tbar input:hover,.flamebar input:hover{border-color:var(--border3)}
  .tbar input:focus,.flamebar input:focus{border-color:var(--accent)}
  .tbar .chip{font-size:12px;color:var(--tx2);background:var(--panel);border:1px solid var(--border);padding:5px 10px;border-radius:20px}
  .tbar .count{color:var(--tx4);font-size:12px;margin-left:auto;font-family:var(--mono)}
  .tbar .chip.tog{cursor:pointer;transition:.12s}
  .tbar .chip.tog:hover{border-color:var(--border3);background:var(--panelh);color:var(--tx)}
  .tbar .chip.tog.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .tbar .chip.tog.on:hover{background:var(--accent-h);border-color:var(--accent-h)}

  .tscroll{border:1px solid var(--border);border-radius:var(--r);overflow:auto;max-width:100%}
  .tcap{max-height:540px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{position:sticky;top:0;background:var(--bg2);color:var(--tx3);font-weight:600;font-size:12px;text-align:left;padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
  thead .sortbtn{font:inherit;display:inline-flex;align-items:center;min-height:24px}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.r{text-align:right}
  thead th.sortable:hover,thead th.asc,thead th.desc{color:var(--tx)}
  thead th .ar{opacity:0;font-size:9px;margin-left:4px;color:var(--accent)}
  thead th.asc .ar,thead th.desc .ar{opacity:1}
  thead th.asc .ar::after{content:"▲"} thead th.desc .ar::after{content:"▼"}
  tbody td{padding:8px 13px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:var(--mono);font-size:11.5px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:color-mix(in srgb,var(--tx) 3%,transparent)}
  td.r{text-align:right}
  .rank{color:var(--tx4);width:30px}
  .nm{color:var(--tx);font-family:var(--sans);font-weight:500}
  .cls{color:var(--tx2)} .leaf{color:var(--tx)}
  .pkg{color:var(--tx4)}
  .st{font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid}
  .st.RUNNABLE{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 7%,transparent)}
  .st.WAITING{color:var(--tx3);border-color:var(--border3)}
  .st.TIMED_WAITING{color:var(--tx4);border-color:var(--border2)}
  .st.STALL{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);letter-spacing:0}
  .st.BLOCKED{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,transparent)}
  .st.NEUTRAL{color:var(--tx3);border-color:var(--border2)}
  .pcount{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--tx3);background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:0 7px;line-height:18px;vertical-align:middle}
  .pcount .plk{display:inline-flex;color:var(--tx4)}
  .pcount .plk svg{width:12px;height:12px}
  .pcount b{color:var(--tx2);font-weight:600}
  .pcount[data-tip]{cursor:help}
  .pcount.z{color:var(--tx3)}
  .pct{color:var(--tx3)}
  tr.hl td{background:color-mix(in srgb,var(--warn) 7%,transparent)!important}
  .nm.stallname{color:var(--warn);cursor:help}
  .vtag{font-family:var(--mono);color:var(--tx2)}

const DV=(()=>{
  const worlds=D.worlds||[];
  const sampled=worlds.filter(w=>has(w.samples)&&w.samples>0);
  const ranked=[...sampled].sort((a,b)=>b.samples-a.samples);
  const stalled=worlds.find(w=>w.stalled)||null;
  const rankedAll=[...worlds].sort((a,b)=>(b.samples||0)-(a.samples||0));
  const ser=D.series||{};
  const heapG=ser.heap?ser.heap.map(gib):null;
  const rssG=ser.rss?ser.rss.map(gib):null;
  const diskG=ser.disk?ser.disk.map(gib):null;
  const hostMemG=ser.hostMem?ser.hostMem.map(gib):null;
  const seriesLen=Math.max(0,...Object.values(ser).filter(a=>Array.isArray(a)&&a.length>1).map(a=>a.length));
  const bucketSec=(has(D.incident.windowSec)&&D.incident.windowSec>0&&seriesLen>1)?D.incident.windowSec/seriesLen:null;
  return {
    worlds, ranked, topWorld:ranked[0]||null, stalled,
    stalledRank: stalled?rankedAll.indexOf(stalled)+1:0,
    deadlock:Array.isArray(D.deadlocked)&&D.deadlocked.length>0,
    lowLoad:(D.incident.samples||0)<300,
    heapG, rssG, diskG, hostMemG, perMin:bucketSec?60/bucketSec:null, per:bucketSec?" per "+fmtDur(bucketSec*1000):" per sample",
    win:has(D.incident.windowSec)?fmtDur(D.incident.windowSec*1000):null,
    span:(D.incident.recStart&&has(D.incident.windowSec))?{from:D.incident.recStart,to:secToHms(hmsToSec(D.incident.recStart)+D.incident.windowSec)}:null,
    incMarker:has(D.incident.markerFrac)?{label:has(D.incident.stallMs)?("stall "+fmtDur(D.incident.stallMs)):D.incident.triggerLabel,
      frac:D.incident.markerFrac,
      recoverySec:has(D.incident.recoverySec)?D.incident.recoverySec:null,kind:'incident'}
      :has(D.incident.profileFrac)?{label:'profile start',frac:D.incident.profileFrac,recoverySec:null,kind:'profile'}:null,
    gcName:D.sys?gcDisplayName(D.sys.gcYoung,D.sys.gcOld):null,
    samples:D.incident.samples||null
  };
})();

function modOfConfig(cfg){
  const base=String(cfg).toLowerCase().replace(/\.mixins\.json$/,"").replace(/^_+/,"");
  let best=null;
  if(base.length>=3){
    (D.plugins||[]).forEach(p=>{
      const nm=String(p[1]||""), nml=nm.toLowerCase(), aul=String(p[0]||"").toLowerCase();
      if(nml.includes(base)||(nml.length>=3&&base.includes(nml))||(aul.length>=3&&aul.includes(base))){
        if(!best||nm.length<best.length) best=nm;
      }
    });
  }
  if(best) return best;
  if(D.mixins&&D.mixins.bootstrapper){
    const bs=String(D.mixins.bootstrapper).split(" ")[0], bsl=bs.toLowerCase();
    if(bsl.includes(base)||base.includes(bsl)) return bs;
  }
  return String(cfg);
}
const MIXCONF=(()=>{
  const raw=(D.mixins&&Array.isArray(D.mixins.conflicts))?D.mixins.conflicts:null;
  const byConfig=new Set(), modInfo=new Map();
  let list=null;
  if(raw){
    list=raw.map(c=>[c[0],(c[1]||[]).map(p=>Array.isArray(p)?[p[0],p[1]??null]:[p,null])]);
    list.forEach(c=>{
      const shortT=String(c[0]).split(".").pop();
      c[1].forEach((p,pi)=>{
        byConfig.add(p[0]);
        const mod=modOfConfig(p[0]);
        const others=c[1].filter((_,j)=>j!==pi).map(q=>modOfConfig(q[0])).join(" + ");
        const line=`${p[1]||p[0]} ↔ ${others} on ${shortT}`;
        if(!modInfo.has(mod)) modInfo.set(mod,[]);
        modInfo.get(mod).push(line);
      });
    });
  }
  return {list,byConfig,modInfo};
})();

function containerRisk(){
  const c=D.sys&&D.sys.container;
  if(!c||!has(c.memLimit)||c.memLimit<=0) return null;
  if(!has(D.sys.xmxBytes)||D.sys.xmxBytes<=0) return null;
  return D.sys.xmxBytes>0.9*c.memLimit?{xmx:D.sys.xmxBytes,lim:c.memLimit}:null;
}
function diskRisk(){
  const d=D.sys&&D.sys.disk;
  if(!d||!has(d.free)||!has(d.total)||d.total<=0) return null;
  return (d.free<0.05*d.total||d.free<2*1024*1024*1024)?{free:d.free,total:d.total}:null;
}
function sliceAvg(arr,a,b){
  const N=arr.length;
  let i0=Math.max(0,Math.floor(a*(N-1))), i1=Math.min(N-1,Math.ceil(b*(N-1)));
  if(i1<i0) i1=i0;
  let s=0,n=0;
  for(let i=i0;i<=i1;i++){s+=arr[i];n++;}
  return n?s/n:null;
}

      delta=`<span class="${cls}">${d>0?"+":""}${Math.abs(d)>=100?d.toFixed(0):d.toFixed(1)}%${word?`<span class="vword">${word}</span>`:""}</span>`;
    }
    return {flag:!!word,html:`<tr data-cmp="${esc(l)}" data-base="${base.toFixed(4)}" data-inc="${inc.toFixed(4)}"><td class="nm">${esc(l)}</td><td class="r">${withU(base,dec,u)}</td><td class="r">${withU(inc,dec,u)}</td><td class="r">${delta}</td></tr>`};
  }
  const rows=metrics.map(m=>cmpRow(m.l,sliceAvg(m.s,0,b1),sliceAvg(m.s,ia,1),m.u,m.dec,m.bad));
  if(Array.isArray(D.events)&&has(D.incident.windowSec)&&D.incident.windowSec>0){
    const wMin=D.incident.windowSec/60;
    const cnt=(a,b)=>D.events.reduce((s,e)=>{
      if(e[1]!=="error"||e[0]<a||e[0]>=b) return s;
      const m=/ ×(\d+)$/.exec(String(e[2]));
      return s+(m?+m[1]:1);
    },0);
    const bm=b1*wMin, im=(1-ia)*wMin;
    if(bm>0&&im>0) rows.push(cmpRow("Log errors",cnt(0,b1)/bm,cnt(ia,1.0001)/im,"/min",1,"up"));
  }
  if(Array.isArray(D.tickSeries)&&D.tickSeries.length){
    [...D.tickSeries]
      .map(ts=>({ts,avg:ts.series.reduce((a,v)=>a+v,0)/(ts.series.length||1)}))
      .sort((a,b)=>b.avg-a.avg).slice(0,3)
      .forEach(x=>{rows.push(cmpRow(x.ts.name,sliceAvg(x.ts.series,0,b1),sliceAvg(x.ts.series,ia,1),"ms",1,"up"));});
  }
  const all=rows.filter(Boolean);
  if(!all.length) return "";
  const flagged=all.filter(r=>r.flag), rest=all.filter(r=>!r.flag);
  const none=flagged.length?"":`<tr data-cmpnone><td colspan="4" class="pkg">No metric got better or worse by 5% or more.</td></tr>`;
  const more=rest.length?`<tbody id="cmp-more" hidden>${rest.map(r=>r.html).join("")}</tbody>`:"";
  const btn=rest.length?`<button type="button" class="copybtn cmpmore" data-cmpmore data-label="All metrics (${all.length})" aria-expanded="false" aria-controls="cmp-more">All metrics (${all.length})</button>`:"";
  return `<div class="card cmpwrap" id="cmpcard"><h3><span class="ic">${I.clock}</span> Baseline vs ${term} window</h3>
    <div class="subnote">Baseline is the first ${Math.round(b1*100)}% of the recording. ${Term} is from just before the marker ${recov?"through recovery":"to the end"}.</div>
    <div class="tscroll"><table><thead><tr>${thc("Metric","")}${thc("Baseline avg","",{r:true})}${thc(Term+" avg","",{r:true})}${thc("Delta","Marked worse or better when the change is 5% or more in a direction that matters for this metric.",{r:true})}</tr></thead><tbody>${none}${flagged.map(r=>r.html).join("")}</tbody>${more}</table></div>${btn}</div>`;
}
function diagnosisHtml(){
  const f=D.findings||{}, cmp=comparisonHtml();
  const evidence=Array.isArray(f.evidence)?f.evidence:[], steps=Array.isArray(f.steps)?f.steps:[];
  if(!evidence.length&&!steps.length) return cmp;
  const hasFlame=!!(D.flame&&Array.isArray(D.flame)&&Array.isArray(D.flame[2])&&D.flame[2].length);
  const links={cpu:"#cpu",methods:"#methods",worlds:"#worlds",memory:"#memory",states:"#states",metrics:"#metrics",system:"#system",plugins:"#plugins",mixins:"#mixins",config:"#config",log:"#log"};
  if(hasFlame) links.flame="#flame";
  const attrs=e=>{
    if(e.section!=="flame") return "";
    const c=(e.spans||[]).find(s=>s[1]==="code");
    return c?` data-flamegroup="${esc(threadGroup(c[0]))}"`:"";
  };
  const spans=(items,entry)=>(items||[]).map(s=>{
    const value=esc(s[0]), styled=s[1]==="b"?`<b>${value}</b>`:s[1]==="code"?`<code>${value}</code>`:value;
    return entry&&links[entry.section]&&s[0]===entry.label?`<a href="${links[entry.section]}"${attrs(entry)}>${styled}</a>`:styled;
  }).join("");
  const ev=evidence.map(e=>`<li><span class="fi">${I.fire}</span><span>${spans(e.spans)}${links[e.section]?` <a class="evlink" href="${links[e.section]}"${attrs(e)}>${esc(e.label)}</a>`:""}</span></li>`).join("");
  const stepHtml=steps.map(e=>`<li>${spans(e.spans,e)}</li>`).join("");
  const left=ev?`<div class="card"><h3><span class="ic">${I.warn}</span> Evidence</h3><ul class="findings">${ev}</ul></div>`:"";
  const right=stepHtml?`<div class="card"><h3><span class="ic">${I.pulse}</span> Next steps</h3><ol class="nextsteps">${stepHtml}</ol></div>`:"";
  return `<div class="diag${left&&right?"":" one"}">${left}${right}</div>`+cmp;
}

function statsInner(o){
  const d=autoDec(o.min,o.max,o.dec), f=v=>Number(v).toFixed(d);
  const flag=(cls,word)=>cls?`<span class="vword ${cls}">${word}</span>`:"";
  const parts=[];
  const total=o.nowLabel==="total";
  const now=has(o.now)?`<span class="mnow" data-stat="now">${o.nowLabel||"last"} <b${o.nowCls?` class="${o.nowCls}"`:""}>${total?fmt(Math.round(o.now)):has(o.nowDec)?Number(o.now).toFixed(o.nowDec):f(o.now)}</b>${o.nowSuffix||""}</span>`:null;
  if(now&&total) parts.push(now);
  parts.push(`<span data-stat="min">min <b${o.minCls?` class="${o.minCls}"`:""}>${f(o.min)}</b>${flag(o.minCls,"low")}</span>`);
  parts.push(`<span data-stat="avg">avg <b>${f(o.avg)}</b></span>`);
  parts.push(`<span data-stat="max">max <b${o.maxCls?` class="${o.maxCls}"`:""}>${f(o.max)}</b>${flag(o.maxCls,"high")}</span>`);
  if(now&&!total) parts.push(now);
  let out=parts.join('<span class="msep">·</span>');
  if(o.unitLabel) out+=o.unitLabel==="%"?`<span class="munit pc">%</span>`:` <span class="munit">${esc(o.unitLabel)}</span>`;
  if(o.extra) out+=`<span class="msep">·</span>${o.extra}`;
  return out;
}

    parts.push(`<span class="ls"><button type="button" class="evmaster" data-evmaster aria-pressed="true" data-tip="show or hide event lines on every chart"><span class="smp evs"></span><span data-evcount="*"></span></button> `
      +types.map(t=>`<button type="button" class="evtog" data-evtype="${esc(t)}" aria-pressed="true" data-tip="show or hide ${esc(EVLABEL[t])} events on every chart"><span class="edot" style="background:${ECOL[t]}"></span><span data-evcount="${esc(t)}"></span></button>`).join("")

  } else parts.push(`<span class="ls evnone" data-tip="No events were recorded in this window"><span class="smp evs"></span>no events</span>`);

  if(D.sys&&has(D.sys.cpuStealPct)&&D.sys.cpuStealPct>=5) facts.push(`<span class="pill">${I.cpu} CPU steal <b>${D.sys.cpuStealPct.toFixed(1)}%</b></span>`);
  if(D.sys&&has(D.sys.cpuIowaitPct)&&D.sys.cpuIowaitPct>=5) facts.push(`<span class="pill">${I.cpu} CPU iowait <b>${D.sys.cpuIowaitPct.toFixed(1)}%</b></span>`);
  if(D.sys&&has(D.sys.oomKills)&&D.sys.oomKills>0) facts.push(`<span class="pill">${I.warn} OOM kills <b>${D.sys.oomKills}</b></span>`);
  if(D.sys&&has(D.sys.cpuUsageCores)&&D.sys.container&&has(D.sys.container.cpuLimit)&&D.sys.container.cpuLimit>0&&has(D.sys.cpuCores)&&D.sys.container.cpuLimit<D.sys.cpuCores&&(100*D.sys.cpuUsageCores/D.sys.container.cpuLimit)>=80) facts.push(`<span class="pill">${I.cpu} Container CPU <b>${(100*D.sys.cpuUsageCores/D.sys.container.cpuLimit).toFixed(0)}% of limit</b></span>`);
  if(D.sys&&((has(D.sys.psiCpu)&&D.sys.psiCpu>=10)||(has(D.sys.psiIo)&&D.sys.psiIo>=10)||(has(D.sys.psiMem)&&D.sys.psiMem>=10))) facts.push(`<span class="pill">${I.warn} PSI stall <b>cpu ${(D.sys.psiCpu||0).toFixed(0)}% · io ${(D.sys.psiIo||0).toFixed(0)}% · mem ${(D.sys.psiMem||0).toFixed(0)}%</b></span>`);

  if(!cards.length&&!facts.length&&!flatZero.length) return "";
  return (facts.length?`<div class="factstrip">${facts.join("")}</div>`:"")
    +(cards.length?`<div class="mgrid">${cards.join("")}</div>`:"")
    +(flatZero.length?`<div class="subnote" style="margin-top:14px">Flat at zero for the whole window (charts hidden): ${flatZero.map(esc).join(", ")}.</div>`:"");
}

function lineStatText(slice,kind,dec,unit){
  const st=sstat(slice), fm=v=>Number(v).toFixed(autoDec(st.min,st.max,dec));
  const tot=kind==="count"?slice.reduce((a,v)=>a+v,0):null;
  return `${tot!=null?`total ${fmt(Math.round(tot))} · `:""}min ${fm(st.min)} · avg ${fm(st.avg)} · max ${fm(st.max)}${unit&&unit.trim()?(unit.trim()==="%"?"%":" "+unit.trim()):""}`;
}
function groupedCard(title,lines,kindChip,unit,cards,extra,icon){
  const single=lines.length===1;
  const chart=single
    ? lineChart(lines[0].series,Object.assign({h:170,color:lines[0].color,unit,decimals:lines[0].dec,times:DV.span,marker:DV.incMarker},extra||{}))
    : lineChart(null,Object.assign({h:170,unit,decimals:1,times:DV.span,marker:DV.incMarker,multi:lines},extra||{}));
  const cid="ch"+CHART_ID;
  const off=()=>CHARTS[cid].lineOff||new Set();
  const sliceL=(a,b)=>lines.map(l=>{const Nn=l.series.length;
    let j0=Math.max(0,Math.floor(a*(Nn-1))), j1=Math.min(Nn-1,Math.ceil(b*(Nn-1)));
    if(j1<=j0) j1=Math.min(Nn-1,j0+1);
    return l.series.slice(j0,j1+1);});
  const countStrip=slices=>{
    const shown=lines.map((l,k)=>({l,k,tot:Math.round(slices[k].reduce((a,v)=>a+(v||0),0)),mx:Math.round(Math.max(0,...slices[k].filter(v=>v!=null)))})).filter(x=>!off().has(x.k));
    const word=(x,n)=>`<b>${fmt(n)}</b> ${n===1?x.l.noun[0]:x.l.noun[1]}`;
    const totals=`<span class="pml">${shown.map(x=>word(x,x.tot)).join(", ")}</span>`;
    return shown.every(x=>x.tot<10)?totals:`${totals}<span class="msep">·</span><span class="pml">max ${shown.map(x=>word(x,x.mx)).join(" and ")} ${esc(unit.trim())}</span>`;
  };
  const nouns=lines.every(l=>l.noun);
  const stripHtml=slices=>{
    if(nouns) return countStrip(slices);
    if(lines.length>2) return "";
    return lines.map((l,k)=>off().has(k)?"":`<span class="pml"><b style="color:${l.color}">${esc(l.name)}</b> ${lineStatText(slices[k],l.kind,l.dec,unit)}</span>`)
      .filter(Boolean).join('<span class="msep">·</span>');
  };
  const tipFor=(slices,k)=>`${lines[k].name}: ${lineStatText(slices[k],lines[k].kind,lines[k].dec,unit)}`;
  const slices0=lines.map(l=>l.series);
  let strip0;
  if(single&&nouns){
    strip0=countStrip(slices0);
    CHARTS[cid].mkStats=s0=>countStrip([s0]); CHARTS[cid].statHtml0=strip0;
  } else if(single){
    const l=lines[0];
    const sb=(s0,zoomed,i0)=>{const s=s0.filter(v=>v!=null);
      const am=l.amounts&&zoomed?l.amounts.slice(i0||0,(i0||0)+s0.length):null;
      const tot=l.kind!=="rate"?0:am?am.reduce((a,v)=>a+v,0):has(l.total)?l.total:0;
      const totHtml=`<span data-stat="total">total <b>${fmt(Math.round(tot))}</b></span>`;
      if(l.kind==="rate"&&!s.length) return `<span data-stat="none">no rate in this range</span><span class="msep">·</span>${totHtml}`;
      const st=sstat(s);
      const oo={min:st.min,avg:st.avg,max:st.max,dec:l.dec,unitLabel:unit.trim()||null};
      if(l.kind==="rate"){
        oo.extra=totHtml
          +(has(l.cumulative)?`<span class="msep">·</span><span data-stat="cumulative">since start <b>${fmt(Math.round(l.cumulative))}</b></span>`:"");
      } else if(l.kind==="count"){oo.now=s.reduce((a,v)=>a+v,0);oo.nowLabel="total";oo.nowDec=0;} else oo.now=s[s.length-1];
      return statsInner(oo);};
    strip0=sb(l.series);
    CHARTS[cid].mkStats=sb; CHARTS[cid].statHtml0=strip0;
  } else {
    strip0=stripHtml(slices0);
    CHARTS[cid].pmUpdate=()=>{
      const slices=ZOOM?sliceL(ZOOM.a,ZOOM.b):slices0;
      const stripEl=document.querySelector(`.mstats[data-stats="${cid}"]`);
      if(stripEl) stripEl.innerHTML=stripHtml(slices);
      lines.forEach((l,k)=>{const chip=document.querySelector(`[data-pml="${cid}:${k}"]`);
        if(chip) chip.setAttribute("data-tip",tipFor(slices,k));});
    };
  }
  const legend=single?"":`<div class="pmlegend">${lines.map((l,k)=>`<button type="button" class="pmlg" data-pml="${cid}:${k}" aria-pressed="true" data-tip="${esc(tipFor(slices0,k))}">${swatch(l.color)}${esc(l.name)}</button>`).join(" ")}</div>`;
  cards.push(`<div class="chartcard mcard"><div class="cth"><span class="ctt"><span class="cic">${icon||I.pulse}</span>${esc(title)}${kindChip?` <span class="st NEUTRAL" style="margin-left:7px">${kindChip}</span>`:""}</span><span class="mstats" data-stats="${cid}">${strip0}</span></div>${legend}${chart}</div>`);
}

function pluginMetricsHtml(){
  const all=(D.pluginMetrics||[]).filter(m=>m&&m.name);
  if(!all.length) return "";
  const charted=all.filter(m=>m.series&&m.series.length>=2);
  const zero=all.filter(m=>!charted.includes(m)&&m.uncharted==="zero");
  const single=all.filter(m=>!charted.includes(m)&&m.uncharted==="single");
  const skipped=all.filter(m=>!charted.includes(m)&&m.uncharted!=="zero"&&m.uncharted!=="single");
  const decOf=s=>s.some(v=>Math.abs(v-Math.round(v))>1e-9)?1:0;
  const owners=[];
  const colorOf=m=>{const o=String(m.name).split("/")[0];if(!owners.includes(o))owners.push(o);return SERIES[owners.indexOf(o)%SERIES.length];};
  const cards=[];
  charted.forEach(m=>{
    const rate=m.kind==="count"&&has(m.bucketSec);
    const line={name:String(m.name),kind:rate?"rate":(m.kind==="count"?"count":"gauge"),series:m.series,color:colorOf(m),
      dec:decOf(m.series),bucketSec:m.bucketSec,amounts:m.amounts,total:m.total,cumulative:m.cumulative};
    groupedCard(String(m.name),[line],rate?"counter":(m.kind==="count"?"count":"gauge"),rate?"/s":(m.kind==="count"?DV.per:""),cards,rate?{zero:true}:null);
  });
  const names=ms=>ms.map(m=>`<code>${esc(String(m.name))}</code>`).join(", ");
  const withTotals=ms=>ms.map(m=>`<code>${esc(String(m.name))}</code>${m.kind==="count"?` (total ${fmt(Math.round(m.total||0))})`:""}`).join(", ");
  let notes="";
  if(single.length) notes+=`<div class="subnote" style="margin-top:14px">Reported once, so no chart: ${withTotals(single)}.</div>`;
  if(zero.length) notes+=`<div class="subnote" style="margin-top:8px">Zero for the whole window (charts hidden): ${names(zero)}.</div>`;
  if(skipped.length) notes+=`<div class="subnote" style="margin-top:8px">Not charted, over the chart limit: ${withTotals(skipped)}.</div>`;
  return `<p class="lead">Numbers that plugins report through the Hybox API or as JFR events. Counters show as a rate per second. <b>total</b> is the sum in this window. <b>since start</b> is the plugin's own running total.</p>`
    +(cards.length?`<div class="mgrid">${cards.join("")}</div>`:"")+notes;
}

function engineHtml(){
  const ts=(D.tickSystems||[]).filter(r=>r&&r.length>=6);
  const series=(D.tickSeries||[]).filter(s=>s&&s.name&&s.series&&s.series.length>=2);
  if(!ts.length&&!series.length){
    return "";
  }
  const BUDGET=(D.tps&&D.tps.target>0)?1000/D.tps.target:100/3;
  const parts=[];
  if(series.length){
    const byWorld=new Map(), order=[];
    series.forEach(s=>{
      const at=String(s.name).lastIndexOf(" @ ");
      const world=at>=0?String(s.name).slice(at+3):"(unknown world)";
      const sys=at>=0?String(s.name).slice(0,at):String(s.name);
      if(!byWorld.has(world)){byWorld.set(world,[]);order.push(world);}
      byWorld.get(world).push({sys,series:s.series});
    });
    const cards=[];
    order.forEach(world=>{
      let ms=byWorld.get(world);
      if(ms.length>6){
        ms=[...ms].sort((a,b)=>sstat(b.series).avg-sstat(a.series).avg).slice(0,6);
      }
      const lines=ms.map((m,k)=>({name:m.sys,kind:"gauge",series:m.series,color:SERIES[k%SERIES.length],dec:1}));
      groupedCard(worldLabel(world),lines,"tick time"," ms",cards,{gcIdx:true});
    });
    parts.push(`<div class="mgrid">${cards.join("")}</div>`);
  }
  if(ts.length){
    const sorted=[...ts].sort((a,b)=>b[2]-a[2]);
    const rows=sorted.map(r=>{
      const [sys,world,avg1,max1,avg5,max5]=r;
      const pctB=100*avg1/BUDGET;
      const cls=pctB>100?"v-bad":(pctB>50?"v-warn":"pct"), word=pctB>100?"over budget":(pctB>50?"high":"");
      const barCol=pctB>100?"var(--bad)":(pctB>50?"var(--warn)":"var(--good)");
      return `<tr><td class="nm"><span class="tnc2" style="max-width:280px" data-tipov="${esc(sys)}">${esc(sys)}</span></td><td class="pkg" data-sval="${esc(world)}"><span class="tnc2" style="max-width:170px" data-tipov="${esc(world)}">${esc(worldLabel(world))}</span></td><td class="r" data-num="${avg1}">${Number(avg1).toFixed(2)}</td><td class="r" data-num="${max1}">${Number(max1).toFixed(2)}</td><td class="r" data-num="${avg5}">${Number(avg5).toFixed(2)}</td><td class="r" data-num="${max5}">${Number(max5).toFixed(2)}</td><td class="r" data-num="${pctB.toFixed(2)}"><span class="bbar"><i style="width:${Math.min(100,pctB).toFixed(0)}%;background:${barCol}"></i></span><span class="${cls}">${pctB.toFixed(1)}%${word?`<span class="vword">${word}</span>`:""}</span></td></tr>`;
    }).join("");
    parts.push(`<div class="tscroll" style="margin-top:${series.length?"16px":"0"}"><div class="tcap"><table class="sortable" id="es-t"><thead><tr>${thc("System","Engine ECS system",{sort:"text"})}${thc("World","World whose Store ticks this system",{sort:"text"})}${thc("avg 1m","Average tick time, last minute (ms)",{sort:"num",r:true,def:"desc"})}${thc("max 1m","Slowest tick, last minute (ms)",{sort:"num",r:true})}${thc("avg 5m","Average tick time, last 5 minutes (ms)",{sort:"num",r:true})}${thc("max 5m","Slowest tick, last 5 minutes (ms)",{sort:"num",r:true})}${thc("% of budget","Share of the "+BUDGET.toFixed(1)+" ms tick budget (avg 1m)",{sort:"num",r:true})}</tr></thead><tbody>${rows}</tbody></table></div></div>`);
  }
  if(D.tickSystemsNote) parts.push(`<div class="subnote" id="tsnote" style="margin-top:10px">${esc(D.tickSystemsNote)}</div>`);
  const lead=`<p class="lead">Time each engine system took per tick, measured by Hytale. It includes time spent waiting on locks and disk.</p>`;
  return lead+parts.join("");
}

function flameHtml(){
  if(!D.flame||!Array.isArray(D.flame)||!Array.isArray(D.flame[2])||!D.flame[2].length) return "";
  const sw=(o,c,l)=>`<button type="button" class="flg flgtog" data-own="${o}" aria-pressed="true" data-tip="show or hide ${l} frames"><span class="fsw" style="background:${c}"></span>${l}</button>`;
  return `<p class="lead">Width is the share of CPU samples. Each row is one call deeper. Click a frame to zoom.</p>
  <div class="flamebar"><span class="srch"><span class="si">${I.search}</span><input type="search" id="flamefilter" aria-label="Filter flame graph frames" placeholder="filter frames…"></span><span class="flamelg">${sw(1,FLAME_COL[1],"engine")}${sw(2,FLAME_COL[2],"mod")}${sw(3,FLAME_COL[3],"JDK")}</span><button type="button" class="fcrumb" id="flamecrumb">Reset flame graph</button><span class="fnote" id="flamenote"></span></div>
  <div class="flame-controls"><label>Child frame <select id="flamechild" aria-describedby="flamevalue"></select></label><button type="button" class="copybtn" id="flamezoom">Zoom to frame</button><button type="button" class="copybtn" id="flameup">Parent frame</button></div>
  <div class="flame-controls" id="flamesearch" hidden><label>Search matches <select id="flamematch"></select></label><button type="button" class="copybtn" id="flamejump">Zoom to match</button></div>
  <output id="flamevalue" aria-live="polite"></output>
  <canvas id="flamecv" class="bbtipcv" height="520" role="img" aria-label="Flame graph. Use the child frame selector, the parent and zoom buttons, or the search matches to move through it without the canvas." aria-describedby="flamevalue"></canvas>`;
}
function initFlame(){
  const cv=$("#flamecv"); if(!cv||!D.flame) return;
  const ROW=22, AROW=10, MAXH=520;
  const nodes=[];
  function parse(n,parent=null){
    const node={name:String(n[0]),samples:n[1],children:[],owner:n[3]|0,label:n[4]||null,parent,id:nodes.length};
    nodes.push(node);node.children=(n[2]||[]).map(c=>parse(c,node));return node;
  }
  const root=parse(D.flame);
  let path=[root];
  let filter="";
  let cells=[];
  const ownOff={};
  const childSelect=$("#flamechild"),matchSelect=$("#flamematch"),value=$("#flamevalue");
  let choices=[],searchMatches=[],fTimer=null,choiceRoot=null,choiceOwners="";
  function describe(node){
    const names=[];for(let n=node;n;n=n.parent) names.push(n.name);
    return `${names.reverse().join(" → ")}${node.label?` (${node.label})`:""} · ${fmt(node.samples)} samples · ${pct(node.samples,root.samples||1).toFixed(2)}% of total · ${pct(node.samples,path[path.length-1].samples||1).toFixed(1)}% of view`;
  }
  function showFrameValue(){
    const cur=path[path.length-1],selected=nodes[Number(childSelect.value)];
    const gap=Math.max(0,cur.samples-cur.children.reduce((n,c)=>n+c.samples,0));
    value.textContent=`View: ${describe(cur)}${gap&&cur.children.length?` · ${fmt(gap)} samples in pruned frames`:""}`+(selected?`. Selected: ${describe(selected)}`:"");
  }
  function syncFrameControls(){
    const cur=path[path.length-1],owners=[1,2,3].map(o=>ownOff[o]?1:0).join("");
    if(choiceRoot!==cur||choiceOwners!==owners){
      const selected=nodes[Number(childSelect.value)];choices=[];
      const add=n=>{if(ownOff[n.owner])n.children.forEach(add);else choices.push(n);};
      cur.children.forEach(add);
      childSelect.innerHTML=choices.length?choices.map(n=>`<option value="${n.id}">${esc(n.name)} · ${fmt(n.samples)} samples</option>`).join(""):'<option value="-1">No child frames in this view</option>';
      if(choices.includes(selected))childSelect.value=String(selected.id);
      choiceRoot=cur;choiceOwners=owners;
    }
    $("#flamezoom").setAttribute("aria-disabled",String(!choices.length));
    $("#flameup").setAttribute("aria-disabled",String(path.length<2));
    showFrameValue();
  }
  function updateMatches(){
    searchMatches=filter?nodes.filter(n=>n.name.toLowerCase().includes(filter)).sort((a,b)=>b.samples-a.samples):[];
    const search=$("#flamesearch");
    if(!filter&&search.contains(document.activeElement))childSelect.focus();
    search.hidden=!filter;
    matchSelect.innerHTML=searchMatches.length?searchMatches.map(n=>`<option value="${n.id}">${esc(n.name)} · ${fmt(n.samples)} samples</option>`).join(""):'<option value="-1">No matching frames</option>';
    $("#flamejump").setAttribute("aria-disabled",String(!searchMatches.length));
  }
  childSelect.addEventListener("change",showFrameValue);
  $("#flamezoom").addEventListener("click",()=>{const n=nodes[Number(childSelect.value)];if(n){clearTimeout(fTimer);zoomTo(n);}});
  $("#flameup").addEventListener("click",()=>{clearTimeout(fTimer);if(path.length>1)zoomTo(path[path.length-2]);});
  matchSelect.addEventListener("change",()=>{clearTimeout(fTimer);const n=nodes[Number(matchSelect.value)];if(n)value.textContent="Search match: "+describe(n);});
  $("#flamejump").addEventListener("click",()=>{clearTimeout(fTimer);const n=nodes[Number(matchSelect.value)];if(n)zoomTo(n);});
  const hue=name=>{
    const cls=String(name).split(".")[0]||String(name);
    let h=0; for(let i=0;i<cls.length;i++) h=(h*31+cls.charCodeAt(i))>>>0;
    return h%360;
  };
  const hslOf=hex=>{
    const v=parseInt(String(hex).slice(1),16), r=(v>>16&255)/255, g=(v>>8&255)/255, b=(v&255)/255;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn;
    const h=!d?0:mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
    return [h*60,d?100*d/(1-Math.abs(2*l-1)):0,100*l];
  };
  const OWNER_HSL={0:hslOf(FLAME_COL[0]),1:hslOf(FLAME_COL[1]),2:hslOf(FLAME_COL[2]),3:hslOf(FLAME_COL[3])};
  const OWNER_JIT={0:0,1:8,2:2,3:0}, OWNER_LJ={0:5,1:7,2:9,3:7};
  const colorOf=(node,anc)=>{
    const o=OWNER_HSL[node.owner|0]?node.owner|0:0, [bh,bs,bl]=OWNER_HSL[o], hh=hue(node.name), jit=OWNER_JIT[o], j=jit?hh%(2*jit+1)-jit:0;
    const s=anc?Math.max(4,bs-30):bs;
    const l=anc?40:bl-OWNER_LJ[o]/2+hh%OWNER_LJ[o];
    return `hsl(${(bh+j).toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%)`;
  };
  function render(){
    const cssW=cv.clientWidth||(cv.parentElement?cv.parentElement.clientWidth:0); if(!cssW) return;
    const dpr=devicePixelRatio||1;
    const cur=path[path.length-1];
    let depth=0;
    (function dd(n,d){const hid=d>0&&!!ownOff[n.owner];if(!hid&&d>depth)depth=d;const cd=hid?d:d+1;if(cd<64)n.children.forEach(c=>dd(c,cd));})(cur,0);
    const ancRows=path.length-1;
    const availRows=Math.max(3,Math.floor((MAXH-ancRows*AROW)/ROW));
    const shownDepth=Math.min(depth+1,availRows);
    const cut=depth+1-shownDepth;
    const cssH=ancRows*AROW+shownDepth*ROW;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    ctx.font="12px ui-monospace,Menlo,monospace"; ctx.textBaseline="middle";
    cells=[];
    for(let a=0;a<ancRows;a++){
      const nd=path[a], y=a*AROW;
      ctx.globalAlpha=.55; ctx.fillStyle=colorOf(nd,true);
      ctx.fillRect(0,y,cssW,AROW-1); ctx.globalAlpha=1;
      cells.push({x:0,y,w:cssW,h:AROW-1,node:nd,kind:"anc",pathIdx:a});
    }
    const y0=ancRows*AROW;
    const matches=n=>filter&&String(n.name).toLowerCase().includes(filter);
    const draw=(n,x,w,d)=>{
      if(d>=shownDepth||w<1) return;
      const y=y0+d*ROW;
      const hidden=d>0&&!!ownOff[n.owner];
      if(!hidden){
        const dim=filter&&!matches(n);
        ctx.globalAlpha=dim?.22:1;
        ctx.fillStyle=colorOf(n,false);
        ctx.fillRect(x,y,Math.max(w-0.6,0.4),ROW-1);
        if(w>40){
          ctx.globalAlpha=1;ctx.fillStyle=dim?PAL.tx:PAL.ink;
          ctx.save();ctx.beginPath();ctx.rect(x+3,y,w-6,ROW);ctx.clip();
          ctx.fillText(String(n.name),x+4,y+ROW/2);
          ctx.restore();
        }
        ctx.globalAlpha=1;
        cells.push({x,y,w,h:ROW-1,node:n,kind:"cell"});
      }
      const cd=hidden?d:d+1;
      let cx=x, childSum=0;
      n.children.forEach(c=>{childSum+=c.samples;});
      n.children.forEach(c=>{
        const cw=w*c.samples/(n.samples||1);
        draw(c,cx,cw,cd);
        cx+=cw;
      });
      const gapN=n.samples-childSum;
      if(n.children.length&&gapN>0&&!hidden&&cd<shownDepth){
        const gw=w*gapN/(n.samples||1);
        if(gw>=1){
          const gy=y0+cd*ROW;
          ctx.globalAlpha=.06; ctx.fillStyle=PAL.tx;
          ctx.fillRect(cx,gy,Math.max(gw-0.6,0.4),ROW-1); ctx.globalAlpha=1;
          cells.push({x:cx,y:gy,w:gw,h:ROW-1,node:null,kind:"gap",gapN});
        }
      }
    };
    draw(cur,0,cssW,0);
    const note=$("#flamenote");

function initThreadTimeline(){
  const cv=$("#ttcanvas"); if(!cv||!D.threadTimeline||!D.threadTimeline.length) return;
  const tt=D.threadTimeline, ROWH=22;
  const SCOL={1:STCOL.RUNNABLE,2:STCOL.WAITING,3:STCOL.TIMED_WAITING,4:STCOL.BLOCKED};
  const SNAME={0:"no samples",1:"RUNNABLE",2:"WAITING",3:"TIMED_WAITING",4:"BLOCKED"};
  let geo=null;
  const threadSelect=$("#ttthread"),interval=$("#ttinterval"),value=$("#ttvalue");
  function showValue(){
    const t=tt[Number(threadSelect.value)],i=Number(interval.value),state=SNAME[t.states[i]||0],clock=globalClock(i/((t.states.length-1)||1));
    value.textContent=`${t.name} · ${state} · interval ${i+1} of ${t.states.length}${clock?" · "+clock:""}`;
    interval.setAttribute("aria-valuetext",`${i+1}: ${clock?clock+" · ":""}${state}`);
  }
  threadSelect.addEventListener("change",showValue);interval.addEventListener("input",showValue);
  function render(){
    const holder=cv.parentElement;
    const cssW=holder?holder.clientWidth-16:0; if(cssW<=0) return;
    const cssH=tt.length*ROWH;
    const dpr=devicePixelRatio||1;
    cv.style.height=cssH+"px";
    cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
    const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);
    const N=tt[0].states.length;
    const za=ZOOM?ZOOM.a:0, zb=ZOOM?ZOOM.b:1;
    let i0=Math.max(0,Math.floor(za*(N-1))), i1=Math.min(N-1,Math.ceil(zb*(N-1)));
    if(i1<=i0) i1=Math.min(N-1,i0+1);
    const n=i1-i0+1, cw=cssW/n;
    tt.forEach((t,r)=>{
      const y=r*ROWH;
      for(let i=0;i<n;i++){
        const s=t.states[i0+i];
        if(!s) continue;
        ctx.fillStyle=SCOL[s]||PAL.neutral;
        ctx.fillRect(i*cw,y+1,Math.max(cw-0.4,0.5),ROWH-3);
      }
    });
    const mark=DV.incMarker;
    if(INCHL&&mark&&mark.frac!=null){
      const gf=clamp01(mark.frac);
      if(gf>=za-1e-9&&gf<=zb+1e-9){
        const x=Math.round(((gf-za)/((zb-za)||1))*cssW)+0.5;
        ctx.setLineDash([3,3]); ctx.strokeStyle=mark.kind==="profile"?PAL.profile:PAL.bad; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cssH); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    let marks=[];
    const evList=shownEvents();
    if(evList&&evList.length){
      marks=eventMarks(evList,f=>(f<za-1e-9||f>zb+1e-9)?null:Math.max(0,Math.min(n-1,Math.round(f*(N-1))-i0)),i=>(i+0.5)*cw);
      ctx.setLineDash([4,4]); ctx.lineWidth=1;
      marks.forEach(m=>{
        ctx.globalAlpha=.45; ctx.strokeStyle=m.color; ctx.beginPath(); ctx.moveTo(m.x,0); ctx.lineTo(m.x,cssH); ctx.stroke();
        ctx.globalAlpha=1; ctx.fillStyle=m.color; ctx.beginPath(); ctx.arc(m.x,3,2.6,0,2*Math.PI); ctx.fill();
      });
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
    geo={i0,i1,n,cw,cssW,cssH,N,marks};
    interval.min=String(i0);interval.max=String(i1);interval.value=String(Math.max(i0,Math.min(i1,Number(interval.value))));showValue();
  }
  cv.addEventListener("mousemove",e=>{
    if(!geo){hideTip();return;}
    const r=cv.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const row=Math.floor(my/ROWH), col=Math.floor(mx/geo.cw);
    if(row<0||row>=tt.length||col<0||col>=geo.n){hideTip();cv.style.cursor="default";return;}
    cv.style.cursor="pointer";
    let mark=null, best=11;
    geo.marks.forEach(m=>{const d=Math.abs(m.x-mx); if(d<best){best=d;mark=m;}});
    const idx=geo.i0+(mark?mark.i:col), s=tt[row].states[idx]||0;
    const ck=globalClock(idx/((geo.N-1)||1));
    TIP.innerHTML=esc(`${tt[row].name} · ${SNAME[s]||s}${ck?" · "+ck:""}`)
      +(mark?mark.ev.slice(0,3).map(ev=>`<br>${esc(EVWORD[ev[1]]||String(ev[1]))} ${esc(String(ev[2]).slice(0,64))}`).join("")+(mark.ev.length>3?`<br>+${mark.ev.length-3} more`:""):"");
    TIP.style.display="block";
    placeTip(TIP,e.clientX,e.clientY);
  });
  cv.addEventListener("mouseleave",()=>hideTip());
  cv.addEventListener("click",e=>{
    const r=cv.getBoundingClientRect();
    const row=Math.floor((e.clientY-r.top)/ROWH);
    if(row>=0&&row<tt.length){
      threadSelect.value=String(row);showValue();
      if(typeof flameFocusGroup==="function")flameFocusGroup(threadGroup(tt[row].name));
    }
  });
  ttRender=render;
  window.BBTT={render,geo:()=>geo};
  render();
}

const MOD_OLDER="Older bundle: each sample went to the mod frame nearest the top of the stack, so a mod that wraps engine work is charged for that work.";
const CAPTURE_MOD="Hybox, this capture";
const MIXIN_HANDLER=/^((?:handler|redirect|modify|args|constant|localvar|wrapOperation|wrapMethod|modifyExpressionValue|modifyReceiver|modifyReturnValue|wrapWithCondition)|md[0-9a-f]+)\$.*\$([^$]+)$/;
function mixinLeaf(m){

function modSplit(rows,at){
  return (rows||[]).filter(m=>m.length>at)
    .map(m=>({id:String(m[0]),self:m[at]||0,total:m[at+1]||0,sm:m[at+2],st:m[at+3],sl:m[at+4],tm:m[at+5],tl:m[at+6]}))
    .filter(m=>m.self>0||m.total>0).sort((a,b)=>b.self-a.self||b.total-a.total);

    const thr=(m.st||[]).map(t=>`${esc(thName(t))} ${(100*t[1]/Math.max(1,m.self)).toFixed(0)}%`).join(", ");

    const wraps=tot&&pct(m.self,tot)<0.05&&pct(m.total,tot)>=1?`<div class="modmeth">wraps Hytale work, self under 0.1%</div>`:"";

    return `<tr><td class="nm"><span class="tnc2" data-tipov="${esc(m.id)}">${esc(m.id)}</span>${capture}${entry}${ran}${wraps}</td><td class="r" data-num="${m.self}"><span class="bbar"><i style="width:${(100*m.self/mx).toFixed(0)}%;background:var(${bytes?"--s3":"--s1"})"></i></span><span class="modn">${amount(m.self)}<span class="pct">${share(m.self)}</span></span></td><td class="r" data-num="${m.total}">${amount(m.total)}<span class="pct">${share(m.total)}</span></td></tr>`;
