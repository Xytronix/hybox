<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--border:#222a35;--border2:#2b3543;
    --tx:#e6edf3;--tx2:#9aa7b4;--tx3:#6b7785;--accent:#5b9dff;--grid:#1d2630;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;padding:28px 22px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:21px;font-weight:600;margin:0 0 4px}
  .meta{color:var(--tx2);font-size:12.5px;margin-bottom:14px}
  .pmlegend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px;font-size:11px;color:var(--tx2)}
  .pmlegend .pmlg{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .pmlegend .pmlg:hover{color:var(--tx)}
  .pmlegend .pmlg.off{opacity:.32;text-decoration:line-through}
  .pmlegend .edot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .pmlegend .smp{width:20px;border-top:1px dashed #f0626b;display:inline-block;flex:none}
  .card .pmlegend{margin:3px 0 8px;gap:12px;font-variant-numeric:tabular-nums}
  .empty{color:var(--tx2);background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:28px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:840px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 14px 8px}
  .ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .lbl{font-size:13px;color:var(--tx2);font-weight:500}
  .cur{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .cur.dim{font-size:13px;font-weight:400;color:var(--tx3)}
  .sub{font-size:11.5px;color:var(--tx3);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  svg{display:block;width:100%;height:auto}
  .ax{fill:var(--tx3);font-size:10px;font-variant-numeric:tabular-nums}
  .gl{stroke:var(--grid);stroke-width:1}
  .dl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 3}
  .il{stroke:#f0626b;stroke-width:1.1;stroke-dasharray:3 2;opacity:.7}
  .ln{fill:none;stroke-width:1.6}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;

const GROUPS = [
  {label:"Tick time", unit:"ms", zero:false, lines:[
    {k:"tickAvgMs", label:"Tick", hue:8}]},
  {label:"Ticks per second", unit:"", zero:true, lines:[
    {k:"tps", label:"TPS", hue:140}]},
  {label:"Players online", unit:"", zero:true, lines:[
    {k:"players", label:"Players", hue:205}]},
  {label:"Memory", unit:"MB", zero:false, lines:[
    {k:"heapMb", label:"Heap", hue:265},
    {k:"rssMb", label:"RSS", hue:300}]},
  {label:"CPU & GC time", unit:"%", zero:true, lines:[
    {k:"cpuPct", label:"CPU", hue:0},
    {k:"gcPct", label:"GC", hue:40}]},
  {label:"Allocation rate", unit:"MB/s", zero:true, lines:[
    {k:"allocMbPerSec", label:"Alloc", hue:175}]},
  {label:"Queued packets", unit:"", zero:true, lines:[
    {k:"queuedPackets", label:"Queued", hue:320}]},
];

const hiddenLines = new Set();
let showIncidents = true;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2,"0");
function dayLabel(ms){const d=new Date(ms);return MONTHS[d.getUTCMonth()]+" "+d.getUTCDate();}
function timeLabel(ms){const d=new Date(ms);return dayLabel(ms)+" "+pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());}

function fmtVal(v, unit){
  if(v==null||isNaN(v)) return "n/a";
  if(unit==="MB"){
    if(v>=1024) return (v/1024).toFixed(1)+" GB";
    return Math.round(v)+" MB";
  }
  const r = Math.abs(v)>=100 ? Math.round(v) : Math.round(v*100)/100;
  return r + (unit?" "+unit:"");
}

function stats(v){
  let mn=Infinity,mx=-Infinity,sum=0,c=0,last=null;
  for(const x of v){
    if(x==null||isNaN(x)) continue;
    if(x<mn) mn=x;
    if(x>mx) mx=x;
    sum+=x; c++; last=x;
  }
  return c ? {mn,mx,avg:sum/c,last,c} : null;
}

function lineColor(hue){ return `hsl(${hue} 70% 62%)`; }

function chart(t, lines, g){
  const W=820,H=170,PADL=52,PADR=12,PADT=12,PADB=24;
  const visible = lines.filter(l=>l.s && !hiddenLines.has(l.k));
  const use = visible.length ? visible : lines.filter(l=>l.s);
  let mn=Infinity, mx=-Infinity;
  use.forEach(l=>{ if(l.s.mn<mn) mn=l.s.mn; if(l.s.mx>mx) mx=l.s.mx; });
  if(mn===Infinity){ mn=0; mx=1; }
  if(mn===mx){ mn-=1; mx+=1; }
  if(g.zero && mn>0) mn=0;
  const t0=t[0], t1=t[t.length-1], span=Math.max(1,t1-t0);
  const xs = ms => PADL + (ms-t0)/span*(W-PADL-PADR);
  const ys = val => (H-PADB) - (val-mn)/(mx-mn)*(H-PADB-PADT);

  let parts = [];
  [mn,(mn+mx)/2,mx].forEach(gv=>{
    const y=ys(gv).toFixed(1);
    parts.push(`<line class="gl" x1="${PADL}" y1="${y}" x2="${W-PADR}" y2="${y}"/>`);
    parts.push(`<text class="ax" x="${PADL-6}" y="${(ys(gv)+3).toFixed(1)}" text-anchor="end">${fmtVal(gv,g.unit)}</text>`);
  });

  const STEPS=[3600000,2*3600000,3*3600000,6*3600000,12*3600000,86400000,2*86400000,3*86400000,7*86400000];
  let step=STEPS[STEPS.length-1];
  for(const s of STEPS){ if(span/s<=8){ step=s; break; } }
  const sub=step<86400000;
  for(let gx=Math.ceil(t0/step)*step; gx<=t1; gx+=step){
    const x=xs(gx);
    parts.push(`<line class="dl" x1="${x.toFixed(1)}" y1="${PADT}" x2="${x.toFixed(1)}" y2="${H-PADB}"/>`);
    parts.push(`<text class="ax" x="${x.toFixed(1)}" y="${H-7}" text-anchor="middle">${sub?timeLabel(gx):dayLabel(gx)}</text>`);
  }

  (showIncidents?(D.incidents||[]):[]).forEach(ms=>{
    if(ms>=t0&&ms<=t1){
      const x=xs(ms).toFixed(1);
      parts.push(`<line class="il" x1="${x}" y1="${PADT}" x2="${x}" y2="${H-PADB}"/>`);
    }
  });

  use.forEach(l=>{
    let dpath="", pen=false;
    for(let i=0;i<l.v.length;i++){
      const x=l.v[i];
      if(x==null||isNaN(x)){ pen=false; continue; }
      dpath += (pen?"L":"M")+xs(t[i]).toFixed(1)+" "+ys(x).toFixed(1)+" ";
      pen=true;
    }
    parts.push(`<path class="ln" stroke="${lineColor(l.hue)}" d="${dpath.trim()}"/>`);
  });

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${parts.join("")}</svg>`;
}

function card(g){
  const t = D.t||[];
  const lines = g.lines.map(l=>({...l, v:(D[l.k]||[]), s:stats(D[l.k]||[])}));
  if(!lines.some(l=>l.s)){
    return `<div class="card"><div class="ch"><span class="lbl">${g.label}</span><span class="cur dim">no data</span></div></div>`;
  }
  let head, extra;
  if(g.lines.length>1){
    head = `<div class="ch"><span class="lbl">${g.label}</span></div>`;
    extra = `<div class="pmlegend">` + lines.map(l=>
      `<span class="pmlg${hiddenLines.has(l.k)?" off":""}" data-line="${l.k}"><span class="edot" style="background:${lineColor(l.hue)}"></span>${l.label} ${l.s?fmtVal(l.s.last,g.unit):"n/a"}</span>`
    ).join("") + `</div>`;
  } else {
    const l = lines[0];
    head = `<div class="ch"><span class="lbl">${g.label}</span><span class="cur">${fmtVal(l.s.last,g.unit)}</span></div>`;
    extra = `<div class="sub">min ${fmtVal(l.s.mn,g.unit)} · avg ${fmtVal(l.s.avg,g.unit)} · max ${fmtVal(l.s.mx,g.unit)}</div>`;
  }
  return `<div class="card">${head}${extra}${chart(t,lines,g)}</div>`;
}

function renderGrid(){
  document.getElementById("grid").innerHTML = GROUPS.map(card).join("");
}

function toggleLine(k){
  if(hiddenLines.has(k)){
    hiddenLines.delete(k);
  } else {
    const g = GROUPS.find(gr=>gr.lines.some(l=>l.k===k));
    if(g && g.lines.filter(l=>!hiddenLines.has(l.k)).length>1) hiddenLines.add(k);
  }
  renderGrid();
}

(function(){
  const app = document.getElementById("app");
  if(!D || !Array.isArray(D.t) || !D.t.length){
    app.innerHTML = `<h1>Health trends</h1><div class="empty">No health metrics recorded.</div>`;
    return;
  }
  const inc=(D.incidents||[]).length;
  let html = `<h1>Health trends</h1>`;
  html += `<div class="meta">Last ${D.days} day(s) · ${D.count.toLocaleString()} samples${inc?` · ${inc} incident${inc>1?"s":""}`:""} · generated ${D.generated}</div>`;
  if(inc) html += `<div class="pmlegend"><span class="pmlg" data-inc><span class="smp"></span>Incident markers</span></div>`;
  html += `<div class="grid" id="grid"></div>`;
  app.innerHTML = html;
  renderGrid();
  document.getElementById("grid").addEventListener("click", e=>{
    const el = e.target.closest("[data-line]");
    if(el) toggleLine(el.dataset.line);
  });
  const ic=app.querySelector("[data-inc]");
  if(ic) ic.addEventListener("click",()=>{ showIncidents=!showIncidents; ic.classList.toggle("off",!showIncidents); renderGrid(); });
})();
</script>
</body>
</html>
