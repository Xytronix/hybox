<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#0e1116;--panel:#161b22;--border:#222a35;--border2:#2b3543;
    --tx:#e6edf3;--tx2:#9aa7b4;--tx3:#8f9ba8;--accent:#5b9dff;--grid:#1d2630;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;padding:28px 22px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:21px;font-weight:600;margin:0 0 4px}
  .meta{color:var(--tx2);font-size:12.5px;margin-bottom:14px}
  .pmlegend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px;font-size:11px;color:var(--tx2)}
  .pmlegend .pmlg{
    appearance:none;background:transparent;border:0;color:inherit;font:inherit;
    display:inline-flex;align-items:center;gap:5px;cursor:pointer;
    padding:2px 0;text-align:left;user-select:none;
  }
  .pmlegend .pmlg:hover{color:var(--tx)}
  .pmlegend .pmlg:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
  .pmlegend .pmlg.off{color:var(--tx3);text-decoration:line-through}
  .pmlegend .edot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .pmlegend .smp{width:20px;border-top:1px dashed #f0626b;display:inline-block;flex:none}
  .card .pmlegend{margin:3px 0 8px;gap:12px;font-variant-numeric:tabular-nums}
  .empty{color:var(--tx2);background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:28px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:840px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 14px 8px}
  .ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .lbl{font-size:13px;color:var(--tx2);font-weight:500}
  .cur{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .sub{font-size:11.5px;color:var(--tx3);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  svg{display:block;width:100%;height:170px;overflow:visible}
  .ax{fill:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
  .ax.time{font-size:10px}
  .gl{stroke:var(--grid);stroke-width:1}
  .dl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 3}
  .il{stroke:#f0626b;stroke-width:1.1;stroke-dasharray:3 2;opacity:.7}
  .ln{fill:none;stroke-width:1.6}
  .band{fill-opacity:.14;stroke:none}
  .range{fill:none;stroke-width:1;stroke-opacity:.65;stroke-linecap:round}
  @media (max-width:600px){
    body{padding:20px 12px 44px}
    .card{padding-left:10px;padding-right:10px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;

const GROUPS = [
  {label:"Tick time", unit:"ms", zero:false, lines:[
    {k:"tickAvgMs", label:"Tick", hue:8}]},
  {label:"Ticks per second", unit:"", zero:true, lines:[
    {k:"tps", label:"TPS", hue:140}]},
  {label:"Players online", unit:"", zero:true, lines:[
    {k:"players", label:"Players", hue:205}]},
  {label:"Memory", unit:"MB", zero:false, lines:[
    {k:"heapMb", label:"Heap", hue:265},
    {k:"rssMb", label:"RSS", hue:300}]},
  {label:"CPU & GC time", unit:"%", zero:true, lines:[
    {k:"cpuPct", label:"CPU", hue:0},
    {k:"gcPct", label:"GC", hue:40}]},
  {label:"Allocation rate", unit:"MB/s", zero:true, lines:[
    {k:"allocMbPerSec", label:"Alloc", hue:175}]},
  {label:"Queued packets", unit:"", zero:true, lines:[
    {k:"queuedPackets", label:"Queued", hue:320}]},
];

const hiddenLines = new Set();
let chartWidth=820;
let showIncidents = true;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2,"0");
function dayLabel(ms){const d=new Date(ms);return MONTHS[d.getUTCMonth()]+" "+d.getUTCDate();}
function timeLabel(ms){const d=new Date(ms);return dayLabel(ms)+" "+pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());}

function fmtVal(v, unit){
  if(v==null||isNaN(v)) return "n/a";
  if(unit==="MB"){
    if(v>=1024) return (v/1024).toFixed(1)+" GB";
    return Math.round(v)+" MB";
  }
  const r = Math.abs(v)>=100 ? Math.round(v) : Math.round(v*100)/100;
  return r + (unit?" "+unit:"");
}

function timeTicks(t0,t1,width){
  const span=t1-t0;
  if(span<=0) return [t0];
  const steps=[1000,5000,15000,30000,60000,2*60000,5*60000,10*60000,15*60000,30*60000,
    3600000,2*3600000,3*3600000,6*3600000,12*3600000,86400000,2*86400000,3*86400000,7*86400000];
  const maxTicks=Math.max(3,Math.min(8,Math.floor(width/80)));
  let step=steps[steps.length-1];
  for(const s of steps){ if(Math.floor(span/s)+1<=maxTicks){ step=s; break; } }
  const ticks=[];
  for(let ms=Math.ceil(t0/step)*step;ms<=t1;ms+=step) ticks.push(ms);
  if(span<3600000 && ticks.length<3) return [t0,(t0+t1)/2,t1];
  return ticks.length?ticks:[t0];
}

function shortTimeLabel(ms,span){
  const d=new Date(ms);
  if(span<1000) return pad2(d.getUTCSeconds())+"."+String(d.getUTCMilliseconds()).padStart(3,"0");
  return pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes())+(span<5*60000?":"+pad2(d.getUTCSeconds()):"");
}

function lineColor(hue){ return `hsl(${hue} 70% 62%)`; }

function chart(t, lines, g){
  const W=chartWidth,H=170,PADL=64,PADR=12,PADT=12,PADB=24;
  const visible = lines.filter(l=>l.s && !hiddenLines.has(l.k));
  const use = visible.length ? visible : lines.filter(l=>l.s);
  let mn=Infinity, mx=-Infinity;
  use.forEach(l=>{ if(l.s.min<mn) mn=l.s.min; if(l.s.max>mx) mx=l.s.max; });
  if(mn===Infinity){ mn=0; mx=1; }
  if(mn===mx){ mn-=1; mx+=1; }
  if(g.zero && mn>0) mn=0;
  const t0=D.start, t1=D.end, span=Math.max(1,t1-t0);
  const xs = ms => PADL + (ms-t0)/span*(W-PADL-PADR);
  const ys = val => (H-PADB) - (val-mn)/(mx-mn)*(H-PADB-PADT);

  let parts = [];
  [mn,(mn+mx)/2,mx].forEach(gv=>{
    const y=ys(gv).toFixed(1);
    parts.push(`<line class="gl" x1="${PADL}" y1="${y}" x2="${W-PADR}" y2="${y}"/>`);
    parts.push(`<text class="ax" x="${PADL-6}" y="${(ys(gv)+3).toFixed(1)}" text-anchor="end">${fmtVal(gv,g.unit)}</text>`);
  });

  const short=t1>t0 && t1-t0<3600000;
  const sub=span<2*86400000;
  const ticks=timeTicks(t0,t1,W-PADL-PADR);
  ticks.forEach((gx,i)=>{
    const x=xs(gx);
    const anchor=i===0?"start":i===ticks.length-1?"end":"middle";
    parts.push(`<line class="dl" x1="${x.toFixed(1)}" y1="${PADT}" x2="${x.toFixed(1)}" y2="${H-PADB}"/>`);
    parts.push(`<text class="ax${short?" time":""}" x="${x.toFixed(1)}" y="${H-7}" text-anchor="${anchor}">${short?shortTimeLabel(gx,t1-t0):sub?timeLabel(gx):dayLabel(gx)}</text>`);
  });

  (showIncidents?(D.incidents||[]):[]).forEach(ms=>{
    if(ms>=t0&&ms<=t1){
      const x=xs(ms).toFixed(1);
      parts.push(`<line class="il" x1="${x}" y1="${PADT}" x2="${x}" y2="${H-PADB}"/>`);
    }
  });

  use.forEach(l=>{
    let dpath="", ranges="", band="", pen=false, first=0;
    const closeBand=end=>{
      for(let j=end;j>=first;j--) band+="L"+xs(t[j]).toFixed(1)+" "+ys(l.v[j].min).toFixed(1)+" ";
      band+="Z ";
    };
    for(let i=0;i<l.v.length;i++){
      const bucket=l.v[i];
      if(!bucket.count){
        if(pen) closeBand(i-1);
        pen=false;
        continue;
      }
      const x=xs(t[i]).toFixed(1);
      if(!pen) first=i;
      band+=(pen?"L":"M")+x+" "+ys(bucket.max).toFixed(1)+" ";
      ranges+="M"+x+" "+ys(bucket.min).toFixed(1)+" L"+x+" "+ys(bucket.max).toFixed(1)+" ";
      dpath+=(pen?"L":"M")+x+" "+ys(bucket.mean).toFixed(1)+" ";
      pen=true;
    }
    if(pen) closeBand(l.v.length-1);
    const color=lineColor(l.hue);
    parts.push(`<path class="band" fill="${color}" d="${band.trim()}"/>`);
    parts.push(`<path class="range" stroke="${color}" d="${ranges.trim()}"/>`);
    parts.push(`<path class="ln" stroke="${color}" d="${dpath.trim()}"/>`);
  });

  const chartId="trend-"+g.lines.map(l=>l.k).join("-");
  const period=t1>t0?` from ${timeLabel(t0)} to ${timeLabel(t1)}`:` at ${timeLabel(t0)}`;
  const values=use.map(l=>`${l.label}: last ${fmtVal(l.s.last,g.unit)}, minimum ${fmtVal(l.s.min,g.unit)}, average ${fmtVal(l.s.mean,g.unit)}, maximum ${fmtVal(l.s.max,g.unit)}`).join(". ");
  return `<svg role="img" aria-labelledby="${chartId}-title ${chartId}-desc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><title id="${chartId}-title">${g.label} trend</title><desc id="${chartId}-desc">${g.label}${period}. ${values}. Lines show bucket means; shaded envelopes and vertical ranges show observed bucket minima and maxima.</desc>${parts.join("")}</svg>`;
}

function gridPlotWidth(grid){
  const columns=Math.max(1,getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length);
  const styles=getComputedStyle(grid);
  const gap=columns>1?parseFloat(styles.columnGap)||0:0;
  const inset=window.matchMedia("(max-width:600px)").matches?22:30;
  return Math.max(220,Math.round((grid.clientWidth-gap*(columns-1))/columns-inset));
}

function card(g){
  const t = D.t||[];
  const lines = g.lines.map(l=>({...l, v:D[l.k].buckets, s:D[l.k].observed.count?D[l.k].observed:null}));
  if(!lines.some(l=>l.s)) return "";
  let head, extra;
  if(g.lines.length>1){
    head = `<div class="ch"><span class="lbl">${g.label}</span></div>`;
    extra = `<div class="pmlegend" aria-label="${g.label} series">` + lines.map(l=>
      `<button type="button" class="pmlg${hiddenLines.has(l.k)?" off":""}" data-line="${l.k}" aria-pressed="${!!l.s&&!hiddenLines.has(l.k)}"${l.s?"":" disabled"}><span class="edot" style="background:${lineColor(l.hue)}" aria-hidden="true"></span><span>${l.label} ${l.s?fmtVal(l.s.last,g.unit):"n/a"}</span></button>`
    ).join("") + `</div>`;
    extra+=lines.filter(l=>l.s).map(l=>`<div class="sub">${l.label}: min ${fmtVal(l.s.min,g.unit)} · avg ${fmtVal(l.s.mean,g.unit)} · max ${fmtVal(l.s.max,g.unit)}</div>`).join("");
  } else {
    const l = lines[0];
    head = `<div class="ch"><span class="lbl">${g.label}</span><span class="cur">${fmtVal(l.s.last,g.unit)}</span></div>`;
    extra = `<div class="sub">min ${fmtVal(l.s.min,g.unit)} · avg ${fmtVal(l.s.mean,g.unit)} · max ${fmtVal(l.s.max,g.unit)}</div>`;
  }
  return `<div class="card">${head}${extra}${chart(t,lines,g)}</div>`;
}

function renderGrid(){
  const grid=document.getElementById("grid");
  if(!grid) return;
  const focusedLine=document.activeElement?.dataset?.line||null;
  chartWidth=gridPlotWidth(grid);
  grid.innerHTML=GROUPS.map(card).join("");
  const empty=GROUPS.filter(g=>!g.lines.some(l=>D[l.k].observed.count)).map(g=>g.label);
  const note=document.getElementById("nodata");
  if(note) note.textContent=empty.length?"No data in this range for "+empty.join(", ")+".":"";
  if(focusedLine){
    for(const el of grid.querySelectorAll("[data-line]")){
      if(el.dataset.line===focusedLine){
        el.focus({preventScroll:true});
        break;
      }
    }
  }
}

function toggleLine(k){
  if(hiddenLines.has(k)){
    hiddenLines.delete(k);
  } else {
    const g = GROUPS.find(gr=>gr.lines.some(l=>l.k===k));
    if(g && g.lines.some(l=>l.k!==k&&!hiddenLines.has(l.k)&&D[l.k].observed.count)) hiddenLines.add(k);
  }
  renderGrid();
}

(function(){
  const app = document.getElementById("app");
  if(!D || !Array.isArray(D.t) || !D.t.length){
    app.innerHTML = `<h1>Health trends</h1><div class="empty"><strong>No health metrics recorded.</strong><p>In the generated <code>hybox.json</code> in Hybox's plugin data folder, set <code>Metrics.Enabled</code> to <code>true</code>, then run <code>/hybox reload</code>. Allow samples to collect and run <code>/hybox trend</code> again. Check that <code>Metrics.RetentionDays</code> covers the requested window.</p></div>`;
    return;
  }
  const inc=(D.incidents||[]).length;
  let html = `<h1>Health trends</h1>`;
  html += `<div class="meta" title="${D.count.toLocaleString()} recorded samples in ${D.t.length.toLocaleString()} buckets. Lines show bucket means. Shaded min to max envelopes and vertical ranges keep observed lows and spikes. Summaries use every sample, not averages of buckets. Last is the latest observation. Missing values are left out and empty buckets are gaps.">Last ${D.days} day${D.days===1?"":"s"} · ${D.count.toLocaleString()} samples${inc?` · ${inc} incident${inc>1?"s":""}`:""} · generated ${D.generated} · all times UTC</div>`;
  if(inc) html += `<div class="pmlegend"><button type="button" class="pmlg" data-inc aria-pressed="true"><span class="smp" aria-hidden="true"></span><span>Incident markers</span></button></div>`;
  html += `<div class="grid" id="grid"></div><div class="meta" id="nodata"></div>`;
  app.innerHTML = html;
  renderGrid();
  document.getElementById("grid").addEventListener("click", e=>{
    const el = e.target.closest("[data-line]");
    if(el) toggleLine(el.dataset.line);
  });
  const ic=app.querySelector("[data-inc]");
  if(ic) ic.addEventListener("click",()=>{
    showIncidents=!showIncidents;
    ic.classList.toggle("off",!showIncidents);
    ic.setAttribute("aria-pressed",String(showIncidents));
    renderGrid();
  });
  window.addEventListener("resize",renderGrid);
})();
</script>
</body>
</html>
