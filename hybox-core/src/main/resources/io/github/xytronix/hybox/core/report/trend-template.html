<html lang="en">

<style>
  :root{
    color-scheme:dark;
    --bg:#0f0f0f;--panel:#191919;--panelh:#262626;--code:#0b0b0b;--border:#2b2b2b;--border3:#474747;
    --tx:#ece9e2;--tx2:#bdb8ad;--tx3:#a29d93;--tx4:#948f86;--accent:#ffd21f;--warn:#ff8a3d;--bad:#f0626b;--grid:#2b2b2b;--shadow:rgba(0,0,0,.5);
    --s1:var(--accent);--s2:#ece9e2;--s3:#c9a740;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;padding:28px 22px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;margin:0 0 6px}
  .top .logo{display:block;width:32px;height:32px;flex:none}
  h1{font-size:21px;font-weight:600;margin:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .meta{color:var(--tx2);font-size:12.5px;margin-bottom:14px}
  .pmlegend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px;font-size:12px;color:var(--tx2)}
  .pmlegend .pmlg{
    appearance:none;background:transparent;border:0;color:inherit;font:inherit;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    padding:2px 6px;border-radius:4px;text-align:left;user-select:none;
  }
  .pmlegend .pmlg:hover{color:var(--tx);background:var(--panelh)}
  .pmlegend .pmlg.off{color:var(--tx3);text-decoration:line-through}
  .pmlegend .pmlg:disabled{cursor:default;color:var(--tx4);background:transparent}
  .pmlegend .edot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .pmlegend .smp{width:20px;border-top:1px dashed var(--bad);display:inline-block;flex:none}
  .card .pmlegend{margin:3px 0 8px;gap:8px;font-variant-numeric:tabular-nums}
  .empty{color:var(--tx2);background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:22px 26px;margin-top:16px;max-width:760px;line-height:1.65}
  .empty strong{display:block;color:var(--tx);font-size:15px;margin-bottom:6px}
  .empty p{margin:0}
  .empty code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--tx);background:color-mix(in srgb,var(--tx) 6%,transparent);padding:1px 5px;border-radius:4px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:840px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 14px 8px}
  .ch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .lbl{font-size:13px;color:var(--tx2);font-weight:500}
  .cur{font-size:19px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
  .cur small{font-size:12px;font-weight:500;color:var(--tx3);margin-right:5px}
  .sub{font-size:11.5px;color:var(--tx3);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .plot svg{display:block;width:100%;height:170px;overflow:visible}
  .ax{fill:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}
  .ax.time{font-size:10px}
  .gl{stroke:var(--grid);stroke-width:1}
  .dl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 3}
  .il{stroke:var(--bad);stroke-width:1.1;stroke-dasharray:3 2;opacity:.8}
  .ih{fill:var(--bad)}
  .ln{fill:none;stroke-width:1.6}
  .band{fill-opacity:.14;stroke:none}
  .range{fill:none;stroke-width:1;stroke-opacity:.65;stroke-linecap:round}
  .rl{stroke:var(--tx3);stroke-width:1;stroke-dasharray:6 4}
  .rlab{fill:var(--tx3);font-size:12px;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
  .off{fill:color-mix(in srgb,var(--tx3) 10%,transparent);stroke:none}
  .offd{stroke:var(--tx4);stroke-width:1;stroke-dasharray:3 3}
  .offl{fill:var(--tx4);font-size:10px}
  .dot{stroke:none}
  .clipmark{stroke:none}
  .cliplab{fill:var(--tx2);font-size:12px;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
  .scalerow{display:flex;justify-content:flex-end;margin:0 0 4px}
  .scalesw{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden}
  .scl{appearance:none;font:inherit;font-size:11.5px;line-height:1.5;color:var(--tx2);background:transparent;border:0;padding:2px 10px;cursor:pointer}
  .scl+.scl{border-left:1px solid var(--border)}
  .scl:hover{background:var(--panelh);color:var(--tx)}
  .scl[aria-pressed="true"],.scl[aria-pressed="true"]:hover{background:var(--accent);color:var(--code);font-weight:600;text-decoration:underline 2px;text-underline-offset:3px}
  .scl:disabled,.scl:disabled:hover{color:var(--tx4);background:transparent;cursor:default}
  .scl:focus-visible{outline-offset:-2px}
  .gl.minor{stroke-opacity:.45}
  .ax.cap{font-size:11px}
  .pmlegend .pmnone{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;color:var(--tx4);cursor:help}
  .pmlegend .pmnone .smp{border-top-color:var(--tx4)}
  .pmlegend .pmnote{display:inline-flex;align-items:center;padding:2px 6px;color:var(--tx3)}
  .plot{position:relative;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
  .plot:focus-visible{outline-offset:4px;border-radius:4px}
  .tg{stroke:var(--s1);stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 3}
  .td{stroke:var(--code);stroke-width:1.4}
  .ttip{position:fixed;left:0;top:0;width:max-content;max-width:min(360px,calc(100vw - 16px));background:var(--code);border:1px solid var(--border3);border-radius:6px;padding:5px 9px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--tx2);pointer-events:none;z-index:50;box-shadow:0 8px 22px var(--shadow);overflow-wrap:anywhere}
  .ttip.pin{position:absolute;pointer-events:auto;user-select:text;-webkit-user-select:text;padding-right:32px;max-height:calc(100vh - 16px);overflow:auto}
  .ttip .tclose{position:absolute;top:4px;right:5px;width:22px;height:22px;display:grid;place-items:center;border:0;background:none;border-radius:5px;color:var(--tx3);font:16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;cursor:pointer;padding:0}
  .ttip .tclose:hover{background:var(--panelh);color:var(--tx)}
  .ttip[hidden]{display:none}
  .ttip b{color:var(--tx)}
  .ttip .tl{display:flex;gap:6px;align-items:center;margin-top:3px;white-space:nowrap}
  .ttip .tdot{width:6px;height:6px;border-radius:50%;flex:none}
  .ttip .mut{color:var(--tx4)}
  .ttip .inc{color:var(--bad)}
  .ttip .inc .tdot{background:var(--bad)}
  .ttip .tinc{margin-top:6px;padding-top:5px;border-top:1px solid var(--border3)}
  .ttip .thl{color:var(--tx);margin-top:3px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:normal}
  .ttip .tkv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin-top:3px}
  .ttip .tkv>span:nth-child(odd){color:var(--tx3)}
  .ttip .tkv a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .ttip .sev-crit{color:var(--bad)} .ttip .sev-warn{color:var(--warn)} .ttip .sev-info{color:var(--tx3)}
  .ttip .tsec{margin-top:6px;padding-top:5px;border-top:1px solid var(--border3);color:var(--tx);font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ttip .tkv .tln{display:block}
  .ttip .vw{color:var(--warn)}
  .ttip .vword{color:var(--warn);margin-left:4px;font-size:11px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  @media (max-width:600px){
    body{padding:20px 12px 44px}
    .card{padding-left:10px;padding-right:10px}
  }
  @media print{
    html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .ttip{display:none!important}
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="hbx-logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0b0b0b"/><g fill="#FFD21F" stroke="#0b0b0b" stroke-width="12" stroke-linejoin="round"><path d="M136 230 L256 170 L186 136 L66 196 Z"/><path d="M136 230 L256 170 L256 290 Z" fill="#9A7600"/><path d="M256 170 L376 230 L256 290 Z" fill="#C79A00"/><path d="M256 170 L376 230 L446 196 L326 136 Z"/><path d="M270 40 L216 142 L254 142 L232 222 L306 108 L266 108 L302 40 Z"/><path d="M136 230 L256 290 L256 432 L136 372 Z"/><path d="M256 290 L376 230 L376 372 L256 432 Z"/><path d="M136 230 L256 290 L200 334 L80 274 Z"/><path d="M256 290 L376 230 L432 274 L312 334 Z"/></g></symbol></svg>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;
function fixed(x,d){const v=Number(x),n=d|0,s=String(Math.abs(v));if(!isFinite(v)||s.includes("e"))return v.toFixed(n);return ((v<0?-1:1)*Number(Math.round(Number(s+"e"+n))+"e-"+n)).toFixed(n);}

const GROUPS = [
  {label:"Tick time", unit:"ms", dec:1, family:"tick", ref:t=>({v:1000/t,label:`${fixed(1000/t,1)} ms budget`}), sev:(v,t)=>v>1000/t?"high":null, lines:[
    {k:"tickAvgMs", label:"Tick time", c:0}]},
  {label:"TPS", unit:"", dec:1, ref:t=>({v:t,label:`${t} TPS target`,ceiling:true}), sev:(v,t)=>v<0.9*t?"low":null, lines:[
    {k:"tps", label:"TPS", c:0}]},
  {label:"Players online", unit:"", dec:0, lines:[
    {k:"players", label:"Players", c:0}]},
  {label:"Memory", unit:"MiB", dec:0, family:"heap", lines:[
    {k:"heapMb", label:"Heap", c:0},
    {k:"rssMb", label:"RSS", c:1, none:"RSS: Linux only"}]},
  {label:"CPU & GC time", unit:"%", dec:1, lines:[
    {k:"cpuPct", label:"Server CPU", c:0},
    {k:"gcPct", label:"GC time", c:1}]},
  {label:"Allocation rate", unit:"MiB/s", dec:1, family:"alloc", lines:[
    {k:"allocMbPerSec", label:"Allocated", c:0}]},
  {label:"Queued packets", unit:"", dec:0, family:"packets", lines:[
    {k:"queuedPackets", label:"Queued", c:0}]},
  {label:"View and hot radius", unit:"chunks", dec:0, lines:[
    {k:"viewRadiusMedian", label:"View, median", c:0},
    {k:"hotRadiusMedian", label:"Hot, median", c:1},
    {k:"maxViewRadius", label:"Server max", c:2}]},
  {label:"Loaded sections", unit:"", dec:0, family:"loaded", lines:[
    {k:"loadedSections", label:"All players", c:0}]},
];
const CSSV=getComputedStyle(document.documentElement);
const SERIES=[1,2,3].map(k=>CSSV.getPropertyValue("--s"+k).trim());

const hiddenLines = new Set();
const SCALE = {};
const LOGS = D && D.logScale ? D.logScale : {families:[], span:100, decades:6};
const LOGF = new Set(LOGS.families);
const PLOTS = {};
let chartWidth=820;
let showIncidents = true;
const INCS = D && Array.isArray(D.incidents) ? D.incidents.filter(x=>x.x!=null) : [];
const GAPS = D && Array.isArray(D.gaps) ? D.gaps : [];
const SEVW = {CRITICAL:["Critical","crit"], DEGRADED:["Degraded","warn"], INFO:["Info","info"]};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let hover = null, hoverRaf = 0, hoverNext = null;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2,"0");
function dayLabel(ms){const d=new Date(ms);return MONTHS[d.getUTCMonth()]+" "+d.getUTCDate();}
function timeLabel(ms){const d=new Date(ms);return dayLabel(ms)+" "+pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());}
function clockLabel(ms){const d=new Date(ms);return pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());}
function rangeLabel(a,b){
  if(a==null) return "";
  if(b==null||b-a<60000) return timeLabel(a);
  return timeLabel(a)+" to "+(dayLabel(a)===dayLabel(b)?clockLabel(b):timeLabel(b));
}
function durLabel(ms){
  const m=Math.round(ms/60000);
  if(m<60) return m+" min";
  const h=Math.floor(m/60), r=m%60;
  if(h<48) return h+" h"+(r?" "+r+" min":"");
  return Math.round(h/24)+" days";
}

const NICE=[1,1.5,2,2.5,3,4,5,6,8,10];
function niceTop(v){
  if(!(v>0)||!isFinite(v)) return 1;
  const p=10**Math.floor(Math.log10(v));
  for(const s of NICE) if(s*p>=v*(1-1e-9)) return s*p;
  return 10*p;
}
function axisOf(p98,max,ref,whole,ceiling){
  const floor=ref>0?ref*1.15:0, limit=Math.max(floor,typeof p98==="number"&&isFinite(p98)?1.5*p98:0);
  let top=ceiling&&ref>0?floor:(typeof max==="number"&&max>0&&limit>0&&max<=2*limit?Math.max(max,floor):limit);
  if(!(top>0)) top=typeof max==="number"&&max>0?Math.min(max,1):1;
  if(whole){ top=Math.max(2,Math.ceil(top-1e-9)); if(top%2) top+=1; } else top=niceTop(top);
  return {top,clipped:typeof max==="number"&&max>top*(1+1e-9)?max:null};
}
function axisDigits(top,whole){
  if(whole) return 0;
  const mid=top/2;
  for(let d=0;d<3;d++){const s=mid*10**d;if(Math.abs(s-Math.round(s))<1e-6*Math.max(1,Math.abs(s))) return d;}
  return 3;
}
const LOG_STEPS=[1,2,5,10];
function pow10(step,d){ return d>=0?step*10**d:step/10**(-d); }
function logStep(v,up){
  const d=Math.floor(Math.log10(v));
  let best=pow10(1,d);
  for(const s of LOG_STEPS){ const c=pow10(s,d); if(up&&c>=v*(1-1e-9)) return c; if(!up&&c<=v*(1+1e-9)) best=c; }
  return up?pow10(10,d):best;
}
function logAxis(low,high,ref){
  if(ref>0&&isFinite(ref)){ low=isFinite(low)?Math.min(low,ref):ref; high=isFinite(high)?Math.max(high,ref):ref; }
  if(!(high>0)) high=1;
  if(!(low>0)||low>high) low=high;
  const top=logStep(high,true);
  let bottom=Math.max(logStep(low,false),logStep(top/10**LOGS.decades,true));
  if(!(bottom<top*(1-1e-9))) bottom=top/10;
  return {top,bottom};
}
function logTicks(b,t){
  const out=[];
  for(let d=Math.floor(Math.log10(b))-1;d<=Math.ceil(Math.log10(t))+1;d++) for(const s of [1,2,5]){ const v=pow10(s,d); if(v>=b*(1-1e-9)&&v<=t*(1+1e-9)) out.push(v); }
  return out;
}
function logLabels(b,t,px,gap){
  const all=logTicks(b,t), per=px/Math.log10(t/b);
  if(per*Math.log10(2)>=gap) return all;
  const every=Math.max(1,Math.ceil(gap/per-1e-9));
  const cand=all.filter(v=>{const d=Math.round(Math.log10(v));return Math.abs(v-pow10(1,d))<=1e-9*v&&((d%every)+every)%every===0;});
  cand.push(t,b);
  const kept=[];
  for(const c of cand) if(kept.every(k=>Math.abs(Math.log10(c/k))*per>=gap)) kept.push(c);
  return kept.sort((x,y)=>x-y);
}
function logFrac(v,b,t){ return v>b?Math.min(1,Math.log10(v/b)/Math.log10(t/b)):0; }
function logPlain(v){ return v>=1?String(Math.round(v)):String(+v.toPrecision(1)); }

function scaleOf(g,lines){
  if(g.unit!=="MiB") return {u:g.unit,k:1,d:g.dec};
  const mx=Math.max(0,...lines.filter(l=>l.s).map(l=>l.s.max));
  return mx>=1024?{u:"GiB",k:1/1024,d:1}:{u:"MiB",k:1,d:0};
}
function num(v,sc,d){ return (v==null||isNaN(v))?"n/a":fixed(v*sc.k,d==null?sc.d:d); }
function fmtVal(v,sc,d){
  const n=num(v,sc,d);
  if(n==="n/a"||!sc.u) return n;
  return n+(sc.u==="%"?"":" ")+(n==="1"&&sc.u==="chunks"?"chunk":sc.u);
}
function stats(s,sc){ return `min ${num(s.min,sc)} · avg ${num(s.mean,sc)} · max ${num(s.max,sc)}${sc.u?(sc.u==="%"?"%":" "+sc.u):""}`; }

function timeTicks(t0,t1,width){
  const span=t1-t0;
  if(span<=0) return [t0];
  const steps=[1000,5000,15000,30000,60000,2*60000,5*60000,10*60000,15*60000,30*60000,
    3600000,2*3600000,3*3600000,6*3600000,12*3600000,86400000,2*86400000,3*86400000,7*86400000];
  const maxTicks=Math.max(3,Math.min(8,Math.floor(width/80)));
  let step=steps[steps.length-1];
  for(const s of steps){ if(Math.floor(span/s)+1<=maxTicks){ step=s; break; } }
  const ticks=[];
  for(let ms=Math.ceil(t0/step)*step;ms<=t1;ms+=step) ticks.push(ms);
  if(span<3600000 && ticks.length<3) return [t0,(t0+t1)/2,t1];
  return ticks.length?ticks:[t0];
}

function lineColor(c){ return SERIES[c%SERIES.length]; }
function bucketTarget(i){
  const b=D.targetTps&&D.targetTps.buckets?D.targetTps.buckets[i]:null;
  return b&&b.count&&b.mean>0?b.mean:(D.tpsTarget>0?D.tpsTarget:null);
}

function chart(t, lines, g, sc){
  const W=chartWidth,H=170,PADL=64,PADR=12,PADT=20,PADB=24;
  const visible = lines.filter(l=>l.s && !hiddenLines.has(l.k));
  const use = visible.length ? visible : lines.filter(l=>l.s);
  const ref=g.ref&&D.tpsTarget>0?g.ref(D.tpsTarget):null;
  const whole=g.dec===0;
  let p98=null, mx=null, pmed=null, pmin=null;
  use.forEach(l=>{
    const p=D[l.k].p98, m=D[l.k].posMedian, n=D[l.k].posMin;
    if(typeof p==="number"&&(p98==null||p*sc.k>p98)) p98=p*sc.k;
    if(mx==null||l.s.max*sc.k>mx) mx=l.s.max*sc.k;
    if(typeof m==="number"&&m>0&&(pmed==null||m*sc.k>pmed)) pmed=m*sc.k;
    if(typeof n==="number"&&n>0&&(pmin==null||n*sc.k<pmin)) pmin=n*sc.k;
  });
  const chartId="trend-"+g.lines.map(l=>l.k).join("-");
  const fam=LOGF.has(g.family), autoLog=fam&&pmed>0&&mx>=LOGS.span*pmed;
  const isLog=fam&&pmin>0&&(SCALE[chartId]?SCALE[chartId]==="log":autoLog);
  const la=isLog?logAxis(pmin,mx,ref?ref.v*sc.k:0):null;
  const ax=isLog?{top:la.top,clipped:null}:axisOf(p98,mx,ref?ref.v*sc.k:0,whole,!!(ref&&ref.ceiling));
  const top=ax.top/sc.k, bottom=isLog?la.bottom/sc.k:0, digits=axisDigits(ax.top,whole);
  const xf = f => PADL + f*(W-PADL-PADR);
  const ys = val => (H-PADB) - (isLog?logFrac(val,bottom,top):Math.min(val,top)/top)*(H-PADB-PADT);

  let parts = [];
  GAPS.forEach(gp=>{
    const a=xf(gp[2]), b=xf(gp[3]);
    if(b-a<0.5) return;
    parts.push(`<rect class="off" x="${fixed(a,1)}" y="${PADT}" width="${fixed(b-a,1)}" height="${H-PADB-PADT}"/>`);
    if(D.collapsed) parts.push(`<line class="offd" x1="${fixed((a+b)/2,1)}" y1="${PADT}" x2="${fixed((a+b)/2,1)}" y2="${H-PADB}"/>`);
    if(b-a>=30) parts.push(`<text class="offl" x="${fixed((a+b)/2,1)}" y="${PADT+11}" text-anchor="middle">off</text>`);
  });
  if(isLog){
    const labs=logLabels(la.bottom,la.top,H-PADB-PADT,14);
    logTicks(la.bottom,la.top).forEach(gv=>{
      const y=ys(gv/sc.k), lab=labs.some(v=>Math.abs(v-gv)<=1e-9*gv);
      parts.push(`<line class="gl${lab?"":" minor"}" x1="${PADL}" y1="${fixed(y,1)}" x2="${W-PADR}" y2="${fixed(y,1)}"/>`);
      if(lab) parts.push(`<text class="ax" x="${PADL-6}" y="${fixed(y+3,1)}" text-anchor="end">${logPlain(gv)}${sc.u?(sc.u==="%"?"%":" "+sc.u):""}</text>`);
    });
    parts.push(`<text class="ax cap" x="${PADL}" y="${PADT-8}">${sc.u?esc(sc.u)+", ":""}log scale</text>`);
  } else [0,top/2,top].forEach(gv=>{
    const y=fixed(ys(gv),1);
    parts.push(`<line class="gl" x1="${PADL}" y1="${y}" x2="${W-PADR}" y2="${y}"/>`);
    parts.push(`<text class="ax" x="${PADL-6}" y="${fixed(ys(gv)+3,1)}" text-anchor="end">${fmtVal(gv,sc,gv?digits:0)}</text>`);
  });
  if(ref){
    const y=fixed(ys(ref.v),1);
    parts.push(`<line class="rl" x1="${PADL}" y1="${y}" x2="${W-PADR}" y2="${y}"/><text class="rlab" x="${W-PADR-4}" y="${fixed(ys(ref.v)-5,1)}" text-anchor="end">${ref.label}</text>`);
  }

  const t0=D.start, t1=D.end, span=Math.max(1,t1-t0);
  const labels=[];
  if(D.collapsed&&Array.isArray(D.sessions)&&D.sessions.length){
    let last=-Infinity;
    D.sessions.forEach((s,i)=>{
      const x=xf(s[1]);
      if(x-last<84&&i>0) return;
      labels.push({x,text:timeLabel(s[0])});
      last=x;
    });
  } else {
    const short=t1-t0<3600000, sub=span<2*86400000;
    timeTicks(t0,t1,W-PADL-PADR).forEach(ms=>labels.push({x:xf((ms-t0)/span),text:short?clockLabel(ms):sub?timeLabel(ms):dayLabel(ms),grid:true}));
  }
  labels.forEach(lb=>{
    const anchor=lb.x<PADL+40?"start":lb.x>W-PADR-40?"end":"middle";
    if(lb.grid) parts.push(`<line class="dl" x1="${fixed(lb.x,1)}" y1="${PADT}" x2="${fixed(lb.x,1)}" y2="${H-PADB}"/>`);
    parts.push(`<text class="ax time" x="${fixed(lb.x,1)}" y="${H-7}" text-anchor="${anchor}">${lb.text}</text>`);
  });

  const incX=[];
  if(showIncidents) INCS.forEach((inc,k)=>{
    const x=xf(inc.x);
    incX.push({x,k});
    parts.push(`<line class="il" x1="${fixed(x,1)}" y1="${PADT}" x2="${fixed(x,1)}" y2="${H-PADB}"/><circle class="ih" cx="${fixed(x,1)}" cy="${PADT}" r="3.5"/>`);
  });

  const X=t.map((_,i)=>xf(D.x[i]));
  let clipTop=null;
  const clips=[];
  use.forEach(l=>{
    const brk=new Set(D[l.k].brk||[]);
    let dpath="", band="", dots="", pen=false, run=[], prev=-1;
    const color=lineColor(l.c);
    const closeBand=()=>{
      if(run.length>1){
        band+="M"+run.map(i=>fixed(X[i],1)+" "+fixed(ys(l.v[i].max),1)).join(" L")+" L"+run.slice().reverse().map(i=>fixed(X[i],1)+" "+fixed(ys(l.v[i].min),1)).join(" L")+" Z ";
      } else if(run.length===1){
        const i=run[0];
        dots+=`<circle class="dot" cx="${fixed(X[i],1)}" cy="${fixed(ys(l.v[i].mean),1)}" r="2.4" fill="${color}"/>`;
        if(l.v[i].max>l.v[i].min) band+=`M${fixed(X[i]-1,1)} ${fixed(ys(l.v[i].max),1)} L${fixed(X[i]+1,1)} ${fixed(ys(l.v[i].max),1)} L${fixed(X[i]+1,1)} ${fixed(ys(l.v[i].min),1)} L${fixed(X[i]-1,1)} ${fixed(ys(l.v[i].min),1)} Z `;
      }
      run=[];
    };
    let clipRun=null;
    const endClip=()=>{
      if(!clipRun) return;
      const x=(X[clipRun.a]+X[clipRun.b])/2;
      clips.push(`<path class="clipmark" d="M ${fixed(x-4,1)} ${PADT+3} L ${fixed(x+4,1)} ${PADT+3} L ${fixed(x,1)} ${PADT-3} Z" fill="${color}"/>`);
      clipRun=null;
    };
    for(let i=0;i<l.v.length;i++){
      const b=l.v[i];
      if(!b.count) continue;
      if(pen&&brk.has(i)){ closeBand(); pen=false; endClip(); }
      dpath+=(pen?"L":"M")+fixed(X[i],1)+" "+fixed(ys(b.mean),1)+" ";
      run.push(i);
      pen=true;
      if(b.max>top*(1+1e-9)){
        if(clipRun&&clipRun.b===prev) clipRun.b=i; else { endClip(); clipRun={a:i,b:i}; }
        if(!clipTop||b.max>clipTop.v) clipTop={v:b.max,x:X[i],name:use.length>1?l.label:null};
      } else endClip();
      prev=i;
    }
    closeBand(); endClip();
    parts.push(`<path class="band" fill="${color}" d="${band.trim()}"/>`);
    parts.push(`<path class="ln" stroke="${color}" d="${dpath.trim()}"/>`);
    if(dots) parts.push(dots);
  });
  if(clips.length) parts.push(`<g pointer-events="none">${clips.join("")}</g>`);
  if(clipTop){
    const right=clipTop.x>W/2;
    parts.push(`<text class="cliplab" x="${fixed(right?clipTop.x-10:clipTop.x+10,1)}" y="${PADT-8}" text-anchor="${right?"end":"start"}">${esc((clipTop.name?clipTop.name+" ":"")+fmtVal(clipTop.v,sc))} off scale</text>`);
  }

  const period=t1>t0?` from ${timeLabel(t0)} to ${timeLabel(t1)}`:` at ${timeLabel(t0)}`;
  const values=use.map(l=>`${l.label}: last ${fmtVal(l.s.last,sc)}, minimum ${fmtVal(l.s.min,sc)}, average ${fmtVal(l.s.mean,sc)}, maximum ${fmtVal(l.s.max,sc)}`).join(". ");
  PLOTS[chartId]={W,H,x:X,xf,sc,inc:incX,fam,log:isLog,autoLog,canLog:fam&&pmin>0,lines:use.map(l=>({label:l.label,color:lineColor(l.c),v:l.v,y:l.v.map(b=>b.count?ys(b.mean):null)}))};
  const marks=`<line class="tg" x1="0" y1="${PADT}" x2="0" y2="${H-PADB}" visibility="hidden"/>`+use.map(l=>`<circle class="td" r="3.2" fill="${lineColor(l.c)}" visibility="hidden"/>`).join("");
  const offText=GAPS.length?" Shaded: server off.":"";
  return `<div class="plot" data-plot="${chartId}" tabindex="0" role="group" aria-labelledby="${chartId}-title" aria-describedby="tkeys"><svg role="img" aria-labelledby="${chartId}-title ${chartId}-desc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><title id="${chartId}-title">${g.label} trend</title><desc id="${chartId}-desc">${g.label}${period}. ${values}. Line: average. Band: lowest to highest.${offText}${ref?` Dashed line: ${ref.label}.`:""}${clipTop?` ${fmtVal(clipTop.v,sc)} is off scale.`:""}${isLog?" Log scale.":""}</desc>${parts.join("")}${marks}</svg></div>`;
}

function scaleChip(id){
  const p=PLOTS[id];
  if(!p||!p.fam) return "";
  const btn=(mode,label)=>{
    const log=mode==="log";
    return `<button type="button" class="scl" data-scale="${id}:${mode}" aria-pressed="${log===p.log}"${log&&!p.canLog?" disabled":""}${log===p.autoLog?' title="Automatic choice for this data"':""}>${label}</button>`;
  };
  return `<div class="scalerow"><span class="scalesw" role="group" aria-label="Scale of the y axis">${btn("lin","Linear")}${btn("log","Log")}</span></div>`;
}

function gridPlotWidth(grid){
  const columns=Math.max(1,getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length);
  const styles=getComputedStyle(grid);
  const gap=columns>1?parseFloat(styles.columnGap)||0:0;
  const inset=window.matchMedia("(max-width:600px)").matches?22:30;
  return Math.max(220,Math.round((grid.clientWidth-gap*(columns-1))/columns-inset));
}

function card(g){
  const t = D.t||[];
  const lines = g.lines.map(l=>({...l, v:D[l.k].buckets, s:D[l.k].observed.count?D[l.k].observed:null}));
  if(!lines.some(l=>l.s)) return "";
  const sc=scaleOf(g,lines);
  if(lines.every(l=>!l.s||l.s.min===l.s.max)){
    (card.flat||(card.flat=[])).push(...lines.filter(l=>l.s).map(l=>`${g.lines.length>1?l.label:g.label}: ${fmtVal(l.s.min,sc)} the whole time.`));
    return "";
  }
  let head, extra;
  if(g.lines.length>1){
    head = `<div class="ch"><span class="lbl">${g.label}</span></div>`;
    extra = `<div class="pmlegend" aria-label="${g.label} series">` + lines.map(l=>
      `<button type="button" class="pmlg${hiddenLines.has(l.k)?" off":""}" data-line="${l.k}" aria-pressed="${!!l.s&&!hiddenLines.has(l.k)}"${l.s?"":" disabled"}><span class="edot" style="background:${lineColor(l.c)}" aria-hidden="true"></span><span>${l.s?`${l.label}, last ${fmtVal(l.s.last,sc)}`:(l.none||`${l.label}, no data`)}</span></button>`
    ).join("") + `</div>`;
    extra+=lines.filter(l=>l.s).map(l=>`<div class="sub">${l.label}: ${stats(l.s,sc)}</div>`).join("");
  } else {
    const l = lines[0];
    head = `<div class="ch"><span class="lbl">${g.label}</span><span class="cur"><small>last</small>${fmtVal(l.s.last,sc)}</span></div>`;
    extra = `<div class="sub">${stats(l.s,sc)}</div>`;
  }
  const plot=chart(t,lines,g,sc);
  return `<div class="card">${head}${extra}${scaleChip("trend-"+g.lines.map(l=>l.k).join("-"))}${plot}</div>`;
}

function renderGrid(){
  const grid=document.getElementById("grid");
  if(!grid) return;
  const focusedLine=document.activeElement?.dataset?.line||null;
  clearHover();
  for(const k in PLOTS) delete PLOTS[k];
  chartWidth=gridPlotWidth(grid);
  grid.innerHTML=GROUPS.map(card).join("");
  const empty=GROUPS.filter(g=>!g.lines.some(l=>D[l.k].observed.count)).map(g=>g.label);
  const note=document.getElementById("nodata");
  const flat=card.flat||[];
  card.flat=[];
  if(note) note.textContent=[empty.length?"No data in this range for "+empty.join(", ")+".":"",...flat].filter(Boolean).join(" ");
  if(focusedLine){
    for(const el of grid.querySelectorAll("[data-line]")){
      if(el.dataset.line===focusedLine){
        el.focus({preventScroll:true});
        break;
      }
    }
  }
}

function toggleLine(k){
  if(hiddenLines.has(k)){
    hiddenLines.delete(k);
  } else {
    const g = GROUPS.find(gr=>gr.lines.some(l=>l.k===k));
    if(g && g.lines.some(l=>l.k!==k&&!hiddenLines.has(l.k)&&D[l.k].observed.count)) hiddenLines.add(k);
  }
  renderGrid();
}

function hitAt(plot,clientX,reach){
  const geo=PLOTS[plot.dataset.plot], r=plot.getBoundingClientRect(), k=geo.W/(r.width||1), vx=(clientX-r.left)*k;
  let inc=null, at=vx, nd=reach*k;
  geo.inc.forEach(m=>{const d=Math.abs(m.x-vx); if(d<=nd){nd=d;inc=m.k;at=m.x;}});
  let best=0, bd=Infinity;
  geo.x.forEach((x,i)=>{const d=Math.abs(x-at); if(d<bd){bd=d;best=i;}});
  if(inc==null&&bd>reach*k){
    for(let g=0;g<GAPS.length;g++){
      const a=geo.xf(GAPS[g][2]), b=geo.xf(GAPS[g][3]);
      if(vx>a&&vx<b) return {i:best,inc:null,gap:g};
    }
  }
  return {i:best,inc,gap:null};
}

function incidentsAt(i,inc){
  if(!showIncidents) return [];
  const t=D.t, lo=i>0?(t[i-1]+t[i])/2:-Infinity, hi=i<t.length-1?(t[i]+t[i+1])/2:Infinity;
  return INCS.filter((x,k)=>k===inc||(x.t>lo&&x.t<=hi));
}

function incidentHtml(x){
  const sev=SEVW[x.severity]||(x.severity?[x.severity.charAt(0)+x.severity.slice(1).toLowerCase(),"info"]:null);
  let h=`<div class="tinc"><div class="tl inc"><span class="tdot"></span>Incident at ${timeLabel(x.t)}:${pad2(new Date(x.t).getUTCSeconds())}</div>`;
  if(x.headline) h+=`<div class="thl">${esc(x.headline)}</div>`;
  h+=`<div class="tkv">`;
  if(sev) h+=`<span>Severity</span><span class="sev-${sev[1]}">${sev[0]}</span>`;
  if(x.trigger) h+=`<span>Trigger</span><span>${esc(x.trigger)}</span>`;
  if(x.file) h+=`<span>Bundle</span><a href="incidents/${encodeURIComponent(x.file)}" target="_blank" rel="noopener noreferrer">${esc(x.file)}</a>`;
  return h+`</div></div>`;
}

const TTIP=document.createElement("div");
TTIP.className="ttip"; TTIP.hidden=true; TTIP.setAttribute("aria-hidden","true");
document.body.appendChild(TTIP);

function placeTip(cx,cy){
  const tw=TTIP.offsetWidth, th=TTIP.offsetHeight, m=8;
  let x=cx+12; if(x+tw>innerWidth-m) x=cx-tw-12;
  let y=cy+16; if(y+th>innerHeight-m) y=cy-th-12;
  TTIP.style.left=Math.max(m,Math.min(x,innerWidth-tw-m))+"px";
  TTIP.style.top=Math.max(m,Math.min(y,innerHeight-th-m))+"px";
}

function hideMarks(){
  document.querySelectorAll(".plot[data-plot]").forEach(plot=>plot.querySelectorAll(".tg,.td").forEach(n=>n.setAttribute("visibility","hidden")));
}

function pinTip(pinned){
  TTIP.classList.toggle("pin",!!pinned);
  if(pinned){ TTIP.removeAttribute("aria-hidden"); TTIP.insertAdjacentHTML("afterbegin",`<button type="button" class="tclose" aria-label="Close">×</button>`); }
  else TTIP.setAttribute("aria-hidden","true");
}

function placeShown(cx,cy,pinned){
  TTIP.hidden=false;
  placeTip(cx,cy);
  if(pinned){
    TTIP.style.left=parseFloat(TTIP.style.left)+scrollX+"px";
    TTIP.style.top=parseFloat(TTIP.style.top)+scrollY+"px";
  }
}

function showGap(plot,g,cx,cy,pinned){
  const key=plot.dataset.plot+"|gap"+g+"|"+!!pinned;
  if(!hover||hover.key!==key){
    hideMarks();
    const gp=GAPS[g];
    TTIP.innerHTML=`<b>Server off</b><div class="tl">${rangeLabel(gp[0],gp[1])}</div><div class="mut" style="margin-top:4px">No samples for ${durLabel(gp[1]-gp[0])}.</div>`;
    pinTip(pinned);
  }
  hover={plot,i:null,inc:null,pinned:!!pinned,key};
  placeShown(cx,cy,pinned);
}

function showHover(plot,i,cx,cy,pinned,inc=null){
  const key=plot.dataset.plot+"|"+i+"|"+inc+"|"+!!pinned;
  if(!hover||hover.key!==key){
    if(!hover||hover.i!==i) document.querySelectorAll(".plot[data-plot]").forEach(p=>{
      const geo=PLOTS[p.dataset.plot]; if(!geo) return;
      const x=geo.x[i], guide=p.querySelector(".tg");
      guide.setAttribute("x1",x); guide.setAttribute("x2",x); guide.setAttribute("visibility","visible");
      p.querySelectorAll(".td").forEach((dot,k)=>{
        const y=geo.lines[k].y[i];
        if(y==null) dot.setAttribute("visibility","hidden");
        else { dot.setAttribute("cx",x); dot.setAttribute("cy",y); dot.setAttribute("visibility","visible"); }
      });
    });
    const geo=PLOTS[plot.dataset.plot];
    let html=`<b>${rangeLabel(D.t0[i],D.t1[i])}</b>`;
    geo.lines.forEach(l=>{
      const b=l.v[i];
      const range=b.count&&b.max!==b.min?` <span class="mut">min ${fmtVal(b.min,geo.sc)}, max ${fmtVal(b.max,geo.sc)}</span>`:"";
      html+=`<div class="tl"><span class="tdot" style="background:${l.color}"></span>${l.label} ${b.count?`<b>${fmtVal(b.mean,geo.sc)}</b>${range}`:`<span class="mut">no data</span>`}</div>`;
    });
    const incs=incidentsAt(i,inc);
    html+=incs.map(incidentHtml).join("");
    if(pinned) html+=momentHtml(i);
    if(!pinned&&document.activeElement!==plot) html+=`<div class="mut" style="margin-top:4px">Click to keep this open with more detail.</div>`;
    TTIP.innerHTML=html;
    if(document.activeElement===plot) document.getElementById("tvalue").textContent=TTIP.textContent;
    pinTip(pinned);
  }
  hover={plot,i,inc,pinned:!!pinned,key};
  placeShown(cx,cy,pinned);
}

function showHit(plot,h,cx,cy,pinned){
  if(h.gap!=null) showGap(plot,h.gap,cx,cy,pinned);
  else showHover(plot,h.i,cx,cy,pinned,h.inc);
}

function showKeyboardHover(plot,i){
  const geo=PLOTS[plot.dataset.plot]; if(!geo) return;
  const r=plot.getBoundingClientRect();
  showHover(plot,i,r.left+geo.x[i]*r.width/geo.W,r.top+12,false,null);
}

function clearHover(){
  if(hoverRaf){ cancelAnimationFrame(hoverRaf); hoverRaf=0; }
  hoverNext=null; hover=null; TTIP.hidden=true; TTIP.classList.remove("pin"); TTIP.setAttribute("aria-hidden","true");
  hideMarks();
}

function momentHtml(i){
  const target=bucketTarget(i);
  const rows=GROUPS.map(g=>{
    const ls=g.lines.filter(l=>D[l.k]&&D[l.k].observed&&D[l.k].observed.count);
    if(!ls.length) return "";
    const sc=scaleOf(g,ls.map(l=>({s:D[l.k].observed})));
    const val=l=>{
      const b=D[l.k].buckets[i];
      if(!b||!b.count) return `<span class="mut">no data</span>`;
      const w=g.sev&&target?g.sev(b.mean,target):null;
      return `<b${w?' class="vw"':""}>${fmtVal(b.mean,sc)}</b>${w?`<span class="vword">${w}</span>`:""}`;
    };
    const v=ls.length===1&&g.lines.length===1?val(ls[0]):ls.map(l=>`<span class="tln">${esc(l.label)} ${val(l)}</span>`).join("");
    return `<span>${esc(g.label)}</span><span>${v}</span>`;
  }).join("");
  return rows?`<div class="tsec">At this moment</div><div class="tkv">${rows}</div>`:"";
}

(function(){
  const app = document.getElementById("app");
  if(!D || !Array.isArray(D.t) || !D.t.length){
    app.innerHTML = `<header class="top"><svg class="logo" aria-hidden="true" focusable="false"><use href="#hbx-logo"/></svg><h1>Health trends</h1></header><div class="empty"><strong>No health metrics recorded.</strong><p>Turn on Metrics history in <code>/hybox settings</code>, or set <code>Metrics.Enabled</code> to <code>true</code> in <code>hybox.json</code> and run <code>/hybox reload</code>.</p></div>`;
    return;
  }
  const inc=INCS.length;
  const sparse=D.collapsed?` Samples cover only part of this range, so time with the server off is cut out and a dashed divider marks each gap.`:"";
  let html = `<header class="top"><svg class="logo" aria-hidden="true" focusable="false"><use href="#hbx-logo"/></svg><h1>Health trends</h1></header>`;
  html += `<div class="meta">Last ${D.days} day${D.days===1?"":"s"}, ${D.count.toLocaleString()} sample${D.count===1?"":"s"}${inc?`, ${inc} incident${inc>1?"s":""}`:""}. Times are UTC.${sparse}</div>`;
  html += `<div class="pmlegend">${inc?`<button type="button" class="pmlg" data-inc aria-pressed="true"><span class="smp" aria-hidden="true"></span><span>incidents</span></button>`:`<span class="pmnone" title="No incidents were recorded in this range"><span class="smp" aria-hidden="true"></span>no incidents</span>`}<span class="pmnote">Line: average. Band: lowest to highest.${GAPS.length?" Shaded: server off.":""}</span></div>`;
  html += `<div class="grid" id="grid"></div><div class="meta" id="nodata"></div><span class="sr-only" id="tkeys">Left and right arrows move through the time buckets. Home and End jump to the ends. Escape hides the values.</span><span class="sr-only" id="tvalue" aria-live="polite"></span>`;
  app.innerHTML = html;
  renderGrid();
  const grid=document.getElementById("grid");
  grid.addEventListener("click", e=>{
    const sb = e.target.closest("[data-scale]");
    if(sb){
      if(sb.disabled) return;
      const key=sb.dataset.scale, cut=key.lastIndexOf(":");
      SCALE[key.slice(0,cut)]=key.slice(cut+1);
      renderGrid();
      document.querySelector(`[data-scale="${key}"]`)?.focus({preventScroll:true});
      return;
    }
    const el = e.target.closest("[data-line]");
    if(el) toggleLine(el.dataset.line);
  });
  TTIP.addEventListener("click", e=>{ if(e.target.closest(".tclose")) clearHover(); });
  grid.addEventListener("pointermove", e=>{
    const plot=e.target.closest(".plot[data-plot]"), touch=e.pointerType!=="mouse";
    if(!touch&&hover&&hover.pinned) return;
    if(touch&&!(hover&&hover.pinned&&hover.plot===plot)) return;
    if(!plot){ if(hover) clearHover(); return; }
    hoverNext={plot,x:e.clientX,y:e.clientY,pinned:touch};
    if(!hoverRaf) hoverRaf=requestAnimationFrame(()=>{
      hoverRaf=0;
      const q=hoverNext; hoverNext=null;
      if(q&&!(hover&&hover.pinned&&!q.pinned)&&PLOTS[q.plot.dataset.plot]) showHit(q.plot,hitAt(q.plot,q.x,q.pinned?14:8),q.x,q.y,q.pinned);
    });
  });
  grid.addEventListener("pointerdown", e=>{
    const plot=e.target.closest(".plot[data-plot]");
    if(!plot) return;
    const touch=e.pointerType!=="mouse", h=hitAt(plot,e.clientX,touch?14:8);
    if(!touch&&e.button!==0) return;
    if(!touch&&hover&&hover.pinned){ clearHover(); showHit(plot,h,e.clientX,e.clientY,false); }
    else showHit(plot,h,e.clientX,e.clientY,true);
  });
  grid.addEventListener("pointerleave", e=>{ if(e.pointerType==="mouse"&&!(hover&&hover.pinned)) clearHover(); });
  document.addEventListener("pointerdown", e=>{ if(hover&&hover.pinned&&!e.target.closest?.(".plot[data-plot],.ttip")) clearHover(); }, true);
  document.addEventListener("pointercancel", ()=>{ if(hover&&hover.pinned) clearHover(); }, true);
  grid.addEventListener("focusin", e=>{ if(e.target.matches(".plot[data-plot]:focus-visible")) showKeyboardHover(e.target,hover?.i??D.t.length-1); });
  grid.addEventListener("focusout", e=>{ if(e.target.matches(".plot[data-plot]")) clearHover(); });
  grid.addEventListener("keydown", e=>{
    if(!e.target.matches(".plot[data-plot]")||e.altKey||e.ctrlKey||e.metaKey) return;
    const n=D.t.length;
    let i=hover?.i??n-1;
    if(e.key==="ArrowLeft") i=Math.max(0,i-1);
    else if(e.key==="ArrowRight") i=Math.min(n-1,i+1);
    else if(e.key==="Home") i=0;
    else if(e.key==="End") i=n-1;
    else if(e.key==="Escape"){ clearHover(); return; }
    else return;
    e.preventDefault();
    showKeyboardHover(e.target,i);
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") clearHover(); });
  document.addEventListener("scroll", ()=>{ if(!(hover&&hover.pinned)&&!document.activeElement?.matches?.(".plot[data-plot]:focus-visible")) clearHover(); }, true);
  window.addEventListener("blur", ()=>{ if(!(hover&&hover.pinned)) clearHover(); });
  document.documentElement.addEventListener("mouseleave", ()=>{ if(!(hover&&hover.pinned)) clearHover(); });
  const ic=app.querySelector("[data-inc]");
  if(ic) ic.addEventListener("click",()=>{
    showIncidents=!showIncidents;
    ic.classList.toggle("off",!showIncidents);
    ic.setAttribute("aria-pressed",String(showIncidents));
    renderGrid();
  });
  window.addEventListener("resize",renderGrid);
})();
</script>
</body>
</html>
