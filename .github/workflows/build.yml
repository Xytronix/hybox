name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task(s) to run"
        required: false
        default: "build"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_TASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.gradle_task || 'build' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run build
        run: ./gradlew $GRADLE_TASK --no-daemon

      - name: Resolve newest Hytale 0.8 pre-release
        id: server
        if: github.event_name != 'push'
        run: |
          version=$(curl -fsSL https://maven.hytale.com/pre-release/com/hypixel/hytale/Server/maven-metadata.xml | sed -n 's:.*<version>\(0\.8\.[^<]*\)</version>.*:\1:p' | sort -V | tail -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing against Hytale pre-release $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile and test against Hytale ${{ steps.server.outputs.version }}
        if: github.event_name != 'push'
        run: ./gradlew :hybox-hytale:test -PhytaleServerVersion=${{ steps.server.outputs.version }} --no-daemon

      - name: Upload plugin artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: Hybox
          path: hybox-hytale/build/libs/Hybox-*.jar
          if-no-files-found: error
          retention-days: 7
